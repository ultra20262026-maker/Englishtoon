<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الألعاب | EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #f8fafc; }
        .lesson-badge { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(5px); }
        .bg-pattern {
            background-image: radial-gradient(#1e293b 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .star-active { color: #eab308; text-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        .star-inactive { color: rgba(255, 255, 255, 0.1); }
        .btn-leaderboard {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }
        .game-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .game-card:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen bg-slate-950 bg-pattern">
    <header class="p-6 flex items-center justify-between bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a id="backBtn" href="#" class="w-12 h-12 rounded-2xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition-all active:scale-90">
                <i class="fa-solid fa-chevron-right text-xl"></i>
            </a>
            <div>
                <h1 id="unitTitle" class="text-xl font-black text-blue-400">الوحدة</h1>
                <p id="gradeName" class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">جاري التحميل</p>
            </div>
        </div>
        <a href="leaderboard.html" class="px-4 py-2 rounded-2xl bg-yellow-500/10 border border-yellow-500/20 flex items-center gap-2 text-yellow-500 shadow-lg shadow-yellow-900/20 active:scale-95 transition-all">
            <span id="totalStars" class="font-black text-xl">0</span>
            <i class="fa-solid fa-trophy text-xl"></i>
        </a>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-8">
        <!-- Games will be injected here instantly -->
        <div id="gamesList" class="space-y-8">
            <!-- Content -->
        </div>
    </main>

    <script src="js/data.js"></script>
    <script>
        // Load data instantly
        const params = new URLSearchParams(window.location.search);
        const gradeId = params.get('id');
        const unitNum = params.get('unit') || '1';
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!gradeId) { window.location.href = 'dashboard.html'; return; }
            
            const gradeInfo = GRADES_DATA.find(g => g.id === gradeId);
            document.getElementById('gradeName').textContent = gradeInfo ? gradeInfo.name : '';
            document.getElementById('unitTitle').textContent = `الوحدة ${unitNum}`;
            document.getElementById('backBtn').href = `grade.html?id=${gradeId}`;
            
            updateTotalStars(gradeId);
            
            // Fetch arcade map and render immediately
            fetch('js/arcade_games_map.json')
                .then(r => r.json())
                .then(map => renderGames(gradeId, unitNum, map))
                .catch(() => renderGames(gradeId, unitNum, {}));
        });

        function updateTotalStars(gradeId) {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith(`englishtoon_progress_${gradeId}`)) {
                    try {
                        const progress = JSON.parse(localStorage.getItem(key));
                        total += progress.stars || 0;
                    } catch(e){}
                }
            }
            document.getElementById('totalStars').textContent = total;
        }

        function renderGames(gradeId, unitNum, arcadeMap) {
            const container = document.getElementById('gamesList');
            container.innerHTML = '';
            // Get all units from arcadeMap for this grade
            const units = arcadeMap[gradeId] || {};
            const unitData = units[unitNum] || {};
            
            // We still want to show at least 4/6 lessons even if arcade games are missing
            const baseLessonsCount = (gradeId.startsWith('prep')) ? 6 : 4;
            const arcadeLessons = Object.keys(unitData).map(Number);
            const maxLesson = Math.max(baseLessonsCount, ...arcadeLessons, 0);

            for (let l = 1; l <= maxLesson; l++) {
                const progressKey = `englishtoon_progress_${gradeId}_${unitNum}_${l}`;
                const progress = JSON.parse(localStorage.getItem(progressKey)) || { stars: 0, completed: false };
                const gameId = `${gradeId}_U${unitNum}_L${l}`;
                
                let arcadeLink = '#';
                let arcadeName = 'لعبة جديدة';
                
                if (unitData[l]) {
                    arcadeLink = unitData[l];
                    const filename = decodeURIComponent(arcadeLink.split('/').pop().replace('.html', ''));
                    // Try to get a clean name from the filename
                    arcadeName = filename;
                    if (filename.includes(' - ')) arcadeName = filename.split(' - ').pop();
                    else if (filename.includes('_')) arcadeName = filename.split('_').pop();
                    
                    if (arcadeName.match(/^\d+$/) || arcadeName.toLowerCase().startsWith('lesson')) {
                         arcadeName = 'لعبة الأركيد';
                    }
                }

                const lessonContainer = document.createElement('div');
                lessonContainer.className = 'bg-slate-900/50 border border-slate-800 p-6 rounded-[2rem] flex flex-col gap-6 shadow-2xl backdrop-blur-sm relative overflow-hidden animate-fade-in-up';
                
                if (progress.completed) lessonContainer.classList.add('border-green-500/30');

                const starHtml = Array.from({length: 3}, (_, i) => 
                    `<i class="fa-solid fa-star ${i < progress.stars ? 'star-active' : 'star-inactive'}"></i>`
                ).join('');

                lessonContainer.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="lesson-badge px-5 py-1.5 rounded-full text-xs font-black ${progress.completed ? 'text-green-400 border-green-500/20' : 'text-blue-400 border-blue-500/20'} border">
                            ${progress.completed ? '<i class="fa-solid fa-check-circle ml-1"></i> مكتمل' : 'الدرس ' + l}
                        </span>
                        <div class="flex items-center gap-3">
                            <a href="leaderboard.html?gameId=${gameId}" class="w-8 h-8 rounded-full btn-leaderboard flex items-center justify-center text-white text-xs shadow-lg active:scale-90 transition-all">
                                <i class="fa-solid fa-trophy"></i>
                            </a>
                            <div class="flex gap-1 text-sm">${starHtml}</div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 gap-4">
                        <a href="dictation.html?id=${gradeId}&unit=${unitNum}&lesson=${l}" class="game-card flex items-center justify-between bg-indigo-600/10 border border-indigo-500/20 p-5 rounded-3xl group hover:bg-indigo-600/20">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-900/40">
                                    <i class="fa-solid fa-spell-check text-xl"></i>
                                </div>
                                <div>
                                    <h4 class="font-black text-indigo-100 text-lg">تحدي الإملاء</h4>
                                    <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">Dictation Challenge</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-left text-indigo-500 group-hover:translate-x-[-5px] transition-transform"></i>
                        </a>

                        <a href="${arcadeLink}" class="game-card flex items-center justify-between ${arcadeLink === '#' ? 'opacity-50 pointer-events-none' : 'bg-blue-600/10 border border-blue-500/20 p-5 rounded-3xl group hover:bg-blue-600/20'}">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-900/40">
                                    <i class="fa-solid fa-gamepad text-xl"></i>
                                </div>
                                <div>
                                    <h4 class="font-black text-blue-100 text-lg">${arcadeName}</h4>
                                    <p class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Arcade Adventure</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-play text-blue-500 group-hover:scale-125 transition-transform"></i>
                        </a>
                    </div>
                `;
                container.appendChild(lessonContainer);
            }
        }
    </script>
</body>
</html>
