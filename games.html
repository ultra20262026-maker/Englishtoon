<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الألعاب | English Toon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f9ff; }
        .coming-soon-card {
            background: white;
            border-radius: 3rem;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
            margin: 100px auto;
            border: 8px solid #bee3f8;
        }
        .icon-bounce {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="coming-soon-card">
        <div class="w-32 h-32 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-6xl mx-auto mb-8 icon-bounce">
            <i class="fa-solid fa-gamepad"></i>
        </div>
        <h1 class="text-5xl font-black text-slate-800 mb-6">سنعود قريباً!</h1>
        <p class="text-2xl text-slate-600 font-bold mb-8">
            نحن نقوم الآن بتحديث وتطوير الألعاب لنقدم لكم تجربة تعليمية ممتعة وجديدة.
        </p>
        <div class="inline-block bg-blue-600 text-white px-10 py-4 rounded-full text-xl font-black shadow-lg">
            انتظرونا في القريب العاجل 🚀
        </div>
        <div class="mt-12">
            <a href="index.html" class="text-blue-500 font-bold hover:underline">
                <i class="fa-solid fa-arrow-right ml-2"></i> العودة للرئيسية
            </a>
        </div>
    </div>

</body>
</html>
