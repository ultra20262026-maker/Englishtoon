<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التوون | EnglishToon Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; }
        .shop-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .shop-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2); }
        .item-img-container { width: 100%; height: 180px; overflow: hidden; background: rgba(0,0,0,0.2); position: relative; }
        .item-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .shop-card:hover .item-img { transform: scale(1.1); }
        
        .tab-btn { padding: 10px 25px; border-radius: 15px; font-weight: 900; transition: 0.3s; cursor: pointer; opacity: 0.6; }
        .tab-btn.active { background: #3b82f6; color: white; opacity: 1; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        
        .price-tag { background: rgba(245, 158, 11, 0.1); color: #f59e0b; padding: 4px 12px; border-radius: 10px; font-weight: bold; border: 1px solid rgba(245, 158, 11, 0.2); }
        
        .owned-badge { background: #22c55e; color: white; padding: 4px 12px; border-radius: 10px; font-weight: bold; }
        .equipped-badge { background: #8b5cf6; color: white; padding: 4px 12px; border-radius: 10px; font-weight: bold; }

        .bg-pattern {
            background-image: radial-gradient(#1e293b 2px, transparent 2px);
            background-size: 30px 30px;
        }

        .category-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
        }
        .tag-boys { background: #3b82f6; color: white; }
        .tag-girls { background: #ec4899; color: white; }
    </style>
</head>
<body class="bg-pattern pb-20">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 p-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
                <h1 class="text-2xl font-black tracking-tight">متجر التوون 🛒</h1>
            </div>
            <div class="flex items-center gap-3 bg-amber-500/10 px-4 py-2 rounded-2xl border border-amber-500/20">
                <span id="user-coins" class="text-2xl font-black text-amber-500">0</span>
                <span class="text-xl">🪙</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <!-- Tabs -->
        <div class="flex justify-center gap-4 mb-10">
            <div class="tab-btn active" onclick="switchTab('boys', this)">أفاتارات الأولاد ⚽</div>
            <div class="tab-btn" onclick="switchTab('girls', this)">أفاتارات البنات ✨</div>
            <div class="tab-btn" onclick="switchTab('backgrounds', this)">الخلفيات 🖼️</div>
        </div>

        <!-- Items Grid -->
        <div id="items-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Items will be injected here -->
        </div>
    </main>

    <script>
        const SHOP_ITEMS = {
            boys: [
                { id: 'av_messi', name: 'ميسي الساحر', price: 500, img: 'messi_pixar.png', type: 'boys' },
                { id: 'av_ronaldo', name: 'رونالدو الدون', price: 500, img: 'ronaldo_pixar.png', type: 'boys' },
                { id: 'av_salah', name: 'فخر العرب صلاح', price: 500, img: 'salah_pixar.png', type: 'boys' },
                { id: 'av_1', name: 'البطل الصغير', price: 0, img: 'https://cdn-icons-png.flaticon.com/512/4333/4333609.png', type: 'boys' }
            ],
            girls: [
                { id: 'av_princess', name: 'الأميرة ريم', price: 500, img: 'princess_pixar.png', type: 'girls' },
                { id: 'av_supergirl', name: 'البطلة الخارقة', price: 500, img: 'supergirl_pixar.png', type: 'girls' },
                { id: 'av_scientist', name: 'العالمة الذكية', price: 500, img: 'scientist_girl_pixar.png', type: 'girls' },
                { id: 'av_fashion', name: 'نجمة الموضة', price: 500, img: 'fashion_girl_pixar.png', type: 'girls' }
            ],
            backgrounds: [
                { id: 'bg_default', name: 'الفضاء الأزرق', price: 0, color: '#0f172a' },
                { id: 'bg_forest', name: 'الغابة الخضراء', price: 300, color: '#064e3b' },
                { id: 'bg_sunset', name: 'غروب الشمس', price: 600, color: '#7c2d12' },
                { id: 'bg_ocean', name: 'أعماق البحار', price: 900, color: '#1e3a8a' },
                { id: 'bg_royal', name: 'القصر الملكي', price: 1500, color: '#4c1d95' },
                { id: 'bg_galaxy', name: 'المجرة الملونة', price: 2500, color: '#2d064e' }
            ]
        };

        let currentTab = 'boys';
        let inventory = JSON.parse(localStorage.getItem('et_inventory') || '["av_1", "bg_default"]');
        let equipped = JSON.parse(localStorage.getItem('et_equipped') || '{"avatar": "av_1", "bg": "bg_default"}');
        let coins = parseInt(localStorage.getItem('englishtoon_total_score') || '0');

        function updateUI() {
            document.getElementById('user-coins').textContent = coins;
            renderItems();
        }

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            
            SHOP_ITEMS[currentTab].forEach(item => {
                const isOwned = inventory.includes(item.id);
                const isEquipped = (['boys', 'girls'].includes(currentTab) && equipped.avatar === item.id) || 
                                   (currentTab === 'backgrounds' && equipped.bg === item.id);
                
                const card = document.createElement('div');
                card.className = 'shop-card rounded-[2rem] text-center flex flex-col items-center pb-5';
                
                let visual = '';
                if (['boys', 'girls'].includes(currentTab)) {
                    visual = `
                        <div class="item-img-container">
                            <span class="category-tag ${item.type === 'boys' ? 'tag-boys' : 'tag-girls'}">
                                ${item.type === 'boys' ? 'للأولاد' : 'للبنات'}
                            </span>
                            <img src="${item.img}" class="item-img" alt="${item.name}">
                        </div>
                    `;
                } else {
                    visual = `
                        <div class="w-full h-[180px] flex items-center justify-center p-4">
                            <div class="w-full h-full rounded-2xl" style="background: ${item.color}; border: 4px solid rgba(255,255,255,0.1)"></div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${visual}
                    <div class="px-5 w-full mt-4">
                        <h3 class="font-black text-lg mb-4">${item.name}</h3>
                        <div class="flex flex-col gap-3 w-full">
                            ${isEquipped ? 
                                `<span class="equipped-badge"><i class="fa-solid fa-check-double ml-1"></i> مجهز حالياً</span>` : 
                                (isOwned ? 
                                    `<button onclick="equipItem('${item.id}')" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-all">تجهيز الاستخدام</button>` :
                                    `<button onclick="buyItem('${item.id}', ${item.price})" class="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded-xl font-black transition-all flex items-center justify-center gap-2">
                                        <span>${item.price}</span>
                                        <span class="text-sm">🪙</span>
                                        <span class="mr-2">شراء</span>
                                    </button>`)
                            }
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function buyItem(id, price) {
            if (coins < price) {
                alert('عذراً! ليس لديك نقاط كافية 🪙');
                return;
            }

            const item = SHOP_ITEMS[currentTab].find(i => i.id === id);
            if (confirm(`هل تريد شراء "${item.name}" مقابل ${price} نقطة؟`)) {
                coins -= price;
                inventory.push(id);
                localStorage.setItem('englishtoon_total_score', coins);
                localStorage.setItem('et_total_coins', coins);
                localStorage.setItem('et_inventory', JSON.stringify(inventory));
                
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                updateUI();
            }
        }

        function equipItem(id) {
            if (['boys', 'girls'].includes(currentTab)) equipped.avatar = id;
            else equipped.bg = id;
            
            localStorage.setItem('et_equipped', JSON.stringify(equipped));
            renderItems();
        }

        updateUI();
    </script>
</body>
</html>
