<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treasure Hook - صائد الكنز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js?v=5.4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: Cairo, sans-serif; overflow: hidden; background: #0c4a6e; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="fixed top-20 left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none">
        <div class="bg-sky-100/80 backdrop-blur-md p-4 rounded-3xl border border-sky-200 shadow-xl">
            <p class="text-sky-600 text-xs font-bold uppercase mb-1">اصطد الكلمة:</p>
            <h2 id="target-word" class="text-slate-900 text-3xl font-black">APPLE</h2>
            <button onclick="Engine.speak(document.getElementById('target-word').innerText)" class="pointer-events-auto mt-2 bg-sky-600 p-2 rounded-full shadow-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = [{"word": "Apple", "image": "apple.png"}, {"word": "Ball", "image": "ball.png"}, {"word": "Cat", "image": "cat.png"}, {"word": "Dog", "image": "dog.png"}, {"word": "Egg", "image": "egg.png"}, {"word": "bag", "image": "bag.png"}, {"word": "board", "image": "board.png"}, {"word": "book", "image": "book.png"}, {"word": "chair", "image": "chair.png"}, {"word": "desk", "image": "desk.png"}, {"word": "ill", "image": "ill.png"}, {"word": "in", "image": "in.png"}, {"word": "ink", "image": "ink.png"}, {"word": "insect", "image": "insect.png"}, {"word": "open your books", "image": "open_your_books.png"}, {"word": "pencil", "image": "pencil.png"}, {"word": "sit down", "image": "sit_down.png"}, {"word": "stand up", "image": "stand_up.png"}];
        let currentTarget = "";
        let hook = { x: 0, y: 100, angle: 0, length: 50, state: 'swing', speed: 0.05 };
        let treasures = [];

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            hook.x = canvas.width / 2;
            nextLevel();
            Engine.init();
            animate();
        }

        function nextLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.toUpperCase();
            treasures = [];
            spawnTreasures();
        }

        function spawnTreasures() {
            const choices = Engine.getWords(vocab, 3);
            if (!choices.includes(currentTarget)) choices[0] = currentTarget;
            
            choices.forEach((text, i) => {
                Engine.loadSprite(text, (img) => {
                    treasures.push({
                        x: (i + 1) * (canvas.width / 4),
                        y: canvas.height - 200,
                        text: text,
                        img: img,
                        caught: false
                    });
                });
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (Engine.gameActive) {
                // Update Hook
                if (hook.state === 'swing') {
                    hook.angle += hook.speed;
                    if (Math.abs(hook.angle) > 1) hook.speed *= -1;
                } else if (hook.state === 'extend') {
                    hook.length += 10;
                    if (hook.length > canvas.height) hook.state = 'retract';
                } else if (hook.state === 'retract') {
                    hook.length -= 10;
                    if (hook.length <= 50) {
                        hook.length = 50;
                        hook.state = 'swing';
                    }
                }

                // Draw treasures
                treasures.forEach((t, ti) => {
                    if (t.caught) {
                        t.x = hook.x + Math.sin(hook.angle) * hook.length;
                        t.y = hook.y + Math.cos(hook.angle) * hook.length;
                    }
                    if(t.img) ctx.drawImage(t.img, t.x - 40, t.y - 40, 80, 80);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 14px Cairo';
                    ctx.textAlign = 'center';
                    ctx.fillText(t.text.toUpperCase(), t.x, t.y + 55);

                    // Hook detection
                    if (hook.state === 'extend') {
                        let hx = hook.x + Math.sin(hook.angle) * hook.length;
                        let hy = hook.y + Math.cos(hook.angle) * hook.length;
                        if (Math.abs(hx - t.x) < 40 && Math.abs(hy - t.y) < 40) {
                            t.caught = true;
                            hook.state = 'retract';
                            if (t.text === currentTarget) {
                                setTimeout(() => {
                                    treasures = [];
                                    Engine.addScore(100);
                                    Engine.showFeedback(true);
                                    Engine.showWinScreen(() => nextLevel());
                                }, 500);
                            } else {
                                Engine.addScore(-20);
                                Engine.showFeedback(false);
                                setTimeout(() => t.caught = false, 500);
                            }
                        }
                    }
                });

                // Draw Hook Line
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(hook.x, hook.y);
                ctx.lineTo(hook.x + Math.sin(hook.angle) * hook.length, hook.y + Math.cos(hook.angle) * hook.length);
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointerdown', () => {
            if (Engine.gameActive && hook.state === 'swing') hook.state = 'extend';
        });

        initGame();
    </script>
</body>
</html>
