<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة - English Toon</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo_icon.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .cyber-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 10s infinite ease-in-out alternate;
        }

        .glow-orb-1 {
            width: 400px; height: 400px;
            background: #f59e0b;
            top: -100px; left: -100px;
        }

        .glow-orb-2 {
            width: 300px; height: 300px;
            background: #d97706;
            bottom: -50px; right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(245, 158, 11, 0.15);
            text-align: center;
        }

        .admin-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: inline-block;
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .title {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: right;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .password-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 1.1rem;
            text-align: left;
            direction: ltr;
            transition: all 0.3s ease;
            outline: none;
            letter-spacing: 2px;
        }

        .password-input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .error-msg {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div class="cyber-bg">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
    </div>

    <div class="login-card">
        <div class="admin-icon">👑</div>
        <h1 class="title">دخول الإدارة</h1>
        <p class="subtitle">هذه الصفحة مخصصة للمدير فقط</p>

        <div id="error-box" class="error-msg"></div>

        <div class="input-group">
            <label class="input-label">كلمة السر (Admin Password):</label>
            <input type="password" id="admin-pass" class="password-input" placeholder="••••••••" autocomplete="off">
        </div>

        <button onclick="handleAdminLogin()" class="btn-login">
            <span>تسجيل الدخول</span>
            <span>🔐</span>
        </button>
    </div>

    <script>
        document.getElementById('admin-pass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleAdminLogin();
        });

        function handleAdminLogin() {
            const pass = document.getElementById('admin-pass').value.trim();
            const errorBox = document.getElementById('error-box');
            
            if (pass === 'Mm01208609509' || pass === 'mm01208609509' || pass === '01208609509') {
                errorBox.style.display = 'none';
                // Success! Set admin session and redirect
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', 'admin');
                localStorage.setItem('allowedGrade', 'all');
                localStorage.setItem('allowedUnits', 'all');
                
                // Clear any student caches if they existed
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(regs => {
                        for (let r of regs) r.unregister();
                    });
                }
                
                // Redirect straight to admin.html
                window.location.href = 'admin.html';
            } else {
                errorBox.textContent = '❌ كلمة السر غير صحيحة';
                errorBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
