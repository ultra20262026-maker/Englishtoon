<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الألعاب | EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; }
        .item-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 2rem; transition: all 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 2rem; text-decoration: none; color: inherit; }
        .item-card:hover { border-color: #3b82f6; background: rgba(30, 41, 59, 0.8); transform: translateY(-3px); }
    </style>
</head>
<body>
    <header class="p-6 flex items-center justify-between sticky top-0 z-50 bg-[#0f172a]/90 backdrop-blur-xl border-b border-slate-800">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <h1 id="mainTitle" class="text-xl font-black text-white">اختر الصف الدراسي</h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10">
        <div id="contentGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Items -->
        </div>
    </main>

    <script>
        // تنبيه للتأكد من أن الصفحة الجديدة تعمل
        console.log("Play World Page Loaded Successfully!");

        const GRADES = [
            { id: 'primary-1', name: 'الصف الأول الابتدائي' },
            { id: 'primary-2', name: 'الصف الثاني الابتدائي' },
            { id: 'primary-3', name: 'الصف الثالث الابتدائي' },
            { id: 'primary-4', name: 'الصف الرابع الابتدائي' },
            { id: 'primary-5', name: 'الصف الخامس الابتدائي' },
            { id: 'primary-6', name: 'الصف السادس الابتدائي' },
            { id: 'prep-1', name: 'الصف الأول الإعدادي' },
            { id: 'prep-2', name: 'الصف الثاني الإعدادي' },
            { id: 'prep-3', name: 'الصف الثالث الإعدادي' }
        ];

        function render() {
            const params = new URLSearchParams(window.location.search);
            const gradeId = params.get('id');
            const grid = document.getElementById('contentGrid');
            const mainTitle = document.getElementById('mainTitle');
            
            grid.innerHTML = '';

            if (gradeId) {
                const grade = GRADES.find(g => g.id === gradeId);
                mainTitle.textContent = grade ? grade.name : 'الوحدات الدراسية';
                for (let i = 1; i <= 6; i++) {
                    const card = document.createElement('a');
                    card.href = `view-games.html?id=${gradeId}&unit=${i}`;
                    card.className = 'item-card group';
                    card.innerHTML = `
                        <div class="flex items-center gap-6">
                            <div class="w-14 h-14 rounded-2xl bg-blue-600/10 flex items-center justify-center text-blue-500 text-2xl font-black group-hover:bg-blue-600 group-hover:text-white">
                                ${i}
                            </div>
                            <h3 class="text-lg font-black">الوحدة ${i}</h3>
                        </div>
                        <i class="fa-solid fa-chevron-left text-slate-700 group-hover:text-blue-500"></i>
                    `;
                    grid.appendChild(card);
                }
            } else {
                mainTitle.textContent = 'اختر الصف الدراسي';
                GRADES.forEach(grade => {
                    const card = document.createElement('a');
                    card.href = `play-world.html?id=${grade.id}`;
                    card.className = 'item-card group';
                    card.innerHTML = `
                        <div class="flex items-center gap-6">
                            <div class="w-14 h-14 rounded-2xl bg-indigo-600/10 flex items-center justify-center text-indigo-500 text-xl group-hover:bg-indigo-600 group-hover:text-white">
                                <i class="fa-solid fa-school"></i>
                            </div>
                            <h3 class="text-lg font-black">${grade.name}</h3>
                        </div>
                        <i class="fa-solid fa-chevron-left text-slate-700 group-hover:text-indigo-500"></i>
                    `;
                    grid.appendChild(card);
                });
            }
        }
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
