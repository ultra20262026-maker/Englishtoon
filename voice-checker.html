<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدقق النطق الذكي | EnglishToon AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .ai-card {
            background: white;
            border-radius: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .mic-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: #3b82f6; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        .mic-btn.recording {
            background: #ef4444;
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            border: 8px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 900;
        }
    </style>
  <link rel="stylesheet" href="css/englishtoon-brand-theme.css?v=20270827">
</head>
<body class="pb-10 toon-unified-page">
    <header class="p-6 max-w-4xl mx-auto flex items-center justify-between">
        <a href="dashboard.html" class="w-10 h-10 rounded-xl bg-white shadow-sm flex items-center justify-center text-slate-400 hover:text-primary transition-all">
            <i class="fa-solid fa-arrow-right"></i>
        </a>
        <h1 class="text-xl font-black text-slate-800">مدقق النطق بالذكاء الاصطناعي 🤖</h1>
        <div class="w-10"></div>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        <div class="ai-card p-8 text-center">
            <div class="mb-8">
                <input type="text" id="word-input" placeholder="اكتب الكلمة هنا (مثلاً: Apple)" 
                       class="w-full p-5 rounded-2xl border-2 border-slate-100 text-center text-2xl font-bold focus:border-primary outline-none transition-all">
                <button onclick="fetchWordData()" class="mt-4 px-8 py-3 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700 transition-all">
                    بحث ومعنى 🔍
                </button>
            </div>

            <!-- Result Section -->
            <div id="result-section" class="hidden">
                <div class="flex flex-col items-center gap-4 mb-8">
                    <h2 id="display-word" class="text-4xl font-black text-primary uppercase tracking-widest">Apple</h2>
                    <div class="flex items-center gap-3">
                        <span id="word-phonetic" class="text-slate-400 font-bold">—</span>
                        <button onclick="playTargetVoice()" class="text-primary hover:scale-110 transition-transform">
                            <i class="fa-solid fa-volume-high text-2xl"></i>
                        </button>
                    </div>
                    <p id="word-meaning" class="text-slate-600 font-bold text-lg bg-slate-50 px-6 py-2 rounded-full">—</p>
                </div>

                <div class="border-t border-slate-100 pt-8 flex flex-col items-center gap-6">
                    <p class="font-bold text-slate-500">اضغط على الميكروفون وانطق الكلمة:</p>
                    
                    <button id="mic-btn" onclick="toggleRecording()" class="mic-btn">
                        <i class="fa-solid fa-microphone"></i>
                    </button>

                    <div id="status-text" class="text-slate-400 font-bold">جاهز للاستماع...</div>

                    <!-- Score UI -->
                    <div id="score-container" class="hidden flex flex-col items-center gap-4 mt-4">
                        <div id="score-circle" class="score-circle">0%</div>
                        <p id="feedback-text" class="font-black text-xl"></p>
                        <p id="recognized-text" class="text-slate-400 text-sm">سمعتك تقول: <span class="text-slate-800 italic">...</span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let recognition;
        let isRecording = false;
        let targetWord = "";

        // Arabic meanings used by the curriculum checker. The old page had a
        // fixed placeholder ("تفاحة") which stayed visible whenever the
        // remote dictionary/translation request failed.
        const LOCAL_MEANINGS = Object.freeze({
            digital: "رقمي / رقمية", device: "جهاز", devices: "أجهزة", screen: "شاشة",
            computer: "حاسوب", tablet: "جهاز لوحي", phone: "هاتف", internet: "الإنترنت",
            website: "موقع إلكتروني", password: "كلمة مرور", camera: "كاميرا",
            book: "كتاب", books: "كتب", teacher: "معلّم / معلّمة", student: "طالب / طالبة",
            friend: "صديق / صديقة", friends: "أصدقاء", family: "عائلة", school: "مدرسة",
            home: "منزل", house: "بيت", table: "طاولة", chair: "كرسي", bag: "حقيبة",
            pencil: "قلم رصاص", pen: "قلم", board: "سبورة", tree: "شجرة", tiger: "نمر",
            tomato: "طماطم", apple: "تفاحة", apples: "تفاح", orange: "برتقال",
            banana: "موز", water: "ماء", food: "طعام", meal: "وجبة", recipe: "وصفة",
            ingredients: "مكوّنات", delicious: "لذيذ", selfish: "أناني", flyer: "منشور إعلاني",
            screen_time: "وقت استخدام الشاشة", privacy: "الخصوصية", identity: "الهوية",
            community: "المجتمع", help: "يساعد / مساعدة", healthy: "صحي", strong: "قوي",
            read: "يقرأ", write: "يكتب", play: "يلعب", work: "يعمل", eat: "يأكل",
            drink: "يشرب", go: "يذهب", come: "يأتي", make: "يصنع", use: "يستخدم",
            learn: "يتعلم", speak: "يتحدث", listen: "يستمع", hello: "مرحبًا", goodbye: "إلى اللقاء"
        });
        const normalizeLookup = value => String(value || "").toLowerCase().trim().replace(/\s+/g, "_");
        async function translateWordFallback(word) {
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ar`;
                const response = await fetch(url, { headers: { Accept: "application/json" } });
                const data = await response.json();
                const translated = data?.responseData?.translatedText?.trim();
                if (translated && translated.toLowerCase() !== word.toLowerCase() && !/\bapple\b|تفاحة/i.test(translated)) return translated;
            } catch (error) { console.warn("Arabic translation fallback unavailable", error); }
            return "";
        }

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const result = event.results[0][0].transcript.toLowerCase().trim();
                const confidence = event.results[0][0].confidence;
                processResult(result);
            };

            recognition.onerror = (event) => {
                console.error(event.error);
                stopRecording();
                alert("حدث خطأ في الميكروفون. تأكد من إعطاء الصلاحية.");
            };

            recognition.onend = () => {
                stopRecording();
            };
        }

        async function fetchWordData() {
            const input = document.getElementById('word-input').value.trim();
            if (!input) return;

            targetWord = input.toLowerCase();
            document.getElementById('display-word').textContent = targetWord;
            document.getElementById('result-section').classList.remove('hidden');
            document.getElementById('score-container').classList.add('hidden');
            
            const meaningEl = document.getElementById("word-meaning");
            const phoneticEl = document.getElementById("word-phonetic");
            const localMeaning = LOCAL_MEANINGS[normalizeLookup(targetWord)] || LOCAL_MEANINGS[targetWord];
            phoneticEl.textContent = "—";
            meaningEl.textContent = localMeaning || "جاري البحث عن المعنى العربي...";
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(targetWord)}`, { signal: controller.signal });
                clearTimeout(timeout);
                const data = await response.json();
                const entry = Array.isArray(data) ? data[0] : null;
                if (entry?.phonetic) phoneticEl.textContent = entry.phonetic;
                if (!localMeaning) {
                    const translated = await translateWordFallback(targetWord);
                    meaningEl.textContent = translated || "لا توجد ترجمة عربية موثوقة لهذه الكلمة حاليًا";
                }
            } catch (error) {
                console.warn("Dictionary request unavailable; using Arabic fallback", error);
                if (!localMeaning) {
                    const translated = await translateWordFallback(targetWord);
                    meaningEl.textContent = translated || "لا توجد ترجمة عربية موثوقة لهذه الكلمة حاليًا";
                }
            }
        }

        function playTargetVoice() {
            const utterance = new SpeechSynthesisUtterance(targetWord);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function toggleRecording() {
            if (!recognition) {
                alert("متصفحك لا يدعم خاصية التعرف على الصوت.");
                return;
            }
            if (isRecording) stopRecording();
            else startRecording();
        }

        function startRecording() {
            isRecording = true;
            document.getElementById('mic-btn').classList.add('recording');
            document.getElementById('status-text').textContent = "جاري الاستماع... تحدث الآن";
            document.getElementById('score-container').classList.add('hidden');
            recognition.start();
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('mic-btn').classList.remove('recording');
            document.getElementById('status-text').textContent = "انتهى الاستماع. جاري التحليل...";
            recognition.stop();
        }

        function processResult(spokenText) {
            document.getElementById('score-container').classList.remove('hidden');
            document.getElementById('recognized-text').querySelector('span').textContent = spokenText;
            
            // Basic similarity check
            let score = 0;
            if (spokenText === targetWord) {
                score = 100;
            } else {
                // Simple Levenshtein-like logic or character match
                let matches = 0;
                const minLen = Math.min(spokenText.length, targetWord.length);
                for(let i=0; i<minLen; i++) {
                    if(spokenText[i] === targetWord[i]) matches++;
                }
                score = Math.round((matches / targetWord.length) * 100);
            }

            // Update UI
            const circle = document.getElementById('score-circle');
            const feedback = document.getElementById('feedback-text');
            
            circle.textContent = score + "%";
            
            if (score >= 90) {
                circle.style.borderColor = "#22c55e";
                circle.style.color = "#22c55e";
                feedback.textContent = "ممتاز! نطقك رائع 🌟";
                feedback.style.color = "#22c55e";
            } else if (score >= 60) {
                circle.style.borderColor = "#f59e0b";
                circle.style.color = "#f59e0b";
                feedback.textContent = "جيد جداً! اقتربت كثيراً 👍";
                feedback.style.color = "#f59e0b";
            } else {
                circle.style.borderColor = "#ef4444";
                circle.style.color = "#ef4444";
                feedback.textContent = "حاول مرة أخرى، يمكنك فعلها! 💪";
                feedback.style.color = "#ef4444";
            }
        }
    </script>
</body>
</html>
