<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحانات الوحدة | English Toon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        en: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#ec4899',
                        accent: '#f59e0b',
                        success: '#10b981',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e0f2fe;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.6) 0%, transparent 50%),
                linear-gradient(135deg, #e0f2fe 0%, #bae6fd 40%, #7dd3fc 100%);
            min-height: 100vh;
            background-attachment: fixed;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .game-tile {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border-radius: 2rem;
            overflow: hidden;
            display: block;
            text-decoration: none;
        }
        .game-tile:hover {
            transform: translateY(-8px);
            border-color: #3b82f6;
            box-shadow: 0 20px 30px -10px rgba(59, 130, 246, 0.3);
        }
        
        .game-thumb-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid rgba(255,255,255,0.5);
        }
        
        .game-emoji-badge {
            font-size: 5rem;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
            transition: transform 0.4s ease;
        }
        
        .game-tile:hover .game-emoji-badge {
            transform: scale(1.1) rotate(5deg);
        }
        
        .game-play-hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .game-tile:hover .game-play-hover-overlay {
            opacity: 1;
        }
        
        .play-action-circle {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            font-size: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .game-tile:hover .play-action-circle {
            transform: scale(1);
        }
        
        .game-info-box {
            padding: 20px;
        }

        #grammar-modal {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
    <link rel="stylesheet" href="css/englishtoon-3d-backgrounds.css?v=1">
</head>
<body class="text-slate-800 pb-20 toon-scene-exam-list">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-4">
                    <a href="#" id="back-to-grade-btn" class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-200 text-slate-500 hover:text-primary hover:border-primary transition-all duration-300 transform hover:-translate-x-1">
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                    <div>
                        <h2 class="text-xl font-black text-slate-800" id="unit-header-title">امتحانات الوحدة</h2>
                        <p class="text-xs font-bold text-primary" id="unit-header-sub">اختبر نفسك وراجع مستواك!</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <h3 class="text-2xl font-black text-slate-800 flex items-center gap-3">
                <i class="fa-solid fa-gamepad text-primary"></i> الامتحانات والتحديات
            </h3>
            <span id="exams-count-badge" class="bg-indigo-100 text-indigo-600 font-bold px-4 py-2 rounded-full text-sm">جاري التحميل...</span>
        </div>

        <!-- Games Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="games-container">
            <!-- Rendered via JS -->
        </div>

    </main>

    <!-- Grammar Modal -->
    <div id="grammar-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-5xl max-h-[90vh] overflow-y-auto shadow-2xl relative border-4 border-accent">
            <button onclick="closeGrammarModal()" class="absolute top-4 left-4 w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-600 transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="p-8 text-center border-b border-slate-100">
                <h2 class="text-3xl font-black text-accent mb-2 font-ar">امتحانات جديدة 🎮</h2>
                <p class="text-slate-500 font-bold hidden"></p>
            </div>
            <div class="p-8 bg-slate-50">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="grammar-modal-grid">
                    <!-- Rendered via JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js?v=960"></script>
    <script src="js/auth.js?v=902"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
try {
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.replace('index.html');
        return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const gradeId = urlParams.get('grade');
    const unitId = urlParams.get('unit');

    if (!gradeId || !unitId) {
        window.location.href = 'exams.html';
        return;
    }

    document.getElementById('back-to-grade-btn').href = 'exams-grades-view.html?id=' + gradeId;
    
    const grade = GRADES_DATA.find(g => g.id === gradeId);
    if(grade) {
        document.getElementById('unit-header-sub').textContent = grade.name + ' - الوحدة ' + unitId;
    }

    const container = document.getElementById('games-container');
    const exams = EXAMS_MAP[gradeId] ? EXAMS_MAP[gradeId][unitId] || [] : [];
    
    document.getElementById('exams-count-badge').textContent = exams.length + ' امتحانات';

    if (exams.length === 0) {
        container.innerHTML = `
            <div class="col-span-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 bg-white/60 backdrop-blur-sm rounded-3xl p-12 text-center border-2 border-dashed border-slate-300">
                <div class="w-24 h-24 mx-auto bg-slate-100 rounded-full flex items-center justify-center text-slate-400 text-4xl mb-6">
                    <i class="fa-solid fa-file-excel"></i>
                </div>
                <h4 class="text-2xl font-black text-slate-600 mb-2">لا توجد امتحانات حالياً</h4>
                <p class="text-slate-500 font-bold">جاري تجهيز الامتحانات لهذه الوحدة، عد لاحقاً!</p>
            </div>
        `;
        return;
    }

    // Render exams
    container.innerHTML = '';
    exams.forEach((exam, index) => {
        const delay = (index % 4) + 1;
        
        let iconHtml = '<i class="fa-solid fa-file-circle-check"></i>';
        let colorClass = 'text-success bg-emerald-100';
        if (exam.name.includes('مراجعة')) {
            iconHtml = '<i class="fa-solid fa-medal"></i>';
            colorClass = 'text-accent bg-orange-100';
        }

        const html = `
            <a href="exams/${gradeId}/unit${unitId}/${exam.file}" class="game-card bg-white rounded-3xl p-6 flex flex-col h-full animate-fade-in-up group relative overflow-hidden" style="animation-delay: 0.${delay}s">
                <div class="absolute top-0 right-0 w-32 h-32 bg-slate-50 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2 group-hover:bg-success/10 transition-colors duration-500"></div>
                
                <div class="flex items-center justify-between mb-6 relative z-10">
                    <div class="w-14 h-14 rounded-2xl ${colorClass} flex items-center justify-center text-2xl shadow-inner group-hover:scale-110 transition-transform duration-300">
                        ${iconHtml}
                    </div>
                    <div class="bg-slate-100 text-slate-500 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1 group-hover:bg-success group-hover:text-white transition-colors">
                        ابدأ الامتحان <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    </div>
                </div>
                
                <h4 class="text-xl font-black text-slate-800 mb-2 relative z-10 group-hover:text-success transition-colors">${exam.name}</h4>
                <p class="text-slate-500 text-sm font-semibold relative z-10 flex-grow">
                    اختبر مستواك في هذا الدرس.
                </p>
            </a>
        `;
        container.innerHTML += html;
    });
} catch(err) { document.getElementById('unit-header-sub').textContent = err.message; console.error(err); }
});
    </script>
</body>
