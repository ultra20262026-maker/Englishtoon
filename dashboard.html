<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | English Toon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #f8fafc; }
        .card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 2rem; transition: all 0.3s; cursor: pointer; display: block; text-decoration: none; }
        .card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.8); border-color: #3b82f6; }
        .badge-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.5rem; padding: 1rem; text-align: center; }
        .badge-icon { font-size: 2rem; margin-bottom: 0.5rem; filter: grayscale(1); opacity: 0.5; }
        .badge-active .badge-icon { filter: grayscale(0); opacity: 1; }
        .badge-active { border-color: #eab308; background: rgba(234, 179, 8, 0.1); }
    </style>
</head>
<body class="pb-20">
    <header class="p-6 flex items-center justify-between sticky top-0 z-50 bg-[#0f172a]/90 backdrop-blur-xl border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-slate-800 overflow-hidden">
                <img src="images/englishtoon_logo_new.jpg" alt="Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-xl font-black text-white">EnglishToon</h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="px-4 py-2 bg-yellow-500/10 rounded-2xl border border-yellow-500/20 text-yellow-500 font-black">
                🪙 <span id="totalPoints">0</span>
            </div>
            <button onclick="localStorage.clear(); window.location.href='index.html';" class="w-10 h-10 rounded-xl bg-red-500/10 text-red-500 border border-red-500/20">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 mt-8">
        <div class="bg-blue-600 rounded-[2.5rem] p-8 mb-8 relative overflow-hidden shadow-2xl shadow-blue-500/20">
            <div class="relative z-10">
                <p class="text-blue-100 font-bold mb-2">أهلاً بك يا بطل 🌟</p>
                <h2 id="userNameDisplay" class="text-3xl font-black text-white">طالب متميز</h2>
            </div>
        </div>

        <!-- أوسمتي -->
        <div class="mb-8">
            <h3 class="text-xl font-black mb-4 flex items-center gap-2">
                <i class="fa-solid fa-medal text-yellow-500"></i> أوسمتي
            </h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4" id="badgesGrid">
                <div class="badge-card" id="badge-king">
                    <div class="badge-icon">👑</div>
                    <p class="text-xs font-bold">ملك الإملاء</p>
                </div>
                <div class="badge-card" id="badge-star">
                    <div class="badge-icon">⭐</div>
                    <p class="text-xs font-bold">النجم الساطع</p>
                </div>
                <div class="badge-card" id="badge-persistent">
                    <div class="badge-icon">🔥</div>
                    <p class="text-xs font-bold">المثابر</p>
                </div>
                <div class="badge-card" id="badge-hero">
                    <div class="badge-icon">🏆</div>
                    <p class="text-xs font-bold">بطل الموقع</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <a href="grade.html" class="card p-8 flex items-center gap-6 group">
                <div class="w-20 h-20 rounded-2xl bg-pink-500/10 flex items-center justify-center text-4xl group-hover:scale-110 transition-transform">🎮</div>
                <div class="flex-1">
                    <h3 class="text-xl font-black text-white mb-1">عالم الألعاب</h3>
                    <p class="text-slate-400 text-sm font-bold">ابدأ المغامرة والتعلم الآن.</p>
                </div>
                <i class="fa-solid fa-chevron-left text-slate-700 group-hover:text-pink-500 transition-colors"></i>
            </a>

            <a href="leaderboard.html" class="card p-8 flex items-center gap-6 group">
                <div class="w-20 h-20 rounded-2xl bg-yellow-500/10 flex items-center justify-center text-4xl group-hover:scale-110 transition-transform">🏆</div>
                <div class="flex-1">
                    <h3 class="text-xl font-black text-white mb-1">لوحة الأبطال</h3>
                    <p class="text-slate-400 text-sm font-bold">شاهد ترتيبك بين أصدقائك.</p>
                </div>
                <i class="fa-solid fa-chevron-left text-slate-700 group-hover:text-yellow-500 transition-colors"></i>
            </a>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('currentUser') || 'طالب متميز';
            document.getElementById('userNameDisplay').textContent = user;
            
            const score = parseInt(localStorage.getItem('et_total_coins') || '0');
            document.getElementById('totalPoints').textContent = score;

            // تحديث الأوسمة
            const badges = JSON.parse(localStorage.getItem('et_badges') || '{}');
            if(badges.king) document.getElementById('badge-king').classList.add('badge-active');
            if(badges.star) document.getElementById('badge-star').classList.add('badge-active');
            if(badges.persistent) document.getElementById('badge-persistent').classList.add('badge-active');
            if(badges.hero) document.getElementById('badge-hero').classList.add('badge-active');
        });
    </script>
</body>
</html>
