<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>English Toon - قريباً</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; color: #1e293b; text-align: center; padding: 50px; }
        h1 { color: #0ea5e9; }
        .btn { display: inline-block; padding: 10px 20px; background: #0ea5e9; color: white; text-decoration: none; border-radius: 8px; margin: 10px; font-weight: bold; cursor: pointer; border: none; font-size: 16px;}
        .btn-logout { background: #f43f5e; }
    </style>
</head>
<body>
    <h1>English Toon 🚀</h1>
    <p>الموقع الآن تحت الصيانة وإعادة البناء بالكامل لتوفير تجربة أفضل.</p>
    <br>
    <a href="admin.html" class="btn">الذهاب للوحة الإدارة</a>
    <button onclick="logout()" class="btn btn-logout">تسجيل الخروج لرؤية واجهة الدخول</button>

    <script>
        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('allowedGrade');
            localStorage.removeItem('allowedUnits');
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
