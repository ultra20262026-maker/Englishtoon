<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ألعاب الصف الأول | EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #f8fafc; }
        .bg-pattern {
            background-image: radial-gradient(#1e293b 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .game-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .game-card:active { transform: scale(0.95); }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .gradient-border {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 2px;
            border-radius: 2rem;
        }
        .card-inner {
            background: #0f172a;
            border-radius: calc(2rem - 2px);
        }
        .dictation-border {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 bg-pattern">
    <header class="p-6 flex items-center justify-between bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="w-12 h-12 rounded-2xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition-all active:scale-90">
                <i class="fa-solid fa-house text-xl"></i>
            </a>
            <div>
                <h1 id="unitTitle" class="text-xl font-black text-blue-400">ألعاب الصف الأول</h1>
                <p id="unitSub" class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">Unit 1 Adventure</p>
            </div>
        </div>
        <div class="px-4 py-2 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center gap-2 text-blue-400 shadow-lg">
            <span class="font-black text-xl">24</span>
            <i class="fa-solid fa-gamepad text-xl"></i>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-8">
        <div id="gamesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Games will be injected here -->
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const unitNum = params.get('unit') || '1';
        
        const GAMES_DATA = [
            { name: "Cannon Shooter", icon: "fa-bomb", color: "from-blue-500 to-indigo-600" },
            { name: "Basket Catcher", icon: "fa-basket-shopping", color: "from-emerald-500 to-teal-600" },
            { name: "Space Shooter", icon: "fa-rocket", color: "from-purple-500 to-pink-600" },
            { name: "Bowling Striker", icon: "fa-bowling-ball", color: "from-orange-500 to-red-600" },
            { name: "Whack-a-Word", icon: "fa-hammer", color: "from-yellow-500 to-amber-600" },
            { name: "Memory Match", icon: "fa-clone", color: "from-cyan-500 to-blue-600" },
            { name: "Penalty Kick", icon: "fa-soccer-ball", color: "from-green-500 to-emerald-600" },
            { name: "Jumping Hero", icon: "fa-up-long", color: "from-indigo-500 to-purple-600" },
            { name: "Meteor Hunter", icon: "fa-meteor", color: "from-rose-500 to-pink-600" },
            { name: "Treasure Hunt", icon: "fa-gem", color: "from-amber-400 to-yellow-600" },
            { name: "Word Bridge", icon: "fa-bridge", color: "from-slate-500 to-slate-700" },
            { name: "Sky Race", icon: "fa-cloud", color: "from-sky-400 to-blue-500" },
            { name: "Robot Repair", icon: "fa-robot", color: "from-zinc-500 to-zinc-700" },
            { name: "Shadow Match", icon: "fa-ghost", color: "from-gray-700 to-black" },
            { name: "Firefighter Rescue", icon: "fa-fire-extinguisher", color: "from-red-500 to-orange-600" },
            { name: "Balloon Popper", icon: "fa-circle", color: "from-pink-400 to-rose-500" },
            { name: "Maze Runner", icon: "fa-route", color: "from-lime-500 to-green-600" },
            { name: "Magic Hat", icon: "fa-hat-wizard", color: "from-violet-500 to-purple-700" },
            { name: "Listening Bot", icon: "fa-headset", color: "from-blue-600 to-blue-800" },
            { name: "Jungle Explorer", icon: "fa-leaf", color: "from-green-600 to-emerald-800" },
            { name: "Butterfly Catcher", icon: "fa-bug", color: "from-orange-400 to-amber-500" },
            { name: "Magic Piano", icon: "fa-music", color: "from-indigo-600 to-blue-700" },
            { name: "Space Explorer", icon: "fa-satellite", color: "from-slate-800 to-slate-950" },
            { name: "Dictation (Spelling)", icon: "fa-spell-check", color: "from-amber-500 to-red-600", isSpecial: true }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('unitTitle').textContent = `الوحدة ${unitNum}`;
            document.getElementById('unitSub').textContent = `Unit ${unitNum} Arcade Adventure`;
            renderGames();
        });

        function renderGames() {
            const container = document.getElementById('gamesGrid');
            container.innerHTML = '';
            
            GAMES_DATA.forEach((game, index) => {
                const i = index + 1;
                const gameLink = `games/primary-1/unit${unitNum}/game_${i}.html`;
                
                const card = document.createElement('div');
                card.className = `gradient-border animate-fade-in-up ${game.isSpecial ? 'dictation-border' : ''}`;
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <a href="${gameLink}" class="game-card block card-inner p-5 group hover:bg-slate-900/40 transition-all">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${game.color} flex items-center justify-center text-white shadow-xl group-hover:scale-110 transition-transform">
                                    <i class="fa-solid ${game.icon} text-2xl"></i>
                                </div>
                                <div>
                                    <h4 class="font-black text-slate-100 text-lg">${game.name}</h4>
                                    <p class="text-[10px] ${game.isSpecial ? 'text-amber-400' : 'text-blue-400'} font-bold uppercase tracking-widest">
                                        ${game.isSpecial ? '⭐ Challenge ⭐' : 'Game ' + i}
                                    </p>
                                </div>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                <i class="fa-solid fa-play"></i>
                            </div>
                        </div>
                    </a>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
