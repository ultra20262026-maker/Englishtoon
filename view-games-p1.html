<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ألعاب الصف الأول - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f172a; font-family: 'Cairo', sans-serif; color: white; }
        .game-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .game-card:hover { transform: translateY(-10px) scale(1.02); }
    </style>
</head>
<body class="min-h-screen p-6 pb-24 bg-slate-950">
    <div class="max-w-6xl mx-auto">
        <header class="flex items-center justify-between mb-12 bg-slate-900/50 p-6 rounded-[2.5rem] border border-white/5 backdrop-blur-xl">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="w-12 h-12 bg-slate-800 rounded-2xl flex items-center justify-center text-white hover:bg-blue-600 transition-all active:scale-90">
                    <i class="fa-solid fa-house"></i>
                </a>
                <div>
                    <h1 id="unit-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 uppercase tracking-tighter">ألعاب الوحدة الأولى</h1>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Arcade Adventure</p>
                </div>
            </div>
            <div class="bg-blue-600/20 text-blue-400 px-4 py-2 rounded-2xl border border-blue-500/20 font-black">24 لعبة</div>
        </header>

        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Cards will be injected here -->
        </div>
    </div>

    <script>
        const GAME_NAMES = {
            1: "صائد الأسماك", 2: "حامي القلعة", 3: "فرقعة البالونات", 4: "انطلاق الصاروخ",
            5: "قفز القرد", 6: "سباق السيارات", 7: "قاذف الكواكب", 8: "ركلات الترجيح",
            9: "مطابقة الذاكرة", 10: "سلة الحصاد", 11: "صائد الكنز", 12: "فرقعة الفقاعات",
            13: "جري الديناصور", 14: "ضرب الأهداف", 15: "النحلة الإملائية", 16: "البحث عن الكلمات",
            17: "توصيل الصور", 18: "آلة الفشار", 19: "تلوين اللوحة", 20: "إصلاح الروبوت",
            21: "متجر الآيس كريم", 22: "إنقاذ الحيوانات", 23: "الغوص عن الكنز", 24: "إملاء الوحدة"
        };

        const ICONS = {
            1: "fa-fish", 2: "fa-fort-awesome", 3: "fa-circle", 4: "fa-rocket",
            5: "fa-frog", 6: "fa-car", 7: "fa-meteor", 8: "fa-futbol",
            9: "fa-clone", 10: "fa-basket-shopping", 11: "fa-gem", 12: "fa-soap",
            13: "fa-dragon", 14: "fa-bullseye", 15: "fa-bee", 16: "fa-magnifying-glass",
            17: "fa-link", 18: "fa-fire", 19: "fa-palette", 20: "fa-robot",
            21: "fa-ice-cream", 22: "fa-heart", 23: "fa-water", 24: "fa-keyboard"
        };

        const urlParams = new URLSearchParams(window.location.search);
        const unit = urlParams.get('unit') || '1';
        document.getElementById('unit-title').innerText = `ألعاب الوحدة ${unit}`;

        const grid = document.getElementById('games-grid');
        for (let i = 1; i <= 24; i++) {
            const card = document.createElement('a');
            card.href = `games/primary-1/unit${unit}/game_${i}.html?v=v2026_final`;
            card.className = "game-card group relative bg-slate-800/50 backdrop-blur-xl border border-white/10 rounded-[2rem] p-6 flex flex-col items-center text-center shadow-2xl hover:border-blue-500/50";
            
            card.innerHTML = `
                <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-3xl flex items-center justify-center text-4xl mb-4 shadow-lg group-hover:rotate-6 transition-transform">
                    <i class="fa-solid ${ICONS[i] || 'fa-gamepad'}"></i>
                </div>
                <h3 class="text-white font-black text-lg mb-1">${GAME_NAMES[i]}</h3>
                <span class="text-blue-400 text-xs font-bold uppercase tracking-widest">اللعبة ${i}</span>
                <div class="absolute top-4 right-4 w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            `;
            grid.appendChild(card);
        }
    </script>
</body>
</html>
