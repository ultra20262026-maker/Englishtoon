<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تحدي الإملاء | EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; touch-action: none; }
        .letter-tile {
            width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Fredoka One', sans-serif; font-size: 28px; font-weight: bold;
            background: linear-gradient(145deg, #3b82f6, #2563eb);
            border-radius: 15px; border-bottom: 5px solid #1d4ed8;
            cursor: pointer; transition: all 0.1s; user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .letter-tile:active { transform: translateY(2px); border-bottom-width: 2px; }
        .letter-tile.used { background: #334155; border-bottom-color: #1e293b; opacity: 0.5; pointer-events: none; transform: scale(0.9); }
        
        .answer-slot {
            width: 55px; height: 55px;
            border: 3px dashed rgba(255,255,255,0.1);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-family: 'Fredoka One', sans-serif; font-size: 28px; font-weight: bold;
            transition: all 0.2s;
        }
        .answer-slot.filled { border-style: solid; border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); color: #60a5fa; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        
        .success-anim { animation: success 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes success {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #22c55e; text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
            100% { transform: scale(1); }
        }

        .wrong-anim { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); color: #ef4444; }
            75% { transform: translateX(10px); color: #ef4444; }
        }

        .floating { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .bg-pattern {
            background-image: radial-gradient(#1e293b 2px, transparent 2px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-pattern">
    <header class="p-4 flex items-center justify-between bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 z-10">
        <div class="flex items-center gap-3">
            <a id="backBtn" href="#" class="w-12 h-12 rounded-2xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition-colors">
                <i class="fa-solid fa-chevron-right text-xl"></i>
            </a>
            <div>
                <h1 class="font-black text-xl text-white tracking-tight">تحدي الإملاء</h1>
                <p id="lesson-info" class="text-xs text-blue-400 font-bold uppercase tracking-widest">UNIT 1 • LESSON 1</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="px-4 py-2 bg-yellow-500/10 rounded-2xl border border-yellow-500/20 text-yellow-500 font-black flex items-center gap-2">
                <span class="text-xl">🪙</span>
                <span id="score" class="text-2xl">0</span>
            </div>
            <div id="lives" class="flex gap-1 text-2xl drop-shadow-lg">❤️❤️❤️</div>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 gap-10 relative">
        <!-- Progress Bar -->
        <div class="w-full max-w-md bg-slate-800 h-3 rounded-full overflow-hidden absolute top-6">
            <div id="progress" class="bg-blue-500 h-full transition-all duration-500" style="width: 0%"></div>
        </div>

        <div class="text-center">
            <div id="hint-img" class="text-8xl mb-6 floating drop-shadow-2xl">📝</div>
            <h2 id="arabic-hint" class="text-2xl font-black text-slate-200 mb-4">رتب الحروف لتكوين الكلمة</h2>
            <div class="flex items-center justify-center gap-4">
                <button onclick="speakWord()" class="w-16 h-16 rounded-3xl bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center shadow-lg shadow-blue-900/40 transition-all active:scale-95">
                    <i class="fa-solid fa-volume-high text-2xl"></i>
                </button>
            </div>
        </div>

        <!-- Answer Area -->
        <div id="answer-area" class="flex flex-wrap justify-center gap-3 min-h-[70px] w-full max-w-2xl">
            <!-- Slots will be here -->
        </div>

        <!-- Letters Area -->
        <div id="letters-area" class="flex flex-wrap justify-center gap-4 mt-6 w-full max-w-2xl">
            <!-- Tiles will be here -->
        </div>

        <div class="mt-10 flex gap-6">
            <button onclick="clearAnswer()" class="px-8 py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-black text-lg transition-all active:scale-95 border-b-4 border-slate-900">
                <i class="fa-solid fa-rotate-left ml-2"></i> مسح الكل
            </button>
        </div>
    </main>

    <!-- Success Overlay -->
    <div id="overlay" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center hidden p-8 text-center backdrop-blur-sm">
        <div class="text-9xl mb-8 animate-bounce">🏆</div>
        <h2 class="text-6xl font-black text-white mb-4">عبقري الإملاء!</h2>
        <p class="text-2xl text-slate-400 mb-12 max-w-md">لقد أتقنت تهجئة كافة كلمات هذا الدرس ببراعة وحصلت على مكافأة!</p>
        <div class="flex flex-col gap-4 w-full max-w-xs">
            <button onclick="location.reload()" class="px-10 py-5 bg-blue-600 hover:bg-blue-500 rounded-3xl font-black text-2xl text-white shadow-xl shadow-blue-900/40 transition-all active:scale-95 border-b-8 border-blue-800">العب مرة أخرى</button>
            <a id="finishBtn" href="dashboard.html" class="px-10 py-5 bg-slate-800 hover:bg-slate-700 rounded-3xl font-black text-xl text-slate-300 transition-all border-b-8 border-slate-900">العودة للرئيسية</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gradeId = params.get('id');
        const unit = params.get('unit');
        const lesson = params.get('lesson') || "1";
        
        let words = [];
        let currentWordIndex = 0;
        let currentWord = "";
        let userTyped = "";
        let lives = 3;

        // Firebase Config
        const fbConfig = {
            apiKey: "AIzaSyA1_kx4HmDWZF_T_EnZDKgq5yssYlOMaWM",
            authDomain: "english-toon-14072.firebaseapp.com",
            projectId: "english-toon-14072",
            storageBucket: "english-toon-14072.firebasestorage.app",
            messagingSenderId: "276063917807",
            appId: "1:276063917807:web:c794621a4df054fdaaad1a"
        };
        if (!firebase.apps.length) firebase.initializeApp(fbConfig);
        const db = firebase.firestore();
        const deviceId = localStorage.getItem('device_id') || ('et-' + Math.random().toString(36).slice(2, 9));
        localStorage.setItem('device_id', deviceId);

        // Persistent Data Logic
        async function saveProgress() {
            // Total Score
            let currentTotal = parseInt(localStorage.getItem('englishtoon_total_score') || '0');
            const newTotal = currentTotal + 20;
            localStorage.setItem('englishtoon_total_score', newTotal);

            // Lesson Progress
            const progressKey = `englishtoon_progress_${gradeId}_${unit}_${lesson}`;
            let progress = JSON.parse(localStorage.getItem(progressKey) || '{"stars": 0, "completed": false}');
            
            if (currentWordIndex >= words.length - 1) {
                progress.completed = true;
                progress.stars = 3;
            } else if (currentWordIndex > words.length / 2) {
                progress.stars = Math.max(progress.stars, 2);
            } else {
                progress.stars = Math.max(progress.stars, 1);
            }
            
            localStorage.setItem(progressKey, JSON.stringify(progress));

            // Sync to Cloud for Leaderboard (Total + Specific Game + Badges)
            try {
                const userName = localStorage.getItem('currentUser') || 'طالب متميز';
                const gameKey = `${gradeId}_U${unit}_L${lesson}`;
                const badges = JSON.parse(localStorage.getItem('et_badges') || '{}');
                
                // Update Total Score with Badges
                await db.collection('leaderboard').doc(`${deviceId}_total`).set({
                    name: userName,
                    score: newTotal,
                    grade: gradeId,
                    deviceId: deviceId,
                    badges: badges,
                    lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                // Update Specific Game High Score
                const gameRef = db.collection('game_scores').doc(`${deviceId}_${gameKey}`);
                const doc = await gameRef.get();
                const currentBest = doc.exists ? doc.data().score : 0;
                const sessionGameScore = (currentWordIndex + 1) * 20;
                
                if (sessionGameScore > currentBest) {
                    await gameRef.set({
                        name: userName,
                        score: sessionGameScore,
                        grade: gradeId,
                        unit: unit,
                        lesson: lesson,
                        gameId: gameKey,
                        deviceId: deviceId,
                        badges: badges,
                        lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // Check if player is now #1 for King Badge
                    const topPlayer = await db.collection('game_scores')
                        .where('gameId', '==', gameKey)
                        .orderBy('score', 'desc')
                        .limit(1)
                        .get();
                    
                    if (!topPlayer.empty && topPlayer.docs[0].data().deviceId === deviceId) {
                        badges.king = true;
                        localStorage.setItem('et_badges', JSON.stringify(badges));
                    }
                }
            } catch (e) {
                console.error("Cloud sync failed", e);
            }
        }

        function loadTotalScore() {
            return parseInt(localStorage.getItem('englishtoon_total_score') || '0');
        }

        document.getElementById('backBtn').href = `view-games.html?id=${gradeId}&unit=${unit}`;
        document.getElementById('lesson-info').textContent = `UNIT ${unit} • LESSON ${lesson}`;
        document.getElementById('score').textContent = loadTotalScore();

        async function loadVocab() {
            try {
                const response = await fetch('rebuild/all_dictation_vocab.json');
                const data = await response.json();
                const gradeVocab = data[gradeId] || {};
                const key = `U${unit}L${lesson}`;
                words = gradeVocab[key] || [];
                
                if (words.length === 0) {
                    words = ['hello', 'teacher', 'school', 'student', 'book'];
                }
                
                words.sort(() => Math.random() - 0.5);
                initGame();
            } catch (e) {
                console.error("Failed to load vocab", e);
                words = ['apple', 'orange', 'banana'];
                initGame();
            }
        }

        function initGame() {
            if (currentWordIndex >= words.length) {
                showVictory();
                return;
            }

            currentWord = words[currentWordIndex].toLowerCase().trim();
            userTyped = "";
            
            const progress = (currentWordIndex / words.length) * 100;
            document.getElementById('progress').style.width = `${progress}%`;
            
            renderSlots();
            renderLetters();
            setTimeout(speakWord, 500);
        }

        function renderSlots() {
            const area = document.getElementById('answer-area');
            area.innerHTML = '';
            for (let i = 0; i < currentWord.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'answer-slot';
                area.appendChild(slot);
            }
        }

        function renderLetters() {
            const area = document.getElementById('letters-area');
            area.innerHTML = '';
            let letters = currentWord.split('');
            letters.sort(() => Math.random() - 0.5);
            
            letters.forEach((char, idx) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.textContent = char.toUpperCase();
                tile.onclick = () => addLetter(char, tile);
                area.appendChild(tile);
            });
        }

        function addLetter(char, tile) {
            if (userTyped.length < currentWord.length) {
                userTyped += char;
                tile.classList.add('used');
                updateSlots();
                
                if (userTyped.length === currentWord.length) {
                    setTimeout(checkAnswer, 300);
                }
            }
        }

        function updateSlots() {
            const slots = document.querySelectorAll('.answer-slot');
            for (let i = 0; i < slots.length; i++) {
                if (userTyped[i]) {
                    slots[i].textContent = userTyped[i].toUpperCase();
                    slots[i].classList.add('filled');
                } else {
                    slots[i].textContent = '';
                    slots[i].classList.remove('filled');
                }
            }
        }

        function clearAnswer() {
            userTyped = "";
            updateSlots();
            document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('used'));
        }

        function checkAnswer() {
            if (userTyped === currentWord) {
                saveProgress(); 
                document.getElementById('score').textContent = loadTotalScore();
                
                const slots = document.querySelectorAll('.answer-slot');
                slots.forEach(s => s.classList.add('success-anim'));
                
                confetti({
                    particleCount: 40,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#3b82f6', '#60a5fa', '#ffffff']
                });

                setTimeout(() => {
                    currentWordIndex++;
                    initGame();
                }, 1200);
            } else {
                lives--;
                document.getElementById('lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3-lives);
                
                const area = document.getElementById('answer-area');
                area.classList.add('wrong-anim');
                
                if (lives <= 0) {
                    alert('انتهت المحاولات! حاول مرة أخرى');
                    location.reload();
                } else {
                    setTimeout(() => {
                        area.classList.remove('wrong-anim');
                        clearAnswer();
                    }, 400);
                }
            }
        }

        function speakWord() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(currentWord);
                msg.lang = 'en-US';
                msg.rate = 0.8;
                window.speechSynthesis.speak(msg);
            }
        }

        function showVictory() {
            document.getElementById('progress').style.width = `100%`;
            document.getElementById('overlay').classList.remove('hidden');
            
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
              confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#3b82f6', '#fbbf24'] });
              confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#3b82f6', '#fbbf24'] });
              if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        loadVocab();
    </script>
</body>
</html>
