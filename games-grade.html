<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وحدات الصف | English Toon</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/englishtoon-brand-theme.css?v=20270827">
  <style>
    :root{--navy:#08152d;--navy-2:#10244b;--blue:#4e7cff;--gold:#ffd166;--mint:#4fe0b1;--ink:#edf4ff;--muted:#a9b9dc;--line:#29457f}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 0%,#214582 0,#08152d 43%,#050c1b 100%);color:var(--ink);font-family:"Cairo","Segoe UI",sans-serif} a{text-decoration:none;color:inherit}
    .shell{width:min(1050px,100%);margin:auto;padding:18px 16px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.brand{font-size:clamp(21px,4vw,32px);font-weight:900}.brand span{color:var(--gold)}.back{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#10234a;border-radius:13px;padding:10px 15px;color:#dce7ff;font-weight:900;font-size:13px}.back:hover{border-color:var(--gold)}
    .grade-hero{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:22px;border-radius:28px;border:1px solid #3b5d9e;background:linear-gradient(135deg,#18366d,#0c1b3e);box-shadow:0 20px 45px #0005;margin-bottom:20px}.grade-icon{width:112px;height:112px;border-radius:26px;object-fit:cover;border:4px solid #fff;box-shadow:0 12px 25px #0005}.eyebrow{margin:0 0 5px;color:var(--gold);font-size:13px;font-weight:900}.grade-hero h1{margin:0;font-size:clamp(26px,5vw,43px);line-height:1.2}.grade-hero p{margin:8px 0 0;color:var(--muted);font-weight:700}.mode-badge{padding:10px 14px;border:1px solid #5472b5;border-radius:14px;background:#0a1939;color:#dce7ff;font-weight:900;font-size:12px;white-space:nowrap}.mode-badge.dictation{color:#251900;background:linear-gradient(135deg,#ffd166,#f5a623);border-color:#ffe69d}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:26px 3px 15px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:700}.units-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.unit-card{display:flex;flex-direction:column;min-height:175px;padding:20px;border-radius:22px;border:1px solid #31518e;background:linear-gradient(145deg,#142d60,#0b1939);box-shadow:0 14px 28px #0003;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.unit-card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 19px 32px #0005}.unit-number{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#ffd166,#f5a623);color:#372400;font-family:'Outfit',sans-serif;font-size:20px;font-weight:900;box-shadow:0 7px 0 #bc8024;margin-bottom:15px}.unit-card h3{margin:0;color:#fff;font-size:18px}.unit-card p{margin:6px 0 14px;color:var(--muted);font-size:12px;font-weight:700}.unit-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-top:auto;padding:10px;border-radius:12px;background:#0a1733;border:1px solid #335397;color:#dce7ff;font-size:12px;font-weight:900}.unit-card:hover .unit-link{background:#1b3971;border-color:var(--gold)}
    .dictation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lesson-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:auto}.lesson-link{display:flex;align-items:center;justify-content:center;padding:10px 5px;border-radius:11px;background:#fff7d6;color:#674400;border:1px solid #f5d974;font-size:12px;font-weight:900}.lesson-link:hover{background:#ffd166;transform:translateY(-2px)}.empty{padding:28px;border:1px dashed #5573b1;border-radius:20px;color:var(--muted);text-align:center;font-weight:800}
    .footer-link{display:inline-block;margin-top:27px;color:#b9c9e8;font-weight:900;border-bottom:1px solid #7892c9;padding-bottom:4px}
    @media(max-width:700px){.grade-hero{grid-template-columns:auto 1fr}.mode-badge{grid-column:1/-1;justify-self:start}.units-grid,.dictation-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:500px){.shell{padding:12px 10px 35px}.topbar{align-items:flex-start}.grade-hero{gap:13px;padding:15px;border-radius:22px}.grade-icon{width:78px;height:78px;border-radius:19px}.grade-hero h1{font-size:24px}.grade-hero p{font-size:12px}.section-head{display:block}.units-grid,.dictation-grid{grid-template-columns:1fr;gap:12px}.unit-card{min-height:155px;padding:17px}.lesson-list{grid-template-columns:repeat(4,minmax(0,1fr))}.back{padding:9px 12px}.brand{font-size:22px}}
  </style>
</head>
<body class="toon-unified-page">
  <div class="shell">
    <header class="topbar"><a class="brand" href="dashboard.html">English<span>Toon</span></a><a class="back" href="games.html"><span>↩</span> كل الصفوف</a></header>
    <main id="app" aria-live="polite"></main>
    <a class="footer-link" href="dashboard.html">↩ العودة إلى الواجهة الرئيسية</a>
  </div>
  <script>
    const grades={
      'primary-1':{name:'الصف الأول الابتدائي',root:'games/primary-1/unit_',icon:'primary-1'},
      'primary-2':{name:'الصف الثاني الابتدائي',root:'games/primary-2/Unit_',icon:'primary-2'},
      'primary-3':{name:'الصف الثالث الابتدائي',root:'games/primary-3/Unit_',icon:'primary-3'},
      'primary-4':{name:'الصف الرابع الابتدائي',root:'games/primary-4/Unit_',icon:'primary-4'},
      'primary-5':{name:'الصف الخامس الابتدائي',root:'games/primary-5/Unit_',icon:'primary-5'},
      'primary-6':{name:'الصف السادس الابتدائي',root:'games/primary-6/Unit_',icon:'primary-6'},
      'prep-1':{name:'الصف الأول الإعدادي',root:'games/prep-1/Unit_',icon:'prep-1'},
      'prep-2':{name:'الصف الثاني الإعدادي',root:'games/prep-2/Prep2_ActionGames_Unit',icon:'prep-2'},
      'prep-3':{name:'الصف الثالث الإعدادي',root:'games/prep-3/unit',icon:'prep-3'}
    };
    const params=new URLSearchParams(location.search); const gradeId=params.get('grade')||'primary-1'; const mode=params.get('mode')==='dictation'?'dictation':'games'; const grade=grades[gradeId]||grades['primary-1']; localStorage.setItem('et_current_grade',gradeId);
    const unitPath=(n)=>grade.root+n+'/index.html';
    const units=Array.from({length:6},(_,i)=>i+1);
    const unitCards=mode==='games'?`<section><div class="section-head"><div><h2>وحدات الصف</h2><p>اختر الوحدة لتدخل إلى ألعابها التفاعلية.</p></div></div><div class="units-grid">${units.map(n=>`<a class="unit-card" href="${unitPath(n)}"><span class="unit-number">${n}</span><h3>الوحدة ${n}</h3><p>ألعاب الكتاب والمغامرات التفاعلية</p><span class="unit-link">دخول إلى الوحدة <span>←</span></span></a>`).join('')}</div></section>`:`<section><div class="section-head"><div><h2>دروس تسميع الكلمات</h2><p>اختر الوحدة ثم الدرس لترتيب الكلمة وسماع نطقها.</p></div></div><div class="dictation-grid">${units.map(n=>`<div class="unit-card"><span class="unit-number">${n}</span><h3>الوحدة ${n}</h3><p>أربع مغامرات إملاء</p><div class="lesson-list">${[1,2,3,4].map(l=>`<a class="lesson-link" href="dictation.html?grade=${encodeURIComponent(gradeId)}&unit=${n}&lesson=${l}">L${l}</a>`).join('')}</div></div>`).join('')}</div></section>`;
    document.getElementById('app').innerHTML=`<section class="grade-hero"><img class="grade-icon" src="images/brand/grade-icons/${grade.icon}.webp" alt=""><div><p class="eyebrow">${mode==='dictation'?'تسميع الكلمات — Dictation':'ألعاب الكتاب التفاعلية'}</p><h1>${grade.name}</h1><p>${mode==='dictation'?'رتّب الكلمات واستمع إلى النطق درسًا بعد درس.':'اختر وحدة واحدة لتظهر لك ألعابها وتبدأ المغامرة.'}</p></div><span class="mode-badge ${mode==='dictation'?'dictation':''}">${mode==='dictation'?'🎧 Dictation':'🎮 ألعاب الكتاب'}</span></section>${unitCards}`;
  </script>
</body>
</html>
