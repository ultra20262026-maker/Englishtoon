<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basket Catcher - سلة الحصاد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js?v=5.4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #fef3c7; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="fixed top-20 left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none">
        <div class="bg-orange-100/80 backdrop-blur-md p-4 rounded-3xl border border-orange-200 shadow-xl">
            <p class="text-orange-600 text-xs font-bold uppercase mb-1">التقط في السلة:</p>
            <h2 id="target-word" class="text-slate-900 text-3xl font-black">APPLE</h2>
            <button onclick="Engine.speak(document.getElementById('target-word').innerText)" class="pointer-events-auto mt-2 bg-orange-500 p-2 rounded-full shadow-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = [{"word": "Apple", "image": "apple.png"}, {"word": "Ball", "image": "ball.png"}, {"word": "Cat", "image": "cat.png"}, {"word": "Dog", "image": "dog.png"}, {"word": "Egg", "image": "egg.png"}, {"word": "bag", "image": "bag.png"}, {"word": "board", "image": "board.png"}, {"word": "book", "image": "book.png"}, {"word": "chair", "image": "chair.png"}, {"word": "desk", "image": "desk.png"}, {"word": "ill", "image": "ill.png"}, {"word": "in", "image": "in.png"}, {"word": "ink", "image": "ink.png"}, {"word": "insect", "image": "insect.png"}, {"word": "open your books", "image": "open_your_books.png"}, {"word": "pencil", "image": "pencil.png"}, {"word": "sit down", "image": "sit_down.png"}, {"word": "stand up", "image": "stand_up.png"}];
        let currentTarget = "";
        let basket = { x: 0, w: 120, h: 60 };
        let items = [];

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            basket.x = canvas.width / 2;
            nextLevel();
            Engine.init();
            animate();
        }

        function nextLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.toUpperCase();
            items = [];
            spawnItems();
        }

        function spawnItems() {
            const choices = Engine.getWords(vocab, 3);
            if (!choices.includes(currentTarget)) choices[0] = currentTarget;
            
            choices.forEach((text, i) => {
                Engine.loadSprite(text, (img) => {
                    items.push({
                        x: (i + 1) * (canvas.width / 4),
                        y: -100 - (i * 200),
                        text: text,
                        img: img,
                        speed: (2 + Math.random() * 2) * Engine.speed
                    });
                });
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (Engine.gameActive) {
                // Draw Basket
                ctx.fillStyle = '#92400e';
                ctx.beginPath();
                ctx.roundRect(basket.x - basket.w/2, canvas.height - 80, basket.w, basket.h, 10);
                ctx.fill();
                ctx.strokeStyle = '#78350f'; ctx.lineWidth = 4; ctx.stroke();

                // Update Items
                items.forEach((item, ii) => {
                    item.y += item.speed;
                    
                    if(item.img) ctx.drawImage(item.img, item.x - 40, item.y - 40, 80, 80);
                    ctx.fillStyle = '#451a03';
                    ctx.font = 'bold 14px Cairo';
                    ctx.textAlign = 'center';
                    ctx.fillText(item.text.toUpperCase(), item.x, item.y + 55);

                    // Catch detection
                    if (item.y > canvas.height - 80 && item.y < canvas.height - 20) {
                        if (Math.abs(item.x - basket.x) < basket.w/2) {
                            if (item.text === currentTarget) {
                                items = [];
                                Engine.addScore(100);
                                Engine.showFeedback(true);
                                Engine.showWinScreen(() => nextLevel());
                            } else {
                                Engine.addScore(-20);
                                Engine.showFeedback(false);
                                items.splice(ii, 1);
                            }
                        }
                    }

                    if (item.y > canvas.height + 100) {
                        items.splice(ii, 1);
                        if (items.length === 0) spawnItems();
                    }
                });
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointermove', (e) => {
            if (!Engine.gameActive) return;
            basket.x = e.clientX;
        });

        initGame();
    </script>
</body>
</html>
