<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعاب الوحدة | English Toon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        en: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#ec4899',
                        accent: '#f59e0b',
                        success: '#10b981',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e0f2fe;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.6) 0%, transparent 50%),
                linear-gradient(135deg, #e0f2fe 0%, #bae6fd 40%, #7dd3fc 100%);
            min-height: 100vh;
            background-attachment: fixed;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .game-tile {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border-radius: 2rem;
            overflow: hidden;
            display: block;
            text-decoration: none;
        }
        .game-tile:hover {
            transform: translateY(-8px);
            border-color: #3b82f6;
            box-shadow: 0 20px 30px -10px rgba(59, 130, 246, 0.3);
        }
        
        .game-thumb-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid rgba(255,255,255,0.5);
        }
        
        .game-emoji-badge {
            font-size: 5rem;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
            transition: transform 0.4s ease;
        }
        
        .game-tile:hover .game-emoji-badge {
            transform: scale(1.1) rotate(5deg);
        }
        
        .game-play-hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .game-tile:hover .game-play-hover-overlay {
            opacity: 1;
        }
        
        .play-action-circle {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
            font-size: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .game-tile:hover .play-action-circle {
            transform: scale(1);
        }
        
        .game-info-box {
            padding: 20px;
        }

        #grammar-modal {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
    <link rel="stylesheet" href="css/englishtoon-3d-backgrounds.css?v=1">
</head>
<body class="text-slate-800 pb-20 toon-scene-units">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-4">
                    <a href="#" id="back-to-grade-btn" class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-200 text-slate-500 hover:text-primary hover:border-primary transition-all duration-300 transform hover:-translate-x-1">
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                    <div>
                        <h2 class="text-xl font-black text-slate-800" id="unit-header-title">ألعاب الوحدة</h2>
                        <p class="text-xs font-bold text-primary" id="unit-header-sub">العب، استمتع، وتعلم!</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <h3 class="text-2xl font-black text-slate-800 flex items-center gap-3">
                <i class="fa-solid fa-gamepad text-primary"></i> الألعاب والتحديات
            </h3>
            <span id="games-count-badge" class="bg-indigo-100 text-indigo-600 font-bold px-4 py-2 rounded-full text-sm">جاري التحميل...</span>
        </div>

        <!-- Games Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="games-container">
            <!-- Rendered via JS -->
        </div>

    </main>

    <script src="js/data.js?v=202701"></script>
    <script src="js/auth.js?v=202701"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.replace('index.html');
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const gradeId = urlParams.get('grade');
            const unitId = urlParams.get('unit');

            if (!gradeId || !unitId) {
                window.location.href = 'dashboard.html';
                return;
            }

            document.getElementById('back-to-grade-btn').href = `grade.html?id=${gradeId}`;
            
            const grade = GRADES_DATA.find(g => g.id === gradeId);
            if(grade) {
                document.getElementById('unit-header-sub').textContent = grade.name + ' - الوحدة ' + unitId;
            }

            const container = document.getElementById('games-container');
            let unitGames = [];
            let grammarGames = [];

            if (typeof GAMES_MAP !== 'undefined' && GAMES_MAP[gradeId] && GAMES_MAP[gradeId][unitId]) {
                unitGames = GAMES_MAP[gradeId][unitId];
            }
            if (typeof GRAMMAR_GAMES_MAP !== 'undefined' && GRAMMAR_GAMES_MAP[gradeId] && GRAMMAR_GAMES_MAP[gradeId][unitId]) {
                grammarGames = GRAMMAR_GAMES_MAP[gradeId][unitId];
            }

            // Combine all games side-by-side
            const allGames = [...unitGames, ...grammarGames];
            document.getElementById('games-count-badge').textContent = `${allGames.length} لعبة متاحة`;

            container.innerHTML = '';

            if (allGames.length === 0) {
                    container.innerHTML = `
                    <div class="col-span-full text-center py-24 bg-white/70 backdrop-blur-xl rounded-[2.5rem] border-2 border-dashed border-blue-300 shadow-xl p-8 max-w-2xl mx-auto my-8">
                        <div class="w-24 h-24 mx-auto mb-6 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-3xl flex items-center justify-center text-5xl shadow-lg shadow-blue-500/30 animate-bounce">
                            🚀
                        </div>
                        <h3 class="text-3xl font-black text-slate-800 mb-3 font-ar">جاري الإضافة قريباً!</h3>
                        <p class="text-slate-600 font-bold text-lg leading-relaxed mb-6 font-ar">
                            يتم حالياً تجهيز وإضافة الألعاب التفاعلية الجديدة لهذه الوحدة. ترقبوا التحديث القادم!
                        </p>
                        <span class="inline-block bg-blue-100 text-blue-700 font-black px-5 py-2 rounded-full text-sm font-ar border border-blue-200">
                            ✨ قريباً جداً
                        </span>
                    </div>`;
            } else {
                allGames.forEach((game, idx) => {
                    const visual = getGameVisual(game.name);
                    let gamePath = game.file;
                    if (gamePath.startsWith('../../')) {
                        gamePath = gamePath.replace('../../', '');
                    } else if (!gamePath.includes('/') && !gamePath.startsWith('http')) {
                        gamePath = `games/${gradeId}/unit${unitId}/${game.file}`;
                    }

                    const tile = document.createElement('a');
                    tile.href = gamePath;
                    tile.className = 'game-tile';

                    tile.innerHTML = `
                        <div class="game-thumb-container" style="background: ${visual.bg};">
                            <span class="game-emoji-badge">${visual.emoji}</span>
                            <div class="game-play-hover-overlay">
                                <div class="play-action-circle"><i class="fa-solid fa-play"></i></div>
                            </div>
                        </div>
                        <div class="game-info-box">
                            <h3 class="text-lg font-black text-slate-800 mb-2">${game.name}</h3>
                            <div class="flex items-center justify-between">
                                <span class="text-primary font-bold text-sm">⚡ العب الآن</span>
                                ${idx === 0 ? '<span class="bg-rose-100 text-rose-600 text-xs font-bold px-2 py-1 rounded">⭐ مميز</span>' : ''}
                            </div>
                        </div>
                    `;
                    container.appendChild(tile);
                });
            }
        });

        function getGameVisual(gameName) {
            const name = (gameName || '').toLowerCase();
            
            if (name.includes('cannon') || name.includes('مدفع')) return { emoji: '💣', bg: 'linear-gradient(135deg, #f59e0b, #d97706)' };
            if (name.includes('archery') || name.includes('سهام') || name.includes('رمي')) return { emoji: '🎯', bg: 'linear-gradient(135deg, #FF416C, #FF4B2B)' };
            if (name.includes('space') || name.includes('فضاء') || name.includes('صاروخ') || name.includes('سفينة')) return { emoji: '🚀', bg: 'linear-gradient(135deg, #654ea3, #eaafc8)' };
            if (name.includes('bubble') || name.includes('فقاعات')) return { emoji: '🫧', bg: 'linear-gradient(135deg, #00c6ff, #0072ff)' };
            if (name.includes('balloon') || name.includes('بالون') || name.includes('فرقعة')) return { emoji: '🎈', bg: 'linear-gradient(135deg, #FF4E50, #F9D423)' };
            if (name.includes('صيد') || name.includes('سمك') || name.includes('fishing')) return { emoji: '🎣', bg: 'linear-gradient(135deg, #2193b0, #6dd5ed)' };
            if (name.includes('بناء') || name.includes('برج')) return { emoji: '🏗️', bg: 'linear-gradient(135deg, #FF8008, #FFC837)' };
            if (name.includes('بالون')) return { emoji: '🎈', bg: 'linear-gradient(135deg, #FF4E50, #F9D423)' };
            if (name.includes('سيارات') || name.includes('سباق')) return { emoji: '🏎️', bg: 'linear-gradient(135deg, #F00000, #DC281E)' };
            if (name.includes('ذاكرة') || name.includes('بطاقات')) return { emoji: '🧠', bg: 'linear-gradient(135deg, #f857a6, #ff5858)' };
            if (name.includes('حيوان')) return { emoji: '🦁', bg: 'linear-gradient(135deg, #56ab2f, #a8e063)' };
            if (name.includes('متاهة')) return { emoji: '🌀', bg: 'linear-gradient(135deg, #3A1C71, #D76D77)' };
            
            return { emoji: '🎮', bg: 'linear-gradient(135deg, #6366F1, #8B5CF6)' };
        }

        window.openGrammarModal = function() {
            document.getElementById('grammar-modal').classList.remove('hidden');
            document.getElementById('grammar-modal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        window.closeGrammarModal = function() {
            document.getElementById('grammar-modal').classList.add('hidden');
            document.getElementById('grammar-modal').classList.remove('flex');
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
