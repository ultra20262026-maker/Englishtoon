<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Nunito', sans-serif; overflow: hidden; width: 100vw; height: 100vh; background: #000; user-select: none; }

/* HUD */
#hud { position: fixed; top: 0; left: 0; right: 0; padding: 15px 30px; display: flex; justify-content: space-between; color: white; font-size: 1.5rem; font-weight: 900; z-index: 200; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
#score-val { color: #f1c40f; }

/* Question Panel */
#q-panel { position: fixed; top: 70px; left: 0; right: 0; display: flex; justify-content: center; z-index: 150; pointer-events: none; }
#q-text { background: rgba(0,0,0,0.7); border: 2px solid rgba(255,255,255,0.2); padding: 15px 40px; border-radius: 30px; color: white; font-size: 1.8rem; font-weight: 900; max-width: 80%; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5); line-height: 1.4; }

/* Targets Container */
#targets { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; pointer-events: none; }
.target-btn { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; border: none; font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: white; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; display: flex; justify-content: center; align-items: center; text-align: center; line-height: 1.2; padding: 10px; transition: filter 0.2s; }
.target-btn:hover { filter: brightness(1.2); }
.target-btn:disabled { cursor: not-allowed; }

/* Canvas */
canvas { display: block; position: fixed; top: 0; left: 0; z-index: 10; }

/* End Screen */
#end-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
#end-screen.show { display: flex; }
#end-screen h1 { font-size: 4rem; margin-bottom: 20px; font-family: 'Fredoka One', cursive; }
#end-screen p { font-size: 2rem; color: #f1c40f; margin-bottom: 30px; font-weight: 900; }
#end-screen button { padding: 15px 50px; background: #e74c3c; color: white; border: none; border-radius: 40px; font-size: 1.5rem; font-weight: 900; cursor: pointer; font-family: 'Nunito', sans-serif; transition: transform 0.2s; }
#end-screen button:hover { transform: scale(1.1); background: #c0392b; }

/* Game Specific CSS */

body { background: linear-gradient(to bottom, #1a0b2e, #4a192c); }
.target-btn {
    width: 140px; height: 140px;
    background: radial-gradient(circle, #8B4513 40%, #5c2e0b 100%);
    border: 4px solid #3d1f05; border-radius: 50%;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
    /* Make it look like a wooden barrel top */
    background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
}

</style>

<body>

<div id="hud">
    <div>Cannon Blast - Unit 3</div>
    <div id="q-num">Q 1/25</div>
    <div>Score: <span id="score-val">0</span></div>
</div>

<div id="q-panel"><div id="q-text"></div></div>

<div id="targets"></div>
<canvas id="cv"></canvas>

<div id="end-screen">
    <h1 id="end-title">Game Over!</h1>
    <p id="end-score">Score: 0</p>
    <button onclick="location.reload()">ðŸ”„ Play Again</button>
</div>

<script>
const QS = [{"type": "mcq", "q": "If you don't give up easily, this means you have _____.", "choices": ["information", "determination", "preparation"], "answer": 1}, {"type": "mcq", "q": "My friend Ali finds grammar difficult. He _____ with it.", "choices": ["struggled", "supported", "started"], "answer": 0}, {"type": "mcq", "q": "Failing a quiz makes me discouraged. 'Discouraged' has the same meaning as _____.", "choices": ["happy", "glad", "disappointed"], "answer": 2}, {"type": "mcq", "q": "When we feel that something is difficult, it takes courage to keep _____.", "choices": ["going", "doing", "playing"], "answer": 0}, {"type": "mcq", "q": "During his journey with Science, Dr. Zewail _____ a lot of challenges.", "choices": ["overslept", "overcame", "overdid"], "answer": 1}, {"type": "mcq", "q": "With determination, Soha wanted to overcome her _____ with grammar.", "choices": ["improve", "posters", "challenges"], "answer": 2}, {"type": "mcq", "q": "She watched videos and made grammar _____ for her room.", "choices": ["challenges", "posters", "obstacles"], "answer": 1}, {"type": "mcq", "q": "Each grammar rule felt like an _____, but she didn't stop.", "choices": ["obstacle", "poster", "improve"], "answer": 0}, {"type": "mcq", "q": "Slowly, she began to _____. She passed her next quiz.", "choices": ["obstacle", "poster", "improve"], "answer": 2}, {"type": "mcq", "q": "My brother felt _____ when he took part in the art competition.", "choices": ["terrible", "sad", "excited"], "answer": 2}, {"type": "mcq", "q": "He wanted to _____ the race as he hurt his knee very much.", "choices": ["quite", "quit", "gain"], "answer": 1}, {"type": "mcq", "q": "Sometimes, we want to win _____ our fear, not win a medal or a cup.", "choices": ["against", "for", "after"], "answer": 0}, {"type": "mcq", "q": "The government is trying to find _____ to most of our problems.", "choices": ["salutes", "obstacles", "solutions"], "answer": 2}, {"type": "mcq", "q": "There are big traffic _____ on the streets and highways of Cairo.", "choices": ["blocks", "jams", "cars"], "answer": 1}, {"type": "mcq", "q": "Most students feel _____ before exams.", "choices": ["stressed", "happy", "glad"], "answer": 0}, {"type": "mcq", "q": "One of the greatest projects in Cairo is building a lot of _____.", "choices": ["apartments", "flyovers", "walls"], "answer": 1}, {"type": "mcq", "q": "The _____ is a train that runs on a single rail, usually above the ground.", "choices": ["underground", "monorail", "metro"], "answer": 1}, {"type": "mcq", "q": "Cairo is a very busy city. People drive their cars and roads get _____.", "choices": ["blocked", "dirty", "stressed"], "answer": 0}, {"type": "mcq", "q": "This causes pollution, making the air _____.", "choices": ["dirty", "blocked", "jams"], "answer": 0}, {"type": "mcq", "q": "It also makes people feel _____ and tired from waiting.", "choices": ["stressed", "blocked", "dirty"], "answer": 0}, {"type": "mcq", "q": "Building more roads and bridges will help make it easy to move _____.", "choices": ["on", "behind", "around"], "answer": 2}, {"type": "mcq", "q": "Last week, I went to school late as I got _____ in a traffic jam.", "choices": ["stuck", "sticker", "stick"], "answer": 0}, {"type": "mcq", "q": "Leila felt _____ when she lost the race.", "choices": ["disappointing", "disappointed", "disappoint"], "answer": 1}, {"type": "mcq", "q": "To face any challenge, focus _____ one rule at a time.", "choices": ["in", "at", "on"], "answer": 2}, {"type": "mcq", "q": "You should have _____ to overcome your challenges.", "choices": ["determination", "laziness", "fear"], "answer": 0}];
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = window.innerWidth; cv.height = window.innerHeight;

window.addEventListener('resize', () => { cv.width = window.innerWidth; cv.height = window.innerHeight; });

// AUDIO
const AC = new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d,t='sine',v=0.4){
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.start();o.stop(AC.currentTime+d);
}
function sndCorrect(){ tone(523,.1); setTimeout(()=>tone(784,.3),100); }
function sndWrong(){ tone(150,.6,'sawtooth'); setTimeout(()=>tone(100,.6,'sawtooth'),150); }
function sndShoot(){ tone(300,.1,'square',0.1); }

// CORE GAME LOGIC
let qIdx = 0, score = 0, locked = false;
let particles = [];
let gameEntities = {}; // Custom state for each game

function loadQ() {
    if(qIdx >= QS.length) { showEndScreen(); return; }
    const q = QS[qIdx];
    locked = false;
    document.getElementById('q-text').textContent = q.q;
    document.getElementById('q-num').textContent = `Q ${qIdx+1}/${QS.length}`;
    
    const container = document.getElementById('targets');
    container.innerHTML = '';
    
    let choices = [...q.choices];
    while(choices.length < 3) choices.push('...');
    choices = choices.slice(0, 3);
    const correctText = q.choices[q.answer] || q.choices[0];
    
    const labeled = choices.map(c => ({ text: c, isCorrect: c === correctText }));
    labeled.sort(() => Math.random() - 0.5); // Shuffle
    
    labeled.forEach((item, i) => {
        if(!item.text) return;
        const btn = document.createElement('button');
        btn.className = 'target-btn';
        btn.textContent = item.text;
        btn.onclick = () => handleChoice(btn, item.isCorrect, i);
        container.appendChild(btn);
        
        // Let the specific game set the button's position and appearance
        gameInitTarget(btn, i, labeled.length);
    });
    
    if(typeof gameOnLoadQ === 'function') gameOnLoadQ();
}

function handleChoice(btn, isCorrect, index) {
    if(locked) return;
    locked = true;
    document.querySelectorAll('.target-btn').forEach(b => b.disabled = true);
    
    const rect = btn.getBoundingClientRect();
    const tx = rect.left + rect.width / 2;
    const ty = rect.top + rect.height / 2;
    
    // Call specific game animation
    gameAnimateAction(tx, ty, isCorrect, btn, () => {
        // Action finished hitting target
        if(isCorrect) {
            score += 100;
            document.getElementById('score-val').textContent = score;
            sndCorrect();
            createParticles(tx, ty, '#2ecc71', 30);
            btn.style.transform += ' scale(0)';
        } else {
            sndWrong();
            createParticles(tx, ty, '#e74c3c', 30);
            btn.style.transform += ' scale(0)';
            // Show correct answer briefly
            document.querySelectorAll('.target-btn').forEach(b => {
                if(b !== btn) b.style.opacity = '0.3';
            });
        }
        
        clearTimeout(autoAdvanceTimer); autoAdvanceTimer = setTimeout(() => {
            qIdx++;
            loadQ();
        }, isCorrect ? 1000 : 1500);
    });
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1, color, size: Math.random() * 5 + 3
        });
    }
}

function updateAndDrawParticles() {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.2; // Gravity
        p.life -= 0.02;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    });
}

function showEndScreen() {
    document.getElementById('end-screen').classList.add('show');
    document.getElementById('end-title').textContent = score >= (QS.length*70) ? 'ðŸ† Awesome!' : 'ðŸ’ª Good Effort!';
    document.getElementById('end-score').textContent = `Final Score: ${score}`;
}

// Request Animation Frame loop
function mainLoop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    gameDrawBackground();
    gameDrawForeground();
    updateAndDrawParticles();
    requestAnimationFrame(mainLoop);
}

// Init

let cannonAngle = -Math.PI/2;
let cannonball = null;

function gameInitTarget(btn, i, total) {
    const spacing = window.innerWidth / (total + 1);
    const x = spacing * (i + 1);
    const y = window.innerHeight * 0.55 + (i%2===1 ? 40 : 0); // Staggered heights
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
}

function gameOnLoadQ() { cannonball = null; }

function gameAnimateAction(tx, ty, isCorrect, btn, onHitCallback) {
    sndShoot();
    const startX = cv.width/2;
    const startY = cv.height - 60;
    cannonAngle = Math.atan2(ty - startY, tx - startX);
    
    // Shoot ball
    const speed = 25;
    cannonball = {
        x: startX + Math.cos(cannonAngle)*50,
        y: startY + Math.sin(cannonAngle)*50,
        vx: Math.cos(cannonAngle) * speed,
        vy: Math.sin(cannonAngle) * speed,
        tx, ty, cb: onHitCallback
    };
}

function gameDrawBackground() {
    // Ground
    ctx.fillStyle = '#2c1308';
    ctx.fillRect(0, cv.height - 80, cv.width, 80);
    ctx.fillStyle = '#170903';
    ctx.fillRect(0, cv.height - 70, cv.width, 10);
}

function gameDrawForeground() {
    // Cannon Base
    ctx.fillStyle = '#555';
    ctx.beginPath(); ctx.arc(cv.width/2, cv.height - 40, 40, Math.PI, 0); ctx.fill();
    
    // Cannon Barrel
    ctx.save();
    ctx.translate(cv.width/2, cv.height - 40);
    ctx.rotate(cannonAngle);
    ctx.fillStyle = '#333';
    ctx.fillRect(0, -20, 80, 40);
    ctx.fillStyle = '#111';
    ctx.fillRect(70, -25, 15, 50);
    ctx.restore();
    
    // Cannonball
    if(cannonball) {
        cannonball.x += cannonball.vx;
        cannonball.y += cannonball.vy;
        
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(cannonball.x, cannonball.y, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#555';
        ctx.beginPath(); ctx.arc(cannonball.x - 4, cannonball.y - 4, 4, 0, Math.PI*2); ctx.fill();
        
        // Add trail
        createParticles(cannonball.x, cannonball.y, '#e74c3c', 1);
        
        // Check hit
        const dist = Math.hypot(cannonball.x - cannonball.tx, cannonball.y - cannonball.ty);
        if(dist < 30) {
            cannonball.cb();
            cannonball = null;
        }
    }
}

loadQ();
mainLoop();
</script>

        Object.defineProperty(HTMLAudioElement.prototype, 'src', {
            set: function(value) {
                if (value && (value.includes('bg') || value.includes('music') || value.includes('loop'))) {
                    this.muted = true; this.volume = 0;
                }
                originalSrcDescriptor.set.call(this, value);
            },

    // 2. Intercept document.createElement
    const originalCreateElement = document.createElement;

            const originalPlay = el.play;
            el.play = function() {
                if (el.src && (el.src.includes('bg') || el.src.includes('music') || el.src.includes('loop'))) {
                    el.muted = true; el.volume = 0;
                }
                return originalPlay.apply(this, arguments);
            };
        }
        return el;
    };

    // 3. Patch AudioContext to mute SFX in Prep games if they use oscillators/buffers

                gainNode.gain.setValueAtTime = function() { return gainNode.gain; };

                const originalExponentialRamp = gainNode.gain.exponentialRampToValueAtTime;
