<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art and Expression — Connector Simon</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  p.intro{ max-width:560px; text-align:center; color:var(--muted); margin-top:0; font-size:.9rem; }
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #pads{ display:grid; grid-template-columns:1fr 1fr; gap:12px; width:320px; height:320px; margin-bottom:20px; }
  .pad-btn{ border:none; border-radius:16px; font-size:1.1rem; font-weight:800; color:var(--navy); cursor:pointer; opacity:.7; transition:opacity .15s, transform .1s; }
  .pad-btn.lit{ opacity:1; transform:scale(1.03); box-shadow:0 0 30px rgba(255,255,255,.5); }
  #pad1{ background:var(--green); border-radius:16px 4px 4px 4px; }
  #pad2{ background:var(--cyan); border-radius:4px 16px 4px 4px; }
  #pad3{ background:var(--amber); border-radius:4px 4px 4px 16px; }
  #pad4{ background:var(--red); border-radius:4px 4px 16px 4px; }
  button.ctrl{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:10px; box-shadow:0 8px 20px rgba(53,208,201,.3); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 4 · Art and Expression</div>
  <h1>🎨 Artist Vocabulary Simon</h1>
  <p class="intro">Watch the sequence of art vocabulary words light up, then repeat it in the same order. Each round adds one more step!</p>
  <div class="hud">
    <div class="pill">Round: <b id="roundNum">1</b></div>
    <div class="pill">Best: <b id="bestRound">0</b></div>
  </div>

  <div id="pads">
    <button class="pad-btn" id="pad1" data-idx="0">recognition<br><span style="font-size:.7rem;">(fame for work)</span></button>
    <button class="pad-btn" id="pad2" data-idx="1">exhibition<br><span style="font-size:.7rem;">(art show)</span></button>
    <button class="pad-btn" id="pad3" data-idx="2">creativity<br><span style="font-size:.7rem;">(original ideas)</span></button>
    <button class="pad-btn" id="pad4" data-idx="3">sculptor<br><span style="font-size:.7rem;">(makes statues)</span></button>
  </div>
  <button class="ctrl" id="startBtn">Start Game</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="ctrl" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original memory game · Unit 4, Lesson 3: Biography of an Artist</footer>

<script>
const pads = [document.getElementById('pad1'), document.getElementById('pad2'), document.getElementById('pad3'), document.getElementById('pad4')];
let sequence = [];
let playerStep = 0;
let round = 0;
let best = 0;
let accepting = false;

function lightPad(idx, duration){
  return new Promise(resolve => {
    pads[idx].classList.add('lit');
    setTimeout(() => {
      pads[idx].classList.remove('lit');
      setTimeout(resolve, 150);
    }, duration);
  });
}

async function playSequence(){
  accepting = false;
  for (const idx of sequence) {
    await lightPad(idx, 500);
  }
  accepting = true;
  playerStep = 0;
}

function nextRound(){
  round++;
  document.getElementById('roundNum').textContent = round;
  sequence.push(Math.floor(Math.random()*4));
  playSequence();
}

pads.forEach(pad => {
  pad.addEventListener('click', () => {
    if (!accepting) return;
    const idx = parseInt(pad.dataset.idx, 10);
    pad.classList.add('lit');
    setTimeout(()=>pad.classList.remove('lit'), 200);
    if (idx === sequence[playerStep]) {
      playerStep++;
      if (playerStep === sequence.length) {
        best = Math.max(best, round);
        document.getElementById('bestRound').textContent = best;
        accepting = false;
        setTimeout(nextRound, 700);
      }
    } else {
      accepting = false;
      finishGame();
    }
  });
});

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').style.display = 'none';
  sequence = [];
  round = 0;
  nextRound();
});

function finishGame(){
  document.getElementById('pads').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Good Memory!';
  if (best >= 8) title = '🏆 Connector Memory Champion!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You reached round ${round} (best: ${best}). Each pad represents a connector — keep practicing when to use each one!`;
}
</script>
</body>
</html>
