<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art and Expression — Mission Impossible</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 100%, #241a30, var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #missionMap{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; max-width:680px; }
  .node{ width:34px; height:34px; border-radius:50%; background:var(--card); border:2px solid #1E4568; display:flex; align-items:center; justify-content:center; font-size:.9rem; }
  .node.done{ background:var(--green); border-color:var(--green); color:var(--navy); }
  .node.failed{ background:var(--red); border-color:var(--red); }
  .node.current{ border-color:var(--amber); box-shadow:0 0 0 2px var(--amber); }
  #qcard{ width:100%; max-width:640px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  #missionBrief{ font-style:italic; color:var(--muted); margin-bottom:12px; font-size:.9rem; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.1rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 4 · Art and Expression</div>
  <h1>🕶️ Mission Impossible: Exploring Art — Listen Up!</h1>
  <div class="hud">
    <div class="pill">Mission: <b id="missionNum">1</b> / 6</div>
    <div class="pill">Successes: <b id="successCount">0</b></div>
  </div>
  <div id="missionMap"></div>

  <div id="qcard">
    <div id="qLabel">❓ Question</div>
    <div id="qLabel">❓ Question</div>
    <div id="qLabel">❓ Question</div>
    <div id="missionBrief"></div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Next Mission →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original puzzle content · Unit 4, Lesson 2: Exploring Art — Listen Up!</footer>

<script>
const missions = [
  { brief:"Mission 1: Sneak past the guard by choosing the correctly punctuated sentence.", q:"Which is correct?", opts:["He is rich, so he is wearing new clothes.","He is rich but he is unhappy.","He is rich so unhappy."], a:1, ex:"'but' shows contrast (rich vs unhappy) and needs a comma before it: 'He is rich, but he is unhappy.'" },
  { brief:"Mission 2: Disarm the laser grid with the right connector.", q:"'___ he studied hard, he passed the exam.'", opts:["Because","Although","So"], a:0, ex:"'Because' gives the reason for passing." },
  { brief:"Mission 3: Crack the vault code — combine the sentences.", q:"Combine: 'The artwork is small.' + 'It sold for a lot of money.' (although)", opts:["Although the artwork is small, it sold for a lot of money.","The artwork is small although it sold for a lot but.","Although sold for a lot, artwork is small."], a:0, ex:"'Although' + clause 1, clause 2 is the correct order." },
  { brief:"Mission 4: Escape the gallery before the alarm — pick the correct comma rule.", q:"Which needs NO comma before the connector?", opts:["She was tired, but she smiled.","She smiled because she was happy.","Although she was tired, she smiled."], a:1, ex:"'because' takes no comma when it's in the middle of a sentence." },
  { brief:"Mission 5: Final decoy — spot the true sentence.", q:"Which is grammatically correct?", opts:["I gained weight so I eat unhealthy food.","I eat unhealthy food, so I gained weight.","So I eat unhealthy food I gained weight."], a:1, ex:"The reason comes first, then 'so' + the result." },
  { brief:"Mission 6: The final challenge — combine for the getaway.", q:"Combine: 'He prepared well.' + 'He won the race.' (because)", opts:["He won the race because he prepared well.","Because he won the race he prepared well.","He won the race, because he prepared well."], a:0, ex:"'because' gives the reason, placed after the result, no comma." },
];

let idx = 0, successCount = 0;

function renderMap(){
  const map = document.getElementById('missionMap');
  map.innerHTML = '';
  missions.forEach((_, i) => {
    const n = document.createElement('div');
    n.className = 'node';
    if (i === idx) n.classList.add('current');
    n.textContent = i+1;
    map.appendChild(n);
  });
}

function markNode(status){
  const nodes = document.querySelectorAll('.node');
  nodes[idx].classList.remove('current');
  nodes[idx].classList.add(status);
}

function loadMission(){
  if (idx >= missions.length) { finishGame(); return; }
  document.getElementById('missionNum').textContent = idx + 1;
  renderMap();
  const m = missions[idx];
  document.getElementById('missionBrief').textContent = m.brief;
  document.getElementById('qtext').textContent = m.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  m.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === m.a) {
        b.classList.add('correct');
        successCount++;
        document.getElementById('successCount').textContent = successCount;
        markNode('done');
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[m.a].classList.add('correct');
        markNode('failed');
      }
      document.getElementById('explain').textContent = 'Debrief: ' + m.ex;
      document.getElementById('explain').style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').textContent = idx === missions.length-1 ? 'Complete Final Mission →' : 'Next Mission →';
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => { idx++; loadMission(); });

function finishGame(){
  document.getElementById('qcard').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Mission Complete!';
  if (successCount === missions.length) title = '🏆 Perfect Agent!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You succeeded in ${successCount} of ${missions.length} missions.`;
}

loadMission();
</script>
</body>
</html>
