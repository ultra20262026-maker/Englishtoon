<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Alpha — Space Adventure</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, #0d1f33, #05090f 70%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:12px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #track{ width:100%; max-width:680px; height:14px; background:var(--card); border-radius:8px; overflow:hidden; margin-bottom:16px; position:relative;}
  #shipPos{ position:absolute; top:-8px; width:30px; height:30px; transition:left .5s; font-size:1.5rem; left:0%; }
  #trackFill{ height:100%; background:linear-gradient(90deg, var(--cyan), var(--green)); width:0%; transition:width .5s; }
  #qcard{ width:100%; max-width:680px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.15rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 1 · Gen Alpha</div>
  <h1>🚀 Space Adventure: The Digital Bridge</h1>
  <div class="hud">
    <div class="pill">Progress: <b id="progressPct">0%</b></div>
    <div class="pill">Fuel (Score): <b id="score">0</b></div>
  </div>
  <div id="track"><div id="trackFill"></div><div id="shipPos">🚀</div></div>

  <div id="qcard">
    <div id="qLabel">❓ Question</div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Fuel Up & Continue →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 1, Lesson 3: The Digital Bridge</footer>

<script>
const questions = [
  { q:"Gen Z and Gen Alpha like short videos, emojis, and...", opts:["memes","spoons","chairs","plates"], a:0, ex:"'Memes' are funny images or videos shared online." },
  { q:"Many of them care about the...", opts:["environment","kitchen","garage","basement"], a:0, ex:"The text says many of them care about the environment." },
  { q:"They share their thoughts through using...", opts:["technology","farming","cooking","sports"], a:0, ex:"Technology helps them share their thoughts." },
  { q:"Both generations speak the same digital...", opts:["language","food","music","color"], a:0, ex:"'Digital language' refers to shared ways of communicating online." },
  { q:"Technology helps them _____ each other and cooperate.", opts:["understand","forget","ignore","avoid"], a:0, ex:"Technology helps them 'understand' each other." },
  { q:"'Common' means...", opts:["shared by two or more","different","rare","forbidden"], a:0, ex:"'Common' means something shared by two or more things or people." },
  { q:"Gen Z and Gen Alpha 'have a lot in common' means...", opts:["they share many similarities","they have nothing alike","they never agree","they live far apart"], a:0, ex:"Having 'a lot in common' means sharing many similarities." },
  { q:"Working together to make the world better is an example of...", opts:["cooperation","competition","isolation","confusion"], a:0, ex:"Working together is 'cooperation'." },
  { q:"'Bridge' in 'The Digital Bridge' suggests...", opts:["a connection between two generations","a type of food","a broken road","a type of computer"], a:0, ex:"A 'bridge' connects two things — here, two generations." },
  { q:"Summarizing a text means...", opts:["restating the main ideas briefly","copying every word","ignoring the text","translating it"], a:0, ex:"Summarizing means briefly restating the main ideas." },
];

let idx = 0;
let score = 0;

function updateTrack(){
  const pct = Math.round((idx/questions.length)*100);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('trackFill').style.width = pct + '%';
  document.getElementById('shipPos').style.left = `calc(${pct}% - 15px)`;
}

function loadQ(){
  if (idx >= questions.length) { finishGame(); return; }
  const q = questions[idx];
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === q.a) {
        b.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
      }
      document.getElementById('explain').textContent = 'Why: ' + q.ex;
      document.getElementById('explain').style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
    };
    optsDiv.appendChild(b);
  });
  updateTrack();
}

document.getElementById('nextBtn').addEventListener('click', () => { idx++; loadQ(); });

function finishGame(){
  document.getElementById('qcard').style.display = 'none';
  document.getElementById('trackFill').style.width = '100%';
  document.getElementById('shipPos').style.left = 'calc(100% - 15px)';
  document.getElementById('progressPct').textContent = '100%';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 You Reached the Digital Planet!';
  if (score >= 70) title = '🏆 Space Champion!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final fuel score: ${score} points.`;
}

loadQ();
</script>
</body>
</html>
