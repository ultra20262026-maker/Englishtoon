<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Alpha — Matching Challenge</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 80% 10%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  .board{ display:flex; gap:20px; max-width:820px; width:100%; justify-content:center; }
  .col{ display:flex; flex-direction:column; gap:10px; flex:1; }
  .item{ background:var(--card); border:2px solid #1E4568; border-radius:10px; padding:13px 14px; font-size:.85rem; cursor:pointer; transition:.15s; text-align:center; line-height:1.3; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; text-align:center; margin-bottom:6px; }
  #instrBox{ max-width:640px; text-align:center; background:var(--card); border:1px solid #1E4568; border-radius:14px; padding:14px 22px; margin-bottom:16px; font-size:1rem; font-weight:700; color:#fff; }
  .item:hover{ border-color:var(--cyan); }
  .item.selected{ border-color:var(--amber); background:#2a3d1a; }
  .item.matched{ border-color:var(--green); background:rgba(140,233,154,.15); color:var(--green); cursor:default; }
  .item.wrongflash{ border-color:var(--red); background:rgba(255,128,128,.2); }
  button{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:20px; box-shadow:0 8px 20px rgba(53,208,201,.3); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  .toast{ position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--green); color:var(--navy); padding:10px 22px; border-radius:999px; font-weight:800; opacity:0; transition:opacity .3s; z-index:200;}
  .toast.show{ opacity:1; }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 1 · Gen Alpha</div>
  <h1>🔗 Matching Challenge: We Use Technology</h1>
  <div id="qLabel">❓ Task</div>
  <div id="instrBox">Match each sentence on the left with its correctly completed form on the right.</div>
  <div class="hud">
    <div class="pill">Matches: <b id="matchCount">0</b> / 8</div>
    <div class="pill">Mistakes: <b id="mistakeCount">0</b></div>
  </div>

  <div class="board">
    <div class="col" id="colLeft"></div>
    <div class="col" id="colRight"></div>
  </div>
  <button id="restartBtn">Restart</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
  <div class="toast" id="toast"></div>
  <footer>Original sentence set · Unit 1, Lesson 2: Gen Alpha's Digital Life</footer>

<script>
const pairs = [
  ["My mom always cleans our rooms on Friday. (now)", "My mom is cleaning our rooms now."],
  ["I have booked the tickets to travel next week. (traveling)", "I am traveling next week."],
  ["Ali does his homework every day. (at the moment)", "Ali is doing his homework at the moment."],
  ["Students read in the library. (Look!)", "Look! Students are reading in the library."],
  ["She is ___ (travel) to Aswan next week.", "She is traveling to Aswan next week."],
  ["Adel ___ (eat) Koshari right now.", "Adel is eating Koshari right now."],
  ["They ___ (play) football next Friday — already arranged.", "They are playing football next Friday."],
  ["At the moment, he ___ (study) Science.", "At the moment, he is studying Science."],
];

let matchCount = 0, mistakes = 0;
let selectedLeft = null, selectedRight = null;

const leftItems = pairs.map((p,i) => ({ text:p[0], id:i }));
const rightItems = pairs.map((p,i) => ({ text:p[1], id:i })).sort(()=>Math.random()-0.5);

function render(){
  const colLeft = document.getElementById('colLeft');
  const colRight = document.getElementById('colRight');
  colLeft.innerHTML = ''; colRight.innerHTML = '';
  leftItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = item.text;
    div.dataset.id = item.id;
    div.addEventListener('click', () => selectItem(div, item, 'left'));
    colLeft.appendChild(div);
  });
  rightItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = item.text;
    div.dataset.id = item.id;
    div.addEventListener('click', () => selectItem(div, item, 'right'));
    colRight.appendChild(div);
  });
}
render();

function showToast(msg, bad){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? '' : '');
  t.style.background = bad ? '#FF8080' : '#8CE99A';
  setTimeout(()=>{ t.className='toast'; }, 1100);
}

function selectItem(div, item, side){
  if (div.classList.contains('matched')) return;
  if (side === 'left') {
    if (selectedLeft) selectedLeft.el.classList.remove('selected');
    selectedLeft = { el: div, item };
    div.classList.add('selected');
  } else {
    if (selectedRight) selectedRight.el.classList.remove('selected');
    selectedRight = { el: div, item };
    div.classList.add('selected');
  }
  if (selectedLeft && selectedRight) {
    checkMatch();
  }
}

function checkMatch(){
  const l = selectedLeft, r = selectedRight;
  if (l.item.id === r.item.id) {
    l.el.classList.remove('selected'); r.el.classList.remove('selected');
    l.el.classList.add('matched'); r.el.classList.add('matched');
    matchCount++;
    document.getElementById('matchCount').textContent = matchCount;
    showToast('Matched! ✅');
    if (matchCount === pairs.length) setTimeout(finishGame, 500);
  } else {
    l.el.classList.add('wrongflash'); r.el.classList.add('wrongflash');
    mistakes++;
    document.getElementById('mistakeCount').textContent = mistakes;
    showToast('Not a match — try again', true);
    setTimeout(() => {
      l.el.classList.remove('selected','wrongflash');
      r.el.classList.remove('selected','wrongflash');
    }, 600);
  }
  selectedLeft = null; selectedRight = null;
}

document.getElementById('restartBtn').addEventListener('click', () => location.reload());

function finishGame(){
  document.querySelector('.board').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 All Matched!';
  if (mistakes === 0) title = '🏆 Perfect Match!';
  else if (mistakes <= 3) title = '👍 Great Job!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You matched all ${pairs.length} pairs with ${mistakes} mistakes.`;
}
</script>
</body>
</html>
