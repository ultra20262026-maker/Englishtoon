<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Alpha — Mystery Boxes</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 70% 90%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #boxes{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; max-width:640px; width:100%; margin-bottom:10px; }
  .box{ aspect-ratio:1; background:linear-gradient(160deg,#1a3a5c,#12233a); border:2px solid var(--cyan); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:2rem; cursor:pointer; transition:transform .15s; }
  .box:hover{ transform:translateY(-4px); }
  .box.opened{ opacity:.3; cursor:default; pointer-events:none; }
  #qmodal{ display:none; position:fixed; inset:0; background:rgba(4,10,18,.88); z-index:100; align-items:center; justify-content:center; padding:20px; }
  #qcardbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:28px; max-width:600px; width:100%; }
  #qtext{ color:#fff; font-size:1.15rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  .btn-close{ margin-top:14px; display:none; }
  button{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:10px; padding:12px 24px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 1 · Gen Alpha</div>
  <h1>🎁 Mystery Boxes: Expressing Identity Online</h1>
  <div class="hud">
    <div class="pill">Score: <b id="score">0</b></div>
    <div class="pill">Opened: <b id="openedCount">0</b> / 10</div>
  </div>

  <div id="boxes"></div>

  <div id="qmodal">
    <div id="qcardbox">
      <div id="qLabel" style="color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px;">❓ Question</div>
      <div id="qtext"></div>
      <div id="options"></div>
      <div class="explain" id="explain"></div>
      <button class="btn-close" id="closeBtn">Continue →</button>
    </div>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 1, Lessons 5 &amp; 6: Expressing Identity Online</footer>

<script>
const questions = [
  { q:"We can use the expression 'In my opinion' to explain our ideas _____ when talking to others.", opts:["clearly","rarely","badly","secretly"], a:0, ex:"'Clearly' fits best when explaining ideas.", points:10 },
  { q:"We should put our mobiles _____ during meals and before bedtime.", opts:["away","on","up","over"], a:0, ex:"'Put away' means to store something out of use.", points:10 },
  { q:"Spending too much time on digital devices can be _____.", opts:["unhealthy","required","encouraged","rewarded"], a:0, ex:"Too much screen time is generally 'unhealthy'.", points:15 },
  { q:"We should learn how to find a _____ between our screen time and family life.", opts:["balance","mistake","competition","punishment"], a:0, ex:"'Balance' means a healthy mix of both.", points:15 },
  { q:"A blog is an online journal or _____ where someone writes regularly about a topic.", opts:["diary","kitchen","garden","garage"], a:0, ex:"A blog is like an online 'diary'.", points:10 },
  { q:"Rewrite: 'How long do you spend using technology every day?' (How many)", opts:["How many hours do you spend using technology every day?","How many you spend using technology?","How many time do you spend?","How many use technology every day?"], a:0, ex:"'How many hours' is the correct rewrite.", points:20 },
  { q:"Rewrite: \"In my opinion, it's okay to enjoy your screen, but don't let it control you.\" (I think)", opts:["I think it's okay to enjoy your screen, but don't let it control you.","I think okay to enjoy your screen.","I think it is okay enjoy screen.","I think don't let control screen."], a:0, ex:"'I think' replaces 'In my opinion' with the same meaning.", points:20 },
  { q:"A blog post about your digital life would likely describe...", opts:["your daily habits with technology","a recipe","a math formula","a sports match"], a:0, ex:"A digital-life blog post describes your tech habits.", points:10 },
  { q:"Choose the correct opinion phrase.", opts:["In my opinion","In my opinions","In my opinioning","In my opine"], a:0, ex:"'In my opinion' is the correct fixed phrase.", points:10 },
  { q:"Expressing your identity online means...", opts:["sharing who you really are through your posts","hiding all information","copying others","staying silent always"], a:0, ex:"It means sharing your true self through what you post.", points:15 },
];

let score = 0;
let openedCount = 0;
const boxesEl = document.getElementById('boxes');
const shuffled = [...questions].sort(()=>Math.random()-0.5);

function buildBoxes(){
  boxesEl.innerHTML = '';
  shuffled.forEach((q, i) => {
    const box = document.createElement('div');
    box.className = 'box';
    box.textContent = '🎁';
    box.dataset.idx = i;
    box.addEventListener('click', () => openBox(box, q));
    boxesEl.appendChild(box);
  });
}
buildBoxes();

function openBox(box, q){
  box.classList.add('opened');
  document.getElementById('qtext').textContent = q.q + `  (worth ${q.points} pts)`;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('closeBtn').style.display = 'none';

  q.opts.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (idx === q.a) {
        b.classList.add('correct');
        score += q.points;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
        score = Math.max(0, score - 5);
      }
      document.getElementById('score').textContent = score;
      document.getElementById('explain').textContent = 'Why: ' + q.ex;
      document.getElementById('explain').style.display = 'block';
      document.getElementById('closeBtn').style.display = 'inline-block';
      openedCount++;
      document.getElementById('openedCount').textContent = openedCount;
    };
    optsDiv.appendChild(b);
  });
  document.getElementById('qmodal').style.display = 'flex';
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('qmodal').style.display = 'none';
  if (openedCount >= shuffled.length) finishGame();
});

function finishGame(){
  document.getElementById('boxes').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 All Boxes Opened!';
  if (score >= 100) title = '🏆 Mystery Master!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points.`;
}
</script>
</body>
</html>
