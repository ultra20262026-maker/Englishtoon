<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Around the World — Escape Room</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background: radial-gradient(circle at 15% 20%, rgba(53,208,201,.08), transparent 40%), radial-gradient(circle at 85% 80%, rgba(140,233,154,.08), transparent 40%), var(--navy); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--amber);}
  .doors{ display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; max-width:640px; }
  .door{ width:60px; height:85px; border-radius:8px 8px 4px 4px; background:var(--card); border:2px solid #1E4568; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
  .door.locked::after{ content:'🔒'; }
  .door.open{ background:linear-gradient(160deg, var(--green), #52a866); border-color:var(--green); }
  .door.open::after{ content:'🔓'; }
  .door.current{ box-shadow:0 0 0 3px var(--amber); }
  #room{ width:100%; max-width:640px; background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:24px; min-height:280px; display:flex; flex-direction:column; }
  .story{ font-style:italic; color:var(--muted); margin-bottom:12px; font-size:.9rem; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
  #qtext{ color:#fff; font-size:1.1rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:10px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; align-self:flex-start; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 5 · Around the World</div>
  <h1>🚪 Escape Room: The Hidden Island Ch2</h1>
  <p style="max-width:600px; text-align:center; color:var(--muted); margin-top:0;">
    Five vault doors are locked with grammar puzzles from around the world. Answer correctly to unlock each one!
  </p>
  <div class="hud">
    <div class="pill">Door <b id="doorNum">1</b> / 5</div>
    <div class="pill">Lives: <b id="lives">❤️❤️❤️</b></div>
  </div>
  <div class="doors" id="doors"></div>

  <div id="room">
    <div class="story" id="story"></div>
    <div id="qLabel">❓ Question</div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Unlock Next Door →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Try Again</button>
  </div>
  <footer>Original puzzle content · Unit 5, Lesson 4: Reading — The Hidden Island Ch2</footer>

<script>
const puzzles = [
  { story:"Door 1 — Europe: Strange plants block the way.", q:"Text: As the four friends explored Europe, they saw unusual plants they had never seen before. — What did the friends see in Europe?", opts:["unusual plants they had never seen before","only buildings","nothing new","only animals"], a:0, ex:"They saw unusual plants." },
  { story:"Door 2 — Al Fayoum: A weather riddle.", q:"What did they enjoy in Al Fayoum?", opts:["the traffic","the fresh air and beautiful weather","the noise","the pollution"], a:1, ex:"They enjoyed the fresh air and beautiful weather." },
  { story:"Door 3 — The Split Path: Choose wisely.", q:"What did they decide to do to explore more efficiently?", opts:["stay together always","split into pairs","go home early","give up exploring"], a:1, ex:"They decided to split into pairs." },
  { story:"Door 4 — The Pyramid Riddle: A mystery lock.", q:"What remains a mystery according to the text?", opts:["where Europe is","how the pyramids were built","what plants look like","the weather"], a:1, ex:"How the pyramids were built remains a mystery." },
  { story:"Door 5 — Final Vault: The last lock before the treasure.", q:"What quality did the friends show in this chapter?", opts:["laziness","curiosity and teamwork","fear","dishonesty"], a:1, ex:"They showed curiosity and teamwork." },
];

let current = 0, lives = 3;

function renderDoors(){
  const doorsDiv = document.getElementById('doors');
  doorsDiv.innerHTML = '';
  puzzles.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'door locked';
    if (i < current) d.className = 'door open';
    if (i === current) d.classList.add('current');
    doorsDiv.appendChild(d);
  });
}

function renderLives(){ document.getElementById('lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3-lives); }

function loadPuzzle(){
  if (current >= puzzles.length) { finishGame(true); return; }
  document.getElementById('doorNum').textContent = current + 1;
  renderDoors();
  const p = puzzles[current];
  document.getElementById('story').textContent = p.story;
  document.getElementById('qtext').textContent = p.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain');
  explainDiv.style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  p.opts.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => selectAnswer(idx, b);
    optsDiv.appendChild(b);
  });
}

function selectAnswer(idx, btnEl){
  const p = puzzles[current];
  document.querySelectorAll('.opt').forEach(b => b.onclick = null);
  const explainDiv = document.getElementById('explain');
  explainDiv.textContent = 'Why: ' + p.ex;
  explainDiv.style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');

  if (idx === p.a) {
    btnEl.classList.add('correct');
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = current === puzzles.length - 1 ? 'Escape the Vault! →' : 'Unlock Next Door →';
    nextBtn.onclick = () => { current++; loadPuzzle(); };
  } else {
    btnEl.classList.add('wrong');
    document.querySelectorAll('.opt')[p.a].classList.add('correct');
    lives--;
    renderLives();
    if (lives <= 0) { setTimeout(() => finishGame(false), 900); return; }
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = 'Try the Next Clue →';
    nextBtn.onclick = () => { current++; loadPuzzle(); };
  }
}

function finishGame(escaped){
  document.getElementById('room').style.display = 'none';
  document.getElementById('doors').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  if (escaped) {
    document.getElementById('endTitle').textContent = '🎉 You Escaped the Vault!';
    document.getElementById('endMsg').textContent = `You unlocked all 5 doors with ${lives} ${lives===1?'life':'lives'} remaining.`;
  } else {
    document.getElementById('endTitle').textContent = '💥 Out of Lives!';
    document.getElementById('endMsg').textContent = `You reached door ${current+1} of 5. Review comparatives and superlatives and try again!`;
  }
}

renderLives();
loadPuzzle();
</script>
</body>
</html>
