<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Around the World — Treasure Map</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 30% 90%, #1c3a2a, var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #waypoints{ display:flex; gap:10px; margin-bottom:20px; max-width:680px; flex-wrap:wrap; justify-content:center; }
  .wp{ width:44px; height:44px; border-radius:50%; background:var(--card); border:2px solid #1E4568; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
  .wp.done{ background:var(--green); border-color:var(--green); }
  .wp.current{ border-color:var(--amber); box-shadow:0 0 0 3px var(--amber); }
  #qcard{ width:100%; max-width:640px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  #storyLine{ font-style:italic; color:var(--muted); margin-bottom:12px; font-size:.92rem; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
  #qtext{ color:#fff; font-size:1.1rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 5 · Around the World</div>
  <h1>🗺️ Treasure Map: Have You Ever Explored the World?</h1>
  <div class="hud">
    <div class="pill">Stop: <b id="stopNum">1</b> / 8</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>
  <div id="waypoints"></div>

  <div id="qcard">
    <div id="storyLine"></div>
    <div id="qLabel">❓ Question</div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Continue the Journey →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 5, Lesson 1: Have You Ever Explored the World?</footer>

<script>
const stops = [
  { story:"Stop 1 — Cairo: The tour begins at the pyramids.", q:"'Landmark' means...", opts:["a famous place people easily recognize","a type of food","a type of animal","a type of weather"], a:0, ex:"A 'landmark' is a famous, easily recognized place." },
  { story:"Stop 2 — Tokyo: A city full of surprises.", q:"Tokyo is one of the most ___ places I've ever seen. (impressive)", opts:["impress","impressive","impressed","impressing"], a:1, ex:"'Impressive' is the correct adjective form." },
  { story:"Stop 3 — Marrakech: A city of color and tradition.", q:"'Organized' means...", opts:["arranged in a neat, planned way","messy and confused","broken","empty"], a:0, ex:"'Organized' means neatly arranged." },
  { story:"Stop 4 — Reykjavik: A quiet ceremony of calm.", q:"I joined a tea ceremony, a beautiful ___ that shows calmness. (tradition)", opts:["tradition","traditional","traditionally","traditions only"], a:0, ex:"'Tradition' is the correct noun form here." },
  { story:"Stop 5 — Dubai: A city of modern wonders.", q:"'Population' means...", opts:["the number of people living in a place","the size of a building","the price of goods","the weather pattern"], a:0, ex:"'Population' is the number of people in a place." },
  { story:"Stop 6 — Luxor: Ancient temples along the Nile.", q:"'Impressive' means...", opts:["causing admiration through size or quality","boring","ordinary","small"], a:0, ex:"'Impressive' means causing admiration." },
  { story:"Stop 7 — Aswan: Where the Nile flows gently.", q:"Each country has a special...", opts:["tradition","mistake","argument","complaint"], a:0, ex:"Each country has its own special traditions." },
  { story:"Stop 8 — Home again: The journey ends.", q:"Writing a paragraph about 'A Visit to a Place You Like' would describe...", opts:["what you saw and did there","a math formula","a science experiment","a cooking recipe"], a:0, ex:"Such a paragraph describes your experience at the place." },
];

let idx = 0, score = 0;

function renderWaypoints(){
  const wp = document.getElementById('waypoints');
  wp.innerHTML = '';
  stops.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'wp';
    if (i < idx) d.classList.add('done');
    if (i === idx) d.classList.add('current');
    d.textContent = i < idx ? '✓' : (i+1);
    wp.appendChild(d);
  });
}

function loadStop(){
  if (idx >= stops.length) { finishGame(); return; }
  document.getElementById('stopNum').textContent = idx + 1;
  renderWaypoints();
  const s = stops[idx];
  document.getElementById('storyLine').textContent = s.story;
  document.getElementById('qtext').textContent = s.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  s.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === s.a) {
        b.classList.add('correct');
        score += 10;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[s.a].classList.add('correct');
      }
      document.getElementById('score').textContent = score;
      document.getElementById('explain').textContent = 'Why: ' + s.ex;
      document.getElementById('explain').style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').textContent = idx === stops.length-1 ? 'Finish the Tour! →' : 'Continue the Journey →';
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => { idx++; loadStop(); });

function finishGame(){
  document.getElementById('qcard').style.display = 'none';
  document.getElementById('waypoints').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 World Tour Complete!';
  if (score >= 70) title = '🏆 Master Traveler!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${stops.length} stops.`;
}

loadStop();
</script>
</body>
</html>
