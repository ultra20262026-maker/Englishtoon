<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Around the World — Memory Match</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 20% 0%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  .board{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; max-width:620px; width:100%; }
  .card{ position:relative; aspect-ratio:3/4; cursor:pointer; perspective:800px; }
  .card-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .card.flip .card-inner{ transform:rotateY(180deg); }
  .card.matched .card-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; width:100%; height:100%; border-radius:12px; display:flex; align-items:center; justify-content:center; text-align:center; padding:8px; backface-visibility:hidden; font-weight:700; font-size:.9rem; }
  .face-back{ background:linear-gradient(135deg, var(--navy2), var(--card)); border:2px solid #1E4568; color:var(--cyan); font-size:1.8rem; }
  .face-front{ background:linear-gradient(135deg, #1a3a5c, #12233a); border:2px solid var(--cyan); color:#fff; transform:rotateY(180deg); }
  .card.matched .face-front{ border-color:var(--green); background:linear-gradient(135deg,#1e4a33,#153627); color:var(--green); }
  .card.wrongflash .face-front{ border-color:var(--red); }
  button{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:20px; box-shadow:0 8px 20px rgba(53,208,201,.3); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  .toast{ position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--green); color:var(--navy); padding:10px 22px; border-radius:999px; font-weight:800; opacity:0; transition:opacity .3s; z-index:200;}
  .toast.show{ opacity:1; }
  footer{ margin-top:26px; color:var(--muted); font-size:.72rem; text-align:center;}
  @media (max-width:520px){ .board{ grid-template-columns:repeat(3,1fr); } }

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 5 · Around the World</div>
  <h1>🧠 Memory Match: Four Amazing Places</h1>
  <div id="qLabel" style="color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; text-align:center; margin-bottom:6px;">❓ Task: Match Each Word With Its Meaning</div>
  <div class="hud">
    <div class="pill">Moves: <b id="moves">0</b></div>
    <div class="pill">Matches: <b id="matches">0</b> / 8</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>
  <div class="board" id="board"></div>
  <button id="restartBtn">Restart Game</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <div class="toast" id="toast"></div>
  <footer>Original pairs · Unit 5, Lesson 3: Around the World in Four Amazing Places</footer>

<script>
const pairs = [
  {a:"Geothermal", b:"Related to heat from inside the Earth"},
  {a:"Glacier", b:"A huge, slow-moving mass of ice"},
  {a:"Lagoon", b:"A warm pool of blue water, like Iceland's Blue Lagoon"},
  {a:"Hiking", b:"Walking long distances, especially in nature"},
  {a:"Capital", b:"The main city of a country"},
  {a:"Volcano", b:"A mountain that can erupt with lava"},
  {a:"Population", b:"The number of people living somewhere"},
  {a:"Northernmost", b:"Farthest to the north"},
];

let cards = [];
pairs.forEach((p, i) => {
  cards.push({ id:i, display:p.a, key:i });
  cards.push({ id:i, display:p.b, key:i });
});
cards = cards.sort(()=>Math.random()-0.5);

let flippedIndices = [];
let matchedCount = 0;
let moves = 0;
let score = 0;
let lock = false;

const board = document.getElementById('board');

function render(){
  board.innerHTML = '';
  cards.forEach((c, idx) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.dataset.idx = idx;
    cardEl.innerHTML = `
      <div class="card-inner">
        <div class="face face-back">?</div>
        <div class="face face-front">${c.display}</div>
      </div>
    `;
    cardEl.addEventListener('click', () => onCardClick(idx));
    board.appendChild(cardEl);
  });
}
render();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1200);
}

function onCardClick(idx){
  if (lock) return;
  const el = board.children[idx];
  if (el.classList.contains('flip') || el.classList.contains('matched')) return;
  if (flippedIndices.length >= 2) return;

  el.classList.add('flip');
  flippedIndices.push(idx);

  if (flippedIndices.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    lock = true;
    const [i1, i2] = flippedIndices;
    const c1 = cards[i1], c2 = cards[i2];
    const isMatch = c1.key === c2.key && i1 !== i2 && c1.display !== c2.display;

    setTimeout(() => {
      const el1 = board.children[i1], el2 = board.children[i2];
      if (isMatch) {
        el1.classList.add('matched');
        el2.classList.add('matched');
        matchedCount++;
        score += 15;
        document.getElementById('score').textContent = score;
        document.getElementById('matches').textContent = matchedCount;
        showToast(`Matched: ${c1.display} → ${c2.display}! ✅`);
        if (matchedCount === pairs.length) {
          setTimeout(finishGame, 500);
        }
      } else {
        el1.classList.add('wrongflash');
        el2.classList.add('wrongflash');
        setTimeout(() => {
          el1.classList.remove('flip','wrongflash');
          el2.classList.remove('flip','wrongflash');
        }, 550);
      }
      flippedIndices = [];
      lock = false;
    }, 700);
  }
}

document.getElementById('restartBtn').addEventListener('click', () => location.reload());

function finishGame(){
  document.getElementById('board').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 All Matched!';
  if (moves <= 10) title = '🏆 Perfect Memory!';
  else if (moves <= 16) title = '👍 Great Job!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You finished in ${moves} moves with a score of ${score}.`;
}
</script>
</body>
</html>
