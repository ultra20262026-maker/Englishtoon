<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Around the World — Road Trip Quiz</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #track{ position:relative; width:100%; max-width:680px; height:60px; background:var(--card); border-radius:12px; overflow:hidden; margin-bottom:18px; border:2px solid #1E4568; }
  #trackFill{ height:100%; background:linear-gradient(90deg, var(--cyan), var(--green)); width:0%; transition:width .4s; }
  #car{ position:absolute; top:8px; font-size:2.2rem; transition:left .4s; left:0%; }
  #finishFlag{ position:absolute; top:8px; right:6px; font-size:2rem; }
  #qcard{ width:100%; max-width:680px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.1rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #startBtn{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:20px; box-shadow:0 8px 20px rgba(53,208,201,.3); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 5 · Around the World</div>
  <h1>🏎️ Road Trip Quiz: Come Explore with Us</h1>
  <div class="hud">
    <div class="pill">Checkpoint: <b id="qNum">1</b> / 10</div>
    <div class="pill">Correct: <b id="correctCount">0</b></div>
  </div>
  <div id="track"><div id="trackFill"></div><div id="car">🏎️</div><div id="finishFlag">🏁</div></div>

  <div id="qcard">
    <div id="qLabel">❓ Question</div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Next Checkpoint →</button>
  </div>
  <button id="startBtn">Start the Trip</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 5, Lessons 5 &amp; 6: Come Explore with Us</footer>

<script>
const questions = [
  { q:"Did you buy any _____ for your mother when you were in London?", opts:["souvenirs","mistakes","complaints","arguments"], a:0, ex:"'Souvenirs' are items bought to remember a trip." },
  { q:"Salah El Din's _____ was built to protect Cairo.", opts:["Citadel","kitchen","garden","garage"], a:0, ex:"The Citadel is a historic fortress in Cairo." },
  { q:"Some people are afraid of sharks' _____ when they go swimming in the sea.", opts:["attacks","colors","sounds","shapes"], a:0, ex:"People fear shark 'attacks' while swimming." },
  { q:"The tourists go around the world to explore different traditions and...", opts:["cultures","mistakes","complaints","arguments"], a:0, ex:"Tourists explore different traditions and cultures." },
  { q:"Traveling makes you see famous _____ and hear new languages.", opts:["landmarks","mistakes","complaints","arguments"], a:0, ex:"Travel lets you see famous landmarks." },
  { q:"We stayed for _____ (awhile) when we were in France.", opts:["a while","awhiles","while a","the while"], a:0, ex:"'A while' is the correct phrase for a period of time." },
  { q:"I think this trip gave us the best _____ (memorize) we will keep forever.", opts:["memories","memorizes","memorizing","memorized"], a:0, ex:"'Memories' is the correct noun form." },
  { q:"Japan is _____ (the modern) than India.", opts:["more modern","the more modern","modern","most modern"], a:0, ex:"Comparative form: 'more modern than'." },
  { q:"The animals always _____ (protects) their babies from danger.", opts:["protect","protects","protecting","protection"], a:0, ex:"'Animals' (plural) + base verb: 'protect'." },
  { q:"Writing a paragraph about 'Famous Landmarks in Egypt' would mention...", opts:["the Pyramids, the Citadel, and other famous sites","random unrelated topics","only foreign countries","nothing specific"], a:0, ex:"Such a paragraph would mention famous Egyptian sites." },
];

let idx = 0, correctCount = 0;

function showToast(msg, bad){
  // kept for consistency with other games, though not time-critical here
}

function updateTrack(){
  const pct = Math.round((idx/questions.length)*100);
  document.getElementById('trackFill').style.width = pct + '%';
  document.getElementById('car').style.left = `calc(${pct}% - 20px)`;
}

function loadQ(){
  if (idx >= questions.length) { finishGame(); return; }
  document.getElementById('qNum').textContent = idx + 1;
  updateTrack();
  const q = questions[idx];
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.style.marginTop = '0';
    b.textContent = opt;
    b.onclick = () => answer(i, q, b);
    optsDiv.appendChild(b);
  });
}

function answer(i, q, btn){
  document.querySelectorAll('.opt').forEach(o => o.onclick = null);
  if (i === q.a) {
    btn.classList.add('correct');
    correctCount++;
    document.getElementById('correctCount').textContent = correctCount;
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt')[q.a].classList.add('correct');
  }
  document.getElementById('explain').textContent = 'Why: ' + q.ex;
  document.getElementById('explain').style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = (idx === questions.length - 1) ? 'See Final Result →' : 'Next Checkpoint →';
}

document.getElementById('nextBtn').addEventListener('click', () => { idx++; loadQ(); });

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').style.display = 'none';
  loadQ();
});

function finishGame(){
  document.getElementById('trackFill').style.width = '100%';
  document.getElementById('car').style.left = 'calc(100% - 20px)';
  document.getElementById('qcard').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🏁 You Reached the Finish Line!';
  if (correctCount >= 8) title = '🏆 Road Trip Champion!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You answered ${correctCount} of ${questions.length} checkpoints correctly.`;
}
</script>
</body>
</html>
