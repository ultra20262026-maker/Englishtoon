<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Footprint — Labyrinth</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 100%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #path{ display:flex; gap:8px; margin-bottom:20px; max-width:680px; flex-wrap:wrap; justify-content:center; }
  .room{ width:36px; height:36px; border-radius:8px; background:var(--card); border:2px solid #1E4568; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
  .room.done{ background:var(--green); border-color:var(--green); }
  .room.current{ border-color:var(--amber); box-shadow:0 0 0 2px var(--amber); }
  #qcard{ width:100%; max-width:640px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  #storyLine{ font-style:italic; color:var(--muted); margin-bottom:12px; font-size:.9rem; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
  #qtext{ color:#fff; font-size:1.1rem; font-weight:700; margin-bottom:16px; }
  .doors{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt{ text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:14px 16px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 2 · My Digital Footprint</div>
  <h1>🌀 Labyrinth: Digital Detectives</h1>
  <div class="hud">
    <div class="pill">Room: <b id="roomNum">1</b> / 7</div>
    <div class="pill">Lives: <b id="lives">❤️❤️❤️</b></div>
  </div>
  <div id="path"></div>

  <div id="qcard">
    <div id="storyLine"></div>
    <div id="qLabel">❓ Question</div>
    <div id="qtext"></div>
    <div class="doors" id="doors"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Enter Next Room →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Try Again</button>
  </div>
  <footer>Original puzzle content · Unit 2, Lessons 5 &amp; 6: Digital Detectives</footer>

<script>
const rooms = [
  { story:"Room 1: A locked panel needs the right word.", q:"Last year, my father's Facebook account was _____ as his password was very simple.", opts:["hacked", "hoped"], a:0, ex:"'Hacked' means someone broke into the account." },
  { story:"Room 2: The floor questions your grammar before it lets you pass.", q:"If I don't set my privacy settings _____, all my photos online will be seen by others.", opts:["properly", "wrongly"], a:0, ex:"'Properly' means correctly, which prevents the problem." },
  { story:"Room 3: A mirror shows two reflections — only one is correct.", q:"Don't put yourself _____ risk by trying extreme sports.", opts:["at", "of"], a:0, ex:"'At risk' is the correct fixed phrase." },
  { story:"Room 4: The exit sign flickers between two sentences.", q:"To stay safe online, you shouldn't _____ your full name or address.", opts:["share", "read"], a:0, ex:"You shouldn't 'share' private information." },
  { story:"Room 5: A final riddle blocks the way out.", q:"You should _____ sure that you don't post your personal details online.", opts:["make", "have"], a:0, ex:"'Make sure' is the correct fixed phrase." },
  { story:"Room 6: One last door to freedom!", q:"Rewrite: 'It is important to make a study plan.' (should)", opts:["You should make a study plan.","You should to make a study plan."], a:0, ex:"'should' + base verb, no 'to'." },
  { story:"Room 7: The final exit!", q:"Rewrite: 'You should think twice before posting anything online.' (carefully)", opts:["You should think carefully before posting anything online.","You should think careful before posting."], a:0, ex:"'carefully' (adverb) modifies the verb 'think'." },
];

let idx = 0, lives = 3;

function renderPath(){
  const path = document.getElementById('path');
  path.innerHTML = '';
  rooms.forEach((_, i) => {
    const r = document.createElement('div');
    r.className = 'room';
    if (i < idx) r.classList.add('done');
    if (i === idx) r.classList.add('current');
    r.textContent = i < idx ? '✓' : (i+1);
    path.appendChild(r);
  });
}

function renderLives(){ document.getElementById('lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3-lives); }

function loadRoom(){
  if (idx >= rooms.length) { finishGame(true); return; }
  document.getElementById('roomNum').textContent = idx + 1;
  renderPath();
  const r = rooms[idx];
  document.getElementById('storyLine').textContent = r.story;
  document.getElementById('qtext').textContent = r.q;
  const doorsDiv = document.getElementById('doors');
  doorsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  r.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === r.a) {
        b.classList.add('correct');
        document.getElementById('nextBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').textContent = idx === rooms.length-1 ? 'Escape the Maze! →' : 'Enter Next Room →';
        document.getElementById('nextBtn').onclick = () => { idx++; loadRoom(); };
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[r.a].classList.add('correct');
        lives--;
        renderLives();
        if (lives <= 0) { setTimeout(() => finishGame(false), 800); return; }
        document.getElementById('nextBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').textContent = 'Try This Room Again →';
        document.getElementById('nextBtn').onclick = () => loadRoom();
      }
      document.getElementById('explain').textContent = 'Hint: ' + r.ex;
      document.getElementById('explain').style.display = 'block';
    };
    doorsDiv.appendChild(b);
  });
}

function finishGame(escaped){
  document.getElementById('qcard').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  if (escaped) {
    document.getElementById('endTitle').textContent = '🎉 You Escaped the Data Maze!';
    document.getElementById('endMsg').textContent = `You cleared all ${rooms.length} rooms with ${lives} ${lives===1?'life':'lives'} remaining.`;
  } else {
    document.getElementById('endTitle').textContent = '💥 Trapped in the Maze!';
    document.getElementById('endMsg').textContent = `You reached room ${idx+1} of ${rooms.length}. Review passive voice and try again!`;
  }
}

renderLives();
loadRoom();
</script>
</body>
</html>
