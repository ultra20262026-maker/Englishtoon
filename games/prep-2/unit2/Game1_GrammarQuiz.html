<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Footprint — Grammar Quiz</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  .progress{ width:100%; max-width:640px; height:8px; background:var(--card); border-radius:6px; overflow:hidden; margin-bottom:16px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--cyan), var(--green)); width:0%; transition:width .3s; }
  #qcard{ width:100%; max-width:640px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.15rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #startBtn{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:20px; box-shadow:0 8px 20px rgba(53,208,201,.3); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 2 · My Digital Footprint</div>
  <h1>📝 Grammar Quiz: Protecting Your Privacy</h1>
  <div class="hud">
    <div class="pill">Score: <b id="score">0</b></div>
    <div class="pill">Question: <b id="qNum">1</b> / 10</div>
  </div>
  <div class="progress"><div class="progress-fill" id="prog"></div></div>
  <div id="qcard">
    <div id="qLabel">❓ Question</div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Next Question →</button>
  </div>
  <button id="startBtn">Start Quiz</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 2, Lesson 1: Protecting Your Privacy in the Digital Age</footer>

<script>
const questions = [
  { q:"'The internet is a big part of our life.' This statement is...", opts:["an opinion many people would agree with","definitely false","impossible","illegal"], a:0, ex:"It's a reasonable opinion most people would agree with." },
  { q:"The antonym of 'safe' is...", opts:["dangerous","protected","secure","careful"], a:0, ex:"'Dangerous' is the opposite of 'safe'." },
  { q:"The antonym of 'easy' is...", opts:["difficult","simple","quick","clear"], a:0, ex:"'Difficult' is the opposite of 'easy'." },
  { q:"The antonym of 'strong' is...", opts:["weak","powerful","tough","solid"], a:0, ex:"'Weak' is the opposite of 'strong'." },
  { q:"Keeping your online information safe is important because...", opts:["it protects your privacy","it makes the internet slower","it's required by websites only","it has no effect"], a:0, ex:"Online safety protects your personal privacy." },
  { q:"'Privacy' means...", opts:["the state of being free from public attention","being famous","being loud","being careless"], a:0, ex:"'Privacy' is freedom from public attention." },
  { q:"A good way to stay safe online is to...", opts:["use strong passwords","share your password with everyone","post your address publicly","ignore privacy settings"], a:0, ex:"Strong passwords help protect your accounts." },
  { q:"Writing a paragraph about 'How to Stay Safe Online' would include tips about...", opts:["passwords and personal information","cooking recipes","sports scores","weather forecasts"], a:0, ex:"Online safety tips focus on passwords and personal data." },
  { q:"'The digital age' refers to...", opts:["the era shaped by widespread use of technology","a specific person's age","a type of clock","a school subject"], a:0, ex:"'The digital age' describes our technology-driven era." },
  { q:"Which is a personal detail you should NOT share online with strangers?", opts:["your home address","your favorite color","your favorite book","your favorite subject"], a:0, ex:"Your home address is private and should stay that way." },
];

let idx = 0, score = 0;

function loadQ(){
  if (idx >= questions.length) { finishGame(); return; }
  document.getElementById('qNum').textContent = idx + 1;
  document.getElementById('prog').style.width = `${(idx/questions.length)*100}%`;
  const q = questions[idx];
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => answer(i, q, b);
    optsDiv.appendChild(b);
  });
}

function answer(i, q, btn){
  document.querySelectorAll('.opt').forEach(o => o.onclick = null);
  if (i === q.a) {
    btn.classList.add('correct');
    score += 10;
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt')[q.a].classList.add('correct');
  }
  document.getElementById('score').textContent = score;
  document.getElementById('explain').textContent = 'Why: ' + q.ex;
  document.getElementById('explain').style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = (idx === questions.length - 1) ? 'See Final Score →' : 'Next Question →';
}

document.getElementById('nextBtn').addEventListener('click', () => { idx++; loadQ(); });

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').style.display = 'none';
  loadQ();
});

function finishGame(){
  document.getElementById('qcard').style.display = 'none';
  document.getElementById('prog').style.width = '100%';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Quiz Complete!';
  if (score >= 90) title = '🏆 Passive Voice Master!';
  else if (score >= 60) title = '👍 Nice Work!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${questions.length} questions.`;
}
</script>
</body>
</html>
