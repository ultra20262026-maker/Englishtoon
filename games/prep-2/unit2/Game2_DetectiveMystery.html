<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Footprint — Detective Mystery</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 15% 20%, rgba(53,208,201,.08), transparent 40%), var(--navy); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  p.intro{ max-width:620px; text-align:center; color:var(--muted); margin-top:0; }
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--amber);}
  #suspects{ display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; max-width:640px; }
  .suspect{ background:var(--card); border:2px solid #1E4568; border-radius:10px; padding:10px 16px; font-size:.9rem; text-align:center; }
  .suspect.cleared{ opacity:.3; text-decoration:line-through; }
  .suspect.suspicious{ border-color:var(--amber); }
  #clueBox{ width:100%; max-width:640px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  .clueLabel{ color:var(--amber); font-weight:800; font-size:.8rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.15rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 2 · My Digital Footprint</div>
  <h1>🕵️ Detective Mystery: Who Leaked the Password?</h1>
  <p class="intro">Someone's account was hacked. Answer each grammar clue correctly to clear innocent suspects and find the culprit!</p>
  <div class="hud">
    <div class="pill">Clue: <b id="clueNum">1</b> / 6</div>
    <div class="pill">Cleared: <b id="clearedCount">0</b> / 5</div>
  </div>
  <div id="suspects"></div>

  <div id="clueBox">
    <div class="clueLabel" id="clueLabel"></div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Next Clue →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original puzzle content · Unit 2, Lesson 2: Staying Safe Online</footer>

<script>
const suspectNames = ["Yara", "Omar", "Sara", "Karim", "Nadia"];
const culpritIdx = 4; // Nadia
let clearedSet = new Set();

const clues = [
  { label:"Clue 1: The Login Log", q:"Rewrite in the passive: 'Someone opened the account at midnight.'", opts:["The account was opened at midnight.","The account opens at midnight.","The account is open at midnight.","The account opened was at midnight."], a:0, clears:0, ex:"'was opened' is the correct past passive form." },
  { label:"Clue 2: The Message Trace", q:"'Messages ___ (send) from an unknown device.'", opts:["send","are sent","sent","is sent"], a:1, clears:1, ex:"'Messages' (plural) + are sent." },
  { label:"Clue 3: The Password Hint", q:"'The password should ___ (change) every month.'", opts:["change","changed","be changed","being changed"], a:2, clears:2, ex:"Modal + be + past participle: 'should be changed'." },
  { label:"Clue 4: The Alibi", q:"Rewrite in the passive: 'They protect their accounts with strong passwords.'", opts:["Their accounts are protected with strong passwords.","Their accounts protect with strong passwords.","Their accounts is protected with strong passwords.","Their accounts protected are with strong passwords."], a:0, clears:3, ex:"'are protected' is the correct passive form." },
  { label:"Clue 5: The Final Trace", q:"'The suspicious file ___ (download) two days ago.'", opts:["downloads","downloaded","was downloaded","is downloaded"], a:2, clears:-1, ex:"Past passive: 'was downloaded'. This points to the real culprit!" },
];

let clueIdx = 0;

function renderSuspects(){
  const wrap = document.getElementById('suspects');
  wrap.innerHTML = '';
  suspectNames.forEach((name, i) => {
    const div = document.createElement('div');
    div.className = 'suspect';
    if (clearedSet.has(i)) div.classList.add('cleared');
    if (i === culpritIdx && clueIdx >= clues.length - 1) div.classList.add('suspicious');
    div.textContent = name + (clearedSet.has(i) ? ' ✓ cleared' : '');
    wrap.appendChild(div);
  });
}
renderSuspects();

function loadClue(){
  if (clueIdx >= clues.length) { finishGame(); return; }
  document.getElementById('clueNum').textContent = clueIdx + 1;
  const c = clues[clueIdx];
  document.getElementById('clueLabel').textContent = c.label;
  document.getElementById('qtext').textContent = c.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  c.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === c.a) {
        b.classList.add('correct');
        if (c.clears >= 0) { clearedSet.add(c.clears); document.getElementById('clearedCount').textContent = clearedSet.size; }
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[c.a].classList.add('correct');
      }
      document.getElementById('explain').textContent = 'Deduction: ' + c.ex;
      document.getElementById('explain').style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
      renderSuspects();
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => { clueIdx++; loadClue(); });

function finishGame(){
  document.getElementById('clueBox').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  document.getElementById('endTitle').textContent = '🔍 Case Solved!';
  document.getElementById('endMsg').textContent = `The culprit was ${suspectNames[culpritIdx]}! You cleared ${clearedSet.size} of 5 innocent suspects using passive voice clues.`;
}

loadClue();
</script>
</body>
</html>
