<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Digital Footprint — Word Search</title>
<style>
  :root{
    --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9;
    --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  body{
    margin:0; min-height:100vh; background:radial-gradient(circle at 80% 90%, var(--navy2), var(--navy) 60%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px;
  }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  .layout{ display:flex; gap:24px; flex-wrap:wrap; justify-content:center; max-width:920px; }
  #grid{
    display:grid; gap:3px; background:var(--navy2); padding:10px; border-radius:14px; border:1px solid #1E4568;
    touch-action:none;
  }
  .cell{
    width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-weight:700;
    background:var(--card); border-radius:6px; color:var(--light); cursor:pointer; font-size:.95rem; transition:.1s;
  }
  .cell.selecting{ background:#2a5b86; color:#fff; }
  .cell.found{ background:linear-gradient(135deg, var(--green), #58b56d); color:var(--navy); }
  .wordlist{
    background:var(--card); border:1px solid #1E4568; border-radius:14px; padding:18px 20px; min-width:220px;
  }
  .wordlist h3{ margin:0 0 12px; color:var(--amber); font-size:.95rem; text-transform:uppercase; letter-spacing:1px;}
  .wordlist li{ list-style:none; padding:6px 0; font-size:1rem; color:var(--light); border-bottom:1px dashed #1E4568; }
  .wordlist li.found{ color:var(--green); text-decoration:line-through; font-weight:700; }
  .wordlist ul{ padding:0; margin:0; }
  .hint{ margin-top:14px; font-size:.8rem; color:var(--muted); }
  button{
    font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:20px;
    box-shadow:0 8px 20px rgba(53,208,201,.3);
  }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  footer{ margin-top:24px; color:var(--muted); font-size:.75rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 2 · My Digital Footprint</div>
  <h1>🔎 Word Search: Managing Your Online Data</h1>
  <div class="hud">
    <div class="pill">Found: <b id="foundCount">0</b> / <b id="totalCount">0</b></div>
    <div class="pill">Take your time — no rush!</div>
  </div>

  <div class="layout">
    <div id="grid"></div>
    <div class="wordlist">
      <h3>Find These Words</h3>
      <ul id="wordul"></ul>
      <div class="hint">Click and drag across letters (or tap start → tap end) to select a word — up, down, or across.</div>
    </div>
  </div>

  <button id="restartBtn">New Puzzle</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original word list · Unit 2, Lesson 3: Managing Your Online Data</footer>

<script>
const WORDS = ["FOOTPRINT","TRACE","ONLINE","IDENTITY","ACTIVE","PASSIVE","MANAGE","STRONG","IMPORTANT","KEEP"];
const SIZE = 13;

function buildGrid(){
  const grid = Array.from({length:SIZE}, () => Array(SIZE).fill(''));
  const dirs = [[0,1],[1,0],[1,1],[-1,1]]; // across, down, diag-down, diag-up
  const placed = [];

  function canPlace(word, r, c, dr, dc){
    for (let i=0;i<word.length;i++){
      const nr = r+dr*i, nc = c+dc*i;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE) return false;
      if (grid[nr][nc] !== '' && grid[nr][nc] !== word[i]) return false;
    }
    return true;
  }
  function place(word){
    const attempts = 200;
    for (let a=0;a<attempts;a++){
      const dir = dirs[Math.floor(Math.random()*dirs.length)];
      const r = Math.floor(Math.random()*SIZE);
      const c = Math.floor(Math.random()*SIZE);
      if (canPlace(word, r, c, dir[0], dir[1])) {
        for (let i=0;i<word.length;i++){
          grid[r+dir[0]*i][c+dir[1]*i] = word[i];
        }
        placed.push({word, r, c, dr:dir[0], dc:dir[1]});
        return true;
      }
    }
    return false;
  }
  WORDS.slice().sort((a,b)=>b.length-a.length).forEach(place);

  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (!grid[r][c]) grid[r][c] = letters[Math.floor(Math.random()*26)];
  return {grid, placed};
}

const {grid, placed} = buildGrid();
let foundWords = new Set();

const gridEl = document.getElementById('grid');
gridEl.style.gridTemplateColumns = `repeat(${SIZE}, 34px)`;
const cellEls = [];
for (let r=0;r<SIZE;r++){
  cellEls.push([]);
  for (let c=0;c<SIZE;c++){
    const div = document.createElement('div');
    div.className = 'cell';
    div.textContent = grid[r][c];
    div.dataset.r = r; div.dataset.c = c;
    gridEl.appendChild(div);
    cellEls[r].push(div);
  }
}

const wordul = document.getElementById('wordul');
WORDS.forEach(w => {
  const li = document.createElement('li');
  li.textContent = w;
  li.id = 'word-' + w;
  wordul.appendChild(li);
});
document.getElementById('totalCount').textContent = WORDS.length;

let selecting = false;
let startCell = null;
let currentPath = [];

function cellKey(r,c){ return r+'_'+c; }

function clearSelecting(){
  currentPath.forEach(([r,c]) => { if(!isFoundCell(r,c)) cellEls[r][c].classList.remove('selecting'); });
  currentPath = [];
}
let foundCellSet = new Set();
function isFoundCell(r,c){ return foundCellSet.has(cellKey(r,c)); }

function getLineCells(r1,c1,r2,c2){
  const dr = Math.sign(r2-r1), dc = Math.sign(c2-c1);
  if (dr !== 0 && dc !== 0 && Math.abs(r2-r1) !== Math.abs(c2-c1)) return null;
  if (dr === 0 && dc === 0) return [[r1,c1]];
  const len = Math.max(Math.abs(r2-r1), Math.abs(c2-c1)) + 1;
  const cells = [];
  for (let i=0;i<len;i++) cells.push([r1+dr*i, c1+dc*i]);
  return cells;
}

function startSelect(r,c){
  selecting = true;
  startCell = [r,c];
  currentPath = [[r,c]];
  cellEls[r][c].classList.add('selecting');
}
function moveSelect(r,c){
  if (!selecting) return;
  clearSelecting();
  const line = getLineCells(startCell[0], startCell[1], r, c);
  if (!line) { currentPath=[startCell]; cellEls[startCell[0]][startCell[1]].classList.add('selecting'); return; }
  currentPath = line;
  line.forEach(([rr,cc]) => cellEls[rr][cc].classList.add('selecting'));
}
function endSelect(){
  if (!selecting) return;
  selecting = false;
  checkWord();
  clearSelecting();
}

function checkWord(){
  const str = currentPath.map(([r,c]) => grid[r][c]).join('');
  const strRev = str.split('').reverse().join('');
  const match = placed.find(p => {
    if (foundWords.has(p.word)) return false;
    return p.word === str || p.word === strRev;
  });
  if (match) {
    foundWords.add(match.word);
    currentPath.forEach(([r,c]) => { foundCellSet.add(cellKey(r,c)); cellEls[r][c].classList.add('found'); });
    document.getElementById('word-' + match.word).classList.add('found');
    document.getElementById('foundCount').textContent = foundWords.size;
    if (foundWords.size === WORDS.length) finishGame();
  }
}

gridEl.addEventListener('mousedown', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  startSelect(+cell.dataset.r, +cell.dataset.c);
});
gridEl.addEventListener('mouseover', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  moveSelect(+cell.dataset.r, +cell.dataset.c);
});
document.addEventListener('mouseup', endSelect);

// touch support
gridEl.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const cell = el && el.closest('.cell');
  if (cell) startSelect(+cell.dataset.r, +cell.dataset.c);
}, {passive:true});
gridEl.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const cell = el && el.closest('.cell');
  if (cell) moveSelect(+cell.dataset.r, +cell.dataset.c);
}, {passive:true});
document.addEventListener('touchend', endSelect);

document.getElementById('restartBtn').addEventListener('click', () => location.reload());

function finishGame(){
  document.querySelector('.layout').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  document.getElementById('endTitle').textContent = '🎉 All Words Found!';
  document.getElementById('endMsg').textContent = `You found all ${WORDS.length} words. Great job!`;
}
</script>
</body>
</html>
