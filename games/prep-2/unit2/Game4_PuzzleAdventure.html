<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Footprint — Puzzle Adventure</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 80% 90%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #puzzle{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; width:300px; height:300px; margin-bottom:20px; background:var(--card); border-radius:12px; overflow:hidden; border:2px solid #1E4568; }
  .piece{ display:flex; align-items:center; justify-content:center; font-size:2rem; background:var(--navy2); transition:.3s; }
  .piece.revealed{ background:linear-gradient(160deg,#1a3a5c,#12233a); }
  #qcard{ width:100%; max-width:600px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.1rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 2 · My Digital Footprint</div>
  <h1>🧩 Puzzle Adventure: The Little Inventor Ch2</h1>
  <div class="hud">
    <div class="pill">Pieces revealed: <b id="revealedCount">0</b> / 9</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>
  <div id="puzzle"></div>

  <div id="qcard">
    <div id="qLabel">❓ Question</div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Reveal Next Piece →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 2, Lesson 4: Reading — The Little Inventor Ch2</footer>

<script>
const pieceEmojis = ["🔒","🛡️","🔑","👤","📱","💾","🌐","✅","🔐"];
const questions = [
  { q:"Text: Before the science fair, Amal faced several problems with her robot. She sometimes felt like giving up, but her parents always encouraged her to keep trying. Her friend Yara showed empathy whenever Amal felt frustrated. In the end, Amal fixed every problem by researching carefully from trustworthy sources online. — What did Amal face before the science fair?", opts:["several problems with her robot","no problems at all","a big prize","a new school"], a:0, ex:"The text says she faced several problems with her robot." },
  { q:"How did Amal sometimes feel?", opts:["like giving up","extremely happy","bored","hungry"], a:0, ex:"She sometimes felt like giving up." },
  { q:"What did her parents do?", opts:["encouraged her to keep trying","told her to stop","ignored her","punished her"], a:0, ex:"Her parents always encouraged her." },
  { q:"What did Yara show when Amal felt frustrated?", opts:["empathy","anger","jealousy","indifference"], a:0, ex:"Yara showed empathy." },
  { q:"How did Amal fix her problems?", opts:["by researching carefully from trustworthy sources","by giving up","by copying a classmate","by guessing randomly"], a:0, ex:"She researched carefully from trustworthy sources." },
  { q:"The word 'frustrated' means...", opts:["annoyed or upset because of difficulty","extremely happy","calm and relaxed","bored"], a:0, ex:"'Frustrated' means annoyed due to difficulty." },
  { q:"This text is mainly about...", opts:["persevering through difficulty with support from others","a school holiday","a sports match","a cooking recipe"], a:0, ex:"The text is about persevering with support from others." },
  { q:"What quality did Amal's parents show?", opts:["encouragement and support","anger","carelessness","jealousy"], a:0, ex:"They showed encouragement and support." },
  { q:"Why is it important to use trustworthy sources online?", opts:["to get correct and reliable information","to waste time","to confuse yourself","it doesn't matter"], a:0, ex:"Trustworthy sources give correct, reliable information." },
  { q:"What can we learn from this story?", opts:["it's okay to struggle, but persevering leads to success","giving up is always best","friends should never help each other","research is unnecessary"], a:0, ex:"Struggling is okay — perseverance leads to success." },
];

let idx = 0, score = 0, revealed = 0;
const puzzleEl = document.getElementById('puzzle');

function buildPuzzle(){
  puzzleEl.innerHTML = '';
  for (let i=0;i<9;i++){
    const div = document.createElement('div');
    div.className = 'piece';
    div.dataset.idx = i;
    puzzleEl.appendChild(div);
  }
}
buildPuzzle();

function loadQ(){
  if (idx >= questions.length) { finishGame(); return; }
  const q = questions[idx];
  document.getElementById('qtext').textContent = `Piece ${idx+1}/${questions.length}: ${q.q}`;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === q.a) {
        b.classList.add('correct');
        score += 10;
        revealPiece();
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
      }
      document.getElementById('score').textContent = score;
      document.getElementById('explain').textContent = 'Why: ' + q.ex;
      document.getElementById('explain').style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
    };
    optsDiv.appendChild(b);
  });
}

function revealPiece(){
  const pieces = document.querySelectorAll('.piece:not(.revealed)');
  if (pieces.length === 0) return;
  const piece = pieces[Math.floor(Math.random()*pieces.length)];
  piece.classList.add('revealed');
  piece.textContent = pieceEmojis[revealed % pieceEmojis.length];
  revealed++;
  document.getElementById('revealedCount').textContent = revealed;
}

document.getElementById('nextBtn').addEventListener('click', () => { idx++; loadQ(); });

function finishGame(){
  document.getElementById('qcard').style.display = 'none';
  // reveal all remaining pieces
  document.querySelectorAll('.piece:not(.revealed)').forEach((p,i) => {
    p.classList.add('revealed');
    p.textContent = pieceEmojis[(revealed+i) % pieceEmojis.length];
  });
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Puzzle Complete!';
  if (score >= 80) title = '🏆 Privacy Puzzle Master!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${questions.length} questions.`;
}

loadQ();
</script>
</body>
</html>
