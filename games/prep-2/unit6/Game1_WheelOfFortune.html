<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Young Innovators — Wheel of Fortune</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 70% 10%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  .arena{position:relative; width:300px; height:300px; margin:10px auto;}
  .wheel{ width:100%; height:100%; border-radius:50%; position:relative; overflow:hidden; transition: transform 3.6s cubic-bezier(.17,.67,.12,1); box-shadow:0 0 0 8px var(--navy2), 0 20px 40px rgba(0,0,0,.5); transform:rotate(0deg); }
  .seg{ position:absolute; width:50%; height:50%; top:0; left:50%; transform-origin:0% 100%; display:flex; align-items:flex-start; justify-content:center; font-weight:800; font-size:.8rem; color:var(--navy); }
  .seg span{ transform: translateY(16px); }
  .pointer{ position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent; border-top:28px solid var(--amber); z-index:5; }
  .hub{ position:absolute; top:50%; left:50%; width:60px; height:60px; margin:-30px 0 0 -30px; background:var(--navy2); border:3px solid var(--cyan); border-radius:50%; z-index:4; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
  button{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:14px 30px; cursor:pointer; color:var(--navy); }
  .btn-spin{ background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:18px;}
  .btn-spin:disabled{ opacity:.4; cursor:not-allowed; }
  #qpanel{ display:none; width:100%; max-width:560px; background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:26px; margin-top:22px; }
  #qcat{ color:var(--amber); font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px;}
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4;}
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:14px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.92rem; color:var(--muted); display:none;}
  .btn-next{ margin-top:16px; background:var(--amber); display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  footer{ margin-top:26px; color:var(--muted); font-size:.75rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 6 · Young Innovators</div>
  <h1>🎡 Wheel of Fortune: Turning Ideas into an Impact</h1>
  <div class="hud">
    <div class="pill">Score: <b id="score">0</b></div>
    <div class="pill">Round: <b id="round">1</b> / 8</div>
  </div>
  <div class="arena">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
    <div class="hub">💡</div>
  </div>
  <button class="btn-spin" id="spinBtn">SPIN THE WHEEL</button>
  <div id="qpanel">
    <div id="qcat"></div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="btn-next" id="nextBtn">Next Round →</button>
  </div>
  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="btn-spin" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original practice content · Unit 6, Lesson 1: Turning Ideas into an Impact</footer>

<script>
const categories = [
  {name:"Vocabulary", color:"#8CE99A"}, {name:"Impact Words", color:"#35D0C9"},
  {name:"Fill the Blank", color:"#7FD8E8"}, {name:"Meaning Match", color:"#FFC168"},
  {name:"Vocabulary", color:"#FF8080"}, {name:"Impact Words", color:"#B79CFF"},
  {name:"Fill the Blank", color:"#8CE99A"}, {name:"Meaning Match", color:"#35D0C9"},
];
const bank = [
  {cat:"Vocabulary", q:"When engineers create a new app, they first try to _____ any problems that might happen.", opts:["identify","ignore","hide","forget"], a:0, ex:"'Identify' means to recognize or discover something."},
  {cat:"Impact Words", q:"Some apps are very _____.", opts:["complex","simple only","boring","empty"], a:0, ex:"'Complex' means complicated or difficult to understand."},
  {cat:"Fill the Blank", q:"The way people use an app can have a big _____ on their daily lives.", opts:["impact","mistake","complaint","argument"], a:0, ex:"'Impact' means a strong effect or influence."},
  {cat:"Meaning Match", q:"Then they make a new _____ that works better.", opts:["version","mistake","complaint","argument"], a:0, ex:"'Version' means a new, updated form of something."},
  {cat:"Vocabulary", q:"'Identify' means...", opts:["to recognize or discover something","to hide something","to destroy something","to forget something"], a:0, ex:"'Identify' means to recognize or discover something."},
  {cat:"Impact Words", q:"'Impact' means...", opts:["a strong effect or influence","a small object","a type of food","a type of animal"], a:0, ex:"'Impact' is a strong effect or influence."},
  {cat:"Fill the Blank", q:"Inventions don't have to be complex — what matters is the...", opts:["impact","price","size","color"], a:0, ex:"What matters most is the invention's impact."},
  {cat:"Meaning Match", q:"Working hard helps you _____ great success.", opts:["achieve","avoid","ignore","forget"], a:0, ex:"'Achieve' means to successfully reach a goal."},
];
let deck = [...bank].sort(()=>Math.random()-0.5);
let round = 0, score = 0;
const TOTAL_ROUNDS = 8;
const wheelEl = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
const qpanel = document.getElementById('qpanel');

function buildWheel(){
  const n = categories.length; wheelEl.innerHTML = '';
  const parts = []; const step = 360/n;
  categories.forEach((c,i)=> parts.push(`${c.color} ${i*step}deg ${(i+1)*step}deg`));
  wheelEl.style.background = `conic-gradient(${parts.join(',')})`;
  categories.forEach((c,i)=>{
    const seg = document.createElement('div'); seg.className = 'seg';
    seg.style.transform = `rotate(${i*step + step/2}deg)`;
    seg.innerHTML = `<span>${c.name}</span>`;
    wheelEl.appendChild(seg);
  });
}
buildWheel();

let currentRotation = 0;
spinBtn.addEventListener('click', () => {
  if (round >= TOTAL_ROUNDS) return;
  spinBtn.disabled = true; qpanel.style.display = 'none';
  const n = categories.length, step = 360/n;
  const targetIndex = Math.floor(Math.random()*n);
  const spins = 4 + Math.floor(Math.random()*2);
  const landingOffset = targetIndex*step + step/2;
  const finalRotation = currentRotation + spins*360 + (360 - landingOffset);
  currentRotation = finalRotation % 360;
  wheelEl.style.transform = `rotate(${finalRotation}deg)`;
  setTimeout(() => { openQuestion(categories[targetIndex].name); spinBtn.disabled = false; }, 3700);
});

function openQuestion(catName){
  round++;
  document.getElementById('round').textContent = Math.min(round, TOTAL_ROUNDS);
  let pool = deck.filter(q => q.cat === catName);
  if (pool.length === 0) pool = deck;
  const q = pool[Math.floor(Math.random()*pool.length)];
  deck = deck.filter(item => item !== q);
  if (deck.length === 0) deck = [...bank].sort(()=>Math.random()-0.5);

  qpanel.style.display = 'block';
  document.getElementById('qcat').textContent = 'Category: ' + catName;
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options'); optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain'); explainDiv.style.display = 'none';
  const nextBtn = document.getElementById('nextBtn'); nextBtn.style.display = 'none';

  q.opts.forEach((opt, idx) => {
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o=>o.disabled=true);
      if (idx === q.a) { b.classList.add('correct'); score += 10; }
      else { b.classList.add('wrong'); document.querySelectorAll('.opt')[q.a].classList.add('correct'); }
      document.getElementById('score').textContent = score;
      explainDiv.textContent = 'Why: ' + q.ex; explainDiv.style.display = 'block';
      nextBtn.textContent = round >= TOTAL_ROUNDS ? 'See Final Score →' : 'Next Round →';
      nextBtn.style.display = 'inline-block';
    };
    optsDiv.appendChild(b);
  });
  nextBtn.onclick = () => { if (round >= TOTAL_ROUNDS) finishGame(); else qpanel.style.display = 'none'; };
}

function finishGame(){
  qpanel.style.display = 'none';
  document.querySelector('.arena').style.display = 'none';
  spinBtn.style.display = 'none';
  const end = document.getElementById('endscreen'); end.style.display = 'block';
  let title = score >= 60 ? '🏆 Innovation Champion!' : score >= 40 ? '👍 Nice Work!' : '💪 Keep Practicing!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You scored ${score} points. Spin again to beat your score!`;
}
</script>
</body>
</html>
