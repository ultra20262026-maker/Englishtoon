<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Young Innovators — Race to the Top</title>
<style>
  :root{
    --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9;
    --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:radial-gradient(circle at 50% 100%, var(--navy2), var(--navy) 65%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px;
  }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  #track{
    display:flex; flex-wrap:wrap; gap:6px; max-width:720px; width:100%; background:var(--card); border:1px solid #1E4568;
    border-radius:14px; padding:14px; margin-bottom:18px;
  }
  .tile{
    width:56px; height:56px; border-radius:8px; background:var(--navy2); border:1px solid #1E4568; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:.65rem; font-weight:700; color:var(--muted); position:relative;
  }
  .tile.start{ background:linear-gradient(135deg, var(--green), #52a866); color:var(--navy); }
  .tile.finish{ background:linear-gradient(135deg, var(--amber), #d99a3d); color:var(--navy); }
  .tile.q{ background:#1a3a5c; color:var(--cyan); }
  .token{
    position:absolute; bottom:-4px; right:-4px; width:22px; height:22px; border-radius:50%; background:var(--red);
    border:2px solid #fff; display:flex; align-items:center; justify-content:center; font-size:.7rem; transition:all .4s;
  }
  #diceArea{ display:flex; align-items:center; gap:20px; margin-bottom:10px; }
  #dice{
    width:64px; height:64px; background:#fff; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:2rem; font-weight:800; color:var(--navy); box-shadow:0 8px 18px rgba(0,0,0,.4); transition:transform .15s;
  }
  #dice.rolling{ animation:shake .5s ease; }
  @keyframes shake{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-15deg);} 75%{transform:rotate(15deg);} }
  button{
    font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green));
    box-shadow:0 8px 20px rgba(53,208,201,.3); transition:transform .15s;
  }
  button:hover{ transform:translateY(-2px); }
  button:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
  #qmodal{
    display:none; position:fixed; inset:0; background:rgba(4,10,18,.88); z-index:100; align-items:center; justify-content:center; padding:20px;
  }
  #qcardbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:28px; max-width:600px; width:100%; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568;
    border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none;}
  .btn-close{ margin-top:16px; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  footer{ margin-top:24px; color:var(--muted); font-size:.75rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 6 · Young Innovators</div>
  <h1>🎲 Race to the Top: The Hidden Island Ch3</h1>
  <div class="hud">
    <div class="pill">Position: <b id="pos">1</b> / 20</div>
    <div class="pill">Correct: <b id="correctCount">0</b></div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>

  <div id="track"></div>

  <div id="diceArea">
    <div id="dice">?</div>
    <button id="rollBtn">Roll the Dice</button>
  </div>

  <div id="qmodal">
    <div id="qcardbox">
      <div id="qLabel">❓ Question</div>
      <div id="qtext"></div>
      <div id="options"></div>
      <div class="explain" id="explain"></div>
      <button class="btn-close" id="closeBtn">Continue →</button>
    </div>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original questions · Unit 6, Lesson 4: Reading — The Hidden Island Ch3</footer>

<script>
const TRACK_LENGTH = 20;
const questionTiles = [3, 5, 7, 9, 11, 13, 15, 17, 19];

const questionBank = [
  {q:"Text: As the sun set, the four friends gathered on the beach to leave the island. They agreed that their friendship had grown much stronger through the journey. — When did the friends gather on the beach?", opts:["as the sun set","at noon","at midnight","early morning"], a:0, ex:"They gathered as the sun set."},
  {q:"What did the friends agree about their friendship?", opts:["it had ended","it had grown much stronger","it was the same as before","it was weaker"], a:1, ex:"They agreed their friendship had grown stronger."},
  {q:"What did they promise to do?", opts:["forget the journey","share their stories and lessons with the village","keep everything secret","never talk again"], a:1, ex:"They promised to share their stories and lessons."},
  {q:"The word 'gathered' means...", opts:["came together in one place","separated","argued","disappeared"], a:0, ex:"'Gathered' means came together in one place."},
  {q:"What lesson did the friends learn from their journey?", opts:["traveling is useless","teamwork and friendship grow through shared challenges","friendship doesn't matter","staying home is always better"], a:1, ex:"They learned that teamwork and friendship grow through challenges."},
  {q:"Why do you think they wanted to share their stories?", opts:["to keep secrets","to inspire others with what they learned","to brag only","to confuse people"], a:1, ex:"They wanted to inspire others with their experience."},
  {q:"What quality did the friends' journey build?", opts:["isolation","stronger friendship and teamwork","competition","dishonesty"], a:1, ex:"Their journey built stronger friendship and teamwork."},
  {q:"What time of day does the text describe?", opts:["sunset","sunrise","midnight","noon"], a:0, ex:"The text describes sunset."},
  {q:"What can we predict the friends will do next?", opts:["forget everything","share their experience with their community","argue with each other","avoid their village"], a:1, ex:"They will likely share their experience with their community."},
];
let questionPool = [...questionBank].sort(()=>Math.random()-0.5);

let position = 1;
let score = 0;
let correctCount = 0;
let rolling = false;

const track = document.getElementById('track');
function renderTrack(){
  track.innerHTML = '';
  for (let i = 1; i <= TRACK_LENGTH; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    if (i === 1) tile.classList.add('start');
    else if (i === TRACK_LENGTH) tile.classList.add('finish');
    else if (questionTiles.includes(i)) tile.classList.add('q');
    tile.textContent = i === 1 ? 'START' : (i === TRACK_LENGTH ? 'FINISH' : (questionTiles.includes(i) ? '?' : i));
    tile.dataset.tile = i;
    if (i === position) {
      const token = document.createElement('div');
      token.className = 'token';
      token.textContent = '🚗';
      tile.appendChild(token);
    }
    track.appendChild(tile);
  }
}
renderTrack();

document.getElementById('rollBtn').addEventListener('click', () => {
  if (rolling) return;
  rolling = true;
  const dice = document.getElementById('dice');
  dice.classList.add('rolling');
  document.getElementById('rollBtn').disabled = true;

  let ticks = 0;
  const tickInterval = setInterval(() => {
    dice.textContent = 1 + Math.floor(Math.random()*6);
    ticks++;
    if (ticks > 8) {
      clearInterval(tickInterval);
      const roll = 1 + Math.floor(Math.random()*6);
      dice.textContent = roll;
      dice.classList.remove('rolling');
      movePlayer(roll);
    }
  }, 80);
});

function movePlayer(steps){
  let newPos = Math.min(position + steps, TRACK_LENGTH);
  position = newPos;
  document.getElementById('pos').textContent = position;
  renderTrack();

  if (position === TRACK_LENGTH) {
    setTimeout(finishGame, 500);
    return;
  }
  if (questionTiles.includes(position)) {
    setTimeout(() => openQuestion(), 400);
  } else {
    rolling = false;
    document.getElementById('rollBtn').disabled = false;
  }
}

function openQuestion(){
  if (questionPool.length === 0) questionPool = [...questionBank].sort(()=>Math.random()-0.5);
  const q = questionPool.pop();
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain');
  explainDiv.style.display = 'none';
  const closeBtn = document.getElementById('closeBtn');
  closeBtn.style.display = 'none';

  q.opts.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (idx === q.a) {
        b.classList.add('correct');
        score += 10;
        correctCount++;
        document.getElementById('score').textContent = score;
        document.getElementById('correctCount').textContent = correctCount;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
        // move back 1 space as a small penalty
        position = Math.max(1, position - 1);
        document.getElementById('pos').textContent = position;
      }
      explainDiv.textContent = 'Why: ' + q.ex;
      explainDiv.style.display = 'block';
      closeBtn.style.display = 'inline-block';
    };
    optsDiv.appendChild(b);
  });

  document.getElementById('qmodal').style.display = 'flex';
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('qmodal').style.display = 'none';
  renderTrack();
  rolling = false;
  document.getElementById('rollBtn').disabled = false;
});

function finishGame(){
  document.getElementById('track').style.display = 'none';
  document.getElementById('diceArea').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🏁 You Reached the Finish!';
  if (correctCount >= 7) title = '🏆 Race Champion!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You answered ${correctCount} questions correctly and scored ${score} points.`;
}
</script>
</body>
</html>
