<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Young Innovators — Jeopardy</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:linear-gradient(160deg, #08131f, var(--navy) 55%, #08131f); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #board{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; max-width:900px; width:100%; }
  .cat-header{ background:var(--navy2); border:1px solid #1E4568; border-radius:8px; padding:12px 6px; text-align:center; font-weight:800; font-size:.8rem; color:var(--amber); text-transform:uppercase; }
  .cell{ background:var(--card); border:1px solid #1E4568; border-radius:8px; padding:16px 6px; text-align:center; font-weight:800; font-size:1.3rem; color:var(--cyan); cursor:pointer; }
  .cell:hover{ background:#1a3a5c; }
  .cell.used{ background:#0e1f33; color:var(--muted); cursor:default; }
  #qmodal{ display:none; position:fixed; inset:0; background:rgba(4,10,18,.88); z-index:100; align-items:center; justify-content:center; padding:20px; }
  #qcardbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:30px; max-width:640px; width:100%; }
  #qcat{ color:var(--amber); font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px;}
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:20px; line-height:1.4; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none;}
  .btn-close{ margin-top:16px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:16px; }
  footer{ margin-top:26px; color:var(--muted); font-size:.75rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 6 · Young Innovators</div>
  <h1>🏆 A Man of Impact: Jeopardy</h1>
  <div class="hud">
    <div class="pill">Score: <b id="score">0</b></div>
    <div class="pill">Answered: <b id="answered">0</b> / 12</div>
  </div>
  <div id="board"></div>
  <div id="qmodal">
    <div id="qcardbox">
      <div id="qcat"></div>
      <div id="qtext"></div>
      <div id="options"></div>
      <div class="explain" id="explain"></div>
      <button class="btn-close" id="closeBtn">Back to Board →</button>
    </div>
  </div>
  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 6, Lesson 3: A Man of Impact</footer>

<script>
const categories = ["Engineer Types", "Role Models", "Impact Words", "Mixed Review"];
const points = [100, 200, 300];
const data = {
  "Engineer Types": [
    {q:"_____ engineers use special tools to help patients.", opts:["Biomedical","Fashion","Computer","Sports"], a:0, ex:"'Biomedical' engineers develop medical tools."},
    {q:"He has a relative who works as a _____ engineer.", opts:["biomedical","fashion","computer","sports"], a:0, ex:"The text mentions a biomedical engineer relative."},
    {q:"A _____ engineer works to make cities safe and organized.", opts:["computer","fashion","civil","sports"], a:2, ex:"'Civil' engineers build and organize city infrastructure."},
  ],
  "Role Models": [
    {q:"Many young players see Mohamed Salah as their _____ because of his success.", opts:["role model","enemy","competitor","stranger"], a:0, ex:"A 'role model' is someone you admire and try to be like."},
    {q:"He is a role model for many students in Egypt and...", opts:["around the world","only in his city","nowhere else","only in his school"], a:0, ex:"His influence reaches students worldwide."},
    {q:"Hany Azer is known for his _____ of science and young inventors.", opts:["support","dislike","fear","ignorance"], a:0, ex:"He supports science and young inventors."},
  ],
  "Impact Words": [
    {q:"_____ can help people with problems such as movement difficulties.", opts:["Biomedical engineers","Farmers","Chefs","Painters"], a:0, ex:"Biomedical engineers solve movement-related problems."},
    {q:"_____ can change lives and help those in need.", opts:["Innovations","Mistakes","Complaints","Arguments"], a:0, ex:"'Innovations' can positively change lives."},
    {q:"They both used science and technology to help people live...", opts:["better lives","worse lives","boring lives","dangerous lives"], a:0, ex:"They aimed to help people live better lives."},
  ],
  "Mixed Review": [
    {q:"Hany Azer made a great impact in the world of _____ engineering.", opts:["civil","fashion","computer","sports"], a:0, ex:"He made an impact in civil engineering."},
    {q:"Writing a paragraph about 'A Role Model You Like' would describe...", opts:["who they are and why you admire them","a recipe","a sports score","the weather"], a:0, ex:"Such a paragraph explains who they are and why you admire them."},
    {q:"What quality connects Hany Azer and his relative?", opts:["using science and technology to help others","ignoring technology","working alone always","avoiding challenges"], a:0, ex:"They both use science and technology to help people."},
  ],
};

let score = 0, answered = 0;
function buildBoard(){
  const board = document.getElementById('board'); board.innerHTML = '';
  categories.forEach(cat => { const h = document.createElement('div'); h.className = 'cat-header'; h.textContent = cat; board.appendChild(h); });
  points.forEach((pt, pi) => {
    categories.forEach((cat) => {
      const cell = document.createElement('div'); cell.className = 'cell'; cell.textContent = '$' + pt;
      cell.dataset.cat = cat; cell.dataset.idx = pi;
      cell.addEventListener('click', () => openQuestion(cat, pi, cell, pt));
      board.appendChild(cell);
    });
  });
}
buildBoard();

function openQuestion(cat, idx, cellEl, points){
  if (cellEl.classList.contains('used')) return;
  const qdata = data[cat][idx];
  document.getElementById('qcat').textContent = `${cat} — $${points}`;
  document.getElementById('qtext').textContent = qdata.q;
  const optsDiv = document.getElementById('options'); optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain'); explainDiv.style.display = 'none';
  const closeBtn = document.getElementById('closeBtn'); closeBtn.style.display = 'none';

  qdata.opts.forEach((opt, i) => {
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === qdata.a) { b.classList.add('correct'); score += points; document.getElementById('score').textContent = score; }
      else { b.classList.add('wrong'); document.querySelectorAll('.opt')[qdata.a].classList.add('correct'); }
      explainDiv.textContent = 'Why: ' + qdata.ex; explainDiv.style.display = 'block';
      closeBtn.style.display = 'inline-block';
      cellEl.classList.add('used'); cellEl.textContent = '✓';
      answered++; document.getElementById('answered').textContent = answered;
    };
    optsDiv.appendChild(b);
  });
  document.getElementById('qmodal').style.display = 'flex';
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('qmodal').style.display = 'none';
  if (answered >= 12) finishGame();
});

function finishGame(){
  document.getElementById('board').style.display = 'none';
  const end = document.getElementById('endscreen'); end.style.display = 'block';
  let title = score >= 2400 ? '🏆 Jeopardy Champion!' : score >= 1500 ? '👍 Strong Performance!' : '🎉 Board Complete!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: $${score} across all 12 questions.`;
}
</script>
</body>
</html>
