<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Young Innovators — Millionaire</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:linear-gradient(160deg, #08131f, var(--navy) 55%, #08131f); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.5rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:16px; text-align:center;}
  .layout{ display:flex; gap:24px; max-width:960px; width:100%; flex-wrap:wrap; justify-content:center;}
  .main{ flex:1 1 500px; max-width:560px;}
  .ladder{ width:220px; background:var(--card); border-radius:14px; padding:14px 10px; border:1px solid #1E4568;}
  .rung{ display:flex; justify-content:space-between; padding:8px 12px; border-radius:8px; font-size:.85rem; margin-bottom:4px; color:var(--muted); }
  .rung.current{ background:var(--amber); color:var(--navy); font-weight:800; }
  .rung.done{ color:var(--green); font-weight:700; }
  #qbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:26px; min-height:340px; display:flex; flex-direction:column; }
  #qcount{ color:var(--amber); font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;}
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:20px; line-height:1.4; min-height:70px;}
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt{ background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:14px 14px; font-size:1rem; cursor:pointer; text-align:left; }
  .opt.correct{ background:rgba(140,233,154,.2); border-color:var(--green); color:var(--green); font-weight:700;}
  .opt.wrong{ background:rgba(255,128,128,.2); border-color:var(--red); color:var(--red); font-weight:700;}
  .opt.locked{ opacity:.35; cursor:default; }
  .tools{ display:flex; gap:10px; margin:16px 0 4px; }
  .tool-btn{ background:var(--navy2); color:var(--amber); border:1px solid var(--amber); border-radius:999px; padding:8px 16px; font-size:.8rem; font-weight:700; cursor:pointer; }
  .tool-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .explain{ margin-top:auto; padding-top:14px; font-size:.85rem; color:var(--muted); display:none; }
  button.next{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:12px 26px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:14px; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:26px; color:var(--muted); font-size:.75rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 6 · Young Innovators</div>
  <h1>💡 Who Wants to Be an Innovator Millionaire?</h1>
  <div class="layout">
    <div class="main">
      <div id="qbox">
        <div id="qcount"></div>
        <div id="qtext"></div>
        <div class="opts" id="opts"></div>
        <div class="tools">
          <button class="tool-btn" id="fiftyBtn">50:50</button>
          <button class="tool-btn" id="skipBtn">Skip Question</button>
        </div>
        <div class="explain" id="explain"></div>
        <button class="next" id="nextBtn">Next Question →</button>
      </div>
    </div>
    <div class="ladder" id="ladder"></div>
  </div>
  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 6 grammar focus: Second Conditional</footer>

<script>
const prizes = ["100","200","300","500","1,000","2,000","5,000","10,000","50,000","1 MILLION"];
const questions = [
  {q:"If I ___ a great idea, I would build a prototype. (have)", opts:["have","had","has","having"], a:1, ex:"Past simple 'had' in the if-clause."},
  {q:"If she ___ an inventor, she would solve real problems. (be)", opts:["was","were","is","be"], a:1, ex:"'were' for all subjects with 'to be'."},
  {q:"If I could fly, I ___ visit every country. (visit)", opts:["visit","visits","would visit","visited"], a:2, ex:"Result clause: would + base verb."},
  {q:"If we ___ more time, we would invent something new. (have)", opts:["have","has","had","having"], a:2, ex:"'had' is correct in the if-clause."},
  {q:"If you asked me, I ___ help you immediately. (help)", opts:["help","helps","would help","helped"], a:2, ex:"Result clause needs 'would help'."},
  {q:"Fix the mistake: 'If I will study, I will pass.'", opts:["If I studied, I would pass.","If I study, I pass.","If I studies, I pass.","If I will study, I would pass."], a:0, ex:"Never use 'will' in the if-clause of a second conditional."},
  {q:"If she ___ older, she would join the competition. (be)", opts:["was","is","were","being"], a:2, ex:"'were' with any subject for the verb 'to be'."},
  {q:"What would you invent if you ___ solve any problem? (can)", opts:["can","could","will","would"], a:1, ex:"'could' is used in the if-clause."},
  {q:"If it rained, I ___ go outside. (not go)", opts:["don't","won't","wouldn't","didn't"], a:2, ex:"Negative result: 'wouldn't go'."},
  {q:"If I were an inventor, I ___ create something to help people. (create)", opts:["create","creates","will create","would create"], a:3, ex:"Result clause always uses 'would + base verb'."},
];

let current = 0, score = 0, usedFifty = false, usedSkip = false, bankedPrize = "0";

function renderLadder(){
  const ladder = document.getElementById('ladder'); ladder.innerHTML = '';
  for (let i = prizes.length - 1; i >= 0; i--) {
    const div = document.createElement('div'); div.className = 'rung';
    if (i < current) div.classList.add('done');
    if (i === current) div.classList.add('current');
    div.innerHTML = `<span>${i+1}</span><span>${prizes[i]}</span>`;
    ladder.appendChild(div);
  }
}

function loadQuestion(){
  if (current >= questions.length) { finishGame(true); return; }
  const q = questions[current];
  document.getElementById('qcount').textContent = `Question ${current+1} of ${questions.length} — for ${prizes[current]} points`;
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('opts'); optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain'); explainDiv.style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  q.opts.forEach((opt, idx) => {
    const b = document.createElement('button'); b.className = 'opt';
    b.textContent = `${String.fromCharCode(65+idx)}. ${opt}`; b.dataset.idx = idx;
    b.onclick = () => selectAnswer(idx);
    optsDiv.appendChild(b);
  });
  renderLadder();
}

function selectAnswer(idx){
  const q = questions[current];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => { if(!b.classList.contains('locked')) b.onclick = null; });
  if (idx === q.a) { buttons[idx].classList.add('correct'); score = current; bankedPrize = prizes[current]; }
  else { buttons[idx].classList.add('wrong'); buttons[q.a].classList.add('correct'); }
  document.getElementById('explain').textContent = 'Why: ' + q.ex;
  document.getElementById('explain').style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = (idx === q.a) ? (current === questions.length - 1 ? 'Claim the Million! →' : 'Next Question →') : 'See Final Result →';
  nextBtn.dataset.won = (idx === q.a) ? "1" : "0";
}

document.getElementById('nextBtn').addEventListener('click', () => {
  const won = document.getElementById('nextBtn').dataset.won === "1";
  if (!won) { finishGame(false); return; }
  current++; loadQuestion();
});

document.getElementById('fiftyBtn').addEventListener('click', () => {
  if (usedFifty) return; usedFifty = true; document.getElementById('fiftyBtn').disabled = true;
  const q = questions[current];
  const wrongIndices = q.opts.map((_,i)=>i).filter(i => i !== q.a);
  wrongIndices.sort(()=>Math.random()-0.5);
  const toHide = wrongIndices.slice(0, 2);
  const buttons = document.querySelectorAll('.opt');
  toHide.forEach(i => { buttons[i].classList.add('locked'); buttons[i].onclick = null; buttons[i].textContent = '—'; });
});

document.getElementById('skipBtn').addEventListener('click', () => {
  if (usedSkip) return; usedSkip = true; document.getElementById('skipBtn').disabled = true;
  current++;
  if (current >= questions.length) { finishGame(true); return; }
  loadQuestion();
});

function finishGame(wonAll){
  document.querySelector('.layout').style.display = 'none';
  const end = document.getElementById('endscreen'); end.style.display = 'block';
  if (wonAll) {
    document.getElementById('endTitle').textContent = '🏆 You are an Innovator Millionaire!';
    document.getElementById('endMsg').textContent = `You answered every question correctly and won ${prizes[prizes.length-1]} points!`;
  } else {
    document.getElementById('endTitle').textContent = '💡 Game Over';
    document.getElementById('endMsg').textContent = `You banked ${bankedPrize} points before missing a question. Try again to reach the million!`;
  }
}

loadQuestion();
</script>
</body>
</html>
