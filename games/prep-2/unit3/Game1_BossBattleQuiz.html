<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facing Challenges — Boss Battle</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, #2a1030, var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  #boss{ text-align:center; margin-bottom:14px; }
  #bossEmoji{ font-size:4rem; transition:transform .2s; }
  #bossEmoji.hit{ transform:scale(.85) rotate(-8deg); }
  .barWrap{ width:100%; max-width:500px; margin:0 auto 8px; }
  .barLabel{ font-size:.8rem; color:var(--muted); margin-bottom:4px; display:flex; justify-content:space-between; }
  .bar{ height:16px; background:var(--card); border-radius:8px; overflow:hidden; border:1px solid #1E4568; }
  .barFill{ height:100%; transition:width .3s; }
  #bossHpFill{ background:linear-gradient(90deg, var(--red), #c25252); width:100%; }
  #playerHpFill{ background:linear-gradient(90deg, var(--green), #52a866); width:100%; }
  .hud{display:flex; gap:12px; margin:14px 0; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #qcard{ width:100%; max-width:640px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.1rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 3 · Facing Challenges</div>
  <h1>⚔️ Boss Battle: Overcoming Challenges</h1>
  <div id="boss"><div id="bossEmoji">🚦👹</div></div>
  <div class="barWrap">
    <div class="barLabel"><span>Boss HP</span><span id="bossHpText">100%</span></div>
    <div class="bar"><div class="barFill" id="bossHpFill"></div></div>
  </div>
  <div class="barWrap">
    <div class="barLabel"><span>Your HP</span><span id="playerHpText">100%</span></div>
    <div class="bar"><div class="barFill" id="playerHpFill"></div></div>
  </div>
  <div class="hud">
    <div class="pill">Round: <b id="roundNum">1</b> / 8</div>
  </div>

  <div id="qcard">
    <div id="qLabel">❓ Question</div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Attack Again →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 3, Lesson 1: Overcoming Challenges</footer>

<script>
const questions = [
  { q:"If a classmate has a study challenge, good advice would be to...", opts:["make a study plan and ask for help","ignore the problem","give up immediately","blame the teacher"], a:0, ex:"Making a plan and asking for help is constructive advice." },
  { q:"Soha wanted to overcome her _____ with grammar.", opts:["obstacle","poster","challenge only","improvement"], a:0, ex:"'Obstacle' means a difficulty blocking progress." },
  { q:"She watched videos and made grammar _____ for her room.", opts:["posters","obstacles","challenges","improvements"], a:0, ex:"She made 'posters' to help her study." },
  { q:"Each grammar rule felt like an _____, but she didn't stop.", opts:["obstacle","poster","improvement","challenge only"], a:0, ex:"Each rule felt like an 'obstacle' to overcome." },
  { q:"Slowly, she began to...", opts:["improve","worsen","forget","ignore"], a:0, ex:"With effort, she began to 'improve'." },
  { q:"How about _____ (make) a study plan?", opts:["make","making","made","makes"], a:1, ex:"'How about' + verb-ing: 'making'." },
  { q:"I suggest _____ (go) fishing tomorrow.", opts:["go","goes","going","went"], a:2, ex:"'I suggest' + verb-ing: 'going'." },
  { q:"Maybe we should _____ (clean) our garden.", opts:["clean","cleans","cleaning","cleaned"], a:0, ex:"'Should' + base verb: 'clean'." },
];

let idx = 0;
let bossHp = 100, playerHp = 100;
const dmgPerHit = 100 / questions.length;

function updateBars(){
  document.getElementById('bossHpFill').style.width = bossHp + '%';
  document.getElementById('bossHpText').textContent = Math.round(bossHp) + '%';
  document.getElementById('playerHpFill').style.width = playerHp + '%';
  document.getElementById('playerHpText').textContent = Math.round(playerHp) + '%';
}

function loadQ(){
  if (idx >= questions.length || bossHp <= 0 || playerHp <= 0) { finishGame(); return; }
  document.getElementById('roundNum').textContent = idx + 1;
  const q = questions[idx];
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      const bossEmoji = document.getElementById('bossEmoji');
      if (i === q.a) {
        b.classList.add('correct');
        bossHp = Math.max(0, bossHp - dmgPerHit);
        bossEmoji.classList.add('hit');
        setTimeout(()=>bossEmoji.classList.remove('hit'), 250);
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
        playerHp = Math.max(0, playerHp - dmgPerHit);
      }
      updateBars();
      document.getElementById('explain').textContent = 'Why: ' + q.ex;
      document.getElementById('explain').style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
      if (bossHp <= 0 || playerHp <= 0) document.getElementById('nextBtn').textContent = 'See Result →';
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => { idx++; loadQ(); });

function finishGame(){
  document.getElementById('qcard').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  if (bossHp <= 0) {
    document.getElementById('endTitle').textContent = '🏆 Boss Defeated!';
    document.getElementById('endMsg').textContent = 'You mastered facing challenges and defeated the Obstacle Monster!';
  } else if (playerHp <= 0) {
    document.getElementById('endTitle').textContent = '💥 You Were Defeated!';
    document.getElementById('endMsg').textContent = 'Review the grammar rules and challenge the boss again!';
  } else {
    document.getElementById('endTitle').textContent = '⚔️ Battle Over!';
    document.getElementById('endMsg').textContent = `Boss HP: ${Math.round(bossHp)}% — Your HP: ${Math.round(playerHp)}%`;
  }
}

updateBars();
loadQ();
</script>
</body>
</html>
