<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facing Challenges — Balloon Pop</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  body{ margin:0; min-height:100vh; background:linear-gradient(180deg, #0d2438, var(--navy) 70%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; overflow-x:hidden; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:10px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  .pill.time b{ color:var(--amber); }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; text-align:center; margin-bottom:6px; }
  #promptBox{ max-width:640px; text-align:center; background:var(--card); border:1px solid #1E4568; border-radius:14px; padding:14px 22px; margin-bottom:14px; font-size:1.05rem; font-weight:700; color:#fff; }
  #sky{ position:relative; width:100%; max-width:700px; height:420px; background:radial-gradient(circle at 50% 0%, #123049, #081420); border-radius:18px; border:1px solid #1E4568; overflow:hidden; }
  .balloon{ position:absolute; width:80px; height:96px; border-radius:50% 50% 50% 50% / 55% 55% 45% 45%; cursor:pointer; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:800; font-size:.85rem; color:var(--navy); padding:6px; box-shadow:inset 0 -10px 20px rgba(0,0,0,.15), 0 6px 14px rgba(0,0,0,.3); transition:transform .1s; }
  .balloon:hover{ transform:scale(1.06); }
  .balloon::after{ content:''; position:absolute; bottom:-14px; left:50%; width:2px; height:14px; background:rgba(255,255,255,.4); transform:translateX(-50%); }
  .balloon.pop{ animation:pop .25s ease forwards; }
  @keyframes pop{ to{ transform:scale(1.6); opacity:0; } }
  button{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:20px; box-shadow:0 8px 20px rgba(53,208,201,.3); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  .toast{ position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--green); color:var(--navy); padding:10px 22px; border-radius:999px; font-weight:800; opacity:0; transition:opacity .3s; z-index:200;}
  .toast.show{ opacity:1; }
  .toast.bad{ background:var(--red); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 3 · Facing Challenges</div>
  <h1>🎈 Balloon Pop: Facing Traffic Challenges</h1>
  <div id="qLabel">❓ Question</div>
  <div class="hud">
    <div class="pill">Score: <b id="score">0</b></div>
    <div class="pill">Round: <b id="roundNum">1</b> / 8</div>
  </div>
  <div id="promptBox">Loading round…</div>
  <div id="sky"></div>
  <button id="startBtn">Start Game</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
  <div class="toast" id="toast"></div>
  <footer>Original prompts · Unit 3, Lesson 3: Facing Traffic Challenges</footer>

<script>
const rounds = [
  { prompt:"The government is trying to find _____ to most of our problems.", correct:"solutions", wrong:["mistakes","complaints","excuses"] },
  { prompt:"There are big traffic jams _____ the streets and highways of Cairo.", correct:"on", wrong:["at","in","to"] },
  { prompt:"Most students feel _____ before exams.", correct:"stressed", wrong:["relaxed","excited only","bored"] },
  { prompt:"One of the greatest projects in Cairo is building a lot of _____ to solve the traffic problem.", correct:"bridges", wrong:["obstacles","mistakes","complaints"] },
  { prompt:"The _____ is a train that runs on a single rail, usually above the ground.", correct:"monorail", wrong:["bicycle","car","bus"] },
  { prompt:"People drive their cars and roads get _____.", correct:"blocked", wrong:["clean","empty","new"] },
  { prompt:"This causes pollution, making the air _____.", correct:"dirty", wrong:["clean","fresh","cold"] },
  { prompt:"It also makes people feel stressed and _____ from waiting.", correct:"tired", wrong:["relaxed","excited","calm"] },
];

let roundIdx = 0, score = 0, roundActive = false;
const sky = document.getElementById('sky');
const balloonColors = ["#35D0C9","#8CE99A","#FFC168","#B79CFF","#7FD8E8"];

function showToast(msg, bad){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  setTimeout(()=>{ t.className = 'toast'; }, 1100);
}

function loadRound(){
  if (roundIdx >= rounds.length) { finishGame(true); return; }
  document.getElementById('roundNum').textContent = roundIdx + 1;
  const r = rounds[roundIdx];
  document.getElementById('promptBox').textContent = r.prompt;
  sky.innerHTML = '';

  const options = [r.correct, ...r.wrong].sort(()=>Math.random()-0.5);
  const skyRect = { w: sky.clientWidth || 700, h: sky.clientHeight || 420 };
  const positions = [];
  options.forEach((opt, i) => {
    let x, y, tries = 0;
    do {
      x = 20 + Math.random() * (skyRect.w - 100);
      y = 20 + Math.random() * (skyRect.h - 200);
      tries++;
    } while (positions.some(p => Math.abs(p.x-x) < 90 && Math.abs(p.y-y) < 110) && tries < 30);
    positions.push({x,y});

    const b = document.createElement('div');
    b.className = 'balloon';
    b.textContent = opt;
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    b.style.background = balloonColors[i % balloonColors.length];
    b.style.animation = `float${i % 3} ${3 + Math.random()*2}s ease-in-out infinite`;
    b.addEventListener('click', () => onBalloonClick(b, opt, r.correct));
    sky.appendChild(b);
  });

  roundActive = true;
}

function onBalloonClick(el, opt, correctAnswer){
  if (!roundActive) return;
  if (opt === correctAnswer) {
    el.classList.add('pop');
    roundActive = false;
    score += 10;
    document.getElementById('score').textContent = score;
    showToast('Correct! +10 🎉');
    setTimeout(nextRound, 900);
  } else {
    el.style.filter = 'grayscale(1)';
    el.style.pointerEvents = 'none';
    showToast('Not that one — try again!', true);
  }
}

function nextRound(){ roundIdx++; loadRound(); }

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').style.display = 'none';
  loadRound();
});

function finishGame(){
  document.getElementById('sky').style.display = 'none';
  document.getElementById('promptBox').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Great Popping!';
  if (score >= 70) title = '🏆 Balloon Master!';
  else if (score >= 40) title = '👍 Nice Work!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${rounds.length} rounds.`;
}

const styleSheet = document.createElement('style');
styleSheet.textContent = `
  @keyframes float0 { 0%,100%{ transform:translateY(0px); } 50%{ transform:translateY(-14px); } }
  @keyframes float1 { 0%,100%{ transform:translateY(0px) translateX(0px); } 50%{ transform:translateY(-10px) translateX(6px); } }
  @keyframes float2 { 0%,100%{ transform:translateY(0px) translateX(0px); } 50%{ transform:translateY(-16px) translateX(-6px); } }
`;
document.head.appendChild(styleSheet);
</script>
</body>
</html>
