<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facing Challenges — Treasure Map</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 20% 90%, #2a2010, var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #mapRow{ display:flex; gap:6px; margin-bottom:20px; max-width:680px; flex-wrap:wrap; justify-content:center; }
  .waypoint{ width:40px; height:40px; border-radius:50%; background:var(--card); border:2px solid #1E4568; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
  .waypoint.done{ background:var(--amber); border-color:var(--amber); color:var(--navy); }
  .waypoint.current{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(53,208,201,.3); }
  #storyCard{ width:100%; max-width:640px; background:var(--card); border:1px solid #1E4568; border-radius:16px; padding:24px; }
  #storyText{ font-style:italic; color:var(--muted); margin-bottom:14px; font-size:.95rem; line-height:1.5; }
  #qLabel{ color:var(--amber); font-weight:800; font-size:.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.1rem; font-weight:700; margin-bottom:16px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none; }
  button.next{ margin-top:14px; background:linear-gradient(135deg, var(--cyan), var(--green)); color:var(--navy); border:none; border-radius:10px; padding:12px 24px; font-weight:700; cursor:pointer; display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 3 · Facing Challenges</div>
  <h1>🗺️ Treasure Map: Advice for Facing Challenges</h1>
  <div class="hud">
    <div class="pill">Waypoint: <b id="wpNum">1</b> / 6</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>
  <div id="mapRow"></div>

  <div id="storyCard">
    <div id="storyText"></div>
    <div id="qLabel">❓ Question</div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Continue the Journey →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original story &amp; questions · Unit 3, Lesson 2: Advice for Facing Challenges</footer>

<script>
const waypoints = [
  { story:"Waypoint 1: Mona was walking to school one morning...", q:"'Mona ___ to school when she saw an accident.' (walk)", opts:["walked","was walking","walks","is walking"], a:1, ex:"Past continuous for the ongoing action: 'was walking'." },
  { story:"Waypoint 2: She stopped to help, and thought about what to do next.", q:"Which suggestion is grammatically correct?", opts:["How about calling for help?","How about call for help?","How about to call for help?","How about called for help?"], a:0, ex:"'How about' + -ing form: 'calling'." },
  { story:"Waypoint 3: While waiting for help, Mona noticed something.", q:"'While she ___ for help, a police car arrived.' (wait)", opts:["waits","waited","was waiting","is waiting"], a:2, ex:"'While' + past continuous." },
  { story:"Waypoint 4: The situation was resolved, and Mona continued her walk to school.", q:"'She ___ late for her first class.' (arrive — completed action)", opts:["was arriving","arrives","arrived","is arriving"], a:2, ex:"Completed past action = past simple: 'arrived'." },
  { story:"Waypoint 5: Her teacher asked her about the delay.", q:"Which suggestion fits: giving advice for next time?", opts:["I suggest to leave earlier next time.","I suggest leaving earlier next time.","I suggest leave earlier next time.","I suggest left earlier next time."], a:1, ex:"'I suggest' + -ing form: 'leaving'." },
  { story:"Waypoint 6: The final challenge — Mona reflects on her day.", q:"'As she ___ home, she thought about helping others.' (walk)", opts:["walks","walked","was walking","is walking"], a:2, ex:"'As' + past continuous for the ongoing action." },
];

let idx = 0, score = 0;

function renderMap(){
  const row = document.getElementById('mapRow');
  row.innerHTML = '';
  waypoints.forEach((_, i) => {
    const w = document.createElement('div');
    w.className = 'waypoint';
    if (i < idx) w.classList.add('done');
    if (i === idx) w.classList.add('current');
    w.textContent = i < idx ? '🏆' : '📍';
    row.appendChild(w);
  });
}

function loadWaypoint(){
  if (idx >= waypoints.length) { finishGame(); return; }
  document.getElementById('wpNum').textContent = idx + 1;
  renderMap();
  const w = waypoints[idx];
  document.getElementById('storyText').textContent = w.story;
  document.getElementById('qtext').textContent = w.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  document.getElementById('explain').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  w.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === w.a) {
        b.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[w.a].classList.add('correct');
      }
      document.getElementById('explain').textContent = 'Why: ' + w.ex;
      document.getElementById('explain').style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').textContent = idx === waypoints.length-1 ? 'Find the Treasure! →' : 'Continue the Journey →';
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => { idx++; loadWaypoint(); });

function finishGame(){
  document.getElementById('storyCard').style.display = 'none';
  renderMap();
  document.querySelectorAll('.waypoint').forEach(w => w.classList.add('done'));
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Treasure Found!';
  if (score >= 50) title = '🏆 Master Explorer!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${waypoints.length} waypoints.`;
}

loadWaypoint();
</script>
</body>
</html>
