<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facing Challenges — Card Flip</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 20% 0%, var(--navy2), var(--navy) 65%); font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.6rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:1.5px; font-size:.78rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:7px 16px; font-size:.85rem;}
  .pill b{color:var(--green);}
  #cardArea{ width:280px; height:360px; perspective:1000px; margin-bottom:20px; cursor:pointer; }
  #cardInner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  #cardInner.flipped{ transform:rotateY(180deg); }
  .face{ position:absolute; width:100%; height:100%; border-radius:16px; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
  .face-front{ background:linear-gradient(160deg,#1a3a5c,#12233a); border:3px solid var(--cyan); }
  .face-back{ background:linear-gradient(160deg,#16324f,#0e2035); border:3px solid var(--green); transform:rotateY(180deg); }
  .cardNum{ color:var(--amber); font-weight:800; font-size:.8rem; letter-spacing:1px; margin-bottom:14px; }
  .cardQ{ color:#fff; font-size:1.15rem; font-weight:700; }
  .cardHint{ color:var(--muted); font-size:.85rem; margin-top:16px; }
  #answerArea{ width:100%; max-width:400px; margin-bottom:10px; }
  .opt{ display:block; width:100%; text-align:left; background:var(--card); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:12px 16px; margin-bottom:9px; font-size:1rem; cursor:pointer; transition:.15s; }
  .opt:hover{ border-color:var(--cyan); }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  button{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:10px; box-shadow:0 8px 20px rgba(53,208,201,.3); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  footer{ margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 3 · Facing Challenges</div>
  <h1>🃏 Card Flip: The Little Inventor Ch3</h1>
  <div class="hud">
    <div class="pill">Card: <b id="cardNumHud">1</b> / 8</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>

  <div id="cardArea">
    <div id="cardInner">
      <div class="face face-front">
        <div class="cardNum" id="cardNumFront"></div>
        <div class="cardQ">Tap to flip and reveal the question</div>
        <div class="cardHint">🎴</div>
      </div>
      <div class="face face-back">
        <div class="cardLabel" style="color:var(--amber); font-weight:800; font-size:.7rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;">❓ Question</div>
        <div class="cardQ" id="cardQBack"></div>
      </div>
    </div>
  </div>

  <div id="answerArea"></div>
  <button id="nextBtn" style="display:none;">Next Card →</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
  <footer>Original questions · Unit 3, Lesson 4: Reading — The Little Inventor Ch3</footer>

<script>
const questions = [
  { q:"Text: On the day of the fair, all the children displayed their inventions proudly. When Amal presented her robot, it spoke its first words, and everyone admired her hard work and creativity. — What happened on the day of the fair?", opts:["children displayed their inventions","everyone went home early","the fair was cancelled","no one came"], a:0 },
  { q:"What did Amal's robot do?", opts:["it broke down","it spoke its first words","it caught fire","nothing happened"], a:1 },
  { q:"How did people react to Amal's robot?", opts:["they ignored her","they were angry","they admired her hard work and creativity","they laughed at her"], a:2 },
  { q:"What did Amal's teacher praise?", opts:["her mistakes","her laziness","her honesty and determination","her silence"], a:2 },
  { q:"What does 'stayed true to herself' mean?", opts:["she copied someone else","she remained authentic and honest about who she is","she changed her personality completely","she gave up on her identity"], a:1 },
  { q:"The word 'admired' means...", opts:["disliked","feared","respected and liked","ignored"], a:2 },
  { q:"This text is mainly about...", opts:["a math test","Amal's success at the fair after hard work","a random school day","a sports competition"], a:1 },
  { q:"What quality made Amal's project successful?", opts:["luck alone","cheating","determination and honesty","ignoring advice"], a:2 },
];

let idx = 0, score = 0, flipped = false;

function loadCard(){
  if (idx >= questions.length) { finishGame(); return; }
  document.getElementById('cardNumHud').textContent = idx + 1;
  document.getElementById('cardNumFront').textContent = 'Card ' + (idx+1);
  const q = questions[idx];
  document.getElementById('cardQBack').textContent = q.q;
  document.getElementById('cardInner').classList.remove('flipped');
  flipped = false;
  document.getElementById('answerArea').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
}

document.getElementById('cardArea').addEventListener('click', () => {
  if (flipped) return;
  flipped = true;
  document.getElementById('cardInner').classList.add('flipped');
  setTimeout(showOptions, 300);
});

function showOptions(){
  const q = questions[idx];
  const answerArea = document.getElementById('answerArea');
  answerArea.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.style.display = 'block';
    b.textContent = opt;
    b.onclick = () => {
      answerArea.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === q.a) {
        b.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
      } else {
        b.classList.add('wrong');
        answerArea.querySelectorAll('.opt')[q.a].classList.add('correct');
      }
      document.getElementById('nextBtn').style.display = 'inline-block';
    };
    answerArea.appendChild(b);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => { idx++; loadCard(); });

function finishGame(){
  document.getElementById('cardArea').style.display = 'none';
  document.getElementById('answerArea').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 All Cards Complete!';
  if (score >= 70) title = '🏆 Card Master!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${questions.length} cards.`;
}

loadCard();
</script>
</body>
</html>
