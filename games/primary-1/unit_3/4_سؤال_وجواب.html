<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سؤال وجواب</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #3498db; font-family: 'Cairo', 'Fredoka One', sans-serif; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; height: 100vh;}
        .game-container { width: 95vw; height: 85vh; background: #2980b9; border-radius: 20px; border: 5px solid #fff; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .ui-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 1.5rem; color: #fff; pointer-events: none; z-index: 30;}
        .screen { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; color: white;}
        button.start { font-family: 'Cairo', sans-serif; font-size: 2.5rem; padding: 15px 50px; background: #e74c3c; border: none; border-radius: 50px; color: white; cursor: pointer; box-shadow: 0 8px 0 #c0392b;}
        button.start:active { transform: translateY(8px); box-shadow: 0 0 0; }
        .hidden-screen { display: none !important; }
        
        .speaker { font-size: 5rem; cursor: pointer; transition: transform 0.2s; }
        .speaker:active { transform: scale(0.9); }
        .options { display: flex; gap: 20px; margin-top: 40px; }
        .option { width: 150px; height: 150px; background: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 5px solid transparent; }
        .option img { width: 80%; height: 80%; object-fit: contain; }
        .option:hover { border-color: #f1c40f; }
        
    </style>
<!-- MOBILE-FIT-2027 -->
<style id="mobile-fit-2027">
html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, .target-btn, a, [onclick] { touch-action: manipulation; }
@media (max-width: 900px), (max-height: 520px) {
  html { font-size: clamp(11px, 3.4vmin, 16px) !important; }
}
</style>
<!-- /MOBILE-FIT-2027-head -->
<style>.timer, #timer, [id*="timer"], [class*="timer"], .time-display, #time-display { display: none !important; opacity: 0 !important; pointer-events: none !important; visibility: hidden !important; }</style>
<!-- MOBILE-FIT-2027 -->
<style id="mobile-fit-2027-surgical">
html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, .target-btn, a, [onclick], .gg-target, .gg-btn { touch-action: manipulation; }
@media (max-width: 900px), (max-height: 520px) {
  html { font-size: clamp(10px, 3vmin, 16px) !important; }
}
</style>
</head>

const synth = window.speechSynthesis;
function speak(text) {
    const utterThis = new SpeechSynthesisUtterance(text);
    utterThis.pitch = 1.3; utterThis.rate = 0.9;
    synth.speak(utterThis);
}

        let score = 0;
        let level = 1;
        
        let currentWord = null;
        function spawnLevel() {
            let selected = [...wordsData].sort(()=>0.5-Math.random()).slice(0,3);
            currentWord = selected[Math.floor(Math.random()*3)];
            const opts = document.getElementById('options'); opts.innerHTML = '';
            selected.forEach(w => {
                let d = document.createElement('div'); d.className='option';
                let i = document.createElement('img'); i.src=w.img; d.appendChild(i);
                d.onclick = () => {
                    if(w.word === currentWord.word) { speak("Excellent!"); score+=10; document.getElementById('score').textContent=score; setTimeout(spawnLevel, 1000); }
                    else { speak("No, try again!"); d.style.borderColor = 'red'; setTimeout(()=>d.style.borderColor='transparent', 500); }
                };
                opts.appendChild(d);
            });
            playQuestion();
        }
        function playQuestion() { speak("Where is " + currentWord.word + "?"); }
        function startGame() { document.getElementById('start-screen').classList.add('hidden-screen'); score=0; spawnLevel(); }
