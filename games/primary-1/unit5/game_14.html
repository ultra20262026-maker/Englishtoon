<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Match - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka One', cursive; margin: 0; overflow: hidden; background: #f0fdf4; }
        .choice-card { 
            background: white; border: 4px solid #22c55e; border-radius: 25px; 
            padding: 15px; text-align: center; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .choice-card:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="gameArea" class="w-full h-full relative p-4 flex flex-col items-center justify-center">
        <!-- HUD -->
        <div class="absolute top-4 left-4 z-50 flex gap-4">
            <div class="bg-white/90 p-2 rounded-xl shadow-md border-2 border-green-400">
                Score: <span id="score">0</span> | ⭐ <span id="stars">0</span>
            </div>
        </div>

        <!-- Question Section -->
        <div class="bg-white p-6 rounded-[40px] shadow-2xl border-8 border-green-500 text-center mb-8 max-w-sm w-full">
            <p class="text-green-600 mb-2">Listen and find:</p>
            <h2 id="targetWord" class="text-4xl text-blue-900 mb-4">...</h2>
            <button onclick="Engine.speak(Engine.currentWord)" class="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-full text-xl shadow-lg active:scale-95 transition-all">🔊 Listen Again</button>
        </div>

        <!-- Choices Grid -->
        <div id="choicesGrid" class="grid grid-cols-2 gap-4 w-full max-w-md">
            <!-- Injected by JS -->
        </div>

        <!-- Start Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-green-600/90 z-[100] flex items-center justify-center p-6 text-white">
            <div class="bg-white p-8 rounded-[40px] text-center shadow-2xl border-8 border-green-400 text-green-600">
                <h1 class="text-5xl mb-4">Shadow Match</h1>
                <p class="text-xl text-gray-600 mb-8">Ready to play?</p>
                <button onclick="startGame()" class="bg-green-500 hover:bg-green-600 text-white px-12 py-4 rounded-full text-3xl shadow-xl active:scale-95 transition-all">PLAY</button>
            </div>
        </div>
    </div>

    <script>
// EnglishToon Game Engine 2027
const Engine = {
    score: 0, stars: 0, currentWord: null, gameActive: false,
    studentName: localStorage.getItem('et_student_name') || 'Guest Student',
    init() { console.log("Engine Init"); this.updateUI(); },
    speak(text) { if (!text) return; const msg = new SpeechSynthesisUtterance(text); msg.lang = 'en-US'; window.speechSynthesis.speak(msg); },
    updateUI() {
        const s = document.getElementById('score'), st = document.getElementById('stars');
        if (s) s.innerText = this.score; if (st) st.innerText = this.stars;
    },
    addScore(p) { this.score += p; if (this.score % 50 === 0) this.stars++; this.updateUI(); },
    getAssetPath(w) { return `../../../assets/p1/${w.toLowerCase().replace(/ /g, '_')}.png`; },
    showFeedback(c) {
        const f = document.createElement('div');
        f.className = 'fixed inset-0 flex items-center justify-center z-[100] pointer-events-none';
        f.innerHTML = c ? `<div class="bg-green-500 text-white p-10 rounded-full text-4xl animate-bounce">Excellent! 🌟</div>` :
                          `<div class="bg-red-500 text-white p-10 rounded-full text-4xl animate-shake">Try Again! ❌</div>`;
        document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
    }
};
window.Engine = Engine;
Engine.init();
</script>
    <script>
        const wordsData = [{"word": "chicken"}, {"word": "cow"}, {"word": "duck"}, {"word": "fan"}, {"word": "fish"}, {"word": "fork"}, {"word": "fox"}, {"word": "frog"}, {"word": "girl"}, {"word": "gloves"}, {"word": "goat"}, {"word": "grapes"}, {"word": "guitar"}, {"word": "horse"}, {"word": "mango"}, {"word": "milk"}, {"word": "monkey"}, {"word": "moon"}, {"word": "mouse"}, {"word": "octopus"}, {"word": "olive"}, {"word": "ostrich"}];
        
        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            Engine.gameActive = true;
            nextQuestion();
        }

        function nextQuestion() {
            Engine.currentWord = wordsData[Math.floor(Math.random() * wordsData.length)].word;
            document.getElementById('targetWord').innerText = Engine.currentWord;
            renderChoices();
        }

        function renderChoices() {
            const grid = document.getElementById('choicesGrid');
            grid.innerHTML = '';

            let choices = [Engine.currentWord];
            while(choices.length < 4) {
                let w = wordsData[Math.floor(Math.random() * wordsData.length)].word;
                if(!choices.includes(w)) choices.push(w);
            }
            choices = choices.sort(() => Math.random() - 0.5);

            choices.forEach(word => {
                const card = document.createElement('div');
                card.className = 'choice-card flex flex-col items-center';
                
                const img = document.createElement('img');
                img.src = Engine.getAssetPath(word);
                img.className = 'w-24 h-24 object-contain mb-2';
                img.onerror = () => img.src = 'https://cdn-icons-png.flaticon.com/512/3081/3081840.png';
                
                const label = document.createElement('span');
                label.innerText = word;
                label.className = 'text-lg font-bold text-green-800';

                card.appendChild(img);
                card.appendChild(label);
                card.onclick = () => checkAnswer(word, card);
                grid.appendChild(card);
            });
        }

        function checkAnswer(selected, element) {
            if(!Engine.gameActive) return;
            if(selected === Engine.currentWord) {
                Engine.addScore(10);
                Engine.showFeedback(true);
                element.classList.add('bg-green-100', 'scale-105');
                setTimeout(nextQuestion, 1000);
            } else {
                Engine.showFeedback(false);
                element.classList.add('bg-red-100', 'animate-shake');
                setTimeout(() => element.classList.remove('bg-red-100', 'animate-shake'), 500);
            }
        }
    </script>
</body>
</html>
