<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; background: #f0f9ff; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        </style>

    <title>Fire Fighter</title>
</head>
<body class="bg-sky-50">
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Extinguish the wrong fire:</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    


    <canvas id="gameCanvas"></canvas>
    <script src="../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["chicken", "cow", "duck", "fan", "fish", "fork", "fox", "frog", "girl", "gloves", "goat", "grapes", "guitar", "horse", "mango", "milk", "monkey", "moon", "mouse", "octopus", "olive", "ostrich"]');
        let width, height, currentWord;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        
    let fires = [];
    function initGame() { nextQuestion(); loop(); }
    function nextQuestion() {
        currentWord = vocab[Math.floor(Math.random()*vocab.length)];
        document.getElementById('targetWord').innerText = currentWord;
    }
    function loop() {
        ctx.clearRect(0,0,width,height);
        if(Math.random() < 0.02) {
            let w = Math.random() < 0.4 ? currentWord : vocab[Math.floor(Math.random()*vocab.length)];
            fires.push({word: w, x: Math.random()*width, y: height-100, s: 0, life: 100, img: new Image()});
            fires[fires.length-1].img.src = Engine.getAssetPath(w);
        }
        fires.forEach((f, i) => {
            ctx.fillStyle='orange'; ctx.beginPath(); ctx.arc(f.x, f.y, 40, 0, Math.PI*2); ctx.fill();
            if(f.img.complete) ctx.drawImage(f.img, f.x-30, f.y-30, 60, 60);
        });
        requestAnimationFrame(loop);
    }
    canvas.addEventListener('mousedown', e => {
        fires.forEach((f, i) => {
            if(Math.hypot(e.clientX-f.x, e.clientY-f.y) < 40) {
                fires.splice(i, 1);
                if(f.word === currentWord) { Engine.addScore(10); Engine.showFeedback(true); nextQuestion(); }
                else Engine.showFeedback(false);
            }
        });
    });
    

        window.onload = () => {
            if (window.Engine) {
                Engine.init();
                if (typeof initGame === 'function') initGame();
            }
        };
    </script>
</body>
</html>
