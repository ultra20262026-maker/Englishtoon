<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نينجا التقطيع - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js?v=5"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #020617; font-family: 'Cairo', sans-serif; }
        canvas { display: block; touch-action: none; }
        .game-ui { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); width: 95%; max-width: 900px; display: flex; gap: 20px; justify-content: center; z-index: 50; }
        .choice-btn { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 3px solid rgba(255,255,255,0.1); color: white; padding: 25px; border-radius: 32px; font-weight: 900; font-size: 1.8rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); flex: 1; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .choice-btn:hover { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; transform: translateY(-8px) scale(1.02); }
        .choice-btn:active { transform: scale(0.9); }
        .listen-btn { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #3b82f6, #6366f1); color: white; padding: 15px 50px; border-radius: 100px; font-weight: 900; font-size: 1.5rem; box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4); z-index: 60; cursor: pointer; border: 3px solid rgba(255,255,255,0.3); transition: all 0.3s; }
        .listen-btn:hover { transform: translateX(-50%) translateY(-3px); box-shadow: 0 20px 45px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body>
    <button class="listen-btn" onclick="Engine.speak(currentWord)">🔊 Listen / استمع</button>
    <canvas id="gameCanvas"></canvas>
    <div class="game-ui" id="choices"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let currentWord = "";
        let words = {"unit 1": ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"], "unit 2": ["ant", "apple", "arm", "arrow", "axe", "bird", "butterfly", "flower", "grass", "sky", "snake", "spider", "spoon", "star", "sun", "tree"], "unit 3": ["brother", "dog", "doll", "door", "drum", "duck", "father", "five", "flowers", "four", "grandfather", "grandmother", "hair", "hands", "hat", "horse", "house", "mother", "nail", "neck", "net", "nose", "nurse", "one", "panda", "parents", "parrot", "pencil", "pizza", "potato", "sister", "three", "two"], "unit 4": ["arm", "cake", "car", "carrot", "cat", "cup", "ear", "egg", "eggplant", "elbow", "elephant", "enter", "eye", "feet", "foot", "hand", "head", "hear", "key", "king", "kitchen", "kite", "leg", "mouth", "nose", "rabbit", "red", "ring", "robot", "rocket", "see", "smell", "taste", "toes", "tongue", "touch"], "unit 5": ["chicken", "cow", "duck", "fan", "fish", "fork", "fox", "frog", "girl", "gloves", "goat", "grapes", "guitar", "horse", "mango", "milk", "monkey", "moon", "mouse", "octopus", "olive", "ostrich"], "unit 6": ["ball", "banana", "bike", "bird", "boy", "cage", "cat", "chair", "couch", "dog", "elephant", "giraffe", "in", "jacket", "jam", "jar", "jeans", "jellyfish", "lamp", "leaf", "lemon", "lion", "lunch", "monkey", "on", "snake", "table", "tiger", "turtle", "umbrella", "under", "unlock", "up"]};
        let unitWords = words["unit 5"] || [];
        let frame = 0;
        let sprite = null;
        let gameObjects = [];
        let score = 0;

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            Engine.init();
            nextQuestion();
            animate();
        }

        function nextQuestion() {
            if (unitWords.length === 0) return;
            currentWord = unitWords[Math.floor(Math.random() * unitWords.length)];
            
            // Load Pixar sprite
            Engine.loadSprite(currentWord, (img) => { sprite = img; });
            
            const others = unitWords.filter(w => w !== currentWord).sort(() => 0.5 - Math.random()).slice(0, 2);
            const choices = [currentWord, ...others].sort(() => 0.5 - Math.random());
            
            const ui = document.getElementById('choices');
            ui.innerHTML = '';
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(choice);
                ui.appendChild(btn);
            });
            
            // Reset objects for mechanic
            gameObjects = [];
            setupMechanic();
        }

        function setupMechanic() {
            gameObjects = [];
        }

        function checkAnswer(choice) {
            if (choice === currentWord) {
                Engine.addScore(100);
                Engine.showWinScreen(() => nextQuestion());
            } else {
                Engine.addScore(-50);
                Engine.showFeedback(false);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Professional Parallax Background
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#1e293b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid Effect
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.05)';
            ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

            // Sprite Rendering with Bounce
            if (sprite) {
                const bounce = Math.sin(frame/15) * 10;
                const size = 250;
                ctx.save();
                ctx.shadowBlur = 30; ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.drawImage(sprite, canvas.width/2 - size/2, 250 + bounce, size, size);
                ctx.restore();
            }

            // Mechanic-specific rendering logic
            ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.font='30px Cairo'; ctx.textAlign='center'; ctx.fillText('Professional Arcade Mode Active', canvas.width/2, canvas.height/2);

            frame++;
            requestAnimationFrame(animate);
        }

        window.onload = initGame;
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    </script>
</body>
</html>
