<body>
    <div class="game-container" id="game-container">
        <div class="ui-top">
            <div>النقاط: <span id="score">0</span></div>
            <div>مزرعة العد 🚜</div>
        </div>
        
        <div class="question-box" id="question-box" onclick="if(targetNum) speak(`how many cows? there are ${targetNum} cows`)">how many cows?</div>
        
        <div class="farm-grid" id="farm-grid"></div>
        
    </div>
    <div id="start-screen" class="screen">
        <h1 style="font-size: 4rem; color: #f1c40f;">مزرعة العد 🚜</h1>
        <p style="font-size: 1.5rem;">اختر المزرعة التي تحتوي على العدد الصحيح من الأبقار!</p>
        <button class="start" onclick="startGame()">العب!</button>
    </div>
    <script>
        
const synth = window.speechSynthesis;
function speak(text) {
    const utterThis = new SpeechSynthesisUtterance(text);
    utterThis.pitch = 1.3; utterThis.rate = 0.9;
    synth.speak(utterThis);
}

        let score = 0;
        let targetNum = 3;
        let canClick = true;

        function spawnLevel() {
            canClick = true;
            targetNum = Math.floor(Math.random() * 5) + 1; // 1 to 5
            
            document.getElementById('question-box').innerHTML = `How many cows?<br>There are ${targetNum} cows.`;
            speak(`how many cows? there are ${targetNum} cows`);
            
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';
            
            let nums = [targetNum];
            while(nums.length < 3) {
                let r = Math.floor(Math.random() * 5) + 1;
                if(!nums.includes(r)) nums.push(r);
            }
            nums.sort(()=>0.5-Math.random());
            
            nums.forEach(n => {
                const pen = document.createElement('div');
                pen.className = 'farm-pen';
                pen.innerHTML = '🐄'.repeat(n);
                
                pen.onclick = () => {
                    if(!canClick) return;
                    if(n === targetNum) {
                        speak('Great!'); score+=10; document.getElementById('score').textContent=score;
                        pen.style.background = '#f1c40f'; pen.style.borderColor = 'white';
                        canClick = false; setTimeout(spawnLevel, 1500);
                    } else {
                        speak('No, that is ' + n); pen.style.background = '#e74c3c'; setTimeout(()=>pen.style.background='rgba(255,255,255,0.9)', 500);
                    }
                };
                grid.appendChild(pen);
            });
        }

        function startGame() { 
            document.getElementById('start-screen').classList.add('hidden-screen'); 
            score=0; document.getElementById('score').textContent=score;
            spawnLevel(); 
        }
    </script>

<script id="mobile-fit-2027-js">
(function(){
  try {
    function fireResize(){ try { window.dispatchEvent(new Event('resize')); } catch(e){} }
    window.addEventListener('orientationchange', function(){ setTimeout(fireResize,150); setTimeout(fireResize,450); setTimeout(fireResize,900); });
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', fireResize); }
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e){
      var now = Date.now();
      if (now - lastTouchEnd <= 300) { e.preventDefault(); }
      lastTouchEnd = now;
    }, {passive:false});
  } catch(err) {}
})();
</script>

    if (!firebase.apps.length) firebase.initializeApp(fbConfig);
    const db = firebase.firestore();
    const deviceId = localStorage.getItem('device_id') || ('et-' + Math.random().toString(36).slice(2, 9));
    localStorage.setItem('device_id', deviceId);

    async function saveScoreToFirebase(finalScore) {
        const studentName = localStorage.getItem('et_student_name') || localStorage.getItem('currentUser') || 'بطل التوون';
        const urlParams = new URLSearchParams(window.location.search);
        const gradeId = urlParams.get('id') || window.location.pathname.split('/').slice(-3, -2)[0] || 'primary-1';
        const unit = urlParams.get('unit') || window.location.pathname.split('/').slice(-2, -1)[0].replace('unit', '') || '1';
        const lesson = urlParams.get('lesson') || '1';
        const gameKey = `${gradeId}_U${unit}_L${lesson}`;
        
        const badges = JSON.parse(localStorage.getItem('et_badges') || '{}');
        const currentTotal = parseInt(localStorage.getItem('englishtoon_total_score') || '0');
        const newTotal = currentTotal + (finalScore > 0 ? 50 : 0);
        localStorage.setItem('englishtoon_total_score', newTotal);

        try {
            await db.collection('leaderboard').doc(`${deviceId}_total`).set({
                name: studentName,
                score: newTotal,
                grade: gradeId,
                deviceId: deviceId,
                badges: badges,
                lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            await db.collection('game_scores').doc(`${deviceId}_${gameKey}`).set({
                name: studentName,
                score: finalScore,
                grade: gradeId,
                unit: unit,
                lesson: lesson,
                gameId: gameKey,
                deviceId: deviceId,
                badges: badges,
                lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch (e) { console.error("Firebase save failed", e); }
    }
</script>
