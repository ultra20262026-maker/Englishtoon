<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whack-a-Word - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #ecfdf5; overflow: hidden; touch-action: none; }
        .hole { background: #065f46; border-radius: 50%; box-shadow: inset 0 10px 0 rgba(0,0,0,0.3); position: relative; overflow: hidden; }
        .mole { position: absolute; bottom: -100%; left: 0; right: 0; transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .mole.up { bottom: 10%; }
        .mole img { width: 80%; border-radius: 15px; border: 3px solid white; background: white; }
        .mole span { background: white; color: #065f46; padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 0.8rem; margin-top: 5px; }
        .game-ui { pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>
    <div class="game-ui fixed inset-0 z-10 flex flex-col p-4">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-emerald-200 flex items-center gap-4">
                <div class="text-emerald-600">
                    <span class="text-xs font-bold block uppercase tracking-wider">Score</span>
                    <span id="score" class="text-2xl font-black">0</span>
                </div>
                <div class="w-px h-8 bg-emerald-100"></div>
                <div class="text-amber-500">
                    <span class="text-xs font-bold block uppercase tracking-wider">Stars</span>
                    <span id="stars" class="text-2xl font-black">0</span>
                </div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-emerald-400 w-full max-w-md text-center">
                <h2 class="text-emerald-500 font-bold text-lg mb-1 uppercase tracking-widest">Whack the:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="interactive bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg shadow-emerald-200 transition-all active:scale-95 flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i>
                    Listen
                </button>
            </div>
        </div>
    </div>

    <div class="h-screen flex items-center justify-center pt-40 pb-10 px-4">
        <div id="grid" class="grid grid-cols-3 gap-4 w-full max-w-lg">
            <!-- 9 Holes -->
            <div class="hole aspect-square"><div class="mole" data-index="0"><img><span></span></div></div>
            <div class="hole aspect-square"><div class="mole" data-index="1"><img><span></span></div></div>
            <div class="hole aspect-square"><div class="mole" data-index="2"><img><span></span></div></div>
            <div class="hole aspect-square"><div class="mole" data-index="3"><img><span></span></div></div>
            <div class="hole aspect-square"><div class="mole" data-index="4"><img><span></span></div></div>
            <div class="hole aspect-square"><div class="mole" data-index="5"><img><span></span></div></div>
            <div class="hole aspect-square"><div class="mole" data-index="6"><img><span></span></div></div>
            <div class="hole aspect-square"><div class="mole" data-index="7"><img><span></span></div></div>
            <div class="hole aspect-square"><div class="mole" data-index="8"><img><span></span></div></div>
        </div>
    </div>

    <script src="../../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["chicken", "cow", "duck", "fan", "fish", "fork", "fox", "frog", "girl", "gloves", "goat", "grapes", "guitar", "horse", "mango", "milk", "monkey", "moon", "mouse", "octopus", "olive", "ostrich"]');
        const moles = document.querySelectorAll('.mole');
        let currentWord = "";
        let gameTimer;
        
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
            startRound();
        }

        function startRound() {
            clearInterval(gameTimer);
            moles.forEach(m => m.classList.remove('up'));
            
            gameTimer = setInterval(() => {
                const randomMole = moles[Math.floor(Math.random() * moles.length)];
                if(!randomMole.classList.contains('up')) {
                    // Decide if correct or wrong
                    const isCorrect = Math.random() > 0.7;
                    let word;
                    if(isCorrect) {
                        word = currentWord;
                    } else {
                        do {
                            word = vocab[Math.floor(Math.random() * vocab.length)];
                        } while(word === currentWord);
                    }
                    
                    const img = randomMole.querySelector('img');
                    const span = randomMole.querySelector('span');
                    img.src = Engine.getAssetPath(word);
                    img.onerror = () => { img.src = 'https://cdn-icons-png.flaticon.com/512/3081/3081840.png'; };
                    span.innerText = word;
                    randomMole.dataset.word = word;
                    
                    randomMole.classList.add('up');
                    setTimeout(() => randomMole.classList.remove('up'), 1500 + Math.random() * 1000);
                }
            }, 800);
        }

        moles.forEach(mole => {
            mole.addEventListener('click', () => {
                if(!mole.classList.contains('up')) return;
                
                const clickedWord = mole.dataset.word;
                if(clickedWord === currentWord) {
                    Engine.addScore(20);
                    Engine.showFeedback(true);
                    mole.classList.remove('up');
                    clearInterval(gameTimer);
                    setTimeout(nextQuestion, 1000);
                } else {
                    Engine.showFeedback(false);
                    mole.classList.remove('up');
                }
            });
        });

        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        
        nextQuestion();
    </script>
</body>
</html>
