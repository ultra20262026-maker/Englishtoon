
<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; }
        canvas { display: block; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .btn-action { background: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-action:active { transform: scale(0.95); }
    </style>

    <title>Memory Match</title>
    <style>
        .card { perspective: 1000px; height: 100px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 3px solid white; }
        .card-front { background: #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; }
        .card-back { background: white; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-amber-50">
    
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Find the matching pairs:</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>

    <div class="h-screen flex items-center justify-center pt-40 p-4">
        <div id="grid" class="grid grid-cols-3 gap-3 w-full max-w-md"></div>
    </div>
    <script src="../../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["chicken", "cow", "duck", "fan", "fish", "fork", "fox", "frog", "girl", "gloves", "goat", "grapes", "guitar", "horse", "mango", "milk", "monkey", "moon", "mouse", "octopus", "olive", "ostrich"]');
        let flipped = [], matched = 0;

        function init() {
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            const words = [...vocab].sort(() => 0.5-Math.random()).slice(0, 6);
            const cards = [...words, ...words].sort(() => 0.5-Math.random());
            cards.forEach(w => {
                const el = document.createElement('div'); el.className = 'card interactive';
                el.innerHTML = `<div class="card-inner"><div class="card-front">?</div><div class="card-back"><img src="${Engine.getAssetPath(w)}" class="w-12 h-12 object-contain"></div></div>`;
                el.onclick = () => {
                    if(flipped.length < 2 && !el.classList.contains('flipped')) {
                        el.classList.add('flipped'); flipped.push({el, w});
                        if(flipped.length === 2) setTimeout(check, 800);
                    }
                };
                grid.appendChild(el);
            });
        }
        function check() {
            if(flipped[0].w === flipped[1].w) { Engine.addScore(20); matched++; if(matched === 6) { Engine.showFeedback(true); setTimeout(init, 2000); } }
            else { flipped[0].el.classList.remove('flipped'); flipped[1].el.classList.remove('flipped'); }
            flipped = [];
        }
        document.getElementById('listenBtn').style.display = 'none';
        init();
    </script>
</body>
</html>
