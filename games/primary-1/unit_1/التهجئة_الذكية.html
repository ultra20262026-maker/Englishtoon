<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>التهجئة الذكية (Smart Spelling)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #2c3e50; color: white; font-family: 'Cairo', 'Fredoka One', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; touch-action: none;}
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 1.5rem; pointer-events: none; z-index: 10;}
        
        .game-area { 
            width: 95vw; 
            height: 75vh; 
            background: linear-gradient(#8e44ad, #9b59b6); 
            border: 5px solid #bdc3c7; 
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5); 
            position: relative; 
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
        }

        #image-container {
            width: 250px;
            height: 250px;
            background: white;
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        #word-slots {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            direction: ltr; /* English words */
        }

        .slot {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px dashed white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-family: 'Fredoka One', sans-serif;
            color: #f1c40f;
            text-shadow: 2px 2px #000;
        }

        #letters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            direction: ltr;
            max-width: 90%;
        }

        .letter-btn {
            width: 60px;
            height: 60px;
            background: #f1c40f;
            border: none;
            border-bottom: 5px solid #f39c12;
            border-radius: 10px;
            font-size: 2.5rem;
            font-family: 'Fredoka One', sans-serif;
            color: #2c3e50;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .letter-btn:active {
            transform: translateY(5px);
            border-bottom-width: 0;
        }

        .letter-btn:disabled {
            background: #bdc3c7;
            border-color: #95a5a6;
            color: #7f8c8d;
            cursor: not-allowed;
            transform: translateY(5px);
            border-bottom-width: 0;
        }

        .screen { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box;}
        button.main-btn { font-family: 'Cairo', sans-serif; font-size: 2.5rem; padding: 15px 50px; background: #e74c3c; border: none; border-radius: 50px; color: white; cursor: pointer; box-shadow: 0 8px 0 #c0392b; margin-top: 20px;}
        button.main-btn:active { transform: translateY(8px); box-shadow: 0 0 0; }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            #image-container { width: 150px; height: 150px; }
            .slot, .letter-btn { width: 45px; height: 45px; font-size: 1.8rem; }
            button.main-btn { font-size: 1.8rem; padding: 10px 30px; }
        }
    </style>
<!-- MOBILE-FIT-2027 -->
<style id="mobile-fit-2027">
html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, .target-btn, a, [onclick] { touch-action: manipulation; }
@media (max-width: 900px), (max-height: 520px) {
  html { font-size: clamp(11px, 3.4vmin, 16px) !important; }
}
</style>
<!-- /MOBILE-FIT-2027-head -->
<style>.timer, #timer, [id*="timer"], [class*="timer"], .time-display, #time-display { display: none !important; opacity: 0 !important; pointer-events: none !important; visibility: hidden !important; }</style>
<!-- MOBILE-FIT-2027 -->
<style id="mobile-fit-2027-surgical">
html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, .target-btn, a, [onclick], .gg-target, .gg-btn { touch-action: manipulation; }
@media (max-width: 900px), (max-height: 520px) {
  html { font-size: clamp(10px, 3vmin, 16px) !important; }
}
</style>
</head>

                btn.className = 'letter-btn';

            if (currentSpelling.length < targetWord.length) {
                currentSpelling += letter;
                btnEl.disabled = true;
                updateSlots();
                
                if (currentSpelling.length === targetWord.length) {
                    checkWin();

        function updateSlots() {
            const slots = document.querySelectorAll('.slot');

                if (index < currentSpelling.length) {

                    slot.style.borderStyle = 'solid';
                } else {
                    slot.textContent = '';
                    slot.style.borderStyle = 'dashed';
                }
            });
        }

            if (currentSpelling === targetWord) {
                // Win!
                speak('Great job!');

                celeb.style.opacity = '1';
                celeb.style.transform = 'scale(1.5)';
                
                clearTimeout(autoAdvanceTimer); autoAdvanceTimer = setTimeout(() => {

                    currentWordIndex++;
                    if (currentWordIndex < vocabulary.length) {
                        loadLevel();
                    } else {
                        document.getElementById('end-screen').classList.remove('hidden');
                    }
                }, 1500);

            } else {

                slotsContainer.style.animation = 'shake 0.5s';
                setTimeout(() => slotsContainer.style.animation = '', 500);
