
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Firefighter Rescue - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #fef2f2; overflow: hidden; }
        .fire { font-size: 3rem; animation: flicker 0.5s infinite alternate; }
        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }
        .choice { cursor: pointer; }
    </style>
</head>
<body>
    <div class="fixed inset-0 z-10 flex flex-col p-4 pointer-events-none">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-red-200 flex items-center gap-4 pointer-events-auto">
                <div class="text-red-600"><span class="text-xs font-bold block uppercase">Rescue</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-red-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="pointer-events-auto w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 text-center pointer-events-auto">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-red-400 w-full max-w-md mx-auto">
                <h2 class="text-red-500 font-bold text-lg mb-1 uppercase tracking-widest">Put out the fire on:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    <div class="h-screen flex items-center justify-center pt-40 px-4">
        <div id="choices" class="grid grid-cols-2 gap-8"></div>
    </div>
    <script src="../../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["brother", "dog", "doll", "door", "drum", "duck", "father", "five", "flowers", "four", "grandfather", "grandmother", "hair", "hands", "hat", "horse", "house", "mother", "nail", "neck", "net", "nose", "nurse", "one", "panda", "parents", "parrot", "pencil", "pizza", "potato", "sister", "three", "two"]');
        let currentWord;
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
            const container = document.getElementById('choices');
            container.innerHTML = '';
            const choices = [currentWord];
            while(choices.length < 4) {
                let w = vocab[Math.floor(Math.random()*vocab.length)];
                if(!choices.includes(w)) choices.push(w);
            }
            choices.sort(() => Math.random() - 0.5);
            choices.forEach(w => {
                const div = document.createElement('div');
                div.className = 'choice relative bg-white p-4 rounded-3xl shadow-xl border-4 border-red-50';
                div.innerHTML = `<div class="fire absolute -top-8 left-1/2 -translate-x-1/2">🔥</div><img src="${Engine.getAssetPath(w)}" class="w-24 h-24 object-contain mb-2"><div class="text-center font-bold text-slate-700">${w}</div>`;
                div.onclick = () => {
                    if(w === currentWord) { Engine.addScore(30); Engine.showFeedback(true); div.querySelector('.fire').innerText = '💦'; setTimeout(nextQuestion, 1000); }
                    else { Engine.showFeedback(false); div.style.transform = 'shake 0.5s'; }
                };
                container.appendChild(div);
            });
        }
        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        nextQuestion();
    </script>
</body>
</html>
