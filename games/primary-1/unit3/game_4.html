
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Tree Explorer - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka One', cursive; margin: 0; overflow: hidden; background: #f8fafc; height: 100vh; }
        .animate-shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>
    <div id="gameArea" class="w-full h-full relative">
        <!-- HUD -->
        <div class="absolute top-4 left-4 z-50 flex gap-4 pointer-events-none">
            <div class="bg-white/90 p-3 rounded-2xl shadow-xl border-2 border-blue-400 flex items-center gap-3">
                <div class="text-blue-600 font-bold">Score: <span id="score">0</span></div>
                <div class="text-yellow-500 font-bold">⭐ <span id="stars">0</span></div>
            </div>
        </div>
        
        <div class="absolute top-4 right-4 z-50">
            <button onclick="window.history.back()" class="w-12 h-12 rounded-full bg-white/90 shadow-lg flex items-center justify-center text-slate-600 border-2 border-slate-200 active:scale-90 transition-all">✕</button>
        </div>

        
        <style>
            .card { width: 80px; height: 100px; background: #3b82f6; border-radius: 10px; cursor: pointer; position: relative; transform-style: preserve-3d; transition: 0.5s; }
            .card.flipped { transform: rotateY(180deg); }
            .card-front, .card-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
            .card-back { background: #1e40af; color: white; font-size: 2rem; }
            .card-front { background: white; transform: rotateY(180deg); border: 2px solid #3b82f6; }
        </style>
        <div class="flex flex-col items-center justify-center h-full p-4">
            <div class="bg-white p-4 rounded-2xl shadow-md mb-6 text-center border-2 border-blue-500">
                <p>Find the match for:</p>
                <h2 id="targetWord" class="text-2xl font-bold">...</h2>
            </div>
            <div id="cardGrid" class="grid grid-cols-3 gap-4"></div>
        </div>
        <script>
            function renderGame() {
                const grid = document.getElementById('cardGrid');
                grid.innerHTML = '';
                let words = [Engine.currentWord];
                while(words.length < 3) {
                    let w = wordsData[Math.floor(Math.random() * wordsData.length)].word;
                    if(!words.includes(w)) words.push(w);
                }
                words.forEach(word => {
                    const c = document.createElement('div');
                    c.className = 'card';
                    c.innerHTML = `<div class="card-back">?</div><div class="card-front"><img src="${Engine.getAssetPath(word)}" class="w-16 h-16 object-contain"></div>`;
                    c.onclick = () => {
                        c.classList.add('flipped');
                        if(word === Engine.currentWord) { Engine.addScore(25); Engine.showFeedback(true); setTimeout(nextQuestion, 1000); }
                        else { setTimeout(() => c.classList.remove('flipped'), 1000); }
                    };
                    grid.appendChild(c);
                });
            }
        </script>
    

        <!-- Start Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-blue-600/95 z-[100] flex items-center justify-center p-6 text-white">
            <div class="bg-white p-8 rounded-[40px] text-center shadow-2xl border-8 border-blue-400 text-blue-600 max-w-sm w-full">
                <h1 class="text-4xl font-black mb-2">Family Tree Explorer</h1>
                <p class="text-gray-500 mb-8">Ready for adventure?</p>
                <button onclick="startGame()" class="bg-blue-500 hover:bg-blue-600 text-white w-full py-4 rounded-3xl text-2xl font-black shadow-xl active:scale-95 transition-all">START PLAYING</button>
            </div>
        </div>
    </div>

    <script>
    const Engine = {
        score: 0, stars: 0, currentWord: null, gameActive: false,
        init() { this.updateUI(); },
        speak(text) { if(!text) return; const msg = new SpeechSynthesisUtterance(text); msg.lang = 'en-US'; window.speechSynthesis.speak(msg); },
        updateUI() { 
            document.getElementById('score').innerText = this.score; 
            document.getElementById('stars').innerText = this.stars; 
        },
        addScore(p) { this.score += p; if(this.score % 50 === 0) this.stars++; this.updateUI(); },
        getAssetPath(w) { return `../../../assets/p1/${w.toLowerCase().replace(/ /g, '_')}.png`; },
        showFeedback(c) {
            const f = document.createElement('div');
            f.className = 'fixed inset-0 flex items-center justify-center z-[200] pointer-events-none';
            f.innerHTML = c ? `<div class="bg-green-500 text-white px-8 py-4 rounded-full text-2xl font-black animate-bounce shadow-2xl">GREAT! 🌟</div>` :
                              `<div class="bg-red-500 text-white px-8 py-4 rounded-full text-2xl font-black animate-shake shadow-2xl">TRY AGAIN! ❌</div>`;
            document.body.appendChild(f); setTimeout(() => f.remove(), 800);
        }
    };
    
    const wordsData = [{"word": "brother"}, {"word": "dog"}, {"word": "doll"}, {"word": "door"}, {"word": "drum"}, {"word": "duck"}, {"word": "father"}, {"word": "five"}, {"word": "flowers"}, {"word": "four"}, {"word": "grandfather"}, {"word": "grandmother"}, {"word": "hair"}, {"word": "hands"}, {"word": "hat"}, {"word": "horse"}, {"word": "house"}, {"word": "mother"}, {"word": "nail"}, {"word": "neck"}, {"word": "net"}, {"word": "nose"}, {"word": "nurse"}, {"word": "one"}, {"word": "panda"}, {"word": "parents"}, {"word": "parrot"}, {"word": "pencil"}, {"word": "pizza"}, {"word": "potato"}, {"word": "sister"}, {"word": "three"}, {"word": "two"}];

    function startGame() {
        document.getElementById('startOverlay').classList.add('hidden');
        Engine.gameActive = true;
        nextQuestion();
    }

    function nextQuestion() {
        Engine.currentWord = wordsData[Math.floor(Math.random() * wordsData.length)].word;
        document.getElementById('targetWord').innerText = Engine.currentWord;
        renderGame();
    }
    
    Engine.init();
    </script>
</body>
</html>
