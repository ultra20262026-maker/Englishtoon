<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; }
        canvas { display: block; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .btn-action { background: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-action:active { transform: scale(0.95); }
    </style>

    <title>Memory Match</title>
</head>
<body class="bg-sky-100">
    
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Find matching pairs:</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["brother", "dog", "doll", "door", "drum", "duck", "father", "five", "flowers", "four", "grandfather", "grandmother", "hair", "hands", "hat", "horse", "house", "mother", "nail", "neck", "net", "nose", "nurse", "one", "panda", "parents", "parrot", "pencil", "pizza", "potato", "sister", "three", "two"]');
        let width, height, currentWord;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        
        let cards = [], flipped = [];
        function nextQuestion() {
            const words = [...vocab].sort(()=>0.5-Math.random()).slice(0, 4);
            const deck = [...words, ...words].sort(()=>0.5-Math.random());
            cards = deck.map((w, i) => ({ word: w, x: (i%3)*110+width/2-160, y: Math.floor(i/3)*110+350, flipped: false, img: new Image() }));
            cards.forEach(c => c.img.src = Engine.getAssetPath(c.word));
        }
        function loop() {
            ctx.clearRect(0,0,width,height);
            cards.forEach(c => {
                ctx.fillStyle = c.flipped ? 'white' : '#3b82f6';
                ctx.fillRect(c.x, c.y, 100, 100);
                if(c.flipped) ctx.drawImage(c.img, c.x+10, c.y+10, 80, 80);
            });
            requestAnimationFrame(loop);
        }
        canvas.addEventListener('mousedown', (e) => {
            cards.forEach(c => {
                if(e.clientX > c.x && e.clientX < c.x+100 && e.clientY > c.y && e.clientY < c.y+100) {
                    if(!c.flipped && flipped.length < 2) {
                        c.flipped = true; flipped.push(c);
                        if(flipped.length === 2) {
                            if(flipped[0].word === flipped[1].word) { Engine.addScore(20); flipped = []; }
                            else setTimeout(() => { flipped[0].flipped = flipped[1].flipped = false; flipped = []; }, 1000);
                        }
                    }
                }
            });
            if(cards.every(c => c.flipped)) { Engine.showFeedback(true); setTimeout(nextQuestion, 2000); }
        });
        nextQuestion(); loop();
    
    </script>
</body>
</html>
