
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penalty Kick - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #15803d; overflow: hidden; touch-action: none; }
        #gameCanvas { width: 100%; height: 100vh; display: block; background: linear-gradient(to bottom, #166534, #15803d); }
        .game-ui { pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>
    <div class="game-ui fixed inset-0 z-10 flex flex-col p-4">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-green-200 flex items-center gap-4 pointer-events-auto">
                <div class="text-green-600"><span class="text-xs font-bold block uppercase">Goals</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-green-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-green-400 w-full max-w-md text-center pointer-events-auto">
                <h2 class="text-green-500 font-bold text-lg mb-1 uppercase tracking-widest">Kick the:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="../../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["brother", "dog", "doll", "door", "drum", "duck", "father", "five", "flowers", "four", "grandfather", "grandmother", "hair", "hands", "hat", "horse", "house", "mother", "nail", "neck", "net", "nose", "nurse", "one", "panda", "parents", "parrot", "pencil", "pizza", "potato", "sister", "three", "two"]');
        let width, height, currentWord, ball, targets = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ball = { x: width/2, y: height - 100, r: 30, vx: 0, vy: 0, active: false };
        }
        window.addEventListener('resize', resize);
        resize();

        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
            targets = [];
            const count = 3;
            for(let i=0; i<count; i++) {
                let word = (i === 0) ? currentWord : vocab[Math.floor(Math.random()*vocab.length)];
                targets.push({
                    word, isCorrect: word === currentWord,
                    x: (width/(count+1)) * (i+1), y: 150, r: 50,
                    img: new Image()
                });
                targets[i].img.src = Engine.getAssetPath(word);
            }
            targets.sort(() => Math.random() - 0.5);
            ball.active = false; ball.x = width/2; ball.y = height - 100;
        }

        function gameLoop() {
            ctx.clearRect(0,0,width,height);
            // Draw goal post
            ctx.strokeStyle = 'white'; ctx.lineWidth = 10;
            ctx.strokeRect(50, 100, width-100, 150);
            
            targets.forEach(t => {
                ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
                ctx.fillStyle = 'white'; ctx.fill();
                ctx.drawImage(t.img, t.x-t.r+10, t.y-t.r+10, t.r*2-20, t.r*2-20);
                ctx.fillStyle = 'black'; ctx.font = 'bold 14px Fredoka'; ctx.textAlign='center';
                ctx.fillText(t.word, t.x, t.y + t.r + 20);
            });

            if(ball.active) {
                ball.x += ball.vx; ball.y += ball.vy;
                targets.forEach(t => {
                    if(Math.hypot(ball.x-t.x, ball.y-t.y) < ball.r + t.r) {
                        ball.active = false;
                        if(t.isCorrect) { Engine.addScore(20); Engine.showFeedback(true); setTimeout(nextQuestion, 1000); }
                        else { Engine.showFeedback(false); setTimeout(() => { ball.x=width/2; ball.y=height-100; }, 1000); }
                    }
                });
                if(ball.y < 0) { ball.active = false; ball.x=width/2; ball.y=height-100; }
            }

            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
            ctx.fillStyle = 'white'; ctx.fill(); ctx.strokeStyle='black'; ctx.stroke();
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('mousedown', (e) => {
            if(!ball.active) {
                const angle = Math.atan2(e.clientY - ball.y, e.clientX - ball.x);
                ball.vx = Math.cos(angle) * 15; ball.vy = Math.sin(angle) * 15;
                ball.active = true;
            }
        });
        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        nextQuestion(); gameLoop();
    </script>
</body>
</html>
