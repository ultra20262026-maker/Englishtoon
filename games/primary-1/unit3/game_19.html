
<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; }
        canvas { display: block; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .btn-action { background: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-action:active { transform: scale(0.95); }
    </style>

    <title>Whack-a-Word</title>
    <style>
        .hole { background: #78350f; border-radius: 50%; height: 100px; position: relative; overflow: hidden; border: 8px solid #92400e; }
        .mole { position: absolute; top: 100%; left: 0; right: 0; bottom: 0; transition: top 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .mole.up { top: 0; }
        .mole img { width: 60px; height: 60px; object-fit: contain; }
    </style>
</head>
<body class="bg-orange-50">
    
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Whack the correct word!</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>

    <div class="h-screen flex items-center justify-center pt-40 p-4">
        <div class="grid grid-cols-3 gap-6 w-full max-w-md">
            <div class="hole"><div class="mole interactive" onclick="whack(this)"><img><span class="text-xs font-bold text-white"></span></div></div><div class="hole"><div class="mole interactive" onclick="whack(this)"><img><span class="text-xs font-bold text-white"></span></div></div><div class="hole"><div class="mole interactive" onclick="whack(this)"><img><span class="text-xs font-bold text-white"></span></div></div><div class="hole"><div class="mole interactive" onclick="whack(this)"><img><span class="text-xs font-bold text-white"></span></div></div><div class="hole"><div class="mole interactive" onclick="whack(this)"><img><span class="text-xs font-bold text-white"></span></div></div><div class="hole"><div class="mole interactive" onclick="whack(this)"><img><span class="text-xs font-bold text-white"></span></div></div>
        </div>
    </div>
    <script src="../../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["brother", "dog", "doll", "door", "drum", "duck", "father", "five", "flowers", "four", "grandfather", "grandmother", "hair", "hands", "hat", "horse", "house", "mother", "nail", "neck", "net", "nose", "nurse", "one", "panda", "parents", "parrot", "pencil", "pizza", "potato", "sister", "three", "two"]');
        let currentWord = "";

        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
        }

        function pop() {
            const moles = document.querySelectorAll('.mole');
            const mole = moles[Math.floor(Math.random()*moles.length)];
            const isCorrect = Math.random() < 0.3;
            const word = isCorrect ? currentWord : vocab[Math.floor(Math.random()*vocab.length)];
            
            mole.querySelector('img').src = Engine.getAssetPath(word);
            mole.querySelector('span').innerText = word;
            mole.dataset.word = word;
            mole.classList.add('up');
            
            setTimeout(() => mole.classList.remove('up'), 1000 + Math.random()*1000);
            setTimeout(pop, 800 + Math.random()*1000);
        }

        function whack(el) {
            if(!el.classList.contains('up')) return;
            el.classList.remove('up');
            if(el.dataset.word === currentWord) {
                Engine.addScore(10); Engine.showFeedback(true); nextQuestion();
            } else {
                Engine.showFeedback(false);
            }
        }

        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        nextQuestion(); pop();
    </script>
</body>
</html>
