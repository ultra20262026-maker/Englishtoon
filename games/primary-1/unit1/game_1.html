<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صائد الأسماك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #0ea5e9; touch-action: none; margin: 0; padding: 0; }
        canvas { display: block; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #7dd3fc, #0ea5e9); }
        #top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 45px;
            background: rgba(15, 23, 42, 0.9); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 10px; z-index: 1000; border-bottom: 2px solid #fbbf24;
        }
        #target-word { color: #fbbf24; font-weight: 900; font-size: 1.2rem; margin: 0 10px; text-transform: uppercase; }
        #win-screen {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; text-align: center;
        }
        .win-box { background: white; padding: 20px; border-radius: 20px; border: 4px solid #fbbf24; width: 85%; max-width: 350px; }
        .btn { background: #fbbf24; color: white; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
        .score-tag { background: #0f172a; color: white; padding: 2px 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="top-bar">
        <div style="display: flex; align-items: center;">
            <span style="color: #94a3b8; font-size: 0.7rem; font-weight: bold;">اصطاد:</span>
            <span id="target-word">---</span>
            <button onclick="handleListen()" style="background: #fbbf24; color: white; width: 30px; height: 30px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
        <div class="score-tag">🐟 <span id="score-count">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="win-screen">
        <div class="win-box">
            <div style="font-size: 3rem; margin-bottom: 10px;">🐠</div>
            <h2 style="color: #0f172a; font-size: 1.5rem; font-weight: 900;">صيد رائع!</h2>
            <button class="btn" onclick="nextLevel()">متابعة</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const rawVocab = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        const vocab = rawVocab.map(v => ({ word: v, image: v.toLowerCase().replace(/ /g, '_') + '.png' }));
        let score = 0; let currentTarget = null; let isPaused = false; const assets = {};
        
        function initGame() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            vocab.forEach(item => { const img = new Image(); img.src = `../../../assets/p1/${item.image}`; assets[item.word] = img; });
            setupLevel(); requestAnimationFrame(animate);
        }
        function handleListen() { if (!currentTarget) return; const u = new SpeechSynthesisUtterance(currentTarget.word); u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }
        function nextLevel() { document.getElementById('win-screen').style.display = 'none'; setupLevel(); }
        
        
        let fishList = []; let hook = { x: 0, y: 50, targetX: 0, targetY: 50, state: 'idle', speed: 12, caughtFish: null };
        function setupLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.word;
            fishList = []; let choices = [currentTarget];
            let others = vocab.filter(v => v.word !== currentTarget.word);
            others.sort(() => Math.random() - 0.5); choices.push(others[0], others[1]);
            choices.sort(() => Math.random() - 0.5);
            choices.forEach((c, i) => { fishList.push({ x: (i + 1) * (canvas.width / 4), y: canvas.height - 150, word: c.word, isCorrect: c.word === currentTarget.word, w: 90, h: 60, color: `hsl(${Math.random() * 360}, 70%, 60%)`, caught: false }); });
            isPaused = false; hook.state = 'idle'; hook.y = 50; hook.caughtFish = null;
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (hook.state === 'dropping') { hook.y += hook.speed; if (hook.y >= hook.targetY) { hook.state = 'rising'; checkCatch(); } }
            else if (hook.state === 'rising') { hook.y -= hook.speed; if (hook.caughtFish) hook.caughtFish.y = hook.y + 30;
                if (hook.y <= 50) { hook.state = 'idle'; hook.y = 50;
                    if (hook.caughtFish) { if (hook.caughtFish.isCorrect) { score += 10; document.getElementById('score-count').innerText = score; isPaused = true; document.getElementById('win-screen').style.display = 'flex'; speechSynthesis.speak(new SpeechSynthesisUtterance("Great Job!")); }
                    else { hook.caughtFish.caught = false; hook.caughtFish = null; speechSynthesis.speak(new SpeechSynthesisUtterance("Try again")); } } } }
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hook.x, 0); ctx.lineTo(hook.x, hook.y); ctx.stroke();
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(hook.x, hook.y, 12, 0, Math.PI); ctx.stroke();
            fishList.forEach(f => { if (f.caught && hook.state !== 'rising') return;
                ctx.fillStyle = f.color; ctx.beginPath(); ctx.ellipse(f.x, f.y, f.w/2, f.h/2, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(f.x + f.w/2, f.y); ctx.lineTo(f.x + f.w/2 + 20, f.y - 20); ctx.lineTo(f.x + f.w/2 + 20, f.y + 20); ctx.fill();
                const img = assets[f.word]; if (img && img.complete) ctx.drawImage(img, f.x - 20, f.y - 25, 40, 40);
                ctx.fillStyle = 'white'; ctx.font = 'bold 14px Cairo'; ctx.textAlign = 'center'; ctx.fillText(f.word.toUpperCase(), f.x, f.y + 35);
            });
            requestAnimationFrame(animate);
        }
        function checkCatch() { fishList.forEach(f => { if (Math.hypot(hook.x - f.x, hook.y - f.y) < 60) { f.caught = true; hook.caughtFish = f; } }); }
        window.addEventListener('pointerdown', (e) => { if (e.target.closest('button') || e.target.closest('.win-box') || isPaused || hook.state !== 'idle') return;
            let sel = null; fishList.forEach(f => { if (Math.hypot(e.clientX - f.x, e.clientY - f.y) < 100) sel = f; });
            if (sel) { hook.x = sel.x; hook.targetY = sel.y; hook.state = 'dropping'; }
        });
        
        
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        initGame();
    </script>
</body>
</html>
