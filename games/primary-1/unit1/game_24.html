<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Master - Dictation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js?v=5.2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; touch-action: manipulation; }
        .tile { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .tile:active { transform: scale(0.9); }
        .slot { border: 2px dashed rgba(255,255,255,0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="w-full max-w-md space-y-8 mt-16">
        <!-- Manual Listen Button -->
        <div class="flex flex-col items-center gap-4">
            <button onclick="playTarget()" class="w-24 h-24 bg-blue-600 rounded-full shadow-[0_0_40px_rgba(37,99,235,0.4)] flex items-center justify-center hover:scale-105 active:scale-95 transition-all border-4 border-white/20">
                <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
            <p class="text-blue-400 font-bold tracking-widest uppercase text-sm">اضغط للاستماع والترتيب</p>
        </div>

        <!-- Answer Slots -->
        <div id="answer-container" class="flex flex-wrap justify-center gap-2 min-h-[60px]">
            <!-- Slots will be injected here -->
        </div>

        <!-- Scrambled Tiles -->
        <div id="tiles-container" class="flex flex-wrap justify-center gap-3 p-6 bg-white/5 backdrop-blur-xl rounded-[2rem] border border-white/10 shadow-2xl">
            <!-- Tiles will be injected here -->
        </div>

        <!-- Actions -->
        <div class="flex gap-4">
            <button onclick="resetWord()" class="flex-1 py-4 rounded-2xl bg-slate-800 text-white font-bold border border-white/10 active:bg-slate-700">إعادة محاولة</button>
            <button onclick="giveHint()" class="flex-1 py-4 rounded-2xl bg-indigo-600/20 text-indigo-400 font-bold border border-indigo-500/30 active:bg-indigo-600/30">تلميح ✨</button>
        </div>
    </div>

    <script>
        const vocab = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        let currentWord = "";
        let shuffledLetters = [];
        let userSelection = [];

        function initGame() {
            Engine.init();
            nextWord();
        }

        function nextWord() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)].toUpperCase();
            userSelection = [];
            renderUI();
        }

        function playTarget() {
            Engine.speak(currentWord);
        }

        function renderUI() {
            const answerContainer = document.getElementById('answer-container');
            const tilesContainer = document.getElementById('tiles-container');
            
            answerContainer.innerHTML = '';
            tilesContainer.innerHTML = '';

            // Render Slots
            currentWord.split('').forEach((char, i) => {
                const slot = document.createElement('div');
                slot.className = `w-12 h-14 sm:w-14 sm:h-16 rounded-xl flex items-center justify-center text-2xl font-black border-2 transition-all ${userSelection[i] ? 'bg-blue-600 border-blue-400 shadow-lg' : 'bg-slate-900/50 border-dashed border-white/20'}`;
                slot.innerText = userSelection[i] || (char === ' ' ? ' ' : '');
                if (char === ' ') slot.className = "w-6 h-14"; // Space handling
                answerContainer.appendChild(slot);
            });

            // Scramble remaining letters
            const usedIndices = [];
            const remaining = [];
            
            // Simple scramble: get all chars except spaces
            const chars = currentWord.replace(/ /g, '').split('');
            const currentSelectionClean = userSelection.filter(c => c !== ' ');
            
            // This is a simple version: show all letters initially
            if (userSelection.length === 0) {
                shuffledLetters = chars.sort(() => Math.random() - 0.5);
            }

            shuffledLetters.forEach((char, i) => {
                const tile = document.createElement('button');
                tile.className = "tile w-12 h-14 sm:w-14 sm:h-16 bg-white text-slate-900 rounded-xl flex items-center justify-center text-2xl font-black shadow-xl hover:bg-blue-50";
                tile.innerText = char;
                tile.onclick = () => selectLetter(char, i, tile);
                tilesContainer.appendChild(tile);
            });
        }

        function selectLetter(char, index, element) {
            // Find next empty non-space slot
            let nextSlot = -1;
            for(let i=0; i<currentWord.length; i++) {
                if (currentWord[i] !== ' ' && !userSelection[i]) {
                    nextSlot = i;
                    break;
                }
            }

            if (nextSlot !== -1) {
                userSelection[nextSlot] = char;
                element.style.opacity = "0.2";
                element.style.pointerEvents = "none";
                
                // Auto-fill spaces if needed
                checkSpaces();
                renderUI();
                checkWin();
            }
        }

        function checkSpaces() {
            for(let i=0; i<currentWord.length; i++) {
                if (currentWord[i] === ' ') userSelection[i] = ' ';
            }
        }

        function resetWord() {
            userSelection = [];
            renderUI();
        }

        function giveHint() {
            Engine.addScore(-50);
            for(let i=0; i<currentWord.length; i++) {
                if (!userSelection[i] && currentWord[i] !== ' ') {
                    userSelection[i] = currentWord[i];
                    break;
                }
            }
            renderUI();
            checkWin();
        }

        function checkWin() {
            const result = userSelection.join('');
            if (result === currentWord) {
                Engine.addScore(200);
                Engine.showFeedback(true);
                setTimeout(() => {
                    Engine.showWinScreen(() => nextWord());
                }, 500);
            }
        }

        initGame();
    </script>
</body>
</html>
