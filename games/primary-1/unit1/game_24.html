<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الإملاء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #f8fafc; touch-action: none; margin: 0; padding: 0; }
        canvas { display: block; width: 100vw; height: 100vh; background: #f1f5f9; }
        #top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 45px;
            background: rgba(15, 23, 42, 0.9); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 10px; z-index: 1000; border-bottom: 2px solid #0f172a;
        }
        #target-word { color: #0f172a; font-weight: 900; font-size: 1.2rem; margin: 0 10px; text-transform: uppercase; }
        #win-screen {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; text-align: center;
        }
        .win-box { background: white; padding: 20px; border-radius: 20px; border: 4px solid #0f172a; width: 85%; max-width: 350px; }
        .btn { background: #0f172a; color: white; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
        .score-tag { background: #0f172a; color: white; padding: 2px 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="top-bar">
        <div style="display: flex; align-items: center;">
            <span style="color: #94a3b8; font-size: 0.7rem; font-weight: bold;">رتب كلمة:</span>
            <span id="target-word">---</span>
            <button onclick="handleListen()" style="background: #0f172a; color: white; width: 30px; height: 30px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
        <div class="score-tag">✍️ <span id="score-count">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="win-screen">
        <div class="win-box">
            <div style="font-size: 3rem; margin-bottom: 10px;">🏆</div>
            <h2 style="color: #0f172a; font-size: 1.5rem; font-weight: 900;">عبقري إملاء!</h2>
            <button class="btn" onclick="nextLevel()">متابعة</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const rawVocab = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        const vocab = rawVocab.map(v => ({ word: v, image: v.toLowerCase().replace(/ /g, '_') + '.png' }));
        let score = 0; let currentTarget = null; let isPaused = false; const assets = {};
        
        function initGame() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            vocab.forEach(item => { const img = new Image(); img.src = `../../../assets/p1/${item.image}`; assets[item.word] = img; });
            setupLevel(); requestAnimationFrame(animate);
        }
        function handleListen() { if (!currentTarget) return; const u = new SpeechSynthesisUtterance(currentTarget.word); u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }
        function nextLevel() { document.getElementById('win-screen').style.display = 'none'; setupLevel(); }
        
        
        let letters = []; let currentInput = "";
        function setupLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.word;
            currentInput = ""; letters = [];
            let chars = currentTarget.word.replace(/ /g, "").split("");
            chars.sort(() => Math.random() - 0.5);
            chars.forEach((char, i) => { letters.push({ x: (i + 1) * (canvas.width / (chars.length + 1)), y: canvas.height/2, char: char, used: false }); });
            isPaused = false;
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f172a'; ctx.font = 'bold 40px Cairo'; ctx.textAlign = 'center'; ctx.fillText(currentInput.toUpperCase(), canvas.width/2, canvas.height/2 - 100);
            letters.forEach(l => { if (l.used) return;
                ctx.fillStyle = 'white'; ctx.fillRect(l.x - 30, l.y - 30, 60, 60); ctx.strokeStyle = '#0f172a'; ctx.strokeRect(l.x - 30, l.y - 30, 60, 60);
                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 30px Cairo'; ctx.textAlign = 'center'; ctx.fillText(l.char.toUpperCase(), l.x, l.y + 15);
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('pointerdown', (e) => { if (isPaused) return;
            letters.forEach(l => { if (!l.used && Math.abs(e.clientX - l.x) < 30 && Math.abs(e.clientY - l.y) < 30) {
                l.used = true; currentInput += l.char;
                if (currentInput.toLowerCase() === currentTarget.word.replace(/ /g, "").toLowerCase()) {
                    score += 20; isPaused = true; setTimeout(() => document.getElementById('win-screen').style.display = 'flex', 500);
                } else if (currentInput.length >= currentTarget.word.replace(/ /g, "").length) {
                    speechSynthesis.speak(new SpeechSynthesisUtterance("Try again")); setTimeout(setupLevel, 1000);
                }
            }});
        });
        
        
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        initGame();
    </script>
</body>
</html>
