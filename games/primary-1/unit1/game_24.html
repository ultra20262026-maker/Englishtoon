<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اللعبة 24 - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            user-select: none;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            height: 50px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .target-box {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        canvas {
            flex: 1;
            touch-action: none;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.9);
            z-index: 200;
            backdrop-filter: blur(5px);
        }
        .btn-continue {
            background: linear-gradient(to bottom, #22c55e, #16a34a);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
            transition: all 0.2s;
        }
        .btn-continue:active { transform: scale(0.95); }
        
        /* Juiciness Classes */
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
    </style>
</head>
<body>
    <div id="game-container">
        <div class="top-bar">
            <a href="../../../view-games-p1.html?unit=1" class="text-white text-xl"><i class="fas fa-times"></i></a>
            <div class="target-box" id="target-word">...</div>
            <div class="score font-black text-amber-400" id="score-val">0</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="overlay" id="feedback-overlay">
            <h2 class="text-4xl font-black mb-6 text-green-400" id="feedback-text">رائع!</h2>
            <button class="btn-continue" onclick="nextQuestion()">استمر</button>
        </div>
        
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const targetEl = document.getElementById('target-word');
        const scoreEl = document.getElementById('score-val');
        const overlay = document.getElementById('feedback-overlay');
        
        let score = 0;
        let currentTarget = "";
        let gameActive = true;
        let particles = [];

        const vocab = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 50;
        }
        window.addEventListener('resize', resize);
        resize();

        function spawnParticles(x, y, color) {
            for(let i=0; i<20; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    size: Math.random() * 5 + 2,
                    life: 1.0,
                    color
                });
            }
        }

        function updateParticles() {
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        function handleCorrect(x, y) {
            score += 10;
            scoreEl.innerText = score;
            spawnParticles(x, y, '#22c55e');
            gameActive = false;
            overlay.style.display = 'flex';
            speak(currentTarget);
        }

        function handleWrong(x, y) {
            spawnParticles(x, y, '#ef4444');
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);
        }

        
            let items = [];
            function initQuestion() {
                currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
                targetEl.innerText = currentTarget;
                items = [];
                let options = [currentTarget];
                while(options.length < 3) {
                    let r = vocab[Math.floor(Math.random() * vocab.length)];
                    if(!options.includes(r)) options.push(r);
                }
                options.sort(() => Math.random() - 0.5);
                options.forEach((word, idx) => {
                    items.push({
                        word,
                        x: canvas.width * (idx + 1) / 4,
                        y: canvas.height / 2,
                        color: `hsl(${(idx * 137) % 360}, 70%, 60%)`
                    });
                });
            }
            canvas.addEventListener('mousedown', (e) => {
                if(!gameActive) return;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                items.forEach(it => {
                    if(Math.abs(mx - it.x) < 50 && Math.abs(my - it.y) < 50) {
                        if(it.word === currentTarget) handleCorrect(it.x, it.y);
                        else handleWrong(it.x, it.y);
                    }
                });
            });
            function gameLoop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                items.forEach(it => {
                    ctx.fillStyle = it.color;
                    ctx.beginPath();
                    ctx.roundRect(it.x - 45, it.y - 45, 90, 90, 20);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Cairo';
                    ctx.textAlign = 'center';
                    ctx.fillText(it.word, it.x, it.y + 5);
                });
                updateParticles();
                drawParticles();
                requestAnimationFrame(gameLoop);
            }
            initQuestion();
            gameLoop();
        

        function nextQuestion() {
            overlay.style.display = 'none';
            gameActive = true;
            initQuestion();
        }
    </script>
</body>
</html>
