<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka One', cursive; margin: 0; overflow: hidden; background: #000814; color: white; }
        #gameArea { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle, #001d3d 0%, #000814 100%); }

        .laser { position: absolute; width: 4px; height: 20px; background: #00f5d4; border-radius: 2px; box-shadow: 0 0 10px #00f5d4; }
        .ui-panel { position: absolute; top: 20px; left: 20px; z-index: 20; background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .question-panel { position: absolute; top: 20px; right: 20px; z-index: 20; text-align: center; }
    </style>
</head>

                <button onclick="location.reload()" class="bg-yellow-400 text-black px-8 py-3 rounded-full text-2xl">TRY AGAIN</button>
