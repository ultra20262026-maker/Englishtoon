<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Match - مطابقة الذاكرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js?v=5.4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #1e1b4b; touch-action: none; }
        .card { perspective: 1000px; width: 80px; height: 100px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.2); }
        .card-front { background: #312e81; }
        .card-back { background: #4338ca; transform: rotateY(180deg); flex-direction: column; }
    </style>
</head>
<body>
    <div id="game-container" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="mb-8 text-center">
            <h2 id="target-word" class="text-white text-3xl font-black mb-2">APPLE</h2>
            <button onclick="Engine.speak(document.getElementById('target-word').innerText)" class="bg-indigo-600 p-2 rounded-full shadow-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
        <div id="grid" class="grid grid-cols-3 gap-4"></div>
    </div>

    <script>
        const vocab = [{"word": "Apple", "image": "../../../assets/p1/apple.png"}, {"word": "Ball", "image": "../../../assets/p1/ball.png"}, {"word": "Cat", "image": "../../../assets/p1/cat.png"}, {"word": "Dog", "image": "../../../assets/p1/dog.png"}, {"word": "Egg", "image": "../../../assets/p1/egg.png"}, {"word": "bag", "image": "../../../assets/p1/bag.png"}, {"word": "board", "image": "../../../assets/p1/board.png"}, {"word": "book", "image": "../../../assets/p1/book.png"}, {"word": "chair", "image": "../../../assets/p1/chair.png"}, {"word": "desk", "image": "../../../assets/p1/desk.png"}, {"word": "ill", "image": "../../../assets/p1/ill.png"}, {"word": "in", "image": "../../../assets/p1/in.png"}, {"word": "ink", "image": "../../../assets/p1/ink.png"}, {"word": "insect", "image": "../../../assets/p1/insect.png"}, {"word": "open your books", "image": "../../../assets/p1/open_your_books.png"}, {"word": "pencil", "image": "../../../assets/p1/pencil.png"}, {"word": "sit down", "image": "../../../assets/p1/sit_down.png"}, {"word": "stand up", "image": "../../../assets/p1/stand_up.png"}];
        let currentTarget = "";
        let cards = [];
        let flipped = [];

        function initGame() {
            Engine.init();
            nextLevel();
        }

        function nextLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.toUpperCase();
            
            const choices = Engine.getWords(vocab, 3);
            if (!choices.includes(currentTarget)) choices[0] = currentTarget;
            
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            choices.forEach(text => {
                const card = createCard(text);
                grid.appendChild(card);
            });
        }

        function createCard(text) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front text-white text-3xl">?</div>
                    <div class="card-back p-2">
                        <img id="img-${text}" class="w-12 h-12 mb-1" src="">
                        <span class="text-white text-xs font-bold">${text.toUpperCase()}</span>
                    </div>
                </div>
            `;
            
            Engine.loadSprite(text, (img) => {
                card.querySelector('img').src = img.src;
            });

            card.onclick = () => {
                if (!Engine.gameActive || card.classList.contains('flipped')) return;
                card.classList.add('flipped');
                
                if (text === currentTarget) {
                    Engine.addScore(100);
                    Engine.showFeedback(true);
                    setTimeout(() => Engine.showWinScreen(() => nextLevel()), 600);
                } else {
                    Engine.addScore(-20);
                    Engine.showFeedback(false);
                    setTimeout(() => card.classList.remove('flipped'), 1000);
                }
            };
            return card;
        }

        initGame();
    </script>
</body>
</html>
