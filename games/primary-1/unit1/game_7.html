<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toon Bowling - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka One', cursive; touch-action: manipulation; overflow: hidden; background: #f0f9ff; }
        .lane { position: relative; width: 100vw; height: 100vh; background: #d1d5db; border-left: 20px solid #9ca3af; border-right: 20px solid #9ca3af; }
        .pin { position: absolute; top: 100px; width: 60px; transition: transform 0.5s; }
        .ball { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 80px; z-index: 10; cursor: pointer; }
        .score-board { position: absolute; top: 20px; left: 20px; z-index: 20; }
        .question-box { position: absolute; top: 20px; right: 20px; z-index: 20; }
    </style>
</head>
<body>
    <div class="lane" id="gameArea">
        <div class="score-board bg-white/90 p-4 rounded-3xl shadow-xl border-4 border-blue-400">
            <div class="text-2xl text-blue-600">Score: <span id="score">0</span></div>
        </div>

        <div class="question-box text-center">
            <img id="vocabImg" src="" class="w-32 h-32 rounded-2xl border-4 border-white shadow-lg mb-2 mx-auto">
            <div class="bg-blue-500 text-white px-6 py-2 rounded-full text-xl" id="wordText">Loading...</div>
        </div>

        <!-- Pins will be here -->
        <div id="pinsContainer"></div>

        <!-- The Bowling Ball -->
        <img src="../../assets/bowling_ball.png" class="ball" id="bowlingBall" alt="ball">

        <div id="startScreen" class="absolute inset-0 bg-blue-600/80 z-50 flex items-center justify-center">
            <div class="text-center text-white">
                <h1 class="text-5xl mb-6">Toon Bowling!</h1>
                <button onclick="initGame()" class="bg-yellow-400 hover:bg-yellow-300 text-blue-900 px-10 py-4 rounded-full text-3xl shadow-2xl transition-all transform hover:scale-110">PLAY NOW</button>
            </div>
        </div>
    </div>

    <script>
        let currentWord = "";
        let wordsData = [{"word": "Apple"}, {"word": "Ball"}, {"word": "Cat"}, {"word": "Dog"}, {"word": "Egg"}, {"word": "bag"}, {"word": "board"}, {"word": "book"}, {"word": "chair"}, {"word": "desk"}, {"word": "ill"}, {"word": "in"}, {"word": "ink"}, {"word": "insect"}, {"word": "open your books"}, {"word": "pencil"}, {"word": "sit down"}, {"word": "stand up"}];
        
        function initGame() {
            document.getElementById('startScreen').style.display = 'none';
            loadNext();
        }

        function loadNext() {
            const wordObj = wordsData[Math.floor(Math.random() * wordsData.length)];
            currentWord = wordObj.word;
            document.getElementById('vocabImg').src = "../../assets/p1/" + currentWord.toLowerCase().replace(/ /g, '_') + ".png";
            document.getElementById('wordText').innerText = currentWord;
            spawnPins();
        }

        function spawnPins() {
            const container = document.getElementById('pinsContainer');
            container.innerHTML = '';
            // Spawn 3 pins, one correct
        }

        // Drag and shoot logic for mobile
        let isDragging = false;
        const ball = document.getElementById('bowlingBall');

        ball.addEventListener('touchstart', (e) => { isDragging = true; });
        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const x = e.touches[0].clientX;
                ball.style.left = x + 'px';
            }
        });
        window.addEventListener('touchend', () => {
            if (isDragging) {
                isDragging = false;
                shootBall();
            }
        });

        function shootBall() {
            // Animation for ball moving up
        }
    </script>
</body>
</html>
