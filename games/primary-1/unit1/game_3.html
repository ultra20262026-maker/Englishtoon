<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Defender - Professional Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js?v=5.3"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #020617; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="fixed top-20 left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none">
        <div class="bg-black/40 backdrop-blur-md p-4 rounded-3xl border border-white/20">
            <p class="text-blue-400 text-xs font-bold uppercase mb-1">دمر الكلمة:</p>
            <h2 id="target-word" class="text-white text-3xl font-black">APPLE</h2>
            <button onclick="Engine.speak(document.getElementById('target-word').innerText)" class="pointer-events-auto mt-2 bg-indigo-600 p-2 rounded-full shadow-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        let currentTarget = "";
        let player = { x: 0, y: 0 };
        let bullets = [];
        let enemies = [];

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            nextLevel();
            Engine.init();
            animate();
        }

        function nextLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.toUpperCase();
            enemies = [];
            spawnEnemy();
        }

        function spawnEnemy() {
            if (enemies.length >= 3) return; // Limit to 3 choices
            
            // Get 3 distinct words including the target
            const choices = Engine.getWords(vocab, 3);
            if (!choices.includes(currentTarget)) choices[0] = currentTarget;
            
            choices.forEach((text, i) => {
                Engine.loadSprite(text, (img) => {
                    enemies.push({
                        x: (i + 1) * (canvas.width / 4),
                        y: -100 - (i * 50),
                        text: text,
                        img: img,
                        speed: (0.8 + Math.random() * 0.5) * Engine.speed
                    });
                });
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (Engine.gameActive) {
                // Draw Bullets
                bullets.forEach((b, bi) => {
                    b.y -= 10;
                    ctx.fillStyle = '#f87171';
                    ctx.fillRect(b.x - 2, b.y, 4, 15);
                    if (b.y < 0) bullets.splice(bi, 1);
                });

                // Draw Enemies
                enemies.forEach((e, ei) => {
                    e.y += e.speed;
                    if(e.img) ctx.drawImage(e.img, e.x - 40, e.y - 40, 80, 80);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 14px Cairo';
                    ctx.textAlign = 'center';
                    ctx.fillText(e.text.toUpperCase(), e.x, e.y + 55);

                    // Collision
                    bullets.forEach((b, bi) => {
                        if (Math.abs(b.x - e.x) < 40 && Math.abs(b.y - e.y) < 40) {
                            bullets.splice(bi, 1);
                            if (e.text === currentTarget) {
                                enemies = []; // Clear to prevent double hits
                                Engine.addScore(100);
                                Engine.showFeedback(true);
                                Engine.showWinScreen(() => nextLevel());
                            } else {
                                Engine.addScore(-20);
                                Engine.showFeedback(false);
                                enemies.splice(ei, 1);
                            }
                        }
                    });
                });
            } else {
                // Draw static elements when paused
                enemies.forEach(e => {
                    if(e.img) ctx.drawImage(e.img, e.x - 40, e.y - 40, 80, 80);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 14px Cairo';
                    ctx.textAlign = 'center';
                    ctx.fillText(e.text.toUpperCase(), e.x, e.y + 55);
                });
            }

            // Draw Ship
            ctx.fillStyle = '#6366f1';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 30);
            ctx.lineTo(player.x - 25, player.y + 20);
            ctx.lineTo(player.x + 25, player.y + 20);
            ctx.closePath();
            ctx.fill();

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointermove', (e) => { 
            if (!Engine.gameActive) return;
            player.x = e.clientX; 
        });
        
        // Manual shooting: Only on tap
        window.addEventListener('pointerdown', (e) => { 
            if (!Engine.gameActive) return;
            // Prevent shooting if clicking UI
            if (e.target.closest('button')) return;
            bullets.push({ x: player.x, y: player.y - 30 }); 
        });
        initGame();
    </script>
</body>
</html>
