<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basket Catcher - Game 3: Fruit Catcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; background: #fff7ed; }
        #gameCanvas { width: 100%; height: 100vh; display: block; }
        .game-ui { pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body class="bg-orange-50">
    <!-- UI Overlay -->
    <div class="game-ui fixed inset-0 z-10 flex flex-col p-4">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-orange-200 flex items-center gap-4">
                <div class="text-orange-600">
                    <span class="text-xs font-bold block uppercase tracking-wider">Score</span>
                    <span id="score" class="text-2xl font-black">0</span>
                </div>
                <div class="w-px h-8 bg-orange-100"></div>
                <div class="text-amber-500">
                    <span class="text-xs font-bold block uppercase tracking-wider">Stars</span>
                    <span id="stars" class="text-2xl font-black">0</span>
                </div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-orange-400 w-full max-w-md text-center">
                <h2 class="text-orange-500 font-bold text-lg mb-1 uppercase tracking-widest">Catch the word:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="interactive bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg shadow-orange-200 transition-all active:scale-95 flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i>
                    Listen
                </button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="../../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"]');
        
        let width, height;
        let basketX, basketY;
        const basketWidth = 120;
        const basketHeight = 60;
        let items = [];
        let currentWord = null;
        let lastTime = 0;
        let gameActive = true;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            basketX = width / 2 - basketWidth / 2;
            basketY = height - 100;
        }

        window.addEventListener('resize', resize);
        resize();

        class FallingItem {
            constructor(word, isCorrect) {
                this.word = word;
                this.isCorrect = isCorrect;
                this.x = Math.random() * (width - 80) + 40;
                this.y = -50;
                this.speed = 2 + Math.random() * 2;
                this.radius = 40;
                this.img = new Image();
                this.img.src = Engine.getAssetPath(word);
                this.img.onerror = () => { this.img.src = 'https://cdn-icons-png.flaticon.com/512/3081/3081840.png'; };
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.strokeStyle = this.isCorrect ? '#f97316' : '#e2e8f0';
                ctx.lineWidth = 3;
                ctx.stroke();

                const imgSize = this.radius * 1.4;
                ctx.drawImage(this.img, this.x - imgSize/2, this.y - imgSize/2, imgSize, imgSize);
                
                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 12px Fredoka';
                ctx.textAlign = 'center';
                ctx.fillText(this.word, this.x, this.y + this.radius + 15);
                ctx.restore();
            }
        }

        function nextQuestion() {
            const correctIdx = Math.floor(Math.random() * vocab.length);
            currentWord = vocab[correctIdx];
            document.getElementById('targetWord').innerText = currentWord;
            items = [];
            spawnItem();
        }

        function spawnItem() {
            // Spawn correct one
            items.push(new FallingItem(currentWord, true));
            // Spawn wrong ones periodically
            setTimeout(() => {
                if(gameActive) {
                    let wrongWord;
                    do {
                        wrongWord = vocab[Math.floor(Math.random() * vocab.length)];
                    } while(wrongWord === currentWord);
                    items.push(new FallingItem(wrongWord, false));
                }
            }, 2000);
        }

        function gameLoop(timestamp) {
            ctx.clearRect(0, 0, width, height);

            // Draw Basket
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.roundRect(basketX, basketY, basketWidth, basketHeight, 20);
            ctx.fill();
            ctx.fillStyle = '#ea580c';
            ctx.fillRect(basketX + 10, basketY, basketWidth - 20, 10);

            // Update & Draw Items
            for(let i = items.length - 1; i >= 0; i--) {
                items[i].update();
                items[i].draw();

                // Collision with basket
                if(items[i].y + items[i].radius > basketY && 
                   items[i].x > basketX && items[i].x < basketX + basketWidth) {
                    if(items[i].isCorrect) {
                        Engine.addScore(10);
                        Engine.showFeedback(true);
                        items.splice(i, 1);
                        setTimeout(nextQuestion, 500);
                    } else {
                        Engine.showFeedback(false);
                        items.splice(i, 1);
                    }
                    continue;
                }

                if(items[i].y > height + 50) {
                    const wasCorrect = items[i].isCorrect;
                    items.splice(i, 1);
                    if(wasCorrect) items.push(new FallingItem(currentWord, true));
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function handleMove(clientX) {
            basketX = clientX - basketWidth / 2;
            if(basketX < 0) basketX = 0;
            if(basketX > width - basketWidth) basketX = width - basketWidth;
        }

        canvas.addEventListener('mousemove', (e) => handleMove(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleMove(e.touches[0].clientX);
        }, { passive: false });

        document.getElementById('listenBtn').addEventListener('click', () => {
            Engine.speak(currentWord);
        });

        nextQuestion();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
