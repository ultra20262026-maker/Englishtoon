<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fishing Game - صيد السمك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js?v=5.4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #0ea5e9; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="fixed top-20 left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none">
        <div class="bg-white/20 backdrop-blur-md p-4 rounded-3xl border border-white/40">
            <p class="text-blue-900 text-xs font-bold uppercase mb-1">اصطد السمكة:</p>
            <h2 id="target-word" class="text-white text-3xl font-black drop-shadow-lg">APPLE</h2>
            <button onclick="Engine.speak(document.getElementById('target-word').innerText)" class="pointer-events-auto mt-2 bg-blue-700 p-2 rounded-full shadow-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        let currentTarget = "";
        let fishes = [];
        let hook = { x: 0, y: 100, active: false, targetY: 100 };

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            hook.x = canvas.width / 2;
            nextLevel();
            Engine.init();
            animate();
        }

        function nextLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.toUpperCase();
            spawnFish();
            hook.active = false;
            hook.y = 100;
        }

        function spawnFish() {
            fishes = [];
            const choices = Engine.getWords(vocab, 3);
            if (!choices.includes(currentTarget)) choices[0] = currentTarget;
            
            choices.forEach((text, i) => {
                Engine.loadSprite(text, (img) => {
                    fishes.push({
                        x: Math.random() * canvas.width,
                        y: 300 + (i * 100),
                        text: text,
                        img: img,
                        speed: (1 + Math.random()) * (i % 2 === 0 ? 1 : -1),
                        w: 100,
                        h: 60
                    });
                });
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Water Waves
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(0, 200, canvas.width, canvas.height);

            // Draw Hook
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(hook.x, 0);
            ctx.lineTo(hook.x, hook.y);
            ctx.stroke();
            
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.arc(hook.x, hook.y, 10, 0, Math.PI);
            ctx.stroke();

            // Update Hook
            if (hook.active) {
                if (hook.y < hook.targetY) hook.y += 10;
                else hook.active = false;
            } else if (hook.y > 100) {
                hook.y -= 5;
            }

            // Draw Fish
            fishes.forEach((f, i) => {
                f.x += f.speed;
                if (f.x > canvas.width + 50) f.x = -50;
                if (f.x < -50) f.x = canvas.width + 50;

                ctx.save();
                ctx.translate(f.x, f.y);
                if (f.speed < 0) ctx.scale(-1, 1);
                
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.ellipse(0, 0, 40, 25, 0, 0, Math.PI * 2);
                ctx.fill();
                
                if(f.img) ctx.drawImage(f.img, -20, -20, 40, 40);
                ctx.restore();

                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Cairo';
                ctx.textAlign = 'center';
                ctx.fillText(f.text.toUpperCase(), f.x, f.y + 40);

                // Hook Collision
                if (Math.abs(hook.x - f.x) < 40 && Math.abs(hook.y - f.y) < 30) {
                    if (f.text === currentTarget) {
                        Engine.addScore(100);
                        Engine.showFeedback(true);
                        Engine.showWinScreen(() => nextLevel());
                    } else {
                        Engine.addScore(-20);
                        Engine.showFeedback(false);
                        hook.active = false;
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointermove', (e) => {
            if (hook.active) return;
            hook.x = e.clientX;
        });

        window.addEventListener('pointerdown', (e) => {
            if (hook.active || e.target.closest('button')) return;
            hook.targetY = e.clientY;
            hook.active = true;
        });

        initGame();
    </script>
</body>
</html>
