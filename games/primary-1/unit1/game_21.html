<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Firefighter - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka One', cursive; margin: 0; overflow: hidden; }
        .city { position: relative; width: 100vw; height: 100vh; background: #334155; }
        .window { position: absolute; width: 80px; height: 100px; background: #1e293b; border: 4px solid #94a3b8; }
        .fire { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: orange; animation: flicker 0.2s infinite; }
        @keyframes flicker { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
    </style>
</head>
<body>
    <div class="city" id="gameArea">
        <!-- Firefighter game logic -->
    </div>
</body>
</html>
