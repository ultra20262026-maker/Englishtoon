<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planet Launcher - قاذف الكواكب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../game_engine.js?v=5.5.0"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #0f172a; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const words = [{"word": "Apple", "image": "../../../assets/p1/apple.png"}, {"word": "Ball", "image": "../../../assets/p1/ball.png"}, {"word": "Cat", "image": "../../../assets/p1/cat.png"}, {"word": "Dog", "image": "../../../assets/p1/dog.png"}, {"word": "Egg", "image": "../../../assets/p1/egg.png"}, {"word": "bag", "image": "../../../assets/p1/bag.png"}, {"word": "board", "image": "../../../assets/p1/board.png"}, {"word": "book", "image": "../../../assets/p1/book.png"}, {"word": "chair", "image": "../../../assets/p1/chair.png"}, {"word": "desk", "image": "../../../assets/p1/desk.png"}, {"word": "ill", "image": "../../../assets/p1/ill.png"}, {"word": "in", "image": "../../../assets/p1/in.png"}, {"word": "ink", "image": "../../../assets/p1/ink.png"}, {"word": "insect", "image": "../../../assets/p1/insect.png"}, {"word": "open your books", "image": "../../../assets/p1/open_your_books.png"}, {"word": "pencil", "image": "../../../assets/p1/pencil.png"}, {"word": "sit down", "image": "../../../assets/p1/sit_down.png"}, {"word": "stand up", "image": "../../../assets/p1/stand_up.png"}];
        let currentWordIndex = 0;
        let targets = [];
        let launcher = { x: 0, y: 0, angle: -Math.PI/2 };
        let projectiles = [];

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            launcher.x = canvas.width / 2;
            launcher.y = canvas.height - 100;
            
            Engine.init({
                onListen: () => Engine.speak(words[currentWordIndex].word),
                onContinue: nextLevel
            });
            
            setupLevel();
            animate();
        }

        function setupLevel() {
            const current = words[currentWordIndex];
            document.getElementById('engine-target-word').innerText = current.word.toUpperCase();
            targets = [];
            projectiles = [];
            
            const choices = Engine.getChoices(words, currentWordIndex, 3);
            choices.forEach((c, i) => {
                const img = new Image();
                img.src = c.image;
                targets.push({
                    x: (i + 1) * (canvas.width / 4),
                    y: 250,
                    word: c.word,
                    img: img,
                    isCorrect: c.word === current.word,
                    angle: Math.random() * Math.PI * 2,
                    orbitRadius: 40 + Math.random() * 20,
                    destroyed: false
                });
            });
        }

        function nextLevel() {
            currentWordIndex = (currentWordIndex + 1) % words.length;
            setupLevel();
            Engine.hideWin();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Space Stars
            ctx.fillStyle = 'white';
            for(let i=0; i<50; i++) {
                ctx.beginPath();
                ctx.arc(Math.sin(i)*canvas.width, Math.cos(i)*canvas.height, 1, 0, Math.PI*2);
                ctx.fill();
            }
            
            if (!Engine.isPaused) {
                // Update Projectiles
                projectiles.forEach((p, pi) => {
                    p.x += Math.cos(p.angle) * 12;
                    p.y += Math.sin(p.angle) * 12;
                    
                    targets.forEach(t => {
                        if (!t.destroyed && Math.abs(p.x - t.x) < 50 && Math.abs(p.y - t.y) < 50) {
                            projectiles.splice(pi, 1);
                            if (t.isCorrect) {
                                t.destroyed = true;
                                Engine.showWin();
                            } else {
                                Engine.shake();
                            }
                        }
                    });

                    if (p.x < 0 || p.x > canvas.width || p.y < 0) projectiles.splice(pi, 1);
                });

                // Update Targets Orbit
                targets.forEach(t => {
                    t.angle += 0.02;
                    t.renderX = t.x + Math.cos(t.angle) * t.orbitRadius;
                    t.renderY = t.y + Math.sin(t.angle) * t.orbitRadius;
                });
            }

            // Draw Launcher
            ctx.save();
            ctx.translate(launcher.x, launcher.y);
            ctx.rotate(launcher.angle + Math.PI/2);
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.moveTo(0, -40);
            ctx.lineTo(20, 20);
            ctx.lineTo(-20, 20);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Draw Targets
            targets.forEach(t => {
                if (!t.destroyed) {
                    ctx.save();
                    ctx.translate(t.renderX, t.renderY);
                    
                    // Orbit Circle
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 50, 0, Math.PI*2);
                    ctx.stroke();

                    if (t.img && t.img.complete) ctx.drawImage(t.img, -40, -40, 80, 80);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Cairo';
                    ctx.textAlign = 'center';
                    ctx.fillText(t.word.toUpperCase(), 0, 55);
                    ctx.restore();
                }
            });

            // Draw Projectiles
            ctx.fillStyle = '#f43f5e';
            projectiles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointermove', (e) => {
            const dx = e.clientX - launcher.x;
            const dy = e.clientY - launcher.y;
            launcher.angle = Math.atan2(dy, dx);
        });

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button')) return;
            if (!Engine.isPaused) {
                projectiles.push({ x: launcher.x, y: launcher.y, angle: launcher.angle });
            }
        });

        initGame();
    </script>
</body>
</html>
