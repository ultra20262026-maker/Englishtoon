<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; }
        canvas { display: block; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .btn-action { background: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-action:active { transform: scale(0.95); }
    </style>

    <title>Dictation</title>
</head>
<body class="bg-sky-100">
    
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Spell the word:</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"]');
        let width, height, currentWord;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        
        let scrambled = [], slots = [];
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = "(?)";
            let letters = currentWord.toUpperCase().split('');
            scrambled = letters.map((l, i) => ({ l, x: (i%5)*60+width/2-120, y: height-150, id: i })).sort(()=>0.5-Math.random());
            slots = letters.map((l, i) => ({ l, x: (i%5)*60+width/2-120, y: height/2, filled: null }));
        }
        function loop() {
            ctx.clearRect(0,0,width,height);
            slots.forEach(s => { ctx.strokeStyle='#3b82f6'; ctx.strokeRect(s.x, s.y, 50, 50); if(s.filled) { ctx.fillStyle='#1e293b'; ctx.font='bold 30px Fredoka'; ctx.fillText(s.filled, s.x+15, s.y+35); } });
            scrambled.forEach(l => { ctx.fillStyle='#3b82f6'; ctx.fillRect(l.x, l.y, 50, 50); ctx.fillStyle='white'; ctx.font='bold 30px Fredoka'; ctx.fillText(l.l, l.x+15, l.y+35); });
            requestAnimationFrame(loop);
        }
        canvas.addEventListener('mousedown', (e) => {
            scrambled.forEach((l, i) => {
                if(e.clientX > l.x && e.clientX < l.x+50 && e.clientY > l.y && e.clientY < l.y+50) {
                    let slot = slots.find(s => !s.filled);
                    if(slot) {
                        slot.filled = l.l; scrambled.splice(i, 1);
                        if(slots.every(s => s.filled)) {
                            let result = slots.map(s => s.filled).join('');
                            if(result === currentWord.toUpperCase()) { Engine.addScore(50); Engine.showFeedback(true); setTimeout(nextQuestion, 1500); }
                            else { Engine.showFeedback(false); setTimeout(nextQuestion, 1000); }
                        }
                    }
                }
            });
        });
    
        
        // Ensure Engine is ready before starting
        window.onload = () => {
            if (window.Engine) {
                Engine.init();
                if (typeof nextQuestion === 'function') nextQuestion();
                if (typeof loop === 'function') loop();
            }
        };
    </script>
</body>
</html>
