<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عسل النحل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #fefce8; touch-action: none; margin: 0; padding: 0; }
        canvas { display: block; width: 100vw; height: 100vh; background: #fef9c3; }
        #top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 45px;
            background: rgba(15, 23, 42, 0.9); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 10px; z-index: 1000; border-bottom: 2px solid #eab308;
        }
        #target-word { color: #eab308; font-weight: 900; font-size: 1.2rem; margin: 0 10px; text-transform: uppercase; }
        #win-screen {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; text-align: center;
        }
        .win-box { background: white; padding: 20px; border-radius: 20px; border: 4px solid #eab308; width: 85%; max-width: 350px; }
        .btn { background: #eab308; color: white; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
        .score-tag { background: #0f172a; color: white; padding: 2px 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="top-bar">
        <div style="display: flex; align-items: center;">
            <span style="color: #94a3b8; font-size: 0.7rem; font-weight: bold;">اجمع من:</span>
            <span id="target-word">---</span>
            <button onclick="handleListen()" style="background: #eab308; color: white; width: 30px; height: 30px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
        <div class="score-tag">🐝 <span id="score-count">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="win-screen">
        <div class="win-box">
            <div style="font-size: 3rem; margin-bottom: 10px;">🍯</div>
            <h2 style="color: #0f172a; font-size: 1.5rem; font-weight: 900;">عسل لذيذ!</h2>
            <button class="btn" onclick="nextLevel()">متابعة</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const rawVocab = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        const vocab = rawVocab.map(v => ({ word: v, image: v.toLowerCase().replace(/ /g, '_') + '.png' }));
        let score = 0; let currentTarget = null; let isPaused = false; const assets = {};
        
        function initGame() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            vocab.forEach(item => { const img = new Image(); img.src = `../../../assets/p1/${item.image}`; assets[item.word] = img; });
            setupLevel(); requestAnimationFrame(animate);
        }
        function handleListen() { if (!currentTarget) return; const u = new SpeechSynthesisUtterance(currentTarget.word); u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }
        function nextLevel() { document.getElementById('win-screen').style.display = 'none'; setupLevel(); }
        
        
        let flowers = []; let bee = { x: 0, y: 0 };
        function setupLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.word;
            bee.x = canvas.width / 2; bee.y = canvas.height - 100; flowers = [];
            let choices = [currentTarget]; let others = vocab.filter(v => v.word !== currentTarget.word);
            others.sort(() => Math.random() - 0.5); choices.push(others[0], others[1]);
            choices.sort(() => Math.random() - 0.5);
            choices.forEach((c, i) => { flowers.push({ x: (i + 1) * (canvas.width / 4), y: 200, word: c.word, isCorrect: c.word === currentTarget.word }); });
            isPaused = false;
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(bee.x, bee.y, 25, 0, Math.PI*2); ctx.fill();
            flowers.forEach(f => { ctx.fillStyle = '#f472b6'; ctx.beginPath(); for(let i=0; i<6; i++) ctx.arc(f.x + Math.cos(i)*30, f.y + Math.sin(i)*30, 20, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(f.x, f.y, 20, 0, Math.PI*2); ctx.fill();
                const img = assets[f.word]; if (img && img.complete) ctx.drawImage(img, f.x - 20, f.y - 20, 40, 40);
                ctx.fillStyle = 'black'; ctx.font = 'bold 12px Cairo'; ctx.textAlign = 'center'; ctx.fillText(f.word.toUpperCase(), f.x, f.y + 60);
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('pointerdown', (e) => { if (isPaused) return; bee.x = e.clientX; bee.y = e.clientY;
            flowers.forEach(f => { if (Math.hypot(bee.x - f.x, bee.y - f.y) < 50) {
                if (f.isCorrect) { score += 10; isPaused = true; document.getElementById('win-screen').style.display = 'flex'; }
                else { speechSynthesis.speak(new SpeechSynthesisUtterance("Try again")); }
            }});
        });
        
        
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        initGame();
    </script>
</body>
</html>
