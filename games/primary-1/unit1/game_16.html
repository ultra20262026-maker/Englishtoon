<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whack-a-Mole - اضرب الصورة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js?v=5.4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #1e293b; touch-action: none; }
        .hole { background: #0f172a; border-radius: 50%; box-shadow: inset 0 10px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="game-ui" class="fixed top-20 left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none w-full px-4">
        <div class="bg-amber-900/80 backdrop-blur-md p-4 rounded-3xl border-4 border-amber-600 shadow-2xl inline-block">
            <p class="text-amber-200 text-xs font-bold uppercase mb-1">اضرب صورة:</p>
            <h2 id="target-word" class="text-white text-3xl font-black drop-shadow-lg">APPLE</h2>
            <button onclick="Engine.speak(document.getElementById('target-word').innerText)" class="pointer-events-auto mt-2 bg-amber-600 p-2 rounded-full shadow-lg hover:scale-110 transition-transform">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
    </div>

    <div id="holes-container" class="grid grid-cols-3 gap-8 p-8 mt-64 max-w-lg mx-auto">
        <!-- Holes will be generated here -->
    </div>

    <script>
        const vocab = [{"word": "Apple", "image": "../../../assets/p1/apple.png"}, {"word": "Ball", "image": "../../../assets/p1/ball.png"}, {"word": "Cat", "image": "../../../assets/p1/cat.png"}, {"word": "Dog", "image": "../../../assets/p1/dog.png"}, {"word": "Egg", "image": "../../../assets/p1/egg.png"}, {"word": "bag", "image": "../../../assets/p1/bag.png"}, {"word": "board", "image": "../../../assets/p1/board.png"}, {"word": "book", "image": "../../../assets/p1/book.png"}, {"word": "chair", "image": "../../../assets/p1/chair.png"}, {"word": "desk", "image": "../../../assets/p1/desk.png"}, {"word": "ill", "image": "../../../assets/p1/ill.png"}, {"word": "in", "image": "../../../assets/p1/in.png"}, {"word": "ink", "image": "../../../assets/p1/ink.png"}, {"word": "insect", "image": "../../../assets/p1/insect.png"}, {"word": "open your books", "image": "../../../assets/p1/open_your_books.png"}, {"word": "pencil", "image": "../../../assets/p1/pencil.png"}, {"word": "sit down", "image": "../../../assets/p1/sit_down.png"}, {"word": "stand up", "image": "../../../assets/p1/stand_up.png"}];
        let currentTarget = "";
        let activeMole = null;
        let timer = null;

        function initGame() {
            const container = document.getElementById('holes-container');
            for (let i = 0; i < 3; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole relative aspect-square flex items-center justify-center overflow-hidden border-4 border-amber-800';
                hole.innerHTML = `<div id="mole-${i}" class="mole absolute translate-y-full transition-transform duration-300 w-full h-full flex flex-col items-center justify-center cursor-pointer pointer-events-none"></div>`;
                container.appendChild(hole);
            }
            nextLevel();
            Engine.init();
        }

        function nextLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.toUpperCase();
            if(timer) clearTimeout(timer);
            showMole();
        }

        function showMole() {
            if (!Engine.gameActive) return;
            
            const holeIdx = Math.floor(Math.random() * 3);
            const choices = Engine.getWords(vocab, 3);
            if (!choices.includes(currentTarget)) choices[0] = currentTarget;
            const word = choices[Math.floor(Math.random() * choices.length)];
            
            const mole = document.getElementById(`mole-${holeIdx}`);
            Engine.loadSprite(word, (img) => {
                mole.innerHTML = `
                    <div class="bg-white rounded-2xl p-2 shadow-xl border-2 border-amber-500 w-4/5 h-4/5 flex flex-col items-center justify-center pointer-events-auto" onclick="hitMole('${word}')">
                        ${img ? `<img src="${img.src}" class="w-12 h-12 object-contain">` : ''}
                        <span class="text-xs font-bold text-amber-900 mt-1">${word.toUpperCase()}</span>
                    </div>
                `;
                mole.classList.remove('translate-y-full');
                
                timer = setTimeout(() => {
                    mole.classList.add('translate-y-full');
                    timer = setTimeout(showMole, 500 + Math.random() * 1000);
                }, 1500 / Engine.speed);
            });
        }

        function hitMole(word) {
            if (word === currentTarget) {
                clearTimeout(timer);
                document.querySelectorAll('.mole').forEach(m => m.classList.add('translate-y-full'));
                Engine.addScore(100);
                Engine.showFeedback(true);
                Engine.showWinScreen(() => nextLevel());
            } else {
                Engine.addScore(-20);
                Engine.showFeedback(false);
            }
        }

        initGame();
    </script>
</body>
</html>
