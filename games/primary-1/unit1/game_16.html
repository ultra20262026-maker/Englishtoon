<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino Run - جري الديناصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../game_engine.js?v=5.4.4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #fde68a; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="fixed top-20 left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none">
        <div class="bg-white/80 backdrop-blur-md p-4 rounded-3xl border border-amber-200 shadow-xl">
            <p class="text-amber-600 text-xs font-bold uppercase mb-1">اجرِ نحو الكلمة:</p>
            <h2 id="target-word" class="text-slate-900 text-3xl font-black">APPLE</h2>
            <button onclick="Engine.speak(document.getElementById('target-word').innerText)" class="pointer-events-auto mt-2 bg-amber-600 p-2 rounded-full shadow-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const words = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        let currentWordIndex = 0;
        let dino = { x: 50, y: 0, w: 60, h: 60, dy: 0, jump: -15, ground: 0 };
        let obstacles = [];
        let groundY = 0;

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            groundY = canvas.height - 100;
            dino.ground = groundY - dino.h;
            dino.y = dino.ground;
            
            Engine.init({
                onListen: () => Engine.speak(words[currentWordIndex].word),
                onContinue: nextLevel
            });
            
            setupLevel();
            animate();
        }

        function setupLevel() {
            const current = words[currentWordIndex];
            document.getElementById('target-word').innerText = current.word.toUpperCase();
            obstacles = [];
            const choices = Engine.getChoices(words, currentWordIndex, 3);
            choices.forEach((c, i) => {
                const img = new Image();
                img.src = c.image;
                obstacles.push({
                    x: canvas.width + (i * 400) + 500,
                    y: dino.ground,
                    word: c.word,
                    img: img,
                    isCorrect: c.word === current.word
                });
            });
        }

        function nextLevel() {
            currentWordIndex = (currentWordIndex + 1) % words.length;
            setupLevel();
            Engine.hideWin();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Ground
            ctx.fillStyle = '#92400e';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            if (!Engine.isPaused) {
                // Dino Physics
                dino.dy += 0.8;
                dino.y += dino.dy;
                if (dino.y > dino.ground) {
                    dino.y = dino.ground;
                    dino.dy = 0;
                }

                // Update Obstacles
                obstacles.forEach((o, i) => {
                    o.x -= 5;
                    if (o.img && o.img.complete) {
                        ctx.drawImage(o.img, o.x, o.y, 60, 60);
                    }
                    ctx.fillStyle = 'black';
                    ctx.font = 'bold 14px Cairo';
                    ctx.fillText(o.word.toUpperCase(), o.x + 30, o.y + 80);

                    // Collision
                    if (Math.abs(dino.x - o.x) < 40 && Math.abs(dino.y - o.y) < 40) {
                        if (o.isCorrect) {
                            Engine.showWin();
                        } else {
                            Engine.shake();
                            o.x = -100; // Remove wrong choice
                        }
                    }
                });
            }

            // Draw Dino
            ctx.fillStyle = '#166534';
            ctx.fillRect(dino.x, dino.y, dino.w, dino.h);

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointerdown', () => {
            if (!Engine.isPaused && dino.y === dino.ground) {
                dino.dy = dino.jump;
            }
        });

        initGame();
    </script>
</body>
</html>
