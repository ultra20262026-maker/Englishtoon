<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fishing Game - صيد السمك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../game_engine.js?v=5.4.4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #0c4a6e; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="fixed top-20 left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none">
        <div class="bg-black/40 backdrop-blur-md p-4 rounded-3xl border border-white/20">
            <p class="text-blue-400 text-xs font-bold uppercase mb-1">اصطد الكلمة:</p>
            <h2 id="target-word" class="text-white text-3xl font-black">APPLE</h2>
            <button onclick="Engine.speak(document.getElementById('target-word').innerText)" class="pointer-events-auto mt-2 bg-indigo-600 p-2 rounded-full shadow-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const words = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        let currentWordIndex = 0;
        let hook = { x: 0, y: 100, targetY: 100, isDropping: false, isReturning: false };
        let fishes = [];

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            hook.x = canvas.width / 2;
            
            Engine.init({
                onListen: () => Engine.speak(words[currentWordIndex].word),
                onContinue: nextLevel
            });
            
            setupLevel();
            animate();
        }

        function setupLevel() {
            const current = words[currentWordIndex];
            document.getElementById('target-word').innerText = current.word.toUpperCase();
            fishes = [];
            hook.isDropping = false;
            hook.isReturning = false;
            hook.y = 100;
            
            const choices = Engine.getChoices(words, currentWordIndex, 3);
            choices.forEach((c, i) => {
                const img = new Image();
                img.src = c.image;
                fishes.push({
                    x: (i + 1) * (canvas.width / 4),
                    y: canvas.height - 200,
                    word: c.word,
                    img: img,
                    isCorrect: c.word === current.word,
                    w: 100,
                    h: 60,
                    dir: Math.random() > 0.5 ? 1 : -1
                });
            });
        }

        function nextLevel() {
            currentWordIndex = (currentWordIndex + 1) % words.length;
            setupLevel();
            Engine.hideWin();
        }

        function animate() {
            ctx.fillStyle = '#0c4a6e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Waves
            ctx.fillStyle = '#075985';
            ctx.fillRect(0, 0, canvas.width, 150);

            if (!Engine.isPaused) {
                // Hook Logic
                if (hook.isDropping) {
                    hook.y += 10;
                    if (hook.y >= canvas.height - 150) hook.isReturning = true;
                    
                    // Collision
                    fishes.forEach(f => {
                        if (Math.abs(hook.x - f.x) < 50 && Math.abs(hook.y - f.y) < 30) {
                            hook.isReturning = true;
                            if (f.isCorrect) {
                                Engine.showWin();
                            } else {
                                Engine.shake();
                            }
                        }
                    });
                } else if (hook.isReturning) {
                    hook.y -= 10;
                    if (hook.y <= 100) {
                        hook.isReturning = false;
                        hook.isDropping = false;
                    }
                }

                // Update Fishes
                fishes.forEach(f => {
                    f.x += f.dir * 2;
                    if (f.x < 50 || f.x > canvas.width - 50) f.dir *= -1;
                });
            }

            // Draw Hook Line
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(hook.x, 0);
            ctx.lineTo(hook.x, hook.y);
            ctx.stroke();

            // Draw Hook
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(hook.x, hook.y, 10, 0, Math.PI);
            ctx.stroke();

            // Draw Fishes
            fishes.forEach(f => {
                ctx.save();
                ctx.translate(f.x, f.y);
                if (f.dir === -1) ctx.scale(-1, 1);
                
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.ellipse(0, 0, f.w/2, f.h/2, 0, 0, Math.PI*2);
                ctx.fill();
                
                if (f.img && f.img.complete) {
                    ctx.drawImage(f.img, -20, -25, 40, 40);
                }
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px Cairo';
                ctx.textAlign = 'center';
                ctx.scale(f.dir === -1 ? -1 : 1, 1);
                ctx.fillText(f.word.toUpperCase(), 0, 45);
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointermove', (e) => { 
            if (Engine.isPaused || hook.isDropping || hook.isReturning) return;
            hook.x = e.clientX; 
        });
        
        window.addEventListener('pointerdown', (e) => { 
            if (Engine.isPaused || hook.isDropping || hook.isReturning) return;
            if (e.target.closest('button')) return;
            hook.isDropping = true;
        });

        initGame();
    </script>
</body>
</html>
