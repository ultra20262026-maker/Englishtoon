<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حامي القلعة - Castle Defender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #1e293b; touch-action: none; margin: 0; padding: 0; }
        canvas { display: block; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #0f172a, #1e293b); }
        
        #top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 45px;
            background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 10px; z-index: 1000; border-bottom: 2px solid #ef4444;
        }
        #target-word { color: #fcd34d; font-weight: 900; font-size: 1.2rem; margin: 0 10px; text-transform: uppercase; }
        
        #win-screen {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; text-align: center;
        }
        .win-box { background: #334155; padding: 20px; border-radius: 20px; border: 3px solid #f59e0b; width: 85%; max-width: 350px; }
        .btn { background: #ef4444; color: white; padding: 10px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
        
        .score-tag { background: #0f172a; color: white; padding: 2px 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; border: 1px solid #475569; }
    </style>
</head>
<body>
    <div id="top-bar">
        <div style="display: flex; align-items: center;">
            <span style="color: #94a3b8; font-size: 0.7rem; font-weight: bold;">ابحث عن:</span>
            <span id="target-word">---</span>
            <button onclick="handleListen()" style="background: #ef4444; color: white; width: 30px; height: 30px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
        <div class="score-tag">🏰 <span id="bricks-count">0</span>/5</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="win-screen">
        <div class="win-box">
            <div style="font-size: 3rem; margin-bottom: 10px;">🏰</div>
            <h2 style="color: white; font-size: 1.5rem; font-weight: 900;">تم تحصين القلعة بنجاح!</h2>
            <button class="btn" onclick="nextLevel()">المستوى التالي</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const rawVocab = ["Apple","Ball","Cat","Dog","Egg","bag","board","book","chair","desk","ill","in","ink","insect","open your books","pencil","sit down","stand up"];
        const vocab = rawVocab.map(v => ({ word: v, image: v.toLowerCase().replace(/ /g, '_') + '.png' }));
        
        let currentTarget = null;
        let bricksBuilt = 0;
        let isPaused = false;
        let floatingBricks = [];
        let wallBricks = [];
        const assets = {};

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            vocab.forEach(item => {
                const img = new Image();
                img.src = `../../../assets/p1/${item.image}`;
                assets[item.word] = img;
            });

            setupLevel();
            requestAnimationFrame(animate);
        }

        function setupLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.word;
            
            floatingBricks = [];
            bricksBuilt = 0;
            wallBricks = [];
            document.getElementById('bricks-count').innerText = "0";
            
            spawnBricks();
        }

        function spawnBricks() {
            floatingBricks = [];
            let choices = [currentTarget];
            let others = vocab.filter(v => v.word !== currentTarget.word);
            others.sort(() => Math.random() - 0.5);
            choices.push(others[0], others[1]);
            choices.sort(() => Math.random() - 0.5);

            choices.forEach((c, i) => {
                floatingBricks.push({
                    x: (i + 1) * (canvas.width / 4),
                    y: canvas.height - 120,
                    word: c.word,
                    isCorrect: c.word === currentTarget.word,
                    w: 80,
                    h: 50,
                    color: '#64748b'
                });
            });
        }

        function handleListen() {
            if (!currentTarget) return;
            const utterance = new SpeechSynthesisUtterance(currentTarget.word);
            utterance.lang = 'en-US';
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        function nextLevel() {
            document.getElementById('win-screen').style.display = 'none';
            isPaused = false;
            setupLevel();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Background Sky/Moon
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(canvas.width - 60, 100, 30, 0, Math.PI * 2);
            ctx.fill();

            // Draw Wall Base
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

            // Draw Built Bricks
            wallBricks.forEach(b => {
                ctx.fillStyle = '#475569';
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            });

            // Draw Floating Bricks
            floatingBricks.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 3;
                
                // Brick Shape
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h, 8);
                } else {
                    ctx.rect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
                }
                ctx.fill();
                ctx.stroke();

                // Image on Brick
                const img = assets[b.word];
                if (img && img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, b.x - 20, b.y - 20, 40, 40);
                }

                // Text
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Cairo';
                ctx.textAlign = 'center';
                ctx.fillText(b.word.toUpperCase(), b.x, b.y + 35);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || e.target.closest('.win-box')) return;
            if (isPaused) return;

            floatingBricks.forEach(b => {
                const dist = Math.hypot(e.clientX - b.x, e.clientY - b.y);
                if (dist < 50) {
                    if (b.isCorrect) {
                        // Success
                        bricksBuilt++;
                        document.getElementById('bricks-count').innerText = bricksBuilt;
                        
                        // Add to wall
                        const wallX = (bricksBuilt - 1) * 80 + (canvas.width / 2 - 200);
                        wallBricks.push({ x: wallX, y: canvas.height - 60 - 50, w: 75, h: 45 });
                        
                        if (bricksBuilt >= 5) {
                            isPaused = true;
                            document.getElementById('win-screen').style.display = 'flex';
                            const msg = new SpeechSynthesisUtterance("Great Job! Castle is safe.");
                            speechSynthesis.speak(msg);
                        } else {
                            const msg = new SpeechSynthesisUtterance("Correct");
                            speechSynthesis.speak(msg);
                            // New Target
                            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
                            document.getElementById('target-word').innerText = currentTarget.word;
                            spawnBricks();
                        }
                    } else {
                        // Wrong
                        b.color = '#ef4444';
                        setTimeout(() => b.color = '#64748b', 500);
                        const msg = new SpeechSynthesisUtterance("Try again");
                        speechSynthesis.speak(msg);
                    }
                }
            });
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        initGame();
    </script>
</body>
</html>
