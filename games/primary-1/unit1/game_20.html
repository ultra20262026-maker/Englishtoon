<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق التوربو - Turbo Racer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #1e293b; touch-action: none; margin: 0; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 50px;
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 1000; border-bottom: 2px solid #3b82f6;
        }
        #target-word { color: #fbbf24; font-weight: 900; font-size: 1.3rem; margin-right: 10px; }
        
        #win-screen {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; text-align: center;
        }
        .win-box { background: #1e293b; padding: 30px; border-radius: 30px; border: 4px solid #22c55e; width: 80%; max-width: 400px; }
        .btn { background: #2563eb; color: white; padding: 8px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; }
        
        #controls-hint {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.5); color: white; padding: 5px 15px; border-radius: 20px;
            font-size: 0.9rem; pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="top-bar">
        <div class="flex items-center">
            <span class="text-white/80 text-sm font-bold">المطلوب:</span>
            <span id="target-word">APPLE</span>
            <button class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs ml-2" onclick="handleListen()">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-slate-800 px-3 py-0.5 rounded-lg text-white font-bold flex items-center gap-2 text-sm">
                <span id="score">0</span>
                <i class="fa-solid fa-star text-yellow-400"></i>
            </div>
        </div>
    </div>

    <div id="controls-hint">اسحب لليمين واليسار للتحرك</div>

    <canvas id="gameCanvas"></canvas>

    <div id="win-screen">
        <div class="win-box">
            <div class="text-5xl mb-2">⭐</div>
            <h2 class="text-2xl font-black text-white mb-4">ممتاز! إجابة صحيحة</h2>
            <button class="btn text-lg" onclick="nextLevel()">متابعة اللعب</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const words = [{"word": "Apple", "image": "../../../assets/p1/apple.png"}, {"word": "Ball", "image": "../../../assets/p1/ball.png"}, {"word": "Cat", "image": "../../../assets/p1/cat.png"}, {"word": "Dog", "image": "../../../assets/p1/dog.png"}, {"word": "Egg", "image": "../../../assets/p1/egg.png"}, {"word": "bag", "image": "../../../assets/p1/bag.png"}, {"word": "board", "image": "../../../assets/p1/board.png"}, {"word": "book", "image": "../../../assets/p1/book.png"}, {"word": "chair", "image": "../../../assets/p1/chair.png"}, {"word": "desk", "image": "../../../assets/p1/desk.png"}, {"word": "ill", "image": "../../../assets/p1/ill.png"}, {"word": "in", "image": "../../../assets/p1/in.png"}, {"word": "ink", "image": "../../../assets/p1/ink.png"}, {"word": "insect", "image": "../../../assets/p1/insect.png"}, {"word": "open your books", "image": "../../../assets/p1/open_your_books.png"}, {"word": "pencil", "image": "../../../assets/p1/pencil.png"}, {"word": "sit down", "image": "../../../assets/p1/sit_down.png"}, {"word": "stand up", "image": "../../../assets/p1/stand_up.png"}];
        let currentWordIndex = 0;
        let score = 0;
        let isPaused = false;
        
        let player = { x: 0, y: 0, w: 60, h: 100, targetX: 0 };
        let obstacles = [];
        let roadOffset = 0;
        let speed = 4;
        
        const assets = {};
        function loadAssets() {
            words.forEach(w => {
                const img = new Image();
                img.src = `../../../assets/p1/${w.word.toLowerCase().replace(/ /g, '_')}.png`;
                assets[w.word] = img;
            });
        }

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 150;
            player.x = canvas.width / 2;
            player.targetX = player.x;
            loadAssets();
            setupLevel();
            requestAnimationFrame(animate);
        }

        function setupLevel() {
            const current = words[currentWordIndex];
            document.getElementById('target-word').innerText = current.word.toUpperCase();
            obstacles = [];
            isPaused = false;
            spawnObstacles();
        }

        function spawnObstacles() {
            const current = words[currentWordIndex];
            let choices = [current];
            let others = words.filter(w => w.word !== current.word);
            others.sort(() => Math.random() - 0.5);
            choices.push(others[0], others[1]);
            choices.sort(() => Math.random() - 0.5);

            choices.forEach((c, i) => {
                obstacles.push({
                    x: (i * (canvas.width / 3)) + (canvas.width / 6),
                    y: -200 - (i * 150),
                    word: c.word,
                    isCorrect: c.word === current.word,
                    w: 80,
                    h: 80
                });
            });
        }

        function handleListen() {
            const utterance = new SpeechSynthesisUtterance(words[currentWordIndex].word);
            utterance.lang = 'en-US';
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        function nextLevel() {
            document.getElementById('win-screen').style.display = 'none';
            currentWordIndex = (currentWordIndex + 1) % words.length;
            setupLevel();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Road
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'white';
            ctx.setLineDash([40, 40]);
            ctx.lineWidth = 5;
            roadOffset = (roadOffset + speed) % 80;
            
            for(let i=1; i<3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * (canvas.width / 3), -80 + roadOffset);
                ctx.lineTo(i * (canvas.width / 3), canvas.height + 80);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            if (!isPaused) {
                player.x += (player.targetX - player.x) * 0.15;
                
                obstacles.forEach(obs => {
                    obs.y += speed;
                    
                    // Collision
                    if (Math.abs(player.x - obs.x) < 50 && Math.abs(player.y - obs.y) < 70) {
                        if (obs.isCorrect) {
                            score += 10;
                            document.getElementById('score').innerText = score;
                            isPaused = true;
                            document.getElementById('win-screen').style.display = 'flex';
                            const msg = new SpeechSynthesisUtterance("Excellent");
                            msg.rate = 0.8;
                            speechSynthesis.speak(msg);
                        } else {
                            obs.y = -1000;
                        }
                    }
                });
                
                if (obstacles.every(o => o.y > canvas.height || o.y < -500)) {
                    spawnObstacles();
                }
            }

            // Draw Obstacles
            obstacles.forEach(obs => {
                const img = assets[obs.word];
                if (img && img.complete) {
                    ctx.drawImage(img, obs.x - 40, obs.y - 40, 80, 80);
                } else {
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(obs.x - 40, obs.y - 40, 80, 80);
                }
                
                ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
                ctx.beginPath();
                ctx.roundRect(obs.x - 40, obs.y + 45, 80, 24, 8);
                ctx.fill();
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px Cairo';
                ctx.textAlign = 'center';
                ctx.fillText(obs.word.toUpperCase(), obs.x, obs.y + 62);
            });

            // Draw Player
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.roundRect(player.x - 30, player.y - 50, 60, 100, 15);
            ctx.fill();
            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(player.x - 20, player.y - 40, 40, 30);

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointermove', (e) => {
            if (isPaused) return;
            player.targetX = e.clientX;
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 150;
        });

        initGame();
    </script>
</body>
</html>
