<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fishing Game - لعبة الصياد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../game_engine.js?v=5.5.0"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #0ea5e9; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const words = [{"word": "Apple", "image": "../../../assets/p1/apple.png"}, {"word": "Ball", "image": "../../../assets/p1/ball.png"}, {"word": "Cat", "image": "../../../assets/p1/cat.png"}, {"word": "Dog", "image": "../../../assets/p1/dog.png"}, {"word": "Egg", "image": "../../../assets/p1/egg.png"}, {"word": "bag", "image": "../../../assets/p1/bag.png"}, {"word": "board", "image": "../../../assets/p1/board.png"}, {"word": "book", "image": "../../../assets/p1/book.png"}, {"word": "chair", "image": "../../../assets/p1/chair.png"}, {"word": "desk", "image": "../../../assets/p1/desk.png"}, {"word": "ill", "image": "../../../assets/p1/ill.png"}, {"word": "in", "image": "../../../assets/p1/in.png"}, {"word": "ink", "image": "../../../assets/p1/ink.png"}, {"word": "insect", "image": "../../../assets/p1/insect.png"}, {"word": "open your books", "image": "../../../assets/p1/open_your_books.png"}, {"word": "pencil", "image": "../../../assets/p1/pencil.png"}, {"word": "sit down", "image": "../../../assets/p1/sit_down.png"}, {"word": "stand up", "image": "../../../assets/p1/stand_up.png"}];
        let currentWordIndex = 0;
        let hook = { x: 0, y: 120, length: 50, state: 'swing', angle: 0, speed: 0.03 };
        let fish = [];

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            hook.x = canvas.width / 2;
            
            Engine.init({
                onListen: () => Engine.speak(words[currentWordIndex].word),
                onContinue: nextLevel
            });
            
            setupLevel();
            animate();
        }

        function setupLevel() {
            const current = words[currentWordIndex];
            document.getElementById('engine-target-word').innerText = current.word.toUpperCase();
            fish = [];
            hook.length = 50;
            hook.state = 'swing';
            
            const choices = Engine.getChoices(words, currentWordIndex, 3);
            choices.forEach((c, i) => {
                const img = new Image();
                img.src = c.image;
                fish.push({
                    x: (i + 1) * (canvas.width / 4),
                    y: canvas.height - 150,
                    word: c.word,
                    img: img,
                    isCorrect: c.word === current.word,
                    caught: false,
                    w: 80,
                    h: 80
                });
            });
        }

        function nextLevel() {
            currentWordIndex = (currentWordIndex + 1) % words.length;
            setupLevel();
            Engine.hideWin();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Water
            ctx.fillStyle = '#0ea5e9';
            ctx.fillRect(0, 120, canvas.width, canvas.height - 120);
            
            if (!Engine.isPaused) {
                // Hook Logic
                if (hook.state === 'swing') {
                    hook.angle += hook.speed;
                    if (Math.abs(hook.angle) > 0.8) hook.speed *= -1;
                } else if (hook.state === 'extend') {
                    hook.length += 15;
                    if (hook.length > canvas.height - 150) hook.state = 'retract';
                } else if (hook.state === 'retract') {
                    hook.length -= 15;
                    if (hook.length <= 50) {
                        hook.length = 50;
                        hook.state = 'swing';
                    }
                }

                // Collision
                let hx = hook.x + Math.sin(hook.angle) * hook.length;
                let hy = hook.y + Math.cos(hook.angle) * hook.length;

                fish.forEach(f => {
                    if (hook.state === 'extend' && !f.caught) {
                        if (Math.abs(hx - f.x) < 40 && Math.abs(hy - f.y) < 40) {
                            f.caught = true;
                            hook.state = 'retract';
                            if (f.isCorrect) {
                                Engine.showWin();
                            } else {
                                Engine.shake();
                                setTimeout(() => f.caught = false, 1000);
                            }
                        }
                    }
                    
                    if (f.caught) {
                        f.x = hx;
                        f.y = hy;
                    }
                });
            }

            // Draw Hook Line
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(hook.x, hook.y);
            let hx = hook.x + Math.sin(hook.angle) * hook.length;
            let hy = hook.y + Math.cos(hook.angle) * hook.length;
            ctx.lineTo(hx, hy);
            ctx.stroke();
            
            // Draw Hook End
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.arc(hx, hy, 8, 0, Math.PI * 2);
            ctx.fill();

            // Draw Fish
            fish.forEach(f => {
                ctx.save();
                ctx.translate(f.x, f.y);
                if (f.img && f.img.complete) ctx.drawImage(f.img, -40, -40, 80, 80);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Cairo';
                ctx.textAlign = 'center';
                ctx.fillText(f.word.toUpperCase(), 0, 55);
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button')) return;
            if (!Engine.isPaused && hook.state === 'swing') {
                hook.state = 'extend';
            }
        });

        initGame();
    </script>
</body>
</html>
