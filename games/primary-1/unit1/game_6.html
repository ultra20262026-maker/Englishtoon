<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fisherman Game - لعبة الصياد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../game_engine.js?v=5.5.2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #0c4a6e; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const words = [{"word": "Apple", "image": "../../../assets/p1/apple.png"}, {"word": "Ball", "image": "../../../assets/p1/ball.png"}, {"word": "Cat", "image": "../../../assets/p1/cat.png"}, {"word": "Dog", "image": "../../../assets/p1/dog.png"}, {"word": "Egg", "image": "../../../assets/p1/egg.png"}, {"word": "bag", "image": "../../../assets/p1/bag.png"}, {"word": "board", "image": "../../../assets/p1/board.png"}, {"word": "book", "image": "../../../assets/p1/book.png"}, {"word": "chair", "image": "../../../assets/p1/chair.png"}, {"word": "desk", "image": "../../../assets/p1/desk.png"}, {"word": "ill", "image": "../../../assets/p1/ill.png"}, {"word": "in", "image": "../../../assets/p1/in.png"}, {"word": "ink", "image": "../../../assets/p1/ink.png"}, {"word": "insect", "image": "../../../assets/p1/insect.png"}, {"word": "open your books", "image": "../../../assets/p1/open_your_books.png"}, {"word": "pencil", "image": "../../../assets/p1/pencil.png"}, {"word": "sit down", "image": "../../../assets/p1/sit_down.png"}, {"word": "stand up", "image": "../../../assets/p1/stand_up.png"}];
        let currentWordIndex = 0;
        let fish = [];
        let hook = { x: 0, y: 100, targetY: 100, active: false, caught: null };

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            hook.x = canvas.width / 2;
            
            Engine.init({
                onListen: () => Engine.speak(words[currentWordIndex].word),
                onContinue: nextLevel
            });
            
            setupLevel();
            animate();
        }

        function setupLevel() {
            const current = words[currentWordIndex];
            const targetWordEl = document.getElementById('engine-target-word');
            if(targetWordEl) targetWordEl.innerText = current.word.toUpperCase();
            
            fish = [];
            hook.active = false;
            hook.targetY = 100;
            hook.caught = null;
            
            const choices = Engine.getChoices(words, currentWordIndex, 3);
            choices.forEach((c, i) => {
                const img = new Image();
                img.src = c.image;
                fish.push({
                    x: (i + 1) * (canvas.width / 4),
                    y: canvas.height - 200,
                    word: c.word,
                    img: img,
                    isCorrect: c.word === current.word,
                    speed: 1.2,
                    dir: Math.random() > 0.5 ? 1 : -1,
                    caught: false
                });
            });
        }

        function nextLevel() {
            currentWordIndex = (currentWordIndex + 1) % words.length;
            setupLevel();
            Engine.hideWin();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Water
            ctx.fillStyle = '#075985';
            ctx.fillRect(0, 100, canvas.width, canvas.height - 100);
            
            if (!Engine.isPaused) {
                // Update Fish
                fish.forEach(f => {
                    if (!f.caught) {
                        f.x += f.speed * f.dir;
                        if (f.x < 50 || f.x > canvas.width - 50) f.dir *= -1;
                    }
                });

                // Update Hook
                if (hook.active) {
                    if (hook.y < hook.targetY) hook.y += 10;
                    else if (hook.y > 100) hook.y -= 5;
                    else hook.active = false;

                    // Collision
                    if (hook.y >= hook.targetY - 10 && !hook.caught) {
                        fish.forEach(f => {
                            if (!f.caught && Math.abs(hook.x - f.x) < 50 && Math.abs(hook.y - f.y) < 50) {
                                hook.caught = f;
                                f.caught = true;
                                if (f.isCorrect) {
                                    Engine.showWin();
                                } else {
                                    Engine.shake();
                                    setTimeout(() => {
                                        f.caught = false;
                                        hook.caught = null;
                                        setupLevel();
                                    }, 500);
                                }
                            }
                        });
                    }
                }
                
                if (hook.caught) {
                    hook.caught.x = hook.x;
                    hook.caught.y = hook.y + 40;
                }
            }

            // Draw Hook Line
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(hook.x, 0);
            ctx.lineTo(hook.x, hook.y);
            ctx.stroke();
            
            // Draw Hook
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(hook.x, hook.y, 10, 0, Math.PI);
            ctx.stroke();

            // Draw Fish
            fish.forEach(f => {
                ctx.save();
                ctx.translate(f.x, f.y);
                if (f.dir < 0) ctx.scale(-1, 1);
                if (f.img && f.img.complete) ctx.drawImage(f.img, -40, -40, 80, 80);
                ctx.restore();
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Cairo';
                ctx.textAlign = 'center';
                ctx.fillText(f.word.toUpperCase(), f.x, f.y + 55);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button')) return;
            if (!Engine.isPaused && !hook.active) {
                hook.x = e.clientX;
                hook.targetY = e.clientY;
                hook.active = true;
            }
        });

        initGame();
    </script>
</body>
</html>
