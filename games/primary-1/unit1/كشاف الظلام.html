<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>كشاف الظلام (What is this?)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; font-family: 'Cairo', 'Fredoka One', sans-serif; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; height: 100vh;}
        
        .game-container {
            width: 95vw;
            height: 85vh;
            background: #2c3e50;
            border-radius: 20px;
            border: 5px solid #bdc3c7;
            position: relative;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .choices-area {
            flex: 0.4;
            background: #34495e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            border-right: 5px solid #2c3e50;
            z-index: 20;
        }

        .choice-btn {
            width: 90% !important;
            max-width: 300px !important;
            height: auto !important; 
            min-height: 60px !important; 
            padding: 12px 15px !important; 
            white-space: normal !important; 
            word-wrap: break-word !important;
            line-height: 1.4 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            font-size: 1.5rem !important;
            border-radius: 15px !important;
            background-color: #f1c40f !important;
            color: #2c3e50 !important;
            border: none !important;
            cursor: pointer !important;
            box-shadow: 0 6px 0 #d4ac0d !important;
            transition: all 0.1s ease !important;
            font-family: 'Fredoka One', sans-serif;
        }

        .choice-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d4ac0d !important; }

        .image-area {
            flex: 1;
            position: relative;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .target-img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            user-select: none;
            pointer-events: none;
        }

        .darkness {
            position: absolute;
            inset: 0;
            background: #000;
            pointer-events: auto;
            touch-action: none;
            -webkit-mask-image: radial-gradient(circle 150px at 50% 50%, transparent 0%, black 100%);
            mask-image: radial-gradient(circle 150px at 50% 50%, transparent 0%, black 100%);
            z-index: 10;
        }

        .ui-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 1.5rem; color: #f1c40f; pointer-events: none; z-index: 30; text-shadow: 2px 2px 0 #000;}
        
        .screen { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; color: white;}
        button.start { font-family: 'Cairo', sans-serif; font-size: 2.5rem; padding: 15px 50px; background: #e74c3c; border: none; border-radius: 50px; color: white; cursor: pointer; box-shadow: 0 8px 0 #c0392b;}
        button.start:active { transform: translateY(8px); box-shadow: 0 0 0; }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .game-container { flex-direction: column-reverse; }
            .choices-area { flex: 0.5; flex-direction: row; flex-wrap: wrap; border-right: none; border-top: 5px solid #2c3e50; gap: 10px;}
            .choice-btn { font-size: 1.2rem !important; padding: 8px 15px !important; width: 45% !important; min-height: 50px !important; }
            .darkness { -webkit-mask-image: radial-gradient(circle 100px at 50% 50%, transparent 0%, black 100%); }
        }
    </style>
</head>
<body>
    
    <div class="game-container">
        <div class="ui-top">
            <div>المرحلة: <span id="level">1</span></div>
            <div>نقاط: <span id="score">0</span></div>
        </div>

        <div class="choices-area" id="options">
            <!-- Buttons injected by JS -->
        </div>

        <div class="image-area">
            <img src="" class="target-img" id="target-img">
            <div class="darkness" id="darkness"></div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1 style="font-size: 3rem; color: #f1c40f;">كشاف الظلام 🔦</h1>
        <p style="font-size: 1.2rem; margin: 20px;">حرك إصبعك لاكتشاف الصورة في الظلام وأجب عن السؤال: What is this?</p>
        <button class="start" onclick="startGame()">ابدأ الآن</button>
    </div>

    <div id="end-screen" class="screen hidden">
        <h1 style="font-size: 3rem; color: #f1c40f;">أحسنت يا بطل! 🌟</h1>
        <p style="font-size: 2rem;">نقاطك النهائية: <span id="final-score">0</span></p>
        <button class="start" onclick="startGame()" style="margin-top: 30px;">العب مرة أخرى</button>
    </div>

    <script>
        const vocabulary = [
            { word: "Apple", img: "https://cdn-icons-png.flaticon.com/512/415/415733.png" },
            { word: "Ball", img: "https://cdn-icons-png.flaticon.com/512/2964/2964514.png" },
            { word: "Cat", img: "https://cdn-icons-png.flaticon.com/512/616/616430.png" },
            { word: "Dog", img: "https://cdn-icons-png.flaticon.com/512/616/616408.png" },
            { word: "Egg", img: "https://cdn-icons-png.flaticon.com/512/837/837713.png" }
        ];

        let currentQ = 0;
        let score = 0;
        let locked = false;

        function startGame() {
            currentQ = 0;
            score = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            locked = false;
            const q = vocabulary[currentQ];
            document.getElementById('target-img').src = q.img;
            document.getElementById('level').textContent = currentQ + 1;
            
            // Reset darkness to initial state
            resetDarkness();

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            // Create options: correct one + 3 random ones
            let choices = [q.word];
            let others = vocabulary.filter(v => v.word !== q.word);
            others.sort(() => Math.random() - 0.5);
            choices.push(...others.slice(0, 3).map(v => v.word));
            choices.sort(() => Math.random() - 0.5);
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice;
                btn.onclick = () => checkAnswer(choice, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedWord, btn) {
            if (locked) return;
            
            const correctWord = vocabulary[currentQ].word;
            if (selectedWord === correctWord) {
                locked = true;
                score += 10;
                document.getElementById('score').textContent = score;
                btn.style.backgroundColor = "#2ecc71 !important";
                btn.style.color = "white !important";
                
                // Reveal the image
                document.getElementById('darkness').style.maskImage = 'none';
                document.getElementById('darkness').style.webkitMaskImage = 'none';
                
                setTimeout(() => {
                    currentQ++;
                    if (currentQ < vocabulary.length) {
                        loadQuestion();
                    } else {
                        showEndScreen();
                    }
                }, 1500);
            } else {
                btn.style.backgroundColor = "#e74c3c !important";
                btn.style.color = "white !important";
                setTimeout(() => {
                    btn.style.backgroundColor = "#f1c40f !important";
                    btn.style.color = "#2c3e50 !important";
                }, 500);
            }
        }

        function resetDarkness() {
            const mask = 'radial-gradient(circle 150px at 50% 50%, transparent 0%, black 100%)';
            document.getElementById('darkness').style.maskImage = mask;
            document.getElementById('darkness').style.webkitMaskImage = mask;
        }

        function showEndScreen() {
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
        }

        // Flashlight movement logic
        const darkness = document.getElementById('darkness');
        function moveFlashlight(e) {
            const rect = darkness.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            const mask = `radial-gradient(circle 150px at ${x}px ${y}px, transparent 0%, black 100%)`;
            darkness.style.maskImage = mask;
            darkness.style.webkitMaskImage = mask;
        }

        darkness.addEventListener('mousemove', moveFlashlight);
        darkness.addEventListener('touchmove', (e) => {
            e.preventDefault();
            moveFlashlight(e);
        }, { passive: false });
    </script>
</body>
</html>
