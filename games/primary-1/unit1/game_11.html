
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meteor Hunter - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #0f172a; overflow: hidden; touch-action: none; }
        #gameCanvas { width: 100%; height: 100vh; display: block; }
        .game-ui { pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>
    <div class="game-ui fixed inset-0 z-10 flex flex-col p-4">
        <div class="flex justify-between items-start">
            <div class="bg-white/10 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-white/20 flex items-center gap-4 pointer-events-auto text-white">
                <div><span class="text-xs font-bold block uppercase opacity-70">Rocks</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-white/20"></div>
                <div class="text-amber-400">
                    <span class="text-xs font-bold block uppercase opacity-70">Stars</span>
                    <span id="stars" class="text-2xl font-black">0</span>
                </div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/10 backdrop-blur flex items-center justify-center text-white/50 shadow-lg border-2 border-white/20">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-indigo-400 w-full max-w-md text-center pointer-events-auto">
                <h2 class="text-indigo-500 font-bold text-lg mb-1 uppercase tracking-widest">Blast the Meteor:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="../../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"]');
        let width, height, currentWord, meteors = [];
        
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
            meteors = [];
            for(let i=0; i<4; i++) {
                let word = (i === 0) ? currentWord : vocab[Math.floor(Math.random()*vocab.length)];
                meteors.push({
                    word, isCorrect: word === currentWord,
                    x: Math.random()*(width-100)+50, y: Math.random()*(height-400)+350, r: 50,
                    img: new Image(), color: `hsl(${Math.random()*360}, 50%, 50%)`
                });
                meteors[i].img.src = Engine.getAssetPath(word);
            }
        }

        function gameLoop() {
            ctx.clearRect(0,0,width,height);
            meteors.forEach(m => {
                ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
                ctx.fillStyle = m.color; ctx.fill();
                ctx.drawImage(m.img, m.x-m.r+15, m.y-m.r+15, m.r*2-30, m.r*2-30);
                ctx.fillStyle = 'white'; ctx.font = 'bold 14px Fredoka'; ctx.textAlign='center';
                ctx.fillText(m.word, m.x, m.y + m.r + 20);
            });
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('mousedown', (e) => {
            meteors.forEach((m, i) => {
                if(Math.hypot(e.clientX-m.x, e.clientY-m.y) < m.r) {
                    if(m.isCorrect) { Engine.addScore(25); Engine.showFeedback(true); setTimeout(nextQuestion, 1000); }
                    else { Engine.showFeedback(false); meteors.splice(i, 1); }
                }
            });
        });
        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        nextQuestion(); gameLoop();
    </script>
</body>
</html>
