<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Slasher - قاطع الفواكه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js?v=5.4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background: #450a0a; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="fixed top-20 left-1/2 -translate-x-1/2 text-center z-50 pointer-events-none">
        <div class="bg-black/40 backdrop-blur-md p-4 rounded-3xl border border-white/20">
            <p class="text-orange-400 text-xs font-bold uppercase mb-1">اقطع الكلمة:</p>
            <h2 id="target-word" class="text-white text-3xl font-black">APPLE</h2>
            <button onclick="Engine.speak(document.getElementById('target-word').innerText)" class="pointer-events-auto mt-2 bg-orange-600 p-2 rounded-full shadow-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"];
        let currentTarget = "";
        let fruits = [];
        let trail = [];

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            nextLevel();
            Engine.init();
            animate();
        }

        function nextLevel() {
            currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('target-word').innerText = currentTarget.toUpperCase();
            fruits = [];
            spawnFruits();
        }

        function spawnFruits() {
            if (fruits.length >= 3) return;
            const choices = Engine.getWords(vocab, 3);
            if (!choices.includes(currentTarget)) choices[0] = currentTarget;
            
            choices.forEach((text, i) => {
                Engine.loadSprite(text, (img) => {
                    fruits.push({
                        x: (i + 1) * (canvas.width / 4),
                        y: canvas.height + 100,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -15 - Math.random() * 5,
                        text: text,
                        img: img,
                        sliced: false
                    });
                });
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (Engine.gameActive) {
                // Draw Trail
                if (trail.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 5;
                    ctx.moveTo(trail[0].x, trail[0].y);
                    for(let i=1; i<trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
                    ctx.stroke();
                    trail.shift();
                }

                // Update Fruits
                fruits.forEach((f, fi) => {
                    f.x += f.vx;
                    f.y += f.vy;
                    f.vy += 0.2; // Gravity

                    if(f.img) ctx.drawImage(f.img, f.x - 50, f.y - 50, 100, 100);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Cairo';
                    ctx.textAlign = 'center';
                    ctx.fillText(f.text.toUpperCase(), f.x, f.y + 70);

                    // Slice detection
                    if (!f.sliced && trail.length > 0) {
                        const last = trail[trail.length-1];
                        if (Math.abs(last.x - f.x) < 50 && Math.abs(last.y - f.y) < 50) {
                            f.sliced = true;
                            if (f.text === currentTarget) {
                                fruits = [];
                                Engine.addScore(100);
                                Engine.showFeedback(true);
                                Engine.showWinScreen(() => nextLevel());
                            } else {
                                Engine.addScore(-20);
                                Engine.showFeedback(false);
                            }
                        }
                    }

                    if (f.y > canvas.height + 200) {
                        fruits.splice(fi, 1);
                        if (fruits.length === 0) spawnFruits();
                    }
                });
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('pointermove', (e) => {
            if (!Engine.gameActive) return;
            trail.push({ x: e.clientX, y: e.clientY });
            if (trail.length > 10) trail.shift();
        });

        initGame();
    </script>
</body>
</html>
