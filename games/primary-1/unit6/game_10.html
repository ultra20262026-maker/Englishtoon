<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; }
        canvas { display: block; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .btn-action { background: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-action:active { transform: scale(0.95); }
    </style>

    <title>Dictation</title>
</head>
<body class="bg-sky-100">
    
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Spell the word:</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["ball", "banana", "bike", "bird", "boy", "cage", "cat", "chair", "couch", "dog", "elephant", "giraffe", "in", "jacket", "jam", "jar", "jeans", "jellyfish", "lamp", "leaf", "lemon", "lion", "lunch", "monkey", "on", "snake", "table", "tiger", "turtle", "umbrella", "under", "unlock", "up"]');
        let width, height, currentWord;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        
        let letters = [], slots = [], targetLetters = [];
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = "???";
            targetLetters = currentWord.toUpperCase().split('');
            slots = targetLetters.map((l, i) => ({ x: width/2 - (targetLetters.length*30) + i*60, y: 300, w: 50, h: 50, letter: null }));
            letters = targetLetters.map((l, i) => ({ 
                l, 
                x: Math.random()*(width-100)+50, 
                y: 450 + Math.random()*150, 
                origX: 0, origY: 0,
                dragging: false 
            })).sort(() => Math.random()-0.5);
        }
        function loop() {
            ctx.clearRect(0,0,width,height);
            slots.forEach(s => {
                ctx.strokeStyle = '#94a3b8'; ctx.strokeRect(s.x, s.y, s.w, s.h);
                if(s.letter) { ctx.fillStyle='#1e293b'; ctx.font='bold 30px Fredoka'; ctx.fillText(s.letter, s.x+15, s.y+35); }
            });
            letters.forEach(l => {
                if(!l.dragging) {
                    ctx.fillStyle='#3b82f6'; ctx.fillRect(l.x-25, l.y-25, 50, 50);
                    ctx.fillStyle='white'; ctx.font='bold 30px Fredoka'; ctx.fillText(l.l, l.x-10, l.y+10);
                }
            });
            let dragging = letters.find(l => l.dragging);
            if(dragging) {
                ctx.fillStyle='#2563eb'; ctx.fillRect(dragging.x-30, dragging.y-30, 60, 60);
                ctx.fillStyle='white'; ctx.font='bold 35px Fredoka'; ctx.fillText(dragging.l, dragging.x-12, dragging.y+12);
            }
            requestAnimationFrame(loop);
        }
        canvas.addEventListener('mousedown', (e) => {
            let l = letters.find(l => Math.hypot(e.clientX-l.x, e.clientY-l.y) < 30);
            if(l) { l.dragging = true; l.origX = l.x; l.origY = l.y; }
        });
        canvas.addEventListener('mousemove', (e) => {
            let l = letters.find(l => l.dragging);
            if(l) { l.x = e.clientX; l.y = e.clientY; }
        });
        canvas.addEventListener('mouseup', (e) => {
            let l = letters.find(l => l.dragging);
            if(l) {
                l.dragging = false;
                let s = slots.find(s => !s.letter && e.clientX > s.x && e.clientX < s.x+s.w && e.clientY > s.y && e.clientY < s.y+s.h);
                if(s && l.l === targetLetters[slots.indexOf(s)]) {
                    s.letter = l.l;
                    letters.splice(letters.indexOf(l), 1);
                    if(letters.length === 0) { Engine.addScore(20); Engine.showFeedback(true); setTimeout(nextQuestion, 1500); }
                } else { l.x = l.origX; l.y = l.origY; }
            }
        });
    
        
        window.onload = () => {
            if (window.Engine) {
                Engine.init();
                if (typeof nextQuestion === 'function') nextQuestion();
                if (typeof loop === 'function') loop();
            }
        };
    </script>
</body>
</html>
