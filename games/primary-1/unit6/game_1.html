<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; background: #f0f9ff; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        </style>

    <title>Cannon Aim</title>
</head>
<body class="bg-sky-50">
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Shoot the target:</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    


    <canvas id="gameCanvas"></canvas>
    <script src="../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["ball", "banana", "bike", "bird", "boy", "cage", "cat", "chair", "couch", "dog", "elephant", "giraffe", "in", "jacket", "jam", "jar", "jeans", "jellyfish", "lamp", "leaf", "lemon", "lion", "lunch", "monkey", "on", "snake", "table", "tiger", "turtle", "umbrella", "under", "unlock", "up"]');
        let width, height, currentWord;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        
    let targets = [], projectiles = [];
    function initGame() { nextQuestion(); loop(); }
    function nextQuestion() {
        currentWord = vocab[Math.floor(Math.random()*vocab.length)];
        document.getElementById('targetWord').innerText = currentWord;
        targets = [];
        for(let i=0; i<3; i++) {
            let w = (i===0) ? currentWord : vocab[Math.floor(Math.random()*vocab.length)];
            targets.push({word: w, x: Math.random()*(width-100)+50, y: -50, s: 0.5+Math.random(), img: new Image()});
            targets[i].img.src = Engine.getAssetPath(w);
        }
        targets.sort(() => Math.random()-0.5);
    }
    function loop() {
        ctx.clearRect(0,0,width,height);
        ctx.fillStyle='#334155'; ctx.beginPath(); ctx.arc(width/2, height, 60, Math.PI, 0); ctx.fill();
        targets.forEach((t, i) => {
            t.y += t.s * Engine.speed;
            if(t.img.complete) ctx.drawImage(t.img, t.x-40, t.y-40, 80, 80);
            if(t.y > height) { targets.splice(i, 1); if(targets.length===0) nextQuestion(); }
        });
        projectiles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; ctx.fillStyle='red'; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill();
            targets.forEach((t, j) => {
                if(Math.hypot(p.x-t.x, p.y-t.y) < 40) {
                    projectiles.splice(i, 1);
                    if(t.word === currentWord) { Engine.addScore(10); Engine.showFeedback(true); nextQuestion(); }
                    else Engine.showFeedback(false);
                }
            });
        });
        requestAnimationFrame(loop);
    }
    function handleAction(e) {
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        if (clientX === undefined) return;
        let a = Math.atan2(clientY-height, clientX-width/2);
        projectiles.push({x: width/2, y: height, vx: Math.cos(a)*12, vy: Math.sin(a)*12});
    }
    canvas.addEventListener('mousedown', handleAction);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); handleAction(e); }, {passive:false});
    

        window.onload = () => {
            if (window.Engine) {
                Engine.init();
                if (typeof initGame === 'function') initGame();
            }
        };
    </script>
</body>
</html>
