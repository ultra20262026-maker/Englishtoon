<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; touch-action: none; margin: 0; background: #0f172a; color: white; }
        canvas { display: block; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .arcade-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 2px solid rgba(59, 130, 246, 0.5); border-radius: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>

    <title>قافزة المنصات</title>
</head>
<body>
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="arcade-card p-3 flex items-center gap-4 interactive">
                <div class="text-blue-400"><span class="text-[10px] font-black block uppercase tracking-widest">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-slate-700"></div>
                <div class="text-amber-400"><span class="text-[10px] font-black block uppercase tracking-widest">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl arcade-card flex items-center justify-center text-slate-400 active:scale-90 transition-all">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="arcade-card p-4 w-full max-w-md text-center interactive border-b-4 border-blue-600">
                <h2 class="text-blue-400 font-black text-xs mb-1 uppercase tracking-widest">اقفز لـ:</h2>
                <div id="targetWord" class="text-4xl font-black text-white mb-3 drop-shadow-lg">...</div>
                <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-8 py-2 rounded-xl font-black shadow-xl flex items-center gap-3 mx-auto transition-all active:scale-95">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = ["ball", "banana", "bike", "bird", "boy", "cage", "cat", "chair", "couch", "dog", "elephant", "giraffe", "in", "jacket", "jam", "jar", "jeans", "jellyfish", "lamp", "leaf", "lemon", "lion", "lunch", "monkey", "on", "snake", "table", "tiger", "turtle", "umbrella", "under", "unlock", "up"];
        let width, height, currentWord;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Logic for Doodle Jump Style\n function initGame(){nextQuestion();loop();} function nextQuestion(){currentWord=vocab[Math.floor(Math.random()*vocab.length)];document.getElementById('targetWord').innerText=currentWord;} function loop(){ctx.clearRect(0,0,width,height); ctx.fillStyle='white'; ctx.font='20px Cairo'; ctx.fillText('Doodle Jump Style Arcade Mode', 50, 50); requestAnimationFrame(loop);}

        window.onload = () => {
            if (window.Engine) {
                Engine.init();
                if (typeof initGame === 'function') initGame();
            }
        };
    </script>
</body>
</html>
