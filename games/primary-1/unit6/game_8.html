
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Match - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #fff7ed; overflow: hidden; }
        .card { perspective: 1000px; height: 120px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; border: 4px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-front { background: #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; }
        .card-back { background: white; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; }
        .card-back img { max-width: 80%; max-height: 70%; object-contain: contain; }
        .card-back span { font-size: 0.7rem; font-weight: bold; color: #92400e; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="fixed inset-0 z-10 flex flex-col p-4 pointer-events-none">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-amber-200 flex items-center gap-4 pointer-events-auto">
                <div class="text-amber-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-amber-100"></div>
                <div class="text-orange-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="pointer-events-auto w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 text-center pointer-events-auto">
            <h2 class="text-amber-600 font-bold text-xl bg-white/80 backdrop-blur inline-block px-6 py-2 rounded-full shadow-sm border-2 border-amber-100">Find the Pairs!</h2>
        </div>
    </div>

    <div class="h-screen flex items-center justify-center pt-32 pb-10 px-4">
        <div id="grid" class="grid grid-cols-3 gap-3 w-full max-w-md"></div>
    </div>

    <script src="../../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["ball", "banana", "bike", "bird", "boy", "cage", "cat", "chair", "couch", "dog", "elephant", "giraffe", "in", "jacket", "jam", "jar", "jeans", "jellyfish", "lamp", "leaf", "lemon", "lion", "lunch", "monkey", "on", "snake", "table", "tiger", "turtle", "umbrella", "under", "unlock", "up"]');
        let flippedCards = [];
        let matchedCount = 0;

        function initGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            
            // Pick 6 random words and double them
            const gameWords = [...vocab].sort(() => 0.5 - Math.random()).slice(0, 6);
            const cards = [...gameWords, ...gameWords].sort(() => 0.5 - Math.random());
            
            cards.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back">
                            <img src="${Engine.getAssetPath(word)}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3081/3081840.png'">
                            <span>${word}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => flipCard(card, word);
                grid.appendChild(card);
            });
        }

        function flipCard(card, word) {
            if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            
            card.classList.add('flipped');
            flippedCards.push({ card, word });
            Engine.speak(word);
            
            if (flippedCards.length === 2) {
                setTimeout(checkMatch, 1000);
            }
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (c1.word === c2.word) {
                c1.card.classList.add('matched');
                c2.card.classList.add('matched');
                matchedCount++;
                Engine.addScore(50);
                if (matchedCount === 6) {
                    Engine.showFeedback(true);
                    setTimeout(initGame, 2000);
                }
            } else {
                c1.card.classList.remove('flipped');
                c2.card.classList.remove('flipped');
            }
            flippedCards = [];
        }

        initGame();
    </script>
</body>
</html>
