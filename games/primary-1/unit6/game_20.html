
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Hat - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #faf5ff; overflow: hidden; }
        .hat { cursor: pointer; transition: transform 0.5s; position: relative; }
        .hat.reveal { transform: translateY(-50px); }
        .item { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); opacity: 0; transition: all 0.5s; z-index: -1; }
        .hat.reveal .item { bottom: 80px; opacity: 1; }
    </style>
</head>
<body>
    <div class="fixed inset-0 z-10 flex flex-col p-4 pointer-events-none">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-purple-200 flex items-center gap-4 pointer-events-auto">
                <div class="text-purple-600"><span class="text-xs font-bold block uppercase">Magic</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-purple-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="pointer-events-auto w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 text-center pointer-events-auto">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-purple-400 w-full max-w-md mx-auto">
                <h2 class="text-purple-500 font-bold text-lg mb-1 uppercase tracking-widest">Find the hidden:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="bg-purple-500 hover:bg-purple-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    <div class="h-screen flex items-center justify-center pt-40 px-4">
        <div id="hats" class="flex gap-10"></div>
    </div>
    <script src="../../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["ball", "banana", "bike", "bird", "boy", "cage", "cat", "chair", "couch", "dog", "elephant", "giraffe", "in", "jacket", "jam", "jar", "jeans", "jellyfish", "lamp", "leaf", "lemon", "lion", "lunch", "monkey", "on", "snake", "table", "tiger", "turtle", "umbrella", "under", "unlock", "up"]');
        let currentWord;
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
            const container = document.getElementById('hats');
            container.innerHTML = '';
            const choices = [currentWord];
            while(choices.length < 3) {
                let w = vocab[Math.floor(Math.random()*vocab.length)];
                if(!choices.includes(w)) choices.push(w);
            }
            choices.sort(() => Math.random() - 0.5);
            choices.forEach(w => {
                const div = document.createElement('div');
                div.className = 'hat w-24 h-24 bg-slate-800 rounded-t-full border-b-8 border-slate-950 flex items-center justify-center';
                div.innerHTML = `<div class="item flex flex-col items-center"><img src="${Engine.getAssetPath(w)}" class="w-16 h-16 object-contain bg-white rounded-lg p-1 shadow-lg"><span class="text-purple-900 font-bold text-xs mt-2">${w}</span></div><div class="text-white text-3xl font-bold">🎩</div>`;
                div.onclick = () => {
                    div.classList.add('reveal');
                    if(w === currentWord) { Engine.addScore(40); Engine.showFeedback(true); setTimeout(nextQuestion, 1500); }
                    else { Engine.showFeedback(false); setTimeout(() => div.classList.remove('reveal'), 1000); }
                };
                container.appendChild(div);
            });
        }
        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        nextQuestion();
    </script>
</body>
</html>
