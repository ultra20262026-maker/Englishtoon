
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Race - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #bae6fd; overflow: hidden; touch-action: none; }
        #gameCanvas { width: 100%; height: 100vh; display: block; }
        .game-ui { pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>
    <div class="game-ui fixed inset-0 z-10 flex flex-col p-4">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-sky-200 flex items-center gap-4 pointer-events-auto">
                <div class="text-sky-600"><span class="text-xs font-bold block uppercase">Speed</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-sky-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-sky-400 w-full max-w-md text-center pointer-events-auto">
                <h2 class="text-sky-500 font-bold text-lg mb-1 uppercase tracking-widest">Fly to:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="bg-sky-500 hover:bg-sky-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="../../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["ball", "banana", "bike", "bird", "boy", "cage", "cat", "chair", "couch", "dog", "elephant", "giraffe", "in", "jacket", "jam", "jar", "jeans", "jellyfish", "lamp", "leaf", "lemon", "lion", "lunch", "monkey", "on", "snake", "table", "tiger", "turtle", "umbrella", "under", "unlock", "up"]');
        let width, height, currentWord, player, obstacles = [];
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; player = { x: width/2, y: height - 150, r: 30 }; }
        window.addEventListener('resize', resize); resize();
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
            obstacles = [];
            const lanes = [width/4, width/2, 3*width/4];
            lanes.forEach((lx, i) => {
                let w = (i === 1) ? currentWord : vocab[Math.floor(Math.random()*vocab.length)];
                obstacles.push({ x: lx, y: -100, r: 50, word: w, isCorrect: w === currentWord, img: new Image() });
                obstacles[i].img.src = Engine.getAssetPath(w);
            });
            obstacles.sort(() => Math.random() - 0.5);
            obstacles.forEach((o, i) => o.x = lanes[i]);
        }
        function gameLoop() {
            ctx.clearRect(0,0,width,height);
            obstacles.forEach(o => {
                o.y += 3;
                ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
                ctx.fillStyle = 'white'; ctx.fill(); ctx.strokeStyle = o.isCorrect ? '#0ea5e9' : '#cbd5e1'; ctx.lineWidth = 5; ctx.stroke();
                ctx.drawImage(o.img, o.x-o.r+10, o.y-o.r+10, o.r*2-20, o.r*2-20);
                if(Math.hypot(player.x-o.x, player.y-o.y) < player.r + o.r) {
                    if(o.isCorrect) { Engine.addScore(20); Engine.showFeedback(true); nextQuestion(); }
                    else { Engine.showFeedback(false); o.y = -200; }
                }
            });
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fillStyle = '#0ea5e9'; ctx.fill();
            if(obstacles.every(o => o.y > height)) nextQuestion();
            requestAnimationFrame(gameLoop);
        }
        canvas.addEventListener('mousemove', (e) => player.x = e.clientX);
        canvas.addEventListener('touchmove', (e) => player.x = e.touches[0].clientX);
        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        nextQuestion(); gameLoop();
    </script>
</body>
</html>
