<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حديقة الحيوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #27ae60; font-family: 'Cairo', 'Fredoka One', sans-serif; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; height: 100vh;}
        .game-container { width: 95vw; height: 85vh; background: #2ecc71; border-radius: 20px; border: 5px solid #fff; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;}
        .ui-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 1.5rem; color: #fff; pointer-events: none; z-index: 30; font-weight: bold;}
        .screen { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; color: white;}
        button.start { font-family: 'Cairo', sans-serif; font-size: 2.5rem; padding: 15px 50px; background: #f39c12; border: none; border-radius: 50px; color: white; cursor: pointer; box-shadow: 0 8px 0 #d35400;}
        button.start:active { transform: translateY(8px); box-shadow: 0 0 0; }
        .hidden-screen { display: none !important; }
        
        .word-board { background: white; color: #27ae60; padding: 10px 40px; border-radius: 50px; font-family: 'Fredoka One'; font-size: 3rem; box-shadow: 0 5px 0 #229954; cursor: pointer;}
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 90%; max-width: 500px;}
        .opt-box { background: rgba(255,255,255,0.8); border-radius: 15px; padding: 10px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s;}
        .opt-box:active { transform: scale(0.9); }
        .opt-content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .opt-content img { width: 80%; height: 80%; object-fit: contain; }
        .opt-content.emoji-mode { font-size: 60px; }
    </style>

<body>
    <div class="game-container" id="game-container">
        <div class="ui-top">
            <div>النقاط: <span id="score">0</span></div>
            <div>حديقة الحيوان 🦁</div>
        </div>
        
        <div class="word-board" id="word-board" onclick="if(currentWord) speak(currentWord.word)">word</div>
        <div class="grid" id="grid"></div>
        
    </div>
    <div id="start-screen" class="screen">
        <h1 style="font-size: 4rem; color: #f1c40f;">حديقة الحيوان 🦁</h1>
        <p style="font-size: 1.5rem;">ابحث عن الصورة الصحيحة للكلمة المسموعة!</p>
        <button class="start" onclick="startGame()">العب!</button>
    </div>
    <script>
        
const wordsData = [
  { word: "eye", image: "../../../images/games/p1/eye.png", type: "img" },
  { word: "mouth", image: "../../../images/games/p1/mouth.png", type: "img" },
  { word: "ear", image: "../../../images/games/p1/ear.png", type: "img" },
  { word: "head", image: "../../../images/games/p1/head.png", type: "img" },
  { word: "tongue", image: "../../../images/games/p1/tongue.png", type: "img" },
  { word: "arm", image: "../../../images/games/p1/arm.png", type: "img" },
  { word: "leg", image: "../../../images/games/p1/leg.png", type: "img" },
  { word: "foot", image: "../../../images/games/p1/foot.png", type: "img" },
  { word: "feet", image: "../../../images/games/p1/feet.png", type: "img" },
  { word: "toes", image: "../../../images/games/p1/toes.png", type: "img" },
  { word: "red", image: "../../../images/games/p1/red.png", type: "img" },
  { word: "rocket", image: "../../../images/games/p1/rocket.png", type: "img" },
  { word: "ring", image: "../../../images/games/p1/ring.png", type: "img" },
  { word: "rabbit", image: "../../../images/games/p1/rabbit.png", type: "img" },
  { word: "robot", image: "../../../images/games/p1/robot.png", type: "img" },
  { word: "egg", image: "../../../images/games/p1/egg.png", type: "img" },
  { word: "eggplant", image: "🍆", type: "emoji" },
  { word: "enter", image: "🚪", type: "emoji" },
  { word: "elephant", image: "🐘", type: "emoji" },
  { word: "elbow", image: "💪", type: "emoji" },
  { word: "touch", image: "👆", type: "emoji" },
  { word: "hear", image: "👂", type: "emoji" },
  { word: "see", image: "👀", type: "emoji" },
  { word: "taste", image: "👅", type: "emoji" },
  { word: "smell", image: "👃", type: "emoji" },
  { word: "car", image: "🚗", type: "emoji" },
  { word: "cat", image: "🐱", type: "emoji" },
  { word: "carrot", image: "🥕", type: "emoji" },
  { word: "cup", image: "☕", type: "emoji" },
  { word: "cake", image: "🎂", type: "emoji" },
  { word: "kite", image: "🪁", type: "emoji" },
  { word: "king", image: "👑", type: "emoji" },
  { word: "kitchen", image: "🍳", type: "emoji" },
  { word: "key", image: "🔑", type: "emoji" },
  { word: "hand", image: "✋", type: "emoji" },
  { word: "nose", image: "👃", type: "emoji" }
];

const synth = window.speechSynthesis;
function speak(text) {
    const utterThis = new SpeechSynthesisUtterance(text);
    utterThis.pitch = 1.3; utterThis.rate = 0.9;
    synth.speak(utterThis);
}

        let score = 0;
        let currentWord = null;
        let canClick = true;
        
        function renderOption(w) {
            if(w.type === 'emoji') return `<div class="opt-content emoji-mode">${w.image}</div>`;
            return `<div class="opt-content"><img src="${w.image}"></div>`;
        }

        function spawnLevel() {
            canClick = true;
            let selected = [...wordsData].sort(()=>0.5-Math.random()).slice(0,6);
            currentWord = selected[Math.floor(Math.random()*6)];
            
            document.getElementById('word-board').textContent = currentWord.word;
            speak(currentWord.word);
            
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            selected.forEach(w => {
                let box = document.createElement('div');
                box.className = 'opt-box';
                box.innerHTML = renderOption(w);
                
                box.onclick = () => {
                    if(!canClick) return;
                    if(w.word === currentWord.word) {
                        speak('Good job!'); score+=10; document.getElementById('score').textContent=score;
                        box.style.background = '#2ecc71'; box.style.transform = 'scale(1.1)';
                        canClick = false; setTimeout(spawnLevel, 1000);
                    } else {
                        speak('Try again'); box.style.background = '#e74c3c'; setTimeout(()=>box.style.background='rgba(255,255,255,0.8)', 500);
                    }
                };
                grid.appendChild(box);
            });
        }

        function startGame() { 
            document.getElementById('start-screen').classList.add('hidden-screen'); 
            score=0; document.getElementById('score').textContent=score;
            spawnLevel(); 
        }
    </script>
<!-- MOBILE-FIT-2027-body -->
<script id="mobile-fit-2027-js">
(function(){
  try {
    function fireResize(){ try { window.dispatchEvent(new Event('resize')); } catch(e){} }
    window.addEventListener('orientationchange', function(){ setTimeout(fireResize,150); setTimeout(fireResize,450); setTimeout(fireResize,900); });
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', fireResize); }
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e){
      var now = Date.now();
      if (now - lastTouchEnd <= 300) { e.preventDefault(); }
      lastTouchEnd = now;
    }, {passive:false});
  } catch(err) {}
})();
</script>
<!-- /MOBILE-FIT-2027-body -->
