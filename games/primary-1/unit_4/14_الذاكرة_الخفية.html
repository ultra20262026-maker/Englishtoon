    <style>
        body { margin: 0; background: #8e44ad; font-family: 'Cairo', 'Fredoka One', sans-serif; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; height: 100vh;}
        .game-container { width: 95vw; height: 85vh; background: #9b59b6; border-radius: 20px; border: 5px solid #fff; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .ui-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 1.5rem; color: #fff; pointer-events: none; z-index: 30; font-weight: bold;}
        .screen { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; color: white;}
        button.start { font-family: 'Cairo', sans-serif; font-size: 2.5rem; padding: 15px 50px; background: #f1c40f; border: none; border-radius: 50px; color: #333; cursor: pointer; box-shadow: 0 8px 0 #d4ac0d;}
        button.start:active { transform: translateY(8px); box-shadow: 0 0 0; }
        .hidden-screen { display: none !important; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 90%; max-width: 600px;}
        .card { background: #f39c12; border-radius: 15px; aspect-ratio: 1; position: relative; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; box-shadow: 0 5px 0 #d35400;}
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; display: flex; align-items: center; justify-content: center;}
        .card-front { background: #f1c40f; font-size: 3rem; color: white; display: flex; align-items: center; justify-content: center; content: '?'; }
        .card-front::after { content: '?'; }
        .card-back { background: white; transform: rotateY(180deg); color: #333; font-family: 'Fredoka One'; font-size: 1.5rem;}
        .card-back img { width: 80%; height: 80%; object-fit: contain; }
        .card-back.emoji-mode { font-size: 50px; }
        .card.matched { visibility: hidden; }
    </style>

<body>
    <div class="game-container" id="game-container">
        <div class="ui-top">
            <div>النقاط: <span id="score">0</span></div>
            <div>الذاكرة الخفية 🧠</div>
        </div>
        
        <div class="grid" id="grid"></div>
        
    </div>
    <div id="start-screen" class="screen">
        <h1 style="font-size: 4rem; color: #f1c40f;">الذاكرة الخفية 🧠</h1>
        <p style="font-size: 1.5rem;">طابق الكلمة مع صورتها الصحيحة!</p>
        <button class="start" onclick="startGame()">العب!</button>
    </div>
    <script>
let autoAdvanceTimer = null; // PRIMARY-AUTO-TIMER-FIX-2027

        
const wordsData = [
  { word: "eye", image: "../../../images/games/p1/eye.png", type: "img" },
  { word: "mouth", image: "../../../images/games/p1/mouth.png", type: "img" },
  { word: "ear", image: "../../../images/games/p1/ear.png", type: "img" },
  { word: "head", image: "../../../images/games/p1/head.png", type: "img" },
  { word: "tongue", image: "../../../images/games/p1/tongue.png", type: "img" },
  { word: "arm", image: "../../../images/games/p1/arm.png", type: "img" },
  { word: "leg", image: "../../../images/games/p1/leg.png", type: "img" },
  { word: "foot", image: "../../../images/games/p1/foot.png", type: "img" },
  { word: "feet", image: "../../../images/games/p1/feet.png", type: "img" },
  { word: "toes", image: "../../../images/games/p1/toes.png", type: "img" },
  { word: "red", image: "../../../images/games/p1/red.png", type: "img" },
  { word: "rocket", image: "../../../images/games/p1/rocket.png", type: "img" },
  { word: "ring", image: "../../../images/games/p1/ring.png", type: "img" },
  { word: "rabbit", image: "../../../images/games/p1/rabbit.png", type: "img" },
  { word: "robot", image: "../../../images/games/p1/robot.png", type: "img" },
  { word: "egg", image: "../../../images/games/p1/egg.png", type: "img" },
  { word: "eggplant", image: "🍆", type: "emoji" },
  { word: "enter", image: "🚪", type: "emoji" },
  { word: "elephant", image: "🐘", type: "emoji" },
  { word: "elbow", image: "💪", type: "emoji" },
  { word: "touch", image: "👆", type: "emoji" },
  { word: "hear", image: "👂", type: "emoji" },
  { word: "see", image: "👀", type: "emoji" },
  { word: "taste", image: "👅", type: "emoji" },
  { word: "smell", image: "👃", type: "emoji" },
  { word: "car", image: "🚗", type: "emoji" },
  { word: "cat", image: "🐱", type: "emoji" },
  { word: "carrot", image: "🥕", type: "emoji" },
  { word: "cup", image: "☕", type: "emoji" },
  { word: "cake", image: "🎂", type: "emoji" },
  { word: "kite", image: "🪁", type: "emoji" },
  { word: "king", image: "👑", type: "emoji" },
  { word: "kitchen", image: "🍳", type: "emoji" },
  { word: "key", image: "🔑", type: "emoji" },
  { word: "hand", image: "✋", type: "emoji" },
  { word: "nose", image: "👃", type: "emoji" }
];

const synth = window.speechSynthesis;
function speak(text) {
    const utterThis = new SpeechSynthesisUtterance(text);
    utterThis.pitch = 1.3; utterThis.rate = 0.9;
    synth.speak(utterThis);
}

        let score = 0;
        let firstCard = null;
        let lockBoard = false;
        let matches = 0;

        function renderImg(w) {
            if(w.type === 'emoji') return w.image;
            return `<img src="${w.image}">`;
        }

        function spawnLevel() {
            let selected = [...wordsData].sort(()=>0.5-Math.random()).slice(0, 4);
            let cardsArr = [];
            selected.forEach(w => {
                cardsArr.push({type: 'text', data: w.word, obj: w});
                cardsArr.push({type: 'img', data: w, obj: w});
            });
            cardsArr.sort(()=>0.5-Math.random());
            
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            matches = 0;
            
            cardsArr.forEach(c => {
                let card = document.createElement('div');
                card.className = 'card';
                card.dataset.word = c.obj.word;
                
                let inner = '';
                if(c.type === 'text') {
                    inner = `<div class="card-face card-front"></div><div class="card-face card-back">${c.data}</div>`;
                } else {
                    let eClass = c.data.type === 'emoji' ? 'emoji-mode' : '';
                    inner = `<div class="card-face card-front"></div><div class="card-face card-back ${eClass}">${renderImg(c.data)}</div>`;
                }
                card.innerHTML = inner;
                
                card.onclick = () => {
                    if(lockBoard) return;
                    if(card === firstCard) return;
                    
                    card.classList.add('flipped');
                    speak(c.obj.word);
                    
                    if(!firstCard) {
                        firstCard = card;
                        return;
                    }
                    
                    if(firstCard.dataset.word === card.dataset.word) {
                        speak('Match!'); score+=10; document.getElementById('score').textContent=score;
                        clearTimeout(autoAdvanceTimer); autoAdvanceTimer = setTimeout(() => {
                            firstCard.classList.add('matched');
                            card.classList.add('matched');
                            firstCard = null;
                            matches++;
                            if(matches === 4) { setTimeout(spawnLevel, 1000); }
                        }, 1000);
                    } else {
                        lockBoard = true;
                        clearTimeout(autoAdvanceTimer); autoAdvanceTimer = setTimeout(() => {
                            firstCard.classList.remove('flipped');
                            card.classList.remove('flipped');
                            firstCard = null;
                            lockBoard = false;
                        }, 1000);
                    }
                };
                grid.appendChild(card);
            });
        }

        function startGame() { 
            document.getElementById('start-screen').classList.add('hidden-screen'); 
            score=0; document.getElementById('score').textContent=score;
            spawnLevel(); 
        }
    </script>
<!-- MOBILE-FIT-2027-body -->
<script id="mobile-fit-2027-js">
(function(){
  try {
    function fireResize(){ try { window.dispatchEvent(new Event('resize')); } catch(e){} }
    window.addEventListener('orientationchange', function(){ setTimeout(fireResize,150); setTimeout(fireResize,450); setTimeout(fireResize,900); });
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', fireResize); }
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e){
      var now = Date.now();
      if (now - lastTouchEnd <= 300) { e.preventDefault(); }
      lastTouchEnd = now;
    }, {passive:false});
  } catch(err) {}
})();
</script>
