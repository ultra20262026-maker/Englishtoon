
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jumping Hero - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #e0f2fe; overflow: hidden; touch-action: none; }
        #gameCanvas { width: 100%; height: 100vh; display: block; }
        .game-ui { pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>
    <div class="game-ui fixed inset-0 z-10 flex flex-col p-4">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-sky-200 flex items-center gap-4 pointer-events-auto">
                <div class="text-sky-600"><span class="text-xs font-bold block uppercase">Height</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-sky-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-sky-400 w-full max-w-md text-center pointer-events-auto">
                <h2 class="text-sky-500 font-bold text-lg mb-1 uppercase tracking-widest">Jump to:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="bg-sky-500 hover:bg-sky-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="../../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["ant", "apple", "arm", "arrow", "axe", "bird", "butterfly", "flower", "grass", "sky", "snake", "spider", "spoon", "star", "sun", "tree"]');
        let width, height, currentWord, hero, platforms = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            hero = { x: width/2, y: height - 150, w: 50, h: 50, vy: 0, g: 0.5 };
        }
        window.addEventListener('resize', resize);
        resize();

        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
            platforms = [];
            for(let i=0; i<3; i++) {
                let word = (i === 0) ? currentWord : vocab[Math.floor(Math.random()*vocab.length)];
                platforms.push({
                    word, isCorrect: word === currentWord,
                    x: (width/4) * (i+1) - 50, y: height/2, w: 100, h: 20,
                    img: new Image()
                });
                platforms[i].img.src = Engine.getAssetPath(word);
            }
            platforms.sort(() => Math.random() - 0.5);
            hero.y = height - 150; hero.vy = 0;
        }

        function gameLoop() {
            ctx.clearRect(0,0,width,height);
            ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0, height-100, width, 100);
            
            platforms.forEach(p => {
                ctx.fillStyle = p.isCorrect ? '#38bdf8' : '#94a3b8';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.drawImage(p.img, p.x + p.w/2 - 20, p.y - 50, 40, 40);
                ctx.fillStyle = 'black'; ctx.font = 'bold 12px Fredoka'; ctx.textAlign='center';
                ctx.fillText(p.word, p.x + p.w/2, p.y + 35);
            });

            hero.vy += hero.g; hero.y += hero.vy;
            if(hero.y > height - 150) { hero.y = height - 150; hero.vy = 0; }

            platforms.forEach(p => {
                if(hero.vy > 0 && hero.y + hero.h > p.y && hero.y < p.y + p.h && hero.x + hero.w > p.x && hero.x < p.x + p.w) {
                    if(p.isCorrect) { Engine.addScore(30); Engine.showFeedback(true); setTimeout(nextQuestion, 1000); }
                    else { Engine.showFeedback(false); hero.vy = -10; }
                }
            });

            ctx.fillStyle = '#0ea5e9'; ctx.fillRect(hero.x, hero.y, hero.w, hero.h);
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('mousedown', (e) => {
            if(hero.y >= height - 150) hero.vy = -15;
            hero.x = e.clientX - 25;
        });
        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        nextQuestion(); gameLoop();
    </script>
</body>
</html>
