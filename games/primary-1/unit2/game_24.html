<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dictation Challenge - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #fdf4ff; overflow: hidden; touch-action: none; margin: 0; }
        .letter-box { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 900; border-radius: 10px; transition: all 0.2s; cursor: pointer; user-select: none; }
        .letter-slot { width: 45px; height: 45px; border: 2px dashed #d8b4fe; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.5); }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        @keyframes success { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .animate-success { animation: success 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-purple-50">
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-purple-200 flex items-center gap-4 interactive">
                <div class="text-purple-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-purple-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-purple-400 w-full max-w-md text-center interactive">
                <h2 class="text-purple-500 font-bold text-sm mb-1 uppercase tracking-widest">Dictation Master</h2>
                <div class="flex justify-center gap-4 my-2">
                    <img id="wordImage" src="" class="w-24 h-24 object-contain bg-purple-50 rounded-2xl p-2 border-2 border-purple-100">
                    <div class="flex flex-col justify-center gap-2">
                        <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-volume-high"></i> Listen
                        </button>
                        <button id="hintBtn" onclick="provideHint()" class="bg-amber-400 hover:bg-amber-500 text-white px-6 py-2 rounded-xl font-bold shadow-lg text-xs">
                            Hint
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="h-screen flex flex-col items-center justify-center px-4 pt-20">
        <div id="slotsContainer" class="flex flex-wrap justify-center gap-2 mb-8"></div>
        <div id="lettersContainer" class="flex flex-wrap justify-center gap-2 max-w-md"></div>
    </div>

    <script src="../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["ant", "apple", "arm", "arrow", "axe", "bird", "butterfly", "flower", "grass", "sky", "snake", "spider", "spoon", "star", "sun", "tree"]');
        let currentWord = "";
        let userInput = [];
        let scrambled = [];

        function nextQuestion() {
            const word = vocab[Math.floor(Math.random() * vocab.length)];
            currentWord = word.toUpperCase();
            userInput = new Array(currentWord.length).fill(null);
            document.getElementById('wordImage').src = Engine.getAssetPath(word);
            scrambled = currentWord.split('').map((char, index) => ({ char, id: index }));
            scrambled.sort(() => Math.random() - 0.5);
            renderGame();
        }

        function renderGame() {
            const slots = document.getElementById('slotsContainer');
            const letters = document.getElementById('lettersContainer');
            slots.innerHTML = '';
            letters.innerHTML = '';
            
            userInput.forEach((char, i) => {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                if(char) {
                    slot.innerHTML = `<div class="letter-box bg-white border-2 border-purple-400 text-purple-600 shadow-sm">${char.char}</div>`;
                    slot.onclick = () => removeLetter(i);
                }
                slots.appendChild(slot);
            });
            
            scrambled.forEach((item, i) => {
                const box = document.createElement('div');
                box.className = 'letter-box bg-purple-500 text-white shadow-md border-b-4 border-purple-700 active:border-b-0 active:translate-y-1';
                box.innerText = item.char;
                box.onclick = () => addLetter(item, i);
                letters.appendChild(box);
            });
        }

        function addLetter(item, index) {
            const emptySlot = userInput.indexOf(null);
            if(emptySlot !== -1) {
                userInput[emptySlot] = item;
                scrambled.splice(index, 1);
                renderGame();
                checkWord();
            }
        }

        function removeLetter(index) {
            const item = userInput[index];
            if(item) {
                scrambled.push(item);
                userInput[index] = null;
                renderGame();
            }
        }

        function checkWord() {
            if(userInput.indexOf(null) === -1) {
                const word = userInput.map(i => i.char).join('');
                if(word === currentWord) {
                    Engine.addScore(30);
                    Engine.showFeedback(true);
                    setTimeout(nextQuestion, 1200);
                } else {
                    Engine.showFeedback(false);
                    setTimeout(() => {
                        userInput.forEach((item, i) => { if(item) scrambled.push(item); userInput[i] = null; });
                        renderGame();
                    }, 800);
                }
            }
        }

        function provideHint() {
            const emptySlot = userInput.indexOf(null);
            if(emptySlot !== -1) {
                const targetChar = currentWord[emptySlot];
                const itemIdx = scrambled.findIndex(i => i.char === targetChar);
                if(itemIdx !== -1) addLetter(scrambled[itemIdx], itemIdx);
            }
        }

        window.onload = () => {
            if(window.Engine) Engine.init();
            nextQuestion();
        };
    </script>
</body>
</html>
