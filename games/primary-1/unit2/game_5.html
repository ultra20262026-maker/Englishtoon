<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; }
        canvas { display: block; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .btn-action { background: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-action:active { transform: scale(0.95); }
    </style>

    <title>Whack-a-Word</title>
</head>
<body class="bg-sky-100">
    
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Whack the word!</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["ant", "apple", "arm", "arrow", "axe", "bird", "butterfly", "flower", "grass", "sky", "snake", "spider", "spoon", "star", "sun", "tree"]');
        let width, height, currentWord;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        
        let holes = [], activeMole = null;
        for(let i=0; i<6; i++) holes.push({ x: (i%3)*120 + width/2-180, y: Math.floor(i/3)*120 + 400 });
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
        }
        function spawn() {
            const h = holes[Math.floor(Math.random()*holes.length)];
            const isCorrect = Math.random() < 0.4;
            activeMole = { ...h, word: isCorrect ? currentWord : vocab[Math.floor(Math.random()*vocab.length)], img: new Image() };
            activeMole.img.src = Engine.getAssetPath(activeMole.word);
            setTimeout(() => { activeMole = null; setTimeout(spawn, 500); }, 1500);
        }
        function loop() {
            ctx.clearRect(0,0,width,height);
            holes.forEach(h => { ctx.fillStyle='#451a03'; ctx.beginPath(); ctx.ellipse(h.x, h.y, 50, 20, 0, 0, Math.PI*2); ctx.fill(); });
            if(activeMole) ctx.drawImage(activeMole.img, activeMole.x-40, activeMole.y-60, 80, 80);
            requestAnimationFrame(loop);
        }
        canvas.addEventListener('mousedown', (e) => {
            if(activeMole && Math.hypot(e.clientX-activeMole.x, e.clientY-(activeMole.y-20)) < 60) {
                if(activeMole.word === currentWord) { Engine.addScore(10); Engine.showFeedback(true); nextQuestion(); }
                else Engine.showFeedback(false);
                activeMole = null;
            }
        });
        nextQuestion(); spawn(); loop();
    
    </script>
</body>
</html>
