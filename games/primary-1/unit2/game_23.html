<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Cannon - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka One', cursive; touch-action: manipulation; overflow: hidden; }
        .game-container { position: relative; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #87CEEB, #E0F6FF); }
        .cannon { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 100px; z-index: 10; transition: left 0.1s ease-out; }
        .target { position: absolute; top: -100px; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .ball { position: absolute; width: 20px; height: 20px; background: radial-gradient(circle at 30% 30%, #ff0000, #990000); border-radius: 50%; z-index: 5; }
        .score-panel { position: absolute; top: 20px; left: 20px; z-index: 20; }
        .vocab-image { width: 120px; height: 120px; border-radius: 20px; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #question-panel { position: absolute; top: 20px; right: 20px; z-index: 20; text-align: right; }
        .btn-action { background: #FFD700; border: 4px solid #FFA500; border-radius: 15px; padding: 10px 20px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body class="bg-blue-100">
    <div class="game-container" id="gameArea">
        <!-- Score & Info -->
        <div class="score-panel">
            <div class="bg-white/80 p-3 rounded-2xl shadow-lg">
                <div class="text-blue-600">Score: <span id="score">0</span></div>
                <div class="text-yellow-600">Stars: ⭐<span id="stars">0</span></div>
            </div>
        </div>

        <!-- Question Panel -->
        <div id="question-panel" class="hidden">
            <img id="currentVocabImg" src="" class="vocab-image bg-white mb-2" alt="vocab">
            <div class="bg-white/80 p-2 rounded-xl text-xl text-blue-800" id="currentWord">...</div>
            <button onclick="speakWord()" class="mt-2 bg-blue-500 text-white p-2 rounded-full shadow-md">🔊</button>
        </div>

        <!-- Cannon -->
        <div id="cannon" class="cannon">
            <img src="../../assets/cannon_3d.png" alt="cannon" id="cannonImg">
        </div>

        <!-- Start Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-black/50 z-50 flex items-center justify-center">
            <div class="bg-white p-8 rounded-3xl text-center shadow-2xl">
                <h1 class="text-4xl text-blue-600 mb-4">Super Cannon!</h1>
                <p class="text-gray-600 mb-6">Shoot the correct target to win!</p>
                <button onclick="startGame()" class="btn-action">Start Adventure</button>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let stars = 0;
        let currentQuestion = null;
        let gameActive = false;
        const wordsData = [{"word": "ant"}, {"word": "apple"}, {"word": "arm"}, {"word": "arrow"}, {"word": "axe"}, {"word": "bird"}, {"word": "butterfly"}, {"word": "flower"}, {"word": "grass"}, {"word": "sky"}, {"word": "snake"}, {"word": "spider"}, {"word": "spoon"}, {"word": "star"}, {"word": "sun"}, {"word": "tree"}];

        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('question-panel').classList.remove('hidden');
            gameActive = true;
            nextQuestion();
            gameLoop();
        }

        function nextQuestion() {
            currentQuestion = wordsData[Math.floor(Math.random() * wordsData.length)];
            document.getElementById('currentVocabImg').src = "../../assets/p1/" + currentQuestion.word.toLowerCase().replace(/ /g, '_') + ".png";
            document.getElementById('currentWord').innerText = "Find: " + currentQuestion.word;
            spawnTargets();
        }

        function spawnTargets() {
            // Logic to spawn multiple targets at top
        }

        function gameLoop() {
            if (!gameActive) return;
            // Update positions, collisions, etc.
            requestAnimationFrame(gameLoop);
        }

        function speakWord() {
            if (currentQuestion) {
                const msg = new SpeechSynthesisUtterance(currentQuestion.word);
                msg.lang = 'en-US';
                window.speechSynthesis.speak(msg);
            }
        }

        // Mobile Control
        window.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            const touchX = e.touches[0].clientX;
            document.getElementById('cannon').style.left = touchX + 'px';
            fireBall();
        });

        function fireBall() {
            // Animation for firing
        }
    </script>
</body>
</html>
