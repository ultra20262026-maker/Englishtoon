<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ألعاب الصف الأول - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f172a; font-family: 'Cairo', sans-serif; color: white; }
        .game-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .game-card:hover { transform: translateY(-10px) scale(1.02); }
    </style>

<!-- PRIMARY-MOBILE-FIT-2027 -->
<style id="primary-mobile-fit-2027">
html,body{width:100%;min-width:0;min-height:100%;min-height:100dvh;overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,a,[role="button"],canvas,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img,svg,canvas,video{max-width:100%;height:auto}
@media(max-width:900px),(max-height:650px){html{font-size:clamp(11px,3.35vmin,16px)!important}#game-wrap,#game-container,.game-container,.game-wrapper,.game-area,.game-stage{max-width:100vw!important;max-height:100dvh!important}.screen{padding:clamp(.55rem,3vw,1.5rem)!important}.screen-title{font-size:clamp(1.3rem,6vw,2.8rem)!important}.screen-sub{font-size:clamp(.75rem,3vw,.95rem)!important}.game-logo{font-size:clamp(2rem,15vw,5rem)!important}.btn-start,.btn-home,.btn-next,.btn-replay,button.start,button{min-height:42px;max-width:92vw}.choice-btn{min-height:42px;font-size:clamp(.75rem,3.2vw,1.05rem)!important}.level-select{gap:.45rem!important}.level-btn{min-width:82px!important;padding:.65rem .6rem!important}.level-btn-desc{font-size:.62rem!important}#question-text{font-size:clamp(1rem,4.5vw,1.8rem)!important;margin-top:42px!important}#choices{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;padding:7px!important}}
@media(orientation:landscape) and (max-height:520px){.screen{padding:.35rem!important}.game-logo{margin-bottom:.1rem!important}.screen-sub{margin-bottom:.45rem!important}.level-select{margin-bottom:.45rem!important}.btn-start{padding:8px 24px!important}#hud{padding:6px 9px!important}#question-text{margin-top:40px!important}}
</style>
<!-- /PRIMARY-MOBILE-FIT-2027 -->
<script src="../../../englishtoon_profile.js" defer></script>
</head>
<body class="min-h-screen p-6 pb-24 bg-slate-950">
    <div class="max-w-6xl mx-auto">
        <header class="flex items-center justify-between mb-12 bg-slate-900/50 p-6 rounded-[2.5rem] border border-white/5 backdrop-blur-xl">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="w-12 h-12 bg-slate-800 rounded-2xl flex items-center justify-center text-white hover:bg-blue-600 transition-all active:scale-90">
                    <i class="fa-solid fa-house"></i>
                </a>
                <div>
                    <h1 id="unit-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 uppercase tracking-tighter">ألعاب الوحدة الأولى</h1>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Arcade Adventure</p>
                </div>
            </div>
            <div class="bg-blue-600/20 text-blue-400 px-4 py-2 rounded-2xl border border-blue-500/20 font-black">24 لعبة</div>
        </header>

        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Cards will be injected here -->
        </div>
    </div>

    <script>
        const GAME_NAMES = [
            "سباق التوربو", "تحدي الإملاء", "قفزة الغابة", "حامي الفضاء",
            "قاطع الفواكه", "خطاف الكنز", "ضربات الجزاء", "فرقعة الفقاعات",
            "سلة الكلمات", "جرس الحروف", "ركض الديناصور", "نحلة العسل",
            "مصنع الروبوت", "مظلي الكلمات", "صانع البيتزا", "مثلجات المرح",
            "سائق القطار", "انفجار البالونات", "غواصة الأعماق", "قبعة الساحر",
            "بطل التسلق", "تطابق المزرعة", "صاعق الفضائيين", "الإملاء الخارق"
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const unit = urlParams.get('unit') || '1';
        document.getElementById('unit-title').innerText = `ألعاب الوحدة ${unit}`;

        const grid = document.getElementById('games-grid');
        for (let i = 1; i <= 24; i++) {
            const card = document.createElement('a');
            card.href = `games/primary-1/unit${unit}/game_${i}.html?v=5.3.1`;
            card.className = "game-card group relative bg-slate-800/50 backdrop-blur-xl border border-white/10 rounded-[2rem] p-6 flex flex-col items-center text-center shadow-2xl hover:border-blue-500/50";
            
            const isDictation = i === 2 || i === 24;
            card.innerHTML = `
                <div class="w-20 h-20 bg-gradient-to-br ${isDictation ? 'from-amber-500 to-red-600' : 'from-blue-600 to-indigo-600'} rounded-3xl flex items-center justify-center text-4xl mb-4 shadow-lg group-hover:rotate-6 transition-transform">
                    <i class="fa-solid ${isDictation ? 'fa-spell-check' : 'fa-gamepad'}"></i>
                </div>
                <h3 class="text-white font-black text-lg mb-1">${GAME_NAMES[i-1]}</h3>
                <span class="text-blue-400 text-xs font-bold uppercase tracking-widest">المستوى ${i}</span>
                <div class="absolute top-4 right-4 w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            `;
            grid.appendChild(card);
        }
    </script>

<!-- PRIMARY-MOBILE-FIT-2027-JS -->
<script id="primary-mobile-fit-2027-js">
(function(){'use strict';var ids=[],last=0;function fit(){try{window.dispatchEvent(new Event('resize'))}catch(e){}try{if(window.visualViewport)window.visualViewport.dispatchEvent(new Event('resize'))}catch(e){}}function schedule(){ids.forEach(clearTimeout);ids=[80,320,800].map(function(n){return setTimeout(fit,n)})}window.addEventListener('orientationchange',schedule,{passive:true});window.addEventListener('resize',function(){document.documentElement.style.setProperty('--safe-vh',(window.innerHeight*.01)+'px')},{passive:true});document.addEventListener('visibilitychange',function(){if(!document.hidden)schedule()},{passive:true});if(window.visualViewport)window.visualViewport.addEventListener('resize',schedule,{passive:true});document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<280)e.preventDefault();last=n},{passive:false});schedule()})();
</script>
<!-- /PRIMARY-MOBILE-FIT-2027-JS -->
</body>
</html>
