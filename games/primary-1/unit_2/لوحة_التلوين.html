<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لوحة التلوين (Color Splash)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #2ecc71; font-family: 'Cairo', 'Fredoka One', sans-serif; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; height: 100vh;}
        
        .game-container {
            width: 95vw;
            height: 85vh;
            background: #27ae60;
            border-radius: 20px;
            border: 5px solid #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .sentence {
            font-family: 'Fredoka One', sans-serif;
            font-size: 2.5rem;
            color: #fff;
            background: rgba(0,0,0,0.2);
            padding: 10px 30px;
            border-radius: 30px;
            margin-bottom: 20px;
            direction: ltr;
        }

        .canvas-area {
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.9);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .canvas-area img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            filter: grayscale(1) brightness(1.2);
            transition: filter 1s ease;
        }

        .canvas-area img.colored {
            filter: grayscale(0) brightness(1);
        }

        .colors-area {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .color-bucket {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 5px solid #fff;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .color-bucket:active { transform: translateY(8px); box-shadow: 0 0 0; }

        .ui-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 1.5rem; color: #fff; pointer-events: none; z-index: 30;}
        
        .screen { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; color: white;}
        button.start { font-family: 'Cairo', sans-serif; font-size: 2.5rem; padding: 15px 50px; background: #f1c40f; border: none; border-radius: 50px; color: #d35400; cursor: pointer; box-shadow: 0 8px 0 #d4ac0d;}
        button.start:active { transform: translateY(8px); box-shadow: 0 0 0; }
        .hidden-screen { display: none !important; }
    </style>
<!-- MOBILE-FIT-2027 -->
<style id="mobile-fit-2027">
html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, .target-btn, a, [onclick] { touch-action: manipulation; }
@media (max-width: 900px), (max-height: 520px) {
  html { font-size: clamp(11px, 3.4vmin, 16px) !important; }
}
</style>
<!-- /MOBILE-FIT-2027-head -->
<style>.timer, #timer, [id*="timer"], [class*="timer"], .time-display, #time-display { display: none !important; opacity: 0 !important; pointer-events: none !important; visibility: hidden !important; }</style>
<!-- MOBILE-FIT-2027 -->
<style id="mobile-fit-2027-surgical">
html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, .target-btn, a, [onclick], .gg-target, .gg-btn { touch-action: manipulation; }
@media (max-width: 900px), (max-height: 520px) {
  html { font-size: clamp(10px, 3vmin, 16px) !important; }
}
</style>
</head>
<body>
    
    <div class="game-container">
        <div class="ui-top">
            <div>نقاط: <span id="score">0</span></div>
            <div>محاولات: <span id="lives">5</span></div>
        </div>

        <div class="sentence" id="sentence-text">The sky is blue.</div>

        <div class="canvas-area">
            <img id="main-image" src="" alt="target">
        </div>

        <div class="colors-area">
            <div class="color-bucket" style="background: #e74c3c;" onclick="handleColor('red')"></div>
            <div class="color-bucket" style="background: #3498db;" onclick="handleColor('blue')"></div>
            <div class="color-bucket" style="background: #f1c40f;" onclick="handleColor('yellow')"></div>
            <div class="color-bucket" style="background: #2ecc71;" onclick="handleColor('green')"></div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1 style="font-size: 4rem; color: #f1c40f;">لوحة التلوين 🎨</h1>
        <p style="font-size: 1.5rem;">استمع للجملة وانقر على اللون الصحيح لتلوين الصورة!</p>
        <button class="start" onclick="startGame()">العب!</button>
    </div>

    <div id="end-screen" class="screen hidden-screen">
        <h1 style="font-size: 4rem; color: #f1c40f;">انتهت اللعبة!</h1>
        <p style="font-size: 2rem;">نقاطك: <span id="final-score">0</span></p>
        <button class="start" onclick="startGame()" style="margin-top: 30px;">العب مرة أخرى</button>
    </div>

        let score = 0, lives = 5;
        let currentTarget = null;
        let isWaiting = false;
        
        const mainImage = document.getElementById('main-image');
        const synth = window.speechSynthesis;

        function speak(text) {
            const utterThis = new SpeechSynthesisUtterance(text);
            utterThis.pitch = 1.3; utterThis.rate = 0.9;
            synth.speak(utterThis);
        }

        function spawnLevel() {
            isWaiting = false;
            mainImage.classList.remove('colored');
            
            currentTarget = tasks[Math.floor(Math.random() * tasks.length)];
            mainImage.src = currentTarget.img;
            document.getElementById('sentence-text').textContent = currentTarget.text;
            
            speak(currentTarget.text);
        }

        function handleColor(selectedColor) {
            if(isWaiting) return;
            isWaiting = true;
            
            speak(selectedColor);

            if(selectedColor === currentTarget.color) {
                score += 10;
                document.getElementById('score').textContent = score;
                mainImage.classList.add('colored');
                speak("Great job!");
                setTimeout(spawnLevel, 2000);
            } else {
                lives--;
                document.getElementById('lives').textContent = lives;
                speak("Try again!");
                
                clearTimeout(autoAdvanceTimer); autoAdvanceTimer = setTimeout(() => {
                    if (lives <= 0) endGame();
                    else isWaiting = false;
                }, 1000);
            }
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden-screen');
            document.getElementById('end-screen').classList.add('hidden-screen');
            score = 0; lives = 5;
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            spawnLevel();
        }

        function endGame() {
            document.getElementById('final-score').textContent = score;
            document.getElementById('end-screen').classList.remove('hidden-screen');
        }
    </script>

<script id="mobile-fit-2027-js">
(function(){
  try {
    function fireResize(){ try { window.dispatchEvent(new Event('resize')); } catch(e){} }

    if (window.visualViewport) { window.visualViewport.addEventListener('resize', fireResize); }
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e){
      var now = Date.now();
      if (now - lastTouchEnd <= 300) { e.preventDefault(); }
      lastTouchEnd = now;
    }, {passive:false});
  } catch(err) {}
})();
</script>
