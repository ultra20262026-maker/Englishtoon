<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; background: #f0f9ff; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .speed-ctrl { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; gap: 5px; }
        .speed-btn { width: 40px; height: 40px; border-radius: 50%; background: white; border: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .speed-btn.active { background: #3b82f6; color: white; }
    </style>

    <title>Whack-a-Word</title>
</head>
<body class="bg-sky-50">
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Whack the target word:</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    
    <div class="speed-ctrl interactive">
        <div onclick="Engine.setSpeed(0.5)" class="speed-btn" id="s05">0.5x</div>
        <div onclick="Engine.setSpeed(1.0)" class="speed-btn active" id="s10">1x</div>
        <div onclick="Engine.setSpeed(1.5)" class="speed-btn" id="s15">1.5x</div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["arm", "cake", "car", "carrot", "cat", "cup", "ear", "egg", "eggplant", "elbow", "elephant", "enter", "eye", "feet", "foot", "hand", "head", "hear", "key", "king", "kitchen", "kite", "leg", "mouth", "nose", "rabbit", "red", "ring", "robot", "rocket", "see", "smell", "taste", "toes", "tongue", "touch"]');
        let width, height, currentWord;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        
    let holes = [], activeMole = -1;
    function initGame() {
        for(let i=0; i<6; i++) holes.push({x: 100 + (i%3)*200, y: 300 + Math.floor(i/3)*200, word: ""});
        nextQuestion(); loop();
    }
    function nextQuestion() {
        currentWord = vocab[Math.floor(Math.random()*vocab.length)];
        document.getElementById('targetWord').innerText = currentWord;
        activeMole = -1;
        setTimeout(popMole, 1000);
    }
    function popMole() {
        activeMole = Math.floor(Math.random()*holes.length);
        let w = Math.random() < 0.5 ? currentWord : vocab[Math.floor(Math.random()*vocab.length)];
        holes[activeMole].word = w;
        holes[activeMole].img = new Image();
        holes[activeMole].img.src = Engine.getAssetPath(w);
        setTimeout(() => { activeMole = -1; if(Engine.gameActive) setTimeout(popMole, 1500 / Engine.speed); }, 2000 / Engine.speed);
    }
    function loop() {
        ctx.clearRect(0,0,width,height);
        holes.forEach((h, i) => {
            ctx.fillStyle='#3f6212'; ctx.beginPath(); ctx.ellipse(h.x, h.y+40, 60, 20, 0, 0, Math.PI*2); ctx.fill();
            if(i === activeMole && h.img && h.img.complete) {
                ctx.drawImage(h.img, h.x-40, h.y-60, 80, 80);
            }
        });
        requestAnimationFrame(loop);
    }
    canvas.addEventListener('mousedown', e => {
        if(activeMole !== -1) {
            let h = holes[activeMole];
            if(Math.hypot(e.clientX-h.x, e.clientY-h.y) < 60) {
                if(h.word === currentWord) { Engine.addScore(10); Engine.showFeedback(true); activeMole = -1; nextQuestion(); }
                else Engine.showFeedback(false);
            }
        }
    });
    

        window.onload = () => {
            if (window.Engine) {
                Engine.init();
                if (typeof initGame === 'function') initGame();
            }
        };
    </script>
</body>
</html>
