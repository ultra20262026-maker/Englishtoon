
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garden Matching - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #ecfdf5; overflow: hidden; }
        .pot { width: 100px; height: 100px; background: #92400e; border-radius: 0 0 40px 40px; border-top: 10px solid #78350f; cursor: pointer; position: relative; transition: all 0.3s; }
        .pot:hover { transform: scale(1.05); }
        .plant { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 80px; opacity: 0; transition: all 0.5s; }
        .pot.grown .plant { opacity: 1; bottom: 100px; }
    </style>
</head>
<body>
    <div class="fixed inset-0 z-10 flex flex-col p-4 pointer-events-none">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-emerald-200 flex items-center gap-4 pointer-events-auto">
                <div class="text-emerald-600"><span class="text-xs font-bold block uppercase">Garden</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-emerald-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="pointer-events-auto w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 text-center pointer-events-auto">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-emerald-400 w-full max-w-md mx-auto">
                <h2 class="text-emerald-500 font-bold text-lg mb-1 uppercase tracking-widest">Plant the seed for:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    <div class="h-screen flex items-center justify-center pt-40 px-4">
        <div id="pots" class="flex gap-10"></div>
    </div>
    <script src="../../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["arm", "cake", "car", "carrot", "cat", "cup", "ear", "egg", "eggplant", "elbow", "elephant", "enter", "eye", "feet", "foot", "hand", "head", "hear", "key", "king", "kitchen", "kite", "leg", "mouth", "nose", "rabbit", "red", "ring", "robot", "rocket", "see", "smell", "taste", "toes", "tongue", "touch"]');
        let currentWord;
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
            const container = document.getElementById('pots');
            container.innerHTML = '';
            const choices = [currentWord];
            while(choices.length < 3) {
                let w = vocab[Math.floor(Math.random()*vocab.length)];
                if(!choices.includes(w)) choices.push(w);
            }
            choices.sort(() => Math.random() - 0.5);
            choices.forEach(w => {
                const div = document.createElement('div');
                div.className = 'pot';
                div.innerHTML = `<div class="plant flex flex-col items-center"><img src="${Engine.getAssetPath(w)}" class="w-16 h-16 object-contain bg-white rounded-lg p-1 shadow-md"><span class="text-emerald-900 font-bold text-xs mt-2">${w}</span></div><div class="absolute inset-0 flex items-center justify-center text-white font-bold">🌱</div>`;
                div.onclick = () => {
                    div.classList.add('grown');
                    if(w === currentWord) { Engine.addScore(35); Engine.showFeedback(true); setTimeout(nextQuestion, 1500); }
                    else { Engine.showFeedback(false); setTimeout(() => div.classList.remove('grown'), 1000); }
                };
                container.appendChild(div);
            });
        }
        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        nextQuestion();
    </script>
</body>
</html>
