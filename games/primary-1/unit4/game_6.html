<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchen Chef / شيف المطبخ - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../game_engine.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: system-ui; }
        canvas { display: block; touch-action: none; }
        .game-ui { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); width: 95%; max-width: 800px; display: flex; gap: 15px; justify-content: center; z-index: 50; }
        .choice-btn { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 2px solid rgba(255,255,255,0.1); color: white; padding: 20px; border-radius: 24px; font-weight: 900; font-size: 1.4rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); flex: 1; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .choice-btn:hover { background: rgba(255,255,255,0.15); border-color: #3b82f6; transform: translateY(-5px); }
        .choice-btn:active { transform: scale(0.9); }
        .listen-btn { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 12px 40px; border-radius: 100px; font-weight: 900; font-size: 1.2rem; box-shadow: 0 10px 25px rgba(37,99,235,0.4); z-index: 60; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: all 0.2s; }
        .listen-btn:active { transform: translateX(-50%) scale(0.95); box-shadow: 0 5px 10px rgba(37,99,235,0.4); }
    </style>
</head>
<body>
    <button class="listen-btn" onclick="Engine.speak(currentWord)">🔊 Listen / استمع</button>
    <canvas id="gameCanvas"></canvas>
    <div class="game-ui" id="choices"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let currentWord = "";
        let words = {"unit 1": ["Apple", "Ball", "Cat", "Dog", "Egg", "bag", "board", "book", "chair", "desk", "ill", "in", "ink", "insect", "open your books", "pencil", "sit down", "stand up"], "unit 2": ["ant", "apple", "arm", "arrow", "axe", "bird", "butterfly", "flower", "grass", "sky", "snake", "spider", "spoon", "star", "sun", "tree"], "unit 3": ["brother", "dog", "doll", "door", "drum", "duck", "father", "five", "flowers", "four", "grandfather", "grandmother", "hair", "hands", "hat", "horse", "house", "mother", "nail", "neck", "net", "nose", "nurse", "one", "panda", "parents", "parrot", "pencil", "pizza", "potato", "sister", "three", "two"], "unit 4": ["arm", "cake", "car", "carrot", "cat", "cup", "ear", "egg", "eggplant", "elbow", "elephant", "enter", "eye", "feet", "foot", "hand", "head", "hear", "key", "king", "kitchen", "kite", "leg", "mouth", "nose", "rabbit", "red", "ring", "robot", "rocket", "see", "smell", "taste", "toes", "tongue", "touch"], "unit 5": ["chicken", "cow", "duck", "fan", "fish", "fork", "fox", "frog", "girl", "gloves", "goat", "grapes", "guitar", "horse", "mango", "milk", "monkey", "moon", "mouse", "octopus", "olive", "ostrich"], "unit 6": ["ball", "banana", "bike", "bird", "boy", "cage", "cat", "chair", "couch", "dog", "elephant", "giraffe", "in", "jacket", "jam", "jar", "jeans", "jellyfish", "lamp", "leaf", "lemon", "lion", "lunch", "monkey", "on", "snake", "table", "tiger", "turtle", "umbrella", "under", "unlock", "up"]};
        let unitWords = words["unit 4"] || [];
        let frame = 0;
        let particles = [];

        function initGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            Engine.init();
            nextQuestion();
            animate();
        }

        function nextQuestion() {
            if (unitWords.length === 0) return;
            currentWord = unitWords[Math.floor(Math.random() * unitWords.length)];
            const others = unitWords.filter(w => w !== currentWord).sort(() => 0.5 - Math.random()).slice(0, 2);
            const choices = [currentWord, ...others].sort(() => 0.5 - Math.random());
            
            const ui = document.getElementById('choices');
            ui.innerHTML = '';
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(choice);
                ui.appendChild(btn);
            });
        }

        function checkAnswer(choice) {
            if (choice === currentWord) {
                Engine.addScore(100);
                Engine.showWinScreen(() => nextQuestion());
            } else {
                Engine.addScore(-20);
                Engine.showFeedback(false);
            }
        }

        // Physics & Animation for kitchen_chef
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background Effect
            const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
            gradient.addColorStop(0, '#1e293b');
            gradient.addColorStop(1, '#0f172a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Mechanic-specific rendering logic here
            ctx.fillStyle='white'; ctx.font='20px Arial'; ctx.fillText('Professional Arcade Mode Active', 50, 50);

            frame++;
            requestAnimationFrame(animate);
        }

        window.onload = initGame;
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    </script>
</body>
</html>
