<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; }
        canvas { display: block; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .btn-action { background: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-action:active { transform: scale(0.95); }
    </style>

    <title>Dictation</title>
</head>
<body class="bg-indigo-50">
    
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Spell the word:</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" onclick="Engine.speak(currentWord)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="../game_engine.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const vocab = JSON.parse('["arm", "cake", "car", "carrot", "cat", "cup", "ear", "egg", "eggplant", "elbow", "elephant", "enter", "eye", "feet", "foot", "hand", "head", "hear", "key", "king", "kitchen", "kite", "leg", "mouth", "nose", "rabbit", "red", "ring", "robot", "rocket", "see", "smell", "taste", "toes", "tongue", "touch"]');
        let width, height, currentWord;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        
        let slots = [], tiles = [];
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)].toUpperCase();
            document.getElementById('targetWord').innerText = "???";
            const chars = currentWord.split('');
            slots = chars.map((c, i) => ({ x: width/2 - (chars.length*60)/2 + i*60, y: 300, char: "" }));
            tiles = chars.map((c, i) => ({ x: Math.random()*(width-100)+50, y: 500, char: c })).sort(()=>0.5-Math.random());
        }
        function loop() {
            ctx.clearRect(0,0,width,height);
            slots.forEach(s => { ctx.strokeRect(s.x, s.y, 50, 60); ctx.fillStyle='black'; ctx.font='30px Arial'; ctx.fillText(s.char, s.x+15, s.y+40); });
            tiles.forEach(t => { ctx.fillStyle='blue'; ctx.fillRect(t.x, t.y, 50, 60); ctx.fillStyle='white'; ctx.fillText(t.char, t.x+15, t.y+40); });
            requestAnimationFrame(loop);
        }
        canvas.addEventListener('mousedown', (e) => {
            tiles.forEach((t, i) => {
                if(e.clientX > t.x && e.clientX < t.x+50 && e.clientY > t.y && e.clientY < t.y+60) {
                    let slot = slots.find(s => s.char === "");
                    if(slot) { slot.char = t.char; tiles.splice(i, 1); }
                    if(slots.every(s => s.char !== "")) {
                        if(slots.map(s=>s.char).join('') === currentWord) { Engine.addScore(20); Engine.showFeedback(true); setTimeout(nextQuestion, 1500); }
                        else { Engine.showFeedback(false); nextQuestion(); }
                    }
                }
            });
        });
        nextQuestion(); loop();
    
    </script>
</body>
</html>
