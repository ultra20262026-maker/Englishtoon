
<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; touch-action: none; margin: 0; }
        canvas { display: block; }
        .game-ui { pointer-events: none; position: fixed; inset: 0; z-index: 50; padding: 1rem; }
        .interactive { pointer-events: auto; }
        .btn-action { background: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-action:active { transform: scale(0.95); }
    </style>

    <title>Dictation Master</title>
    <style>
        .letter-slot { width: 50px; height: 60px; border: 3px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; background: white; }
        .letter-tile { width: 50px; height: 60px; background: #3b82f6; color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: grab; box-shadow: 0 4px 0 #2563eb; transition: transform 0.2s; }
        .letter-tile:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body class="bg-indigo-50">
    
    <div class="game-ui">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-blue-200 flex items-center gap-4 interactive">
                <div class="text-blue-600"><span class="text-xs font-bold block uppercase">Score</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-blue-100"></div>
                <div class="text-amber-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-4 shadow-xl border-4 border-blue-400 w-full max-w-md text-center interactive">
                <h2 class="text-blue-500 font-bold text-sm mb-1 uppercase tracking-widest">Spell the word:</h2>
                <div id="targetWord" class="text-3xl font-black text-slate-800 mb-2">...</div>
                <button id="listenBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto text-sm">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>

    <div class="h-screen flex flex-col items-center justify-center p-4 pt-40">
        <div id="slots" class="flex flex-wrap gap-2 mb-12 justify-center"></div>
        <div id="tiles" class="flex flex-wrap gap-4 justify-center"></div>
        <button id="checkBtn" class="mt-12 bg-indigo-600 text-white px-12 py-4 rounded-2xl text-2xl font-bold shadow-xl interactive">CHECK</button>
    </div>
    <script src="../../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["arm", "cake", "car", "carrot", "cat", "cup", "ear", "egg", "eggplant", "elbow", "elephant", "enter", "eye", "feet", "foot", "hand", "head", "hear", "key", "king", "kitchen", "kite", "leg", "mouth", "nose", "rabbit", "red", "ring", "robot", "rocket", "see", "smell", "taste", "toes", "tongue", "touch"]');
        let currentWord = "", userSpelling = [];

        function initGame() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)].toUpperCase();
            document.getElementById('targetWord').innerText = "???";
            userSpelling = Array(currentWord.length).fill("");
            render();
            Engine.speak(currentWord);
        }

        function render() {
            const slots = document.getElementById('slots');
            slots.innerHTML = userSpelling.map((l, i) => `<div class="letter-slot">${l}</div>`).join('');
            
            const tiles = document.getElementById('tiles');
            const shuffled = currentWord.split('').sort(() => 0.5 - Math.random());
            tiles.innerHTML = shuffled.map(l => `<div class="letter-tile interactive" onclick="addLetter('${l}')">${l}</div>`).join('');
        }

        function addLetter(l) {
            const idx = userSpelling.indexOf("");
            if(idx !== -1) {
                userSpelling[idx] = l;
                const slots = document.getElementById('slots').children;
                slots[idx].innerText = l;
                slots[idx].classList.add('border-indigo-400', 'text-indigo-600');
            }
        }

        document.getElementById('checkBtn').onclick = () => {
            if(userSpelling.join('') === currentWord) {
                Engine.addScore(20); Engine.showFeedback(true);
                setTimeout(initGame, 1500);
            } else {
                Engine.showFeedback(false);
                userSpelling = Array(currentWord.length).fill("");
                render();
            }
        };

        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        initGame();
    </script>
</body>
</html>
