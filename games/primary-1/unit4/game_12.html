
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treasure Hunt - EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #fef3c7; overflow: hidden; touch-action: none; }
        .chest { width: 100px; height: 100px; cursor: pointer; transition: transform 0.2s; position: relative; }
        .chest:active { transform: scale(0.9); }
        .game-ui { pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>
    <div class="game-ui fixed inset-0 z-10 flex flex-col p-4">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg border-2 border-amber-200 flex items-center gap-4 pointer-events-auto">
                <div class="text-amber-600"><span class="text-xs font-bold block uppercase">Gold</span><span id="score" class="text-2xl font-black">0</span></div>
                <div class="w-px h-8 bg-amber-100"></div>
                <div class="text-orange-500"><span class="text-xs font-bold block uppercase">Stars</span><span id="stars" class="text-2xl font-black">0</span></div>
            </div>
            <button onclick="window.history.back()" class="interactive w-12 h-12 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center text-slate-400 shadow-lg border-2 border-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="mt-4 flex flex-col items-center">
            <div class="bg-white/95 backdrop-blur rounded-3xl p-6 shadow-xl border-4 border-amber-400 w-full max-w-md text-center pointer-events-auto">
                <h2 class="text-amber-500 font-bold text-lg mb-1 uppercase tracking-widest">Open the chest with:</h2>
                <div id="targetWord" class="text-4xl font-black text-slate-800 mb-4">...</div>
                <button id="listenBtn" class="bg-amber-500 hover:bg-amber-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 mx-auto">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>
            </div>
        </div>
    </div>
    <div class="h-screen flex items-center justify-center pt-40 px-4">
        <div id="chests" class="grid grid-cols-2 gap-10"></div>
    </div>
    <script src="../../game_engine.js"></script>
    <script>
        const vocab = JSON.parse('["arm", "cake", "car", "carrot", "cat", "cup", "ear", "egg", "eggplant", "elbow", "elephant", "enter", "eye", "feet", "foot", "hand", "head", "hear", "key", "king", "kitchen", "kite", "leg", "mouth", "nose", "rabbit", "red", "ring", "robot", "rocket", "see", "smell", "taste", "toes", "tongue", "touch"]');
        let currentWord;
        function nextQuestion() {
            currentWord = vocab[Math.floor(Math.random() * vocab.length)];
            document.getElementById('targetWord').innerText = currentWord;
            Engine.speak(currentWord);
            const container = document.getElementById('chests');
            container.innerHTML = '';
            const choices = [currentWord];
            while(choices.length < 4) {
                let w = vocab[Math.floor(Math.random()*vocab.length)];
                if(!choices.includes(w)) choices.push(w);
            }
            choices.sort(() => Math.random() - 0.5);
            choices.forEach(w => {
                const div = document.createElement('div');
                div.className = 'chest bg-amber-700 rounded-2xl flex flex-col items-center justify-center border-b-8 border-amber-900 shadow-xl';
                div.innerHTML = `<img src="${Engine.getAssetPath(w)}" class="w-16 h-16 object-contain bg-white rounded-lg mb-2"><span class="text-white font-bold text-xs">${w}</span>`;
                div.onclick = () => {
                    if(w === currentWord) { Engine.addScore(40); Engine.showFeedback(true); setTimeout(nextQuestion, 1000); }
                    else { Engine.showFeedback(false); div.style.opacity = '0.3'; }
                };
                container.appendChild(div);
            });
        }
        document.getElementById('listenBtn').onclick = () => Engine.speak(currentWord);
        nextQuestion();
    </script>
</body>
</html>
