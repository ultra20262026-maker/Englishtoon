<body>

<div class="g-hud" id="hud">
  <div class="g-title">Target Archery 🏹</div>
  <div id="qn" class="g-qnum">Q 1/5</div>
  <div class="g-score">Score: <span id="sc">0</span></div>
</div>

<div class="g-qpanel"><div id="qt">Loading...</div></div>
<div id="tg" class="g-targets"></div>
<canvas id="cv" class="g-canvas"></canvas>
<div id="pb" class="g-pbar"></div>

<div id="end" class="g-end">
  <h1 id="eh">Awesome! 🎉</h1>
  <p id="es">Score: 0</p>
  <button onclick="location.reload()">Play Again 🔄</button>
</div>

<script>
const QS = [{"q": "Hello, _____ name is Ahmed.", "choices": ["my", "his", "her", "your"], "answer": 0}, {"q": "What's _____ name?", "choices": ["your", "my", "our", "its"], "answer": 0}, {"q": "_____ is a pencil.", "choices": ["This", "These", "They", "Those"], "answer": 0}, {"q": "I _____ a student.", "choices": ["am", "is", "are", "be"], "answer": 0}, {"q": "She _____ a girl.", "choices": ["is", "are", "am", "be"], "answer": 0}];
let qi=0, score=0, locked=false, parts=[], particles=[], animId=null, tAngle=0;
let cv, ctx, W, H, AC;

window.addEventListener('load', () => {
  cv = document.getElementById('cv'); ctx = cv.getContext('2d');
  resize(); window.addEventListener('resize', resize);
  AC = new (window.AudioContext || window.webkitAudioContext)();
  initAmbientParticles();
  loadQ(); loop();
});

function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }

function tone(f,d,t,v) {
  if(!AC) return; if(AC.state==='suspended') AC.resume();
  const o=AC.createOscillator(), gn=AC.createGain(); o.connect(gn); gn.connect(AC.destination);
  o.type=t||'sine'; o.frequency.value=f; gn.gain.setValueAtTime(v||0.3, AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+d); o.start(); o.stop(AC.currentTime+d);
}

/* Real Crowd Applause Synth + Winning Chime Synthesis */
function playApplauseSnd() {
  if(!AC) return; if(AC.state==='suspended') AC.resume();
  // Winning Melody Chime
  tone(523.25, 0.1, 'sine', 0.4);
  setTimeout(()=> tone(659.25, 0.1, 'sine', 0.4), 90);
  setTimeout(()=> tone(783.99, 0.12, 'sine', 0.4), 180);
  setTimeout(()=> tone(1046.50, 0.35, 'triangle', 0.5), 270);

  // Realistic Crowd Applause Noise Bursts (Simulated Clapping)
  for(let i=0; i<35; i++) {
    const delay = Math.random() * 0.7;
    const dur = 0.04 + Math.random() * 0.05;
    const freq = 1200 + Math.random() * 1800;
    setTimeout(() => {
      try {
        const bufferSize = AC.sampleRate * dur;
        const buffer = AC.createBuffer(1, bufferSize, AC.sampleRate);
        const data = buffer.getChannelData(0);
        for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
        const noise = AC.createBufferSource(); noise.buffer = buffer;
        const filter = AC.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = freq; filter.Q.value = 3;
        const gain = AC.createGain();
        gain.gain.setValueAtTime(0.18 + Math.random()*0.15, AC.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
        noise.connect(filter); filter.connect(gain); gain.connect(AC.destination);
        noise.start();
      } catch(e) {}
    }, delay * 1000);
  }
}

function fail_snd() { tone(200,.2,'sawtooth'); setTimeout(()=>tone(150,.35,'sawtooth'),200); }

function initAmbientParticles() {
  particles = [];
  for(let i=0; i<50; i++) {
    particles.push({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.8, vy: (Math.random()-0.5)*0.8,
      r: Math.random()*3+1, color: '#e74c3c'
    });
  }
}

function burst(x,y,color,n=35) {
  for(let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, sp=Math.random()*9+2;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color, sz:Math.random()*6+3});
  }
}

function loop() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#1b2a47'; ctx.fillRect(0,0,W,H);
  
  // Ambient Aura & Moving Particles
  tAngle += 0.01;
  const pulse = Math.sin(tAngle)*20;
  ctx.fillStyle = '#e74c3c15'; ctx.beginPath(); ctx.arc(W/2, H*0.42, 260+pulse, 0, Math.PI*2); ctx.fill();

  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
    ctx.fillStyle = p.color; ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  parts = parts.filter(p=>p.life>0);
  parts.forEach(p=> {
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life-=0.022;
    ctx.globalAlpha=Math.max(0, p.life); ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
  });
  animId = requestAnimationFrame(loop);
}

function loadQ() {
  if(qi >= QS.length) { endGame(); return; }
  const q = QS[qi]; locked = false;
  document.getElementById('qt').textContent = q.q;
  document.getElementById('qn').textContent = 'Q ' + (qi+1) + '/' + QS.length;
  document.getElementById('pb').style.width = (qi/QS.length*100) + '%';
  const cont = document.getElementById('tg'); cont.innerHTML = '';
  const correctText = q.choices[q.answer] || q.choices[0];
  let ch = [...q.choices];
  const lab = ch.map(c => ({ t: c, ok: c === correctText }));
  lab.sort(() => Math.random() - 0.5);
  lab.forEach((item) => {
    const btn = document.createElement('button'); btn.className = 'tbtn';
    btn.textContent = item.t; btn.onclick = () => pick(btn, item.ok);
    cont.appendChild(btn);
  });
}

function pick(btn, good) {
  if(locked) return; locked = true;
  const rect = btn.getBoundingClientRect();
  if(good) {
    btn.classList.add('correct'); playApplauseSnd(); burst(rect.left+rect.width/2, rect.top+rect.height/2, '#2ecc71', 40);
    score += 10; document.getElementById('sc').textContent = score;
  } else {
    btn.classList.add('wrong'); fail_snd(); burst(rect.left+rect.width/2, rect.top+rect.height/2, '#e74c3c', 20);
    Array.from(document.getElementById('tg').children).forEach(b => {
      if(b.textContent === QS[qi].choices[QS[qi].answer]) b.classList.add('correct');
    });
  }
  setTimeout(() => { qi++; loadQ(); }, 1600);
}

function endGame() { saveScoreToFirebase(score);
  document.getElementById('end').style.display = 'flex';
  document.getElementById('es').textContent = 'Final Score: ' + score + ' / ' + (QS.length*10);
}
</script>

    async function saveScoreToFirebase(finalScore) {
        const studentName = localStorage.getItem('et_student_name') || localStorage.getItem('currentUser') || 'بطل التوون';
        const urlParams = new URLSearchParams(window.location.search);
        const gradeId = urlParams.get('id') || window.location.pathname.split('/').slice(-3, -2)[0] || 'primary-1';
        const unit = urlParams.get('unit') || window.location.pathname.split('/').slice(-2, -1)[0].replace('unit', '') || '1';
        const lesson = urlParams.get('lesson') || '1';
        const gameKey = `${gradeId}_U${unit}_L${lesson}`;
        
        const badges = JSON.parse(localStorage.getItem('et_badges') || '{}');
        const currentTotal = parseInt(localStorage.getItem('englishtoon_total_score') || '0');
        const newTotal = currentTotal + (finalScore > 0 ? 50 : 0); // Give 50 coins for finishing a game
        localStorage.setItem('englishtoon_total_score', newTotal);

        try {
            // Update Global Leaderboard
            await db.collection('leaderboard').doc(`${deviceId}_total`).set({
                name: studentName,
                score: newTotal,
                grade: gradeId,
                deviceId: deviceId,
                badges: badges,
                lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            // Update Game Specific Leaderboard
            await db.collection('game_scores').doc(`${deviceId}_${gameKey}`).set({
                name: studentName,
                score: finalScore,
                grade: gradeId,
                unit: unit,
                lesson: lesson,
                gameId: gameKey,
                deviceId: deviceId,
                badges: badges,
                lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log("Score saved for:", studentName);
        } catch (e) { console.error("Firebase save failed", e); }
    }
