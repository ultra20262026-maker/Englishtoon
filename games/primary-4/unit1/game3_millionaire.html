<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Who Wants to Sail the Nile? | Around Egypt</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B1E3D; --navy2:#132a52; --gold:#D4AF37; --sand:#C89F65; --papyrus:#F4EBD9; --red:#C0392B; --green:#3FA34D; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; min-height:100vh; font-family:'Poppins',sans-serif; color:var(--papyrus);
    background:radial-gradient(circle at 50% -10%, #1a3a6b 0%, var(--navy) 60%, #04070f 100%);
    display:flex; align-items:center; justify-content:center; padding:16px;}
  .wrap{max-width:960px; width:100%; display:grid; grid-template-columns:1fr 230px; gap:18px;}
  @media (max-width:760px){ .wrap{grid-template-columns:1fr;} .ladder{order:-1;} }
  .card{background:linear-gradient(160deg,var(--navy2),#0a1730 85%); border:2px solid #a3852a55; border-radius:18px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.55);}
  h1{font-family:'Cinzel',serif; color:var(--gold); text-align:center; font-size:clamp(19px,4vw,26px); margin:0 0 2px;}
  .sub{text-align:center; color:var(--sand); font-size:13px; margin-bottom:14px;}
  .hud{display:flex; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .pill{font-family:'Space Mono',monospace; background:rgba(0,0,0,.3); border:1px solid var(--gold); border-radius:10px; padding:7px 12px; font-size:13px;}
  .warn{color:#ff8080; border-color:#ff8080; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .qnum{text-align:center; font-family:'Space Mono',monospace; color:var(--sand); font-size:12px; margin-bottom:8px;}
  .qbox{background:rgba(0,0,0,.3); border:2px solid var(--gold); border-radius:14px; padding:18px; font-size:clamp(15px,3vw,17px); text-align:center; margin-bottom:16px; box-shadow:0 0 20px rgba(212,175,55,.15);}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:520px){ .choices{grid-template-columns:1fr;} }
  .choice{font-family:'Poppins'; font-size:14px; text-align:left; padding:12px 14px; border-radius:10px; background:rgba(212,175,55,.08); border:1.5px solid rgba(212,175,55,.35); color:var(--papyrus); cursor:pointer; transition:.18s;}
  .choice:hover:not(:disabled){background:rgba(212,175,55,.22); border-color:var(--gold); transform:scale(1.02);}
  .choice.correct{background:rgba(63,163,77,.3); border-color:var(--green); animation:pop .4s;}
  .choice.wrong{background:rgba(192,57,43,.3); border-color:var(--red); animation:shake .4s;}
  .choice.locked-in{animation:blink .5s infinite;}
  @keyframes blink{0%,100%{box-shadow:0 0 0 rgba(212,175,55,.6)}50%{box-shadow:0 0 16px rgba(212,175,55,.9)}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .lifelines{display:flex; gap:8px; justify-content:center; margin-bottom:14px;}
  .life{font-family:'Space Mono',monospace; font-size:12px; background:rgba(244,235,217,.08); border:1px solid var(--sand); border-radius:20px; padding:6px 12px; cursor:pointer; transition:.15s;}
  .life:hover:not(:disabled){background:rgba(212,175,55,.2);}
  .life:disabled{opacity:.3; cursor:default;}
  .feedback{text-align:center; font-weight:700; margin-top:6px; min-height:20px; font-size:13px;}
  .feedback.good{color:var(--green);} .feedback.bad{color:#ff8b7a;}
  .btn{font-family:'Cinzel',serif; font-weight:700; background:linear-gradient(160deg,var(--gold),#a3852a); color:#1a1400; border:none; border-radius:10px; padding:12px 22px; font-size:15px; cursor:pointer; box-shadow:0 6px 16px rgba(212,175,55,.35);}
  .center{display:flex; justify-content:center; margin-top:14px;}
  .endscreen{text-align:center;}
  .endscreen .big{font-family:'Cinzel',serif; font-size:clamp(22px,6vw,34px); font-weight:900;}
  .win .big{color:var(--gold);} .lose .big{color:#ff6b6b;}
  .ladder{background:linear-gradient(160deg,var(--navy2),#0a1730 85%); border:2px solid #a3852a55; border-radius:18px; padding:14px; display:flex; flex-direction:column-reverse; gap:4px; font-family:'Space Mono',monospace; font-size:12px;}
  .rung{padding:8px 10px; border-radius:6px; color:var(--sand); display:flex; justify-content:space-between;}
  .rung.active{background:var(--gold); color:#1a1400; font-weight:700;}
  .rung.passed{color:var(--papyrus);}
  .confetti{position:fixed; top:-10px; z-index:5; font-size:20px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>&#x1F3DB; Who Wants to Sail the Nile?</h1>
    <div class="sub">Unit 1 · Lesson 3 — Around Egypt</div>
    <div class="hud">
      <div class="pill" id="timerPill">&#9202; <span id="timeLeft">20</span>s</div>
      <div class="pill">&#x1F4B0; <span id="money">0</span> EGP</div>
    </div>
    <div class="lifelines">
      <button class="life" id="lifeFifty" onclick="useFiftyFifty()">50/50</button>
      <button class="life" id="lifeSkip" onclick="useSkip()">Skip Question</button>
    </div>
    <div class="qnum" id="qnum">Question 1 of 10</div>
    <div class="qbox" id="qbox">Loading...</div>
    <div class="choices" id="choicesBox"></div>
    <div class="feedback" id="feedback"></div>
    <div id="endArea"></div>
  </div>
  <div class="ladder" id="ladder"></div>
</div>

<script>
const questions = [
  {q:"The Nile is the longest ______ in the world.", choices:["mountain","river","desert","lake"], a:1, money:1000},
  {q:"The Nile is about how many kilometers long?", choices:["650","1,650","6,650","16,650"], a:2, money:2000},
  {q:"The Nile flows through Egypt from...", choices:["north to south","south to north","east to west","west to east"], a:1, money:4000},
  {q:"Big fish like Nile perch and ______ swim in the Nile.", choices:["tilapia","dolphins","sharks","whales"], a:0, money:8000},
  {q:"Which dangerous animals live in the Nile?", choices:["Lions","Crocodiles","Tigers","Bears"], a:1, money:16000},
  {q:"Which birds can you see near the Nile?", choices:["Penguins","Kingfishers, herons and ducks","Ostriches only","Eagles only"], a:1, money:32000},
  {q:"In the village, some people are ______.", choices:["fishermen","astronauts","pilots","doctors only"], a:0, money:64000},
  {q:"Farmers in Salma's village ______ the crops.", choices:["harvest","paint","sell only","break"], a:0, money:125000},
  {q:"Hassan's family ______ wool and weaves it on looms.", choices:["spins","boils","burns","hides"], a:0, money:250000},
  {q:"In the past, the Nile flooded and brought good...", choices:["sand","soil","ice","smoke"], a:1, money:500000},
];
const milestones = [1000,2000,4000,8000,16000,32000,64000,125000,250000,500000];

let qIndex=0, money=0, timeLeft=20, timerId=null, ended=false, fiftyUsed=false, skipUsed=false, locked=false;

function beep(freq, dur, type='sine', vol=0.15){
  try{
    const ctx = window._actx || (window._actx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(ctx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function sfxCorrect(){ beep(700,.12); setTimeout(()=>beep(950,.18),100); }
function sfxWrong(){ beep(170,.25,'sawtooth',0.12); }
function sfxWin(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.22),i*130)); }
function sfxLose(){ beep(140,.4,'sawtooth',0.1); setTimeout(()=>beep(100,.5,'sawtooth',0.1),200); }
function sfxTick(){ beep(400,.06,'square',0.05); }

function confettiBurst(){
  const emojis = ['\u{1F4B0}','\u2728','\u{1F3C6}','\u{1F451}','\u{1F3DB}'];
  for(let i=0;i<22;i++){
    const c = document.createElement('div');
    c.className='confetti'; c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    c.style.left = Math.random()*100+'vw'; c.style.animationDuration=(2+Math.random()*1.5)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),4000);
  }
}

function buildLadder(){
  const l = document.getElementById('ladder');
  l.innerHTML='';
  for(let i=0;i<milestones.length;i++){
    const r = document.createElement('div');
    r.className = 'rung' + (i===qIndex?' active':'') + (i<qIndex?' passed':'');
    r.innerHTML = `<span>${i+1}</span><span>${milestones[i].toLocaleString()}</span>`;
    l.appendChild(r);
  }
}

function renderQuestion(){
  locked=false; fiftyUsed=false; skipUsedThisQ=false;
  document.getElementById('lifeFifty').disabled = window.fiftyGone;
  document.getElementById('lifeSkip').disabled = window.skipGone;
  buildLadder();
  document.getElementById('qnum').textContent = `Question ${qIndex+1} of ${questions.length}`;
  const item = questions[qIndex];
  document.getElementById('qbox').textContent = item.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML='';
  item.choices.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className='choice'; b.textContent=String.fromCharCode(65+i)+') '+c;
    b.dataset.idx = i;
    b.onclick = ()=>selectAnswer(i,b);
    box.appendChild(b);
  });
  document.getElementById('feedback').textContent='';
  timeLeft=20;
  document.getElementById('timeLeft').textContent=timeLeft;
  document.getElementById('timerPill').classList.remove('warn');
  clearInterval(timerId);
  timerId = setInterval(tick,1000);
}

function tick(){
  timeLeft--;
  document.getElementById('timeLeft').textContent=timeLeft;
  const p = document.getElementById('timerPill');
  p.classList.toggle('warn', timeLeft<=5);
  if(timeLeft<=5 && timeLeft>0) sfxTick();
  if(timeLeft<=0){ clearInterval(timerId); if(!locked) timeOutFail(); }
}

function timeOutFail(){
  locked=true;
  const item = questions[qIndex];
  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b=>b.disabled=true);
  buttons[item.a].classList.add('correct');
  document.getElementById('feedback').textContent = "\u23F0 Time's up! The correct answer was highlighted.";
  document.getElementById('feedback').className='feedback bad';
  sfxWrong();
  setTimeout(loseGame, 1500);
}

function selectAnswer(i, btnEl){
  if(ended || locked) return;
  locked = true;
  clearInterval(timerId);
  const item = questions[qIndex];
  const buttons = document.querySelectorAll('.choice');
  btnEl.classList.add('locked-in');
  setTimeout(()=>{
    buttons.forEach(b=>b.disabled=true);
    btnEl.classList.remove('locked-in');
    if(i === item.a){
      btnEl.classList.add('correct');
      money = item.money;
      document.getElementById('money').textContent = money.toLocaleString();
      document.getElementById('feedback').textContent = '\u2705 Correct! You climbed the ladder.';
      document.getElementById('feedback').className='feedback good';
      sfxCorrect(); confettiBurst();
      setTimeout(()=>{
        qIndex++;
        if(qIndex >= questions.length){ winGame(); } else { renderQuestion(); }
      }, 1400);
    } else {
      btnEl.classList.add('wrong');
      buttons[item.a].classList.add('correct');
      document.getElementById('feedback').textContent = '\u274C Wrong! The right answer is highlighted.';
      document.getElementById('feedback').className='feedback bad';
      sfxWrong();
      setTimeout(loseGame, 1500);
    }
  }, 900);
}

function useFiftyFifty(){
  if(window.fiftyGone || locked) return;
  window.fiftyGone = true;
  document.getElementById('lifeFifty').disabled=true;
  const item = questions[qIndex];
  const buttons = Array.from(document.querySelectorAll('.choice'));
  const wrongIdxs = buttons.map((b,i)=>i).filter(i=>i!==item.a);
  // remove two wrong answers
  const toRemove = wrongIdxs.sort(()=>Math.random()-0.5).slice(0,2);
  toRemove.forEach(i=>{ buttons[i].style.visibility='hidden'; });
  beep(500,.1);
}

function useSkip(){
  if(window.skipGone || locked) return;
  window.skipGone = true;
  document.getElementById('lifeSkip').disabled=true;
  clearInterval(timerId);
  beep(500,.1);
  qIndex++;
  if(qIndex >= questions.length){ winGame(); } else { renderQuestion(); }
}

function winGame(){
  ended=true; clearInterval(timerId); sfxWin(); confettiBurst();
  document.getElementById('choicesBox').innerHTML='';
  document.getElementById('qbox').textContent='';
  document.getElementById('feedback').textContent='';
  document.getElementById('endArea').innerHTML = `
    <div class="endscreen win">
      <div class="big">&#x1F451; You Sailed the Whole Nile!</div>
      <p>Final prize: <b>${money.toLocaleString()} EGP</b></p>
      <div class="center"><button class="btn" onclick="restart()">Play Again</button></div>
    </div>`;
}
function loseGame(){
  ended=true; clearInterval(timerId); sfxLose();
  document.getElementById('endArea').innerHTML = `
    <div class="endscreen lose">
      <div class="big">&#x1F6A2; Game Over</div>
      <p>You banked <b>${money.toLocaleString()} EGP</b> before missing a question.</p>
      <div class="center"><button class="btn" onclick="restart()">Try Again</button></div>
    </div>`;
}

function restart(){
  qIndex=0; money=0; ended=false; window.fiftyGone=false; window.skipGone=false;
  document.getElementById('money').textContent=0;
  document.getElementById('endArea').innerHTML='';
  renderQuestion();
}

restart();
</script>
</body>
</html>
