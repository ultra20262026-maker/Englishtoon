<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bubble Pop</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #f39c12;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #1a1a2e;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        #hud {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            z-index: 100;
        }

        .hud-item {
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
        }

        #score-val { color: var(--secondary); }

        #game-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #question-box {
            background: rgba(255,255,255,0.1);
            padding: 20px 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            max-width: 90%;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #q-text {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1.4;
        }

        #q-image {
            max-width: 200px;
            max-height: 200px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        #choices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .choice-btn {
            background: var(--primary);
            border: none;
            padding: 20px;
            border-radius: 15px;
            color: white;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 6px 0 #2980b9;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .choice-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2980b9;
        }

        .choice-btn.correct { background: var(--success); box-shadow: 0 6px 0 #27ae60; }
        .choice-btn.wrong { background: var(--danger); box-shadow: 0 6px 0 #c0392b; }

        /* Scramble Mode */
        #scramble-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .slots-row, .letters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .letter-tile {
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #2980b9;
        }

        .slot-tile {
            width: 50px;
            height: 50px;
            border-bottom: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--secondary);
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #overlay.show { display: flex; }

        #overlay h1 { font-size: 3rem; margin-bottom: 20px; font-family: 'Fredoka One'; }
        #overlay p { font-size: 1.5rem; margin-bottom: 30px; }

        .btn-restart {
            padding: 15px 40px;
            background: var(--secondary);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #q-text { font-size: 1.4rem; }
            .choice-btn { font-size: 1.1rem; padding: 15px; }
            #choices-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

                    text: q.q || q.question,
                    choices: q.choices || q.options,
                    answer: q.answer,
                    image: q.image || q.img || null,
                    type: 'mcq'
                }));
            } else if (type === 'words' || type === 'vocabulary') {
                questions = raw.map(item => ({
                    text: item.w || item.word,
                    image: item.i || item.img || null,
                    type: 'scramble'
                }));
            } else if (type === 'META') {
                questions = raw.rawRounds.map(r => ({
                    text: r.prompt,
                    choices: r.choices,
                    answer: r.correct,
                    type: 'mcq'
                }));
            } else if (type === 'pairs' || type === 'tasks' || type === 'sentences' || type === 'wordsData') {
                questions = raw.map(item => ({
                    text: item.text || item.word || item.w || "What is this?",
                    image: item.img || item.i || item.image || null,
                    choices: item.wrong ? [item.answer, ...item.wrong] : null,
                    answer: item.wrong ? 0 : null,
                    type: (item.wrong || item.choices) ? 'mcq' : 'scramble'
                }));
            } else if (type === 'custom_farm') {
                questions = raw.map(q => ({
                    text: q.text,
                    answer: q.answer,
                    type: 'count'
                }));
            } else if (type === 'CURRICULUM') {
                // Flatten curriculum
                raw.units.forEach(u => {
                    u.lessons.forEach(l => {
                        if (l.questions) {
                            l.questions.forEach(q => {
                                questions.push({
                                    text: q.q,
                                    choices: q.choices,
                                    answer: q.answer,
                                    type: 'mcq'
                                });
                            });
                        }
                    });
                });
            }
            return questions;
        }

        const questions = parseData(RAW_DATA, DATA_TYPE);
        let currentQ = 0;
        let score = 0;
        let locked = false;

        function loadQuestion() {
            if (currentQ >= questions.length) {
                showEnd();
                return;
            }

            locked = false;
            const q = questions[currentQ];
            document.getElementById('q-num').innerText = `Q ${currentQ + 1}/${questions.length}`;
            
            const qText = document.getElementById('q-text');
            const qImg = document.getElementById('q-image');
            const choicesGrid = document.getElementById('choices-grid');
            const scrambleBox = document.getElementById('scramble-container');

            qText.innerText = q.text;
            if (q.image) {
                qImg.src = q.image;
                qImg.style.display = 'block';
            } else {
                qImg.style.display = 'none';
            }

            const farm = document.getElementById('farm-grid');
            if (farm) farm.style.display = 'none';

            if (q.type === 'mcq') {
                choicesGrid.style.display = 'grid';
                scrambleBox.style.display = 'none';
                choicesGrid.innerHTML = '';
                q.choices.forEach((c, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = c;
                    btn.onclick = () => handleMCQ(btn, i === q.answer);
                    choicesGrid.appendChild(btn);
                });
            } else if (q.type === 'count') {
                choicesGrid.style.display = 'none';
                scrambleBox.style.display = 'none';
                let farmGrid = document.getElementById('farm-grid');
                if (!farmGrid) {
                    farmGrid = document.createElement('div');
                    farmGrid.id = 'farm-grid';
                    farmGrid.style.display = 'flex';
                    farmGrid.style.flexWrap = 'wrap';
                    farmGrid.style.gap = '10px';
                    farmGrid.style.justifyContent = 'center';
                    farmGrid.style.marginTop = '20px';
                    document.getElementById('game-container').appendChild(farmGrid);
                }
                farmGrid.style.display = 'flex';
                setupFarm(farmGrid, q.answer);
            } else {
                choicesGrid.style.display = 'none';
                scrambleBox.style.display = 'flex';
                setupScramble(q.text);
            }

            // Speak question text
            speak(q.text);
        }

        function setupFarm(grid, target) {
            grid.innerHTML = '';
            let nums = [target];
            while(nums.length < 3) {
                let r = Math.floor(Math.random() * 5) + 1;
                if(!nums.includes(r)) nums.push(r);
            }
            nums.sort(() => Math.random() - 0.5);
            
            nums.forEach(n => {
                const pen = document.createElement('div');
                pen.className = 'choice-btn';
                pen.style.fontSize = '2rem';
                pen.innerHTML = '🐄'.repeat(n);
                pen.onclick = () => {
                    if (locked) return;
                    if (n === target) {
                        locked = true;
                        score += 100;
                        document.getElementById('score-val').innerText = score;
                        pen.classList.add('correct');
                        setTimeout(() => {
                            currentQ++;
                            loadQuestion();
                        }, 1000);
                    } else {
                        pen.classList.add('wrong');
                        setTimeout(() => pen.classList.remove('wrong'), 500);
                    }
                };
                grid.appendChild(pen);
            });
        }

        function handleMCQ(btn, isCorrect) {
            if (locked) return;
            locked = true;

            if (isCorrect) {
                score += 100;
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
            }

            document.getElementById('score-val').innerText = score;
            setTimeout(() => {
                currentQ++;
                loadQuestion();
            }, 1000);
        }

        function setupScramble(word) {
            const slots = document.getElementById('slots');
            const letters = document.getElementById('letters');
            slots.innerHTML = '';
            letters.innerHTML = '';

            const chars = word.toUpperCase().split('');
            const shuffled = [...chars].sort(() => Math.random() - 0.5);
            let currentPos = 0;

            chars.forEach(() => {
                const slot = document.createElement('div');
                slot.className = 'slot-tile';
                slots.appendChild(slot);
            });

            shuffled.forEach((char) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.innerText = char;
                tile.onclick = () => {
                    if (tile.classList.contains('used')) return;
                    
                    const targetSlot = slots.children[currentPos];
                    if (char === chars[currentPos]) {
                        tile.classList.add('used');
                        targetSlot.innerText = char;
                        currentPos++;
                        if (currentPos === chars.length) {
                            score += 100;
                            document.getElementById('score-val').innerText = score;
                            setTimeout(() => {
                                currentQ++;
                                loadQuestion();
                            }, 1000);
                        }
                    } else {
                        tile.style.background = 'var(--danger)';
                        setTimeout(() => tile.style.background = 'var(--primary)', 500);
                    }
                };
                letters.appendChild(tile);
            });
        }

        function showEnd() {
            document.getElementById('overlay').classList.add('show');
            document.getElementById('final-score').innerText = `Final Score: ${score}`;
        }

        // Start
        loadQuestion();
    </script>
</body>
</html>
