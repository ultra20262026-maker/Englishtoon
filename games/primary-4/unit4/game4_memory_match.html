<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Man-Made Resources Memory | Man-Made Resources</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --lapis:#0F1C3D; --lapis2:#182b57; --gold:#D4AF37; --turq:#2E8B8B; --sand:#C89F65; --papyrus:#F4EBD9; --red:#C0392B; --green:#3FA34D; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; min-height:100vh; font-family:'Poppins',sans-serif; color:var(--papyrus);
    background:radial-gradient(circle at 50% 0%, #1c2f5e 0%, var(--lapis) 55%, #060c1c 100%);
    display:flex; align-items:center; justify-content:center; padding:16px;}
  .wrap{max-width:680px; width:100%;}
  .card{background:linear-gradient(160deg,var(--lapis2),#0c1735 85%); border:2px solid #a3852a55; border-radius:18px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.55);}
  h1{font-family:'Cinzel',serif; color:var(--gold); text-align:center; font-size:clamp(19px,4.5vw,27px); margin:0 0 2px;}
  .sub{text-align:center; color:var(--sand); font-size:13px; margin-bottom:14px;}
  .hud{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
  .pill{font-family:'Space Mono',monospace; background:rgba(0,0,0,.3); border:1px solid var(--gold); border-radius:10px; padding:7px 12px; font-size:13px;}
  .warn{color:#ff8080; border-color:#ff8080; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .board{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:420px){ .board{grid-template-columns:repeat(3,1fr);} }
  .tile{aspect-ratio:1; position:relative; cursor:pointer; perspective:600px;}
  .tile-inner{width:100%; height:100%; position:relative; transition:transform .5s; transform-style:preserve-3d;}
  .tile.flipped .tile-inner{transform:rotateY(180deg);}
  .tile.matched .tile-inner{transform:rotateY(180deg);}
  .face{position:absolute; inset:0; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:clamp(11px,2.6vw,14px); font-weight:600; text-align:center; padding:6px; backface-visibility:hidden;}
  .face.back{background:linear-gradient(160deg,var(--turq),#12474a); border:2px solid var(--gold); font-size:22px;}
  .face.front{background:linear-gradient(160deg,#3a2d15,#1c150a); border:2px solid var(--sand); transform:rotateY(180deg); color:var(--papyrus);}
  .tile.matched .face.front{background:linear-gradient(160deg,var(--green),#1f6b2b); border-color:var(--gold); animation:pop .4s;}
  @keyframes pop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.08)}100%{transform:rotateY(180deg) scale(1)}}
  .tile.wrong .face.front{background:linear-gradient(160deg,var(--red),#6b1f1f); animation:shake .4s;}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}
  .feedback{text-align:center; font-weight:700; margin-top:14px; min-height:20px; font-size:14px;}
  .feedback.good{color:var(--green);} .feedback.bad{color:#ff8b7a;}
  .btn{font-family:'Cinzel',serif; font-weight:700; background:linear-gradient(160deg,var(--gold),#a3852a); color:#1a1400; border:none; border-radius:10px; padding:12px 22px; font-size:15px; cursor:pointer; box-shadow:0 6px 16px rgba(212,175,55,.35);}
  .center{display:flex; justify-content:center; margin-top:16px;}
  .endscreen{text-align:center;}
  .endscreen .big{font-family:'Cinzel',serif; font-size:clamp(22px,6vw,34px); font-weight:900;}
  .win .big{color:var(--gold);} .lose .big{color:#ff6b6b;}
  .confetti{position:fixed; top:-10px; z-index:5; font-size:20px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>&#x1F3D7; Man-Made Resources Memory</h1>
    <div class="sub">Unit 4 · Lesson 4&5 — Man-Made Resources</div>
    <div class="hud">
      <div class="pill" id="timerPill">&#9202; <span id="timeLeft">90</span>s</div>
      <div class="pill">&#x1F31F; <span id="score">0</span> pts</div>
      <div class="pill">&#128260; <span id="moves">0</span> moves</div>
      <div class="pill">&#x1F3AF; <span id="pairs">0</span>/8 pairs</div>
    </div>
    <div class="board" id="board"></div>
    <div class="feedback" id="feedback"></div>
    <div id="endArea"></div>
  </div>
</div>

<script>
// School-day vocabulary pairs: term <-> meaning/match
const pairSource = [
  ["dam","a structure built to make electricity from water"],
  ["wisely","using something carefully, without waste"],
  ["must","shows something is necessary"],
  ["mustn't","shows something is forbidden"],
  ["natural resources","materials like oil, gas, gold and iron"],
  ["save water","use only the water you really need"],
  ["solar panel","captures energy from the sun"],
  ["pollution","harmful dirt in the air or water"]
];

let deck=[], firstPick=null, secondPick=null, locked=false, score=0, moves=0, matchedPairs=0, timeLeft=90, timerId=null, ended=false;

function beep(freq, dur, type='sine', vol=0.15){
  try{
    const ctx = window._actx || (window._actx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(ctx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function sfxFlip(){ beep(500,.07,'triangle',0.08); }
function sfxMatch(){ beep(700,.12); setTimeout(()=>beep(950,.18),100); }
function sfxWrong(){ beep(170,.25,'sawtooth',0.12); }
function sfxWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.22),i*140)); }
function sfxLose(){ beep(140,.4,'sawtooth',0.1); setTimeout(()=>beep(100,.5,'sawtooth',0.1),200); }

function confettiBurst(){
  const emojis = ['\u2728','\u{1F3C6}','\u{1F393}','\u{1F31F}','\u{1F514}'];
  for(let i=0;i<22;i++){
    const c = document.createElement('div');
    c.className='confetti'; c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    c.style.left = Math.random()*100+'vw'; c.style.animationDuration=(2+Math.random()*1.5)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),4000);
  }
}

function buildDeck(){
  deck = [];
  pairSource.forEach((pair,i)=>{
    deck.push({pairId:i, text:pair[0], key:'a'});
    deck.push({pairId:i, text:pair[1], key:'b'});
  });
  // shuffle
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML='';
  deck.forEach((card, idx)=>{
    const tile = document.createElement('div');
    tile.className='tile';
    tile.dataset.idx = idx;
    tile.innerHTML = `
      <div class="tile-inner">
        <div class="face back">&#x1F4DC;</div>
        <div class="face front">${card.text}</div>
      </div>`;
    tile.onclick = ()=>flip(idx, tile);
    board.appendChild(tile);
  });
}

function flip(idx, tileEl){
  if(ended || locked) return;
  if(tileEl.classList.contains('flipped') || tileEl.classList.contains('matched')) return;
  tileEl.classList.add('flipped');
  sfxFlip();
  if(!firstPick){
    firstPick = {idx, el:tileEl};
    return;
  }
  secondPick = {idx, el:tileEl};
  locked = true;
  moves++;
  document.getElementById('moves').textContent = moves;
  const a = deck[firstPick.idx], b = deck[secondPick.idx];
  if(a.pairId === b.pairId && a.idx !== b.idx){
    setTimeout(()=>{
      firstPick.el.classList.add('matched');
      secondPick.el.classList.add('matched');
      matchedPairs++;
      score += 12;
      document.getElementById('score').textContent = score;
      document.getElementById('pairs').textContent = matchedPairs;
      document.getElementById('feedback').textContent = '\u2705 Nice match!';
      document.getElementById('feedback').className='feedback good';
      sfxMatch(); confettiBurst();
      firstPick=null; secondPick=null; locked=false;
      if(matchedPairs >= pairSource.length){ setTimeout(winGame, 900); }
    }, 500);
  } else {
    firstPick.el.classList.add('wrong');
    secondPick.el.classList.add('wrong');
    document.getElementById('feedback').textContent = '\u274C Not a match, try again.';
    document.getElementById('feedback').className='feedback bad';
    sfxWrong();
    setTimeout(()=>{
      firstPick.el.classList.remove('flipped','wrong');
      secondPick.el.classList.remove('flipped','wrong');
      firstPick=null; secondPick=null; locked=false;
      document.getElementById('feedback').textContent='';
    }, 1000);
  }
}

function tick(){
  timeLeft--;
  document.getElementById('timeLeft').textContent = timeLeft;
  document.getElementById('timerPill').classList.toggle('warn', timeLeft<=15);
  if(timeLeft<=0){ clearInterval(timerId); loseGame(); }
}

function winGame(){
  ended=true; clearInterval(timerId); sfxWin(); confettiBurst();
  document.getElementById('endArea').innerHTML = `
    <div class="endscreen win">
      <div class="big">&#x1F3C6; All Matched!</div>
      <p>You matched all 8 pairs in ${moves} moves with <b>${score}</b> points!</p>
      <div class="center"><button class="btn" onclick="restart()">Play Again</button></div>
    </div>`;
}
function loseGame(){
  ended=true; clearInterval(timerId); sfxLose();
  document.getElementById('endArea').innerHTML = `
    <div class="endscreen lose">
      <div class="big">&#9203; Bell Rang!</div>
      <p>You matched ${matchedPairs}/8 pairs with ${score} points.</p>
      <div class="center"><button class="btn" onclick="restart()">Try Again</button></div>
    </div>`;
}

function restart(){
  score=0; moves=0; matchedPairs=0; timeLeft=90; ended=false; firstPick=null; secondPick=null; locked=false;
  document.getElementById('score').textContent=0;
  document.getElementById('moves').textContent=0;
  document.getElementById('pairs').textContent=0;
  document.getElementById('timeLeft').textContent=90;
  document.getElementById('timerPill').classList.remove('warn');
  document.getElementById('feedback').textContent='';
  document.getElementById('endArea').innerHTML='';
  buildDeck();
  renderBoard();
  clearInterval(timerId);
  timerId = setInterval(tick,1000);
}

restart();
</script>
</body>
</html>
