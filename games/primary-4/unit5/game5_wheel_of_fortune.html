<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wheel of Time Travel | Past Simple Review</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --lapis:#0F1C3D; --lapis2:#182b57; --gold:#D4AF37; --turq:#2E8B8B; --sand:#C89F65; --papyrus:#F4EBD9; --red:#C0392B; --green:#3FA34D; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; min-height:100vh; font-family:'Poppins',sans-serif; color:var(--papyrus);
    background:radial-gradient(circle at 50% 0%, #1c2f5e 0%, var(--lapis) 55%, #060c1c 100%);
    display:flex; align-items:center; justify-content:center; padding:16px;}
  .wrap{max-width:820px; width:100%;}
  .card{background:linear-gradient(160deg,var(--lapis2),#0c1735 85%); border:2px solid #a3852a55; border-radius:18px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.55);}
  h1{font-family:'Cinzel',serif; color:var(--gold); text-align:center; font-size:clamp(19px,4.2vw,27px); margin:0 0 2px;}
  .sub{text-align:center; color:var(--sand); font-size:13px; margin-bottom:14px;}
  .hud{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
  .pill{font-family:'Space Mono',monospace; background:rgba(0,0,0,.3); border:1px solid var(--gold); border-radius:10px; padding:7px 12px; font-size:13px;}
  .warn{color:#ff8080; border-color:#ff8080; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .stage-top{display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:10px;}
  .wheel-holder{position:relative; width:240px; height:240px;}
  .pointer{position:absolute; top:-10px; left:50%; transform:translateX(-50%); font-size:26px; z-index:3; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
  #wheel{width:240px; height:240px; border-radius:50%; border:6px solid var(--gold); box-shadow:0 0 30px rgba(212,175,55,.4); transition:transform 3.2s cubic-bezier(.17,.67,.12,1);}
  .wheel-center{position:absolute; top:50%; left:50%; width:36px; height:36px; margin:-18px; background:var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; z-index:2; box-shadow:0 0 10px rgba(0,0,0,.5);}
  .btn{font-family:'Cinzel',serif; font-weight:700; background:linear-gradient(160deg,var(--gold),#a3852a); color:#1a1400; border:none; border-radius:10px; padding:12px 26px; font-size:15px; cursor:pointer; box-shadow:0 6px 16px rgba(212,175,55,.35);}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn:hover:not(:disabled){transform:translateY(-2px);}
  .qnum{text-align:center; font-family:'Space Mono',monospace; color:var(--sand); font-size:12px; margin-bottom:8px;}
  .qbox{background:rgba(0,0,0,.3); border-left:4px solid var(--gold); border-radius:12px; padding:16px; font-size:clamp(15px,3vw,17px); line-height:1.5; margin-bottom:14px; text-align:center;}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:480px){ .choices{grid-template-columns:1fr;} }
  .choice{font-family:'Poppins'; font-size:14px; padding:12px 14px; border-radius:10px; background:rgba(212,175,55,.08); border:1.5px solid rgba(212,175,55,.35); color:var(--papyrus); cursor:pointer; transition:.18s;}
  .choice:hover:not(:disabled){background:rgba(212,175,55,.22); border-color:var(--gold); transform:scale(1.02);}
  .choice.correct{background:rgba(63,163,77,.3); border-color:var(--green); animation:pop .4s;}
  .choice.wrong{background:rgba(192,57,43,.3); border-color:var(--red); animation:shake .4s;}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .feedback{text-align:center; font-weight:700; margin-top:10px; min-height:20px; font-size:14px;}
  .feedback.good{color:var(--green);} .feedback.bad{color:#ff8b7a;}
  .center{display:flex; justify-content:center; margin-top:14px;}
  .endscreen{text-align:center;}
  .endscreen .big{font-family:'Cinzel',serif; font-size:clamp(22px,6vw,34px); font-weight:900;}
  .win .big{color:var(--gold);} .lose .big{color:#ff6b6b;}
  .confetti{position:fixed; top:-10px; z-index:5; font-size:20px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0;}}
  .segLabel{font-family:'Space Mono',monospace; color:var(--sand); font-size:12px; text-align:center; margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>&#x1F3B1; Wheel of Time Travel</h1>
    <div class="sub">Unit 5 Grammar Review — Past Simple Tense</div>
    <div class="hud">
      <div class="pill" id="timerPill">&#9202; <span id="timeLeft">120</span>s</div>
      <div class="pill">&#x1F3C6; <span id="score">0</span> pts</div>
      <div class="pill">&#x1F4DC; <span id="qcount">0</span>/12 rounds</div>
    </div>
    <div class="stage-top" id="wheelStage">
      <div class="wheel-holder">
        <div class="pointer">&#x1F53B;</div>
        <svg id="wheel" viewBox="0 0 100 100" width="240" height="240"></svg>
        <div class="wheel-center">&#x2600;</div>
      </div>
      <button class="btn" id="spinBtn" onclick="spin()">Spin the Wheel</button>
      <div class="segLabel" id="segLabel">Spin to reveal your round's points!</div>
    </div>
    <div id="quizArea"></div>
    <div id="endArea"></div>
  </div>
</div>

<script>
const segments = [50,100,150,200,"LOSE TURN",250,300,100];
const colors = ["#2E8B8B","#D4AF37","#C89F65","#2E8B8B","#C0392B","#D4AF37","#3FA34D","#C89F65"];

// Grammar review questions for this unit's Weekly Quizzes and Unit Review
const questions = [
  {q:"Omar is (interesting) in English. (correct form)", choices:["interesting","interested","interests","interest"], a:1, why:"A person's feeling uses INTERESTED (in something)."},
  {q:"The film was so (bored). I didn't like it. (correct form)", choices:["bored","boring","bore","bores"], a:1, why:"A thing that causes the feeling is BORING; 'bored' describes a person."},
  {q:"Let's (visited) the museum next Friday. (correct form)", choices:["visited","visit","visits","visiting"], a:1, why:"After 'Let's', use the base verb form: VISIT."},
  {q:"I (doesn't) watch the show yesterday. (correct form)", choices:["doesn't","didn't","don't","not"], a:1, why:"Past negative uses DIDN'T, matching the time clue 'yesterday'."},
  {q:"They (watches) a movie last night. (correct form)", choices:["watches","watched","watch","watching"], a:1, why:"Regular verb + -ed for a finished action last night: WATCHED."},
  {q:"They (paint) their house yesterday.", choices:["paint","painted","paints","painting"], a:1, why:"Regular verb + -ed for a finished past action: PAINTED."},
  {q:"Ali (not be) at school yesterday.", choices:["isn't","wasn't","weren't","aren't"], a:1, why:"Past negative of 'be' with a singular subject: WASN'T."},
  {q:"I (have) dinner an hour ago.", choices:["have","had","haved","has"], a:1, why:"'have' is irregular in the past: HAD."},
  {q:"Reorder: ride - Friday - will - on - He - a - bike.", choices:["He will ride a bike on Friday.","Friday he will a bike ride on.","He a bike will ride on Friday.","Will he ride Friday a bike on."], a:0, why:"Subject + will + base verb + object + time: He WILL RIDE a bike on Friday."},
  {q:"Reorder: want - he - Where - to - did - go?", choices:["Where did he want to go?","He did want where to go?","Where he did want to go?","Did where he want to go?"], a:0, why:"Question word + did + subject + base verb: Where DID HE WANT to go?"},
  {q:"Reorder: the - can - beach - Alexandria - We - to - go - in.", choices:["We can go to the beach in Alexandria.","We in Alexandria can go to the beach.","Can we go to the beach in Alexandria.","The beach we can go to in Alexandria."], a:0, why:"Subject + can + base verb + place phrase: We CAN GO to the beach in Alexandria."},
  {q:"We go to Alex to enjoy its (peace) environment. (correct form)", choices:["peace","peaceful","peacefully","peaces"], a:1, why:"The adjective form is PEACEFUL, describing the environment."},
];

let order = [], qi=0, score=0, rounds=0, timeLeft=120, timerId=null, ended=false, spinning=false, currentPoints=0;

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function beep(freq, dur, type='sine', vol=0.15){
  try{
    const ctx = window._actx || (window._actx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(ctx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function sfxTick(){ beep(300,.04,'square',0.05); }
function sfxCorrect(){ beep(700,.12); setTimeout(()=>beep(950,.18),100); }
function sfxWrong(){ beep(170,.25,'sawtooth',0.12); }
function sfxWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.22),i*140)); }
function sfxLose(){ beep(140,.4,'sawtooth',0.1); setTimeout(()=>beep(100,.5,'sawtooth',0.1),200); }

function confettiBurst(){
  const emojis = ['\u2728','\u{1F3C6}','\u{1F3B1}','\u2600','\u{1F31F}'];
  for(let i=0;i<22;i++){
    const c = document.createElement('div');
    c.className='confetti'; c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    c.style.left = Math.random()*100+'vw'; c.style.animationDuration=(2+Math.random()*1.5)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),4000);
  }
}

function drawWheel(){
  const svg = document.getElementById('wheel');
  svg.innerHTML='';
  const n = segments.length, cx=50, cy=50, r=48;
  for(let i=0;i<n;i++){
    const a0 = (i/n)*2*Math.PI - Math.PI/2;
    const a1 = ((i+1)/n)*2*Math.PI - Math.PI/2;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", `M${cx},${cy} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z`);
    path.setAttribute("fill", colors[i % colors.length]);
    path.setAttribute("stroke", "#0c1735");
    path.setAttribute("stroke-width","0.6");
    svg.appendChild(path);
    // label
    const mid = (a0+a1)/2;
    const lx = cx + (r*0.62)*Math.cos(mid), ly = cy + (r*0.62)*Math.sin(mid);
    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", lx); text.setAttribute("y", ly);
    text.setAttribute("font-size", "6.2");
    text.setAttribute("fill", "#0c1735");
    text.setAttribute("font-weight","700");
    text.setAttribute("text-anchor","middle");
    text.setAttribute("transform",`rotate(${mid*180/Math.PI+90}, ${lx}, ${ly})`);
    text.textContent = segments[i];
    svg.appendChild(text);
  }
}
drawWheel();

function spin(){
  if(spinning || ended) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  const n = segments.length;
  const chosen = Math.floor(Math.random()*n);
  const segAngle = 360/n;
  const targetRotation = 360*5 + (360 - (chosen*segAngle + segAngle/2));
  const wheel = document.getElementById('wheel');
  wheel.style.transform = `rotate(${targetRotation}deg)`;
  let tickCount = 0;
  const tickInt = setInterval(()=>{ sfxTick(); tickCount++; if(tickCount>18) clearInterval(tickInt); }, 160);
  setTimeout(()=>{
    clearInterval(tickInt);
    spinning = false;
    const result = segments[chosen];
    document.getElementById('segLabel').textContent = `Landed on: ${result}`;
    if(result === "LOSE TURN"){
      sfxWrong();
      document.getElementById('segLabel').textContent = 'Landed on LOSE TURN — spin again next round!';
      rounds++;
      document.getElementById('qcount').textContent = rounds;
      document.getElementById('spinBtn').disabled = false;
      if(rounds >= questions.length || rounds>=12){ setTimeout(winGame,700); }
    } else {
      currentPoints = result;
      askQuestion();
    }
  }, 3300);
}

function askQuestion(){
  const item = questions[order[qi % order.length]];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="qnum">Round ${rounds+1} of 12 — worth ${currentPoints} pts</div>
    <div class="qbox">${item.q}</div>
    <div class="choices" id="choicesBox"></div>
    <div class="feedback" id="feedback"></div>
  `;
  const box = document.getElementById('choicesBox');
  item.choices.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className='choice'; b.textContent = c;
    b.onclick = ()=>answer(i,b,item);
    box.appendChild(b);
  });
}

function answer(i, btnEl, item){
  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b=>b.disabled=true);
  const fb = document.getElementById('feedback');
  if(i === item.a){
    btnEl.classList.add('correct');
    score += currentPoints;
    document.getElementById('score').textContent = score;
    fb.textContent = '\u2705 Correct! ' + item.why;
    fb.className='feedback good';
    sfxCorrect(); confettiBurst();
  } else {
    btnEl.classList.add('wrong');
    buttons[item.a].classList.add('correct');
    fb.textContent = '\u274C Not quite. ' + item.why;
    fb.className='feedback bad';
    sfxWrong();
  }
  rounds++; qi++;
  document.getElementById('qcount').textContent = rounds;
  setTimeout(()=>{
    document.getElementById('quizArea').innerHTML='';
    document.getElementById('segLabel').textContent='Spin to reveal your next round!';
    document.getElementById('spinBtn').disabled=false;
    if(rounds >= 12){ winGame(); }
  }, 1800);
}

function tick(){
  timeLeft--;
  document.getElementById('timeLeft').textContent = timeLeft;
  document.getElementById('timerPill').classList.toggle('warn', timeLeft<=15);
  if(timeLeft<=0){ clearInterval(timerId); loseGame(); }
}

function winGame(){
  ended=true; clearInterval(timerId); sfxWin(); confettiBurst();
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('quizArea').innerHTML='';
  document.getElementById('endArea').innerHTML = `
    <div class="endscreen win">
      <div class="big">&#x1F3C6; Grammar Champion!</div>
      <p>You completed 12 rounds with <b>${score}</b> points!</p>
      <div class="center"><button class="btn" onclick="restart()">Spin Again</button></div>
    </div>`;
}
function loseGame(){
  ended=true; clearInterval(timerId); sfxLose();
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('endArea').innerHTML = `
    <div class="endscreen lose">
      <div class="big">&#9203; Time's Up!</div>
      <p>You finished ${rounds} rounds with ${score} points.</p>
      <div class="center"><button class="btn" onclick="restart()">Try Again</button></div>
    </div>`;
}

function restart(){
  order = shuffle(questions.map((_,i)=>i));
  qi=0; score=0; rounds=0; timeLeft=120; ended=false; spinning=false;
  document.getElementById('score').textContent=0;
  document.getElementById('qcount').textContent=0;
  document.getElementById('timeLeft').textContent=120;
  document.getElementById('timerPill').classList.remove('warn');
  document.getElementById('quizArea').innerHTML='';
  document.getElementById('endArea').innerHTML='';
  document.getElementById('segLabel').textContent='Spin to reveal your round\'s points!';
  document.getElementById('spinBtn').disabled=false;
  document.getElementById('wheel').style.transition='none';
  document.getElementById('wheel').style.transform='rotate(0deg)';
  setTimeout(()=>{ document.getElementById('wheel').style.transition='transform 3.2s cubic-bezier(.17,.67,.12,1)'; }, 50);
  clearInterval(timerId);
  timerId = setInterval(tick,1000);
}

restart();
</script>
</body>
</html>
