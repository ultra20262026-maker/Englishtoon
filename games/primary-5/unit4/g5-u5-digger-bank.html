<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Unit 5 · Lesson 2-3 — Metals & The Little Digger</title>
<style>
:root{--ink:#FDF3E7;--deep:#2B1B10;--deep2:#43301E;--acc:#E9A23B;--ok:#8BD450;--bad:#FF6B4A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);
 background:var(--deep);min-height:100vh;padding:10px;overflow:hidden}
.wrap{max-width:620px;margin:0 auto}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:16px}
h1{font-size:1.25rem;color:var(--acc);line-height:1.4}h2{font-size:1.1rem;color:var(--acc)}
p.lead{line-height:1.9;font-size:.95rem;margin-top:8px}
.btn{font-size:1.05rem;font-weight:700;font-family:inherit;background:var(--acc);color:#20160a;border:0;
 border-radius:12px;padding:13px 20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);width:100%;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid rgba(255,255,255,.3);box-shadow:none}
.hud{display:flex;justify-content:space-between;align-items:center;background:var(--deep2);
 border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.88rem}
.qbox{background:var(--deep2);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px;
 text-align:center;margin-top:8px;min-height:58px;display:flex;flex-direction:column;justify-content:center}
.q{font-size:1.02rem;font-weight:700;direction:ltr;line-height:1.5}
.qsub{font-size:.76rem;opacity:.8;margin-top:3px}
#stage{width:100%;height:60vh;min-height:330px;margin-top:8px;border-radius:14px;display:block;touch-action:none;
 background:linear-gradient(180deg,#5A3F26,#2B1B10);border:1px solid rgba(255,255,255,.15)}
section{margin-top:12px}.trophy{font-size:4rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<section id="home"><div class="card">
  <h1>🎱 ارتداد المعادن والحفّار</h1>
  <p class="lead">الوحدة الخامسة — المعادن وقصة الحفّار الصغير.<br>الكورة بترتد من الحيطة وتوصل للإجابة اللي تدوس عليها.</p>
  <button class="btn" onclick="start()">ابدأ</button>
</div></section>

<section id="play" hidden>
  <div class="hud"><span id="lives">❤❤❤</span>
    <span style="font-size:.72rem;opacity:.85">Unit 5 · Lesson 2-3 — Metals & The Little Digger</span>
    <span>⭐ <span id="score">0</span> <span id="combo" style="color:var(--acc)"></span></span></div>
  <div class="qbox"><div class="q" id="q"></div><div class="qsub" id="qsub"></div></div>
  <canvas id="stage"></canvas>
  <button class="btn ghost" onclick="location.reload()">من الأول</button>
</section>

<section id="over" hidden><div class="card" style="text-align:center">
  <div class="trophy" id="ic">🎱</div><h2 id="tt"></h2><p class="lead" id="tx"></p>
  <button class="btn" onclick="location.reload()">العب تاني</button>
</div></section>
</div>

<script>
/* ===== أسئلة الدرس ===== */
const QS=[{"q": "Precious minerals like gold and copper are found ___ .", "opts": ["under the earth", "on trees", "in the sky", "in rivers"], "ans": 0}, {"q": "___ is soft, shiny and used for coins and jewelry.", "opts": ["Gold", "Iron", "Copper", "Sand"], "ans": 0}, {"q": "___ is even more valuable than gold.", "opts": ["Diamond", "Copper", "Iron", "Clay"], "ans": 0}, {"q": "Copper is used for ___ .", "opts": ["electrical wires", "jewelry only", "food", "paper"], "ans": 0}, {"q": "Iron is mainly used to make ___ because it is strong.", "opts": ["cars and bridges", "necklaces", "coins", "wires"], "ans": 0}, {"q": "The little digger watched the big ship get stuck in the ___ .", "opts": ["mud", "sand", "snow", "ice"], "ans": 0}, {"q": "The ship was trying to load its ___ .", "opts": ["cargo", "cars", "water", "air"], "ans": 0}, {"q": "Other machines tried to help but had to ___ .", "opts": ["give up", "give in", "go on", "get up"], "ans": 0}, {"q": "The small digger cleared a ___ around the ship.", "opts": ["path", "park", "pond", "plan"], "ans": 0}, {"q": "The story shows that even small helpers can solve big ___ .", "opts": ["problems", "games", "meals", "songs"], "ans": 0}];
const MODE="bank";

/* ===== الأصوات ===== */
const SFX=(()=>{
 let ac=null,noise=null;
 const A=()=>{if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
   if(ac.state==="suspended")ac.resume();return ac;};
 function nbuf(a){if(noise)return noise;const len=a.sampleRate*1.4,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
   for(let i=0;i<len;i++)d[i]=Math.random()*2-1;noise=b;return b;}
 function tone(f1,f2,dur,type,vol){const a=A();if(!a)return;const o=a.createOscillator(),g=a.createGain();
   o.type=type||"sine";o.frequency.setValueAtTime(f1,a.currentTime);
   if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);
   g.gain.setValueAtTime(vol||.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+dur);
   o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.02);}
 function nz(dur,f,q,vol,to){const a=A();if(!a)return;const s=a.createBufferSource();s.buffer=nbuf(a);
   const bp=a.createBiquadFilter();bp.type="bandpass";bp.frequency.setValueAtTime(f,a.currentTime);
   if(to)bp.frequency.exponentialRampToValueAtTime(to,a.currentTime+dur);bp.Q.value=q||1;
   const g=a.createGain();g.gain.setValueAtTime(vol||.25,a.currentTime);
   g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
   s.connect(bp);bp.connect(g);g.connect(a.destination);s.start();s.stop(a.currentTime+dur+.02);}
 return{unlock(){A();},
  whoosh(){nz(.3,420,1.2,.18,2000);},
  thunk(){tone(170,60,.16,"triangle",.2);nz(.1,700,1.4,.16);},
  snip(){nz(.06,3000,3,.2);nz(.06,2500,3,.18);},
  splash(){nz(.28,900,.8,.26,240);},
  engine(){tone(120,300,.2,"sawtooth",.08);},
  wrong(){tone(240,90,.3,"square",.14);},
  ding(){tone(880,1320,.15,"sine",.15);setTimeout(()=>tone(1320,1760,.18,"sine",.11),90);},
  clap(){const a=A();if(!a)return;const t0=a.currentTime;
   for(let i=0;i<24;i++){const t=t0+i*.045+Math.random()*.03;const s=a.createBufferSource();s.buffer=nbuf(a);
    const bp=a.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1100+Math.random()*1800;bp.Q.value=.9;
    const g=a.createGain();const v=.09+Math.random()*.08;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+.09);
    s.connect(bp);bp.connect(g);g.connect(a.destination);s.start(t);s.stop(t+.12);}}
 };
})();

/* ===== المحرك ===== */
const $=i=>document.getElementById(i);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const cv=$("stage"),ctx=cv.getContext("2d");
const G={W:0,H:0,qi:0,lives:3,score:0,combo:0,right:0,tg:[],proj:null,parts:[],
  t:0,last:0,raf:null,msg:"",msgT:0,busy:false,car:{lane:0,x:0,target:0},wheelA:0,scissors:null,claw:null};
const C={acc:"#E9A23B",ok:"#8BD450",bad:"#FF6B4A",ink:"#FDF3E7",deep2:"#43301E"};

function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
 cv.width=r.width*dpr;cv.height=r.height*dpr;G.W=r.width;G.H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener("resize",()=>{resize();layout();});
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;
 speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function msg(t){G.msg=t;G.msgT=1.7;}
function hud(){$("lives").textContent="❤".repeat(Math.max(0,G.lives))+"🖤".repeat(3-Math.max(0,G.lives));
 $("score").textContent=G.score;$("combo").textContent=G.combo>1?"x"+Math.min(5,G.combo):"";}
function start(){SFX.unlock();$("home").hidden=true;$("play").hidden=false;
 requestAnimationFrame(()=>{resize();newQ();G.last=performance.now();G.raf=requestAnimationFrame(loop);});}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.3,s=50+Math.random()*230;
 G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-50,life:.5+Math.random()*.5,color:c})}}

function newQ(){
 if(G.qi>=QS.length)return over(true);
 const q=QS[G.qi];
 $("q").textContent=q.q;
 $("qsub").textContent=({wheel:"دوس على الإجابة الصح والسهم هيطاردها على العجلة",
   rope:"دوس على الإجابة الصح والمقص هيقطع حبلها",
   race:"دوس على البوابة الصح والعربية هتغيّر الحارة",
   claw:"دوس على الإجابة الصح والكلاب هيمسكها ويحطها في السلة",
   bank:"دوس على الإجابة الصح والكورة هترتد من الحيطة وتوصلها",
   para:"دوس على المنصة اللي فيها الإجابة الصح والمظلة هتوجّه نفسها ليها"})[MODE];
 const opts=shuffle(q.opts.map((o,i)=>({text:o,ok:i===q.ans})));
 ctx.font="700 13px system-ui,Arial";
 G.tg=opts.map(o=>({text:o.text,ok:o.ok,w:Math.max(58,ctx.measureText(o.text).width+20),h:28,x:0,y:0,dead:false}));
 G.proj=null;G.scissors=null;G.busy=false;layout();hud();
}
function layout(){
 const n=G.tg.length;if(!n)return;
 if(MODE==="wheel"){
   G.cx=G.W/2;G.cy=G.H*.44;G.R=Math.min(G.W,G.H)*.30;
   G.tg.forEach((t,i)=>{t.ang=i*(6.283/n);});
 } else if(MODE==="rope"){
   G.tg.forEach((t,i)=>{
     t.ax=(G.W/(n+1))*(i+1); t.ay=18;
     t.len=G.H*.34+((i%2)*26);
     t.th=(Math.random()*.5-.25); t.w0=Math.sqrt(1400/t.len); t.ph=Math.random()*6.3;
     t.falling=false;t.vx=0;t.vy=0;
   });
 } else if(MODE==="race"){
   G.lanes=n; G.car.lane=Math.floor(n/2); G.car.x=laneX(G.car.lane); G.car.target=G.car.lane;
   G.tg.forEach((t,i)=>{t.lane=i;t.y=-40;});
   G.gateSpeed=52+G.qi*5;
  } else if(MODE==="claw"){
   G.tg.forEach((t,i)=>{t.x=(G.W/(n+1))*(i+1);t.y=G.H-52;t.grabbed=false;t.ph=Math.random()*6.3;});
   G.chuteX=28;
 }
 else { // bank
   G.tg.forEach((t,i)=>{
     const col=i%2, row=Math.floor(i/2);
     t.x=(col? G.W*.56 : G.W*.16)+Math.random()*20;
     t.y=40+row*(G.H*.26);
     t.vx=(Math.random()<.5?-1:1)*(12+Math.random()*14);
   });
   G.ball={x:G.W/2,y:G.H-26};
 }
}
function laneX(i){return (G.W/(G.lanes))*(i+.5);}

/* ===== اللمس ===== */
function pt(e){const r=cv.getBoundingClientRect(),p=e.touches?e.changedTouches[0]:e;
 return{x:p.clientX-r.left,y:p.clientY-r.top};}
function centerOf(t){
 if(MODE==="wheel")return{x:G.cx+Math.cos(t.ang+G.wheelA)*G.R,y:G.cy+Math.sin(t.ang+G.wheelA)*G.R};
 if(MODE==="rope")return{x:t.falling?t.x:t.ax+Math.sin(t.th)*t.len,y:t.falling?t.y:t.ay+Math.cos(t.th)*t.len};
 if(MODE==="race")return{x:laneX(t.lane),y:t.y};
 if(MODE==="claw")return t.grabbed&&G.claw?{x:G.claw.x,y:G.claw.y+G.claw.len+10}:{x:t.x,y:t.y};
 if(MODE==="para")return{x:t.x,y:t.y};
 return{x:t.x+t.w/2,y:t.y+t.h/2};
}
function tap(e){
 if(G.busy||G.proj||G.scissors||G.claw)return;e.preventDefault();
 const p=pt(e);let best=null,bd=1e9;
 for(const t of G.tg){if(t.dead)continue;const c=centerOf(t);const d=Math.hypot(p.x-c.x,p.y-c.y);
   if(d<bd){bd=d;best=t;}}
 if(!best||bd>150){msg("دوس على الإجابة");return;}
 launch(best);
}
cv.addEventListener("mousedown",tap);cv.addEventListener("touchstart",tap,{passive:false});

function launch(t){
 if(MODE==="wheel"){
   const c=centerOf(t);
   G.proj={fx:G.W/2,fy:G.H-18,cx:(G.W/2+c.x)/2,cy:(G.H-18+c.y)/2-60,tt:0,dur:.6,lock:t,x:G.W/2,y:G.H-18,px:G.W/2,py:G.H-18};
   SFX.whoosh();
 } else if(MODE==="rope"){
   const c=centerOf(t);
   G.scissors={x:G.W/2,y:G.H-24,tx:t.ax,ty:t.ay+10,tt:0,dur:.4,lock:t};
   SFX.whoosh();
 } else if(MODE==="para"){
   G.para.pick=t;SFX.whoosh();
 } else if(MODE==="race"){
   G.car.target=t.lane;G.pick=t;SFX.engine();
 } else if(MODE==="claw"){
   G.claw={x:G.W/2,y:22,len:18,phase:0,tmr:0,lock:t,sw:0,vx:0};
   SFX.whoosh();
 } else {
   const c=centerOf(t), b=G.ball;
   // مسار ارتدادي: نعكس الهدف على أقرب حيطة
   const wall = c.x> G.W/2 ? 0 : G.W;      // نرتد من الحيطة المقابلة
   const mx = 2*wall - c.x;
   const k = (wall - b.x)/((mx-b.x)||1);
   const px = wall, py = b.y + (c.y-b.y)*k;
   G.proj={poly:[{x:b.x,y:b.y},{x:px,y:Math.max(16,Math.min(G.H-16,py))},{x:c.x,y:c.y}],
     seg:0,tt:0,dur:.42,lock:t,x:b.x,y:b.y,px:b.x,py:b.y,trail:[]};
   SFX.whoosh();
 }
}
const bez=(a,b,c,t)=>{const u=1-t;return u*u*a+2*u*t*b+t*t*c;};

/* ===== الحلقة ===== */
function loop(t){const dt=Math.min(.033,(t-G.last)/1000);G.last=t;G.t+=dt;step(dt);draw();G.raf=requestAnimationFrame(loop);}
function step(dt){
 if(G.msgT>0)G.msgT-=dt;else G.msg="";
 G.parts.forEach(p=>{p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
 G.parts=G.parts.filter(p=>p.life>0);

 if(MODE==="wheel"){
   G.wheelA+=(.55+G.qi*.05)*dt;
   const s=G.proj;
   if(s){const c=centerOf(s.lock);s.tt+=dt/s.dur;const k=Math.min(1,s.tt);
     s.px=s.x;s.py=s.y;
     s.x=bez(s.fx,s.cx,c.x,k);s.y=bez(s.fy,s.cy,c.y,k);
     if(k>=1){SFX.thunk();hit(s.lock);G.proj=null;}}
 }
 else if(MODE==="rope"){
   G.tg.forEach(t=>{
     if(t.dead)return;
     if(t.falling){t.vy+=900*dt;t.x+=t.vx*dt;t.y+=t.vy*dt;
       if(t.y>G.H-40){ // وصلت السلة
         t.dead=true;hit(t);}
     } else { // بندول
       t.th=Math.sin(G.t*t.w0*1.6+t.ph)*.42;
     }
   });
   const sc=G.scissors;
   if(sc){sc.tt+=dt/sc.dur;const k=Math.min(1,sc.tt);
     sc.x=sc.x+(sc.tx-sc.x)*Math.min(1,dt*10);sc.y=sc.y+(sc.ty-sc.y)*Math.min(1,dt*10);
     if(k>=1){SFX.snip();const t=sc.lock;const c=centerOf(t);
       t.falling=true;t.x=c.x;t.y=c.y;t.vx=Math.cos(t.th)*t.len*t.w0*1.6*Math.cos(G.t*t.w0*1.6+t.ph)*.5;t.vy=0;
       G.scissors=null;}}
 }
 else if(MODE==="race"){
   const c=G.car;const tx=laneX(c.target);
   c.x+=(tx-c.x)*Math.min(1,dt*6);
   if(Math.abs(c.x-tx)<4)c.lane=c.target;
   G.tg.forEach(t=>{if(!t.dead)t.y+=G.gateSpeed*dt;});
   const passed=G.tg.find(t=>!t.dead&&t.y>G.H-58);
   if(passed&&!G.busy){
     const chosen=G.tg.reduce((a,b)=>Math.abs(laneX(a.lane)-c.x)<Math.abs(laneX(b.lane)-c.x)?a:b);
     G.tg.forEach(t=>t.dead=true);
     SFX.thunk();hit(chosen);
   }
 }
 else if(MODE==="para"){
   G.tg.forEach(t=>{if(t.dead)return;t.x+=t.vx*dt;
     if(t.x<t.w/2+6){t.x=t.w/2+6;t.vx*=-1}
     if(t.x>G.W-t.w/2-6){t.x=G.W-t.w/2-6;t.vx*=-1}});
   const P=G.para;
   P.vy+=((38+G.qi*2)-P.vy)*1.5*dt;                 // سرعة هبوط ثابتة تقريبًا
   const sway=Math.sin(G.t*1.3+P.sw)*18+G.wind;
   if(P.pick&&!P.pick.dead){const dx=P.pick.x-P.x;P.vx+=dx*3.2*dt;}
   else P.vx+=(sway-P.vx)*1.2*dt;
   P.vx*=Math.pow(.25,dt);
   P.x+=P.vx*dt;P.y+=P.vy*dt;
   P.x=Math.max(14,Math.min(G.W-14,P.x));
   if(P.y>=G.H-52&&!G.busy){
     const land=P.pick&&!P.pick.dead?P.pick:
       G.tg.filter(t=>!t.dead).reduce((a,b)=>Math.abs(a.x-P.x)<Math.abs(b.x-P.x)?a:b);
     SFX.thunk();hit(land);
   }
 }
 else if(MODE==="claw"){
   G.tg.forEach(t=>{if(!t.grabbed)t.y=G.H-52+Math.sin(G.t*2+t.ph)*2;});
   const c=G.claw;
   if(c){
     const t=c.lock;
     const move=(tx,sp)=>{const d=tx-c.x;const st=Math.sign(d)*Math.min(Math.abs(d),sp*dt);
       c.x+=st;c.vx=st/dt;return Math.abs(d)<3;};
     c.sw+=((-c.vx/600)-c.sw)*Math.min(1,dt*5);
     if(c.phase===0){ if(move(t.x,340)){c.phase=1;} }
     else if(c.phase===1){ c.vx*=.6; const tl=(t.y-c.y-12);
       c.len+=Math.min(300*dt,tl-c.len); if(tl-c.len<2){c.phase=2;c.tmr=0;SFX.thunk();} }
     else if(c.phase===2){ c.tmr+=dt; if(c.tmr>.28){t.grabbed=true;c.phase=3;} }
     else if(c.phase===3){ c.len-=300*dt; if(c.len<=20){c.len=20;c.phase=4;} }
     else if(c.phase===4){ if(move(G.chuteX,300)){c.phase=5;c.tmr=0;SFX.splash();} }
     else { c.tmr+=dt; if(c.tmr>.25){const lock=c.lock;G.claw=null;lock.grabbed=false;hit(lock);} }
   }
 }
 else { // bank
   G.tg.forEach(t=>{if(t.dead)return;t.x+=t.vx*dt;
     if(t.x<8){t.x=8;t.vx*=-1}if(t.x+t.w>G.W-8){t.x=G.W-8-t.w;t.vx*=-1}});
   const s=G.proj;
   if(s){
     s.tt+=dt/s.dur;
     let k=Math.min(1,s.tt);
     const a=s.poly[s.seg],b=s.poly[s.seg+1];
     const tx=s.seg===1?centerOf(s.lock).x:b.x, ty=s.seg===1?centerOf(s.lock).y:b.y;
     s.px=s.x;s.py=s.y;
     s.x=a.x+(tx-a.x)*k;s.y=a.y+(ty-a.y)*k;
     s.trail.push({x:s.x,y:s.y});if(s.trail.length>16)s.trail.shift();
     if(k>=1){
       if(s.seg===0){s.seg=1;s.tt=0;s.poly[1]={x:s.x,y:s.y};SFX.thunk();}
       else {hit(s.lock);G.proj=null;}
     }
   }
 }
}
function hit(t){
 const q=QS[G.qi];G.busy=true;
 const c=centerOf(t);
 if(t.ok){
   burst(c.x,c.y,C.ok,24);SFX.ding();SFX.clap();say(t.text);
   G.combo++;const p=10*Math.min(5,G.combo);G.score+=p;G.right++;msg("صح! +"+p);hud();
   G.qi++;setTimeout(newQ,900);
 }else{
   burst(c.x,c.y,C.bad,14);SFX.wrong();G.combo=0;G.lives--;hud();
   msg("مش دي — الصح: "+q.opts[q.ans]);
   if(G.lives<=0)setTimeout(()=>over(false),900);
   else {G.qi++;setTimeout(newQ,1300);}
 }
}
function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function chip(cx,cy,t,fill){
 round(cx-t.w/2,cy-t.h/2,t.w,t.h,10);
 ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=1.4;ctx.stroke();
 ctx.fillStyle="#10202A";ctx.font="700 13px system-ui,Arial";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(t.text,cx,cy);
}
function draw(){
 ctx.clearRect(0,0,G.W,G.H);
 if(MODE==="wheel"){
   ctx.strokeStyle="rgba(255,255,255,.18)";ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(G.cx,G.cy,G.R,0,6.3);ctx.stroke();
   G.tg.forEach(t=>{if(t.dead)return;const c=centerOf(t);
     ctx.strokeStyle="rgba(255,255,255,.2)";ctx.beginPath();ctx.moveTo(G.cx,G.cy);ctx.lineTo(c.x,c.y);ctx.stroke();
     chip(c.x,c.y,t,C.acc);});
   ctx.fillStyle=C.acc;ctx.beginPath();ctx.arc(G.cx,G.cy,12,0,6.3);ctx.fill();
   // القوس
   ctx.fillStyle="rgba(255,255,255,.7)";ctx.beginPath();ctx.arc(G.W/2,G.H-14,10,3.4,6.0);ctx.fill();
   const s=G.proj;
   if(s){const ang=Math.atan2(s.y-s.py,s.x-s.px);
     ctx.save();ctx.translate(s.x,s.y);ctx.rotate(ang);
     ctx.fillStyle="#EEE";ctx.fillRect(-14,-2,20,4);
     ctx.fillStyle=C.bad;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(4,-5);ctx.lineTo(4,5);ctx.closePath();ctx.fill();
     ctx.restore();}
 }
 else if(MODE==="rope"){
   // السلة
   ctx.fillStyle="rgba(255,255,255,.15)";round(G.W/2-70,G.H-34,140,26,8);ctx.fill();
   ctx.strokeStyle=C.acc;ctx.lineWidth=3;ctx.stroke();
   G.tg.forEach(t=>{
     if(t.dead)return;const c=centerOf(t);
     if(!t.falling){ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=2;
       ctx.beginPath();ctx.moveTo(t.ax,t.ay);ctx.lineTo(c.x,c.y);ctx.stroke();
       ctx.fillStyle="rgba(255,255,255,.6)";ctx.beginPath();ctx.arc(t.ax,t.ay,4,0,6.3);ctx.fill();}
     chip(c.x,c.y,t,C.acc);
   });
   const sc=G.scissors;
   if(sc){ctx.font="20px system-ui";ctx.textAlign="center";ctx.fillText("✂️",sc.x,sc.y);}
 }
 else if(MODE==="race"){
   // الطريق
   for(let i=1;i<G.lanes;i++){const x=(G.W/G.lanes)*i;
     ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=2;ctx.setLineDash([12,14]);
     ctx.beginPath();ctx.moveTo(x,-((G.t*90)%26));ctx.lineTo(x,G.H);ctx.stroke();ctx.setLineDash([]);}
   G.tg.forEach(t=>{if(t.dead)return;chip(laneX(t.lane),t.y,t,C.acc);});
   // العربية
   const c=G.car;
   ctx.fillStyle=C.ok;round(c.x-16,G.H-52,32,42,8);ctx.fill();
   ctx.fillStyle="rgba(0,0,0,.35)";round(c.x-11,G.H-44,22,14,4);ctx.fill();
   ctx.fillStyle="#FFF";ctx.fillRect(c.x-13,G.H-14,7,5);ctx.fillRect(c.x+6,G.H-14,7,5);
 }
 else if(MODE==="para"){
   // سحاب
   ctx.fillStyle="rgba(255,255,255,.13)";
   for(let i=0;i<4;i++){const cx=(i*143+G.t*12)%(G.W+150)-75;
     ctx.beginPath();ctx.ellipse(cx,60+i*52,46,15,0,0,6.3);ctx.fill();}
   // المنصات
   G.tg.forEach(t=>{if(t.dead)return;
     ctx.fillStyle="rgba(255,255,255,.18)";round(t.x-t.w/2-6,t.y+14,t.w+12,10,4);ctx.fill();
     chip(t.x,t.y,t,C.acc);});
   // مؤشر الهواء
   ctx.fillStyle="rgba(255,255,255,.6)";ctx.font="700 12px system-ui,Arial";ctx.textAlign="right";
   ctx.fillText((G.wind>0?"→ ":"← ")+"الهواء",G.W-10,16);
   // المظلي
   const P=G.para;
   if(P){
     const tilt=Math.max(-.3,Math.min(.3,P.vx/80));
     ctx.save();ctx.translate(P.x,P.y);ctx.rotate(tilt);
     ctx.fillStyle=C.acc;ctx.beginPath();ctx.arc(0,0,22,Math.PI,0);ctx.fill();
     ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=1.4;
     ctx.beginPath();ctx.moveTo(-20,2);ctx.lineTo(-4,22);ctx.moveTo(20,2);ctx.lineTo(4,22);ctx.stroke();
     ctx.fillStyle=C.ok;ctx.beginPath();ctx.arc(0,28,7,0,6.3);ctx.fill();
     ctx.restore();
   }
 }
 else if(MODE==="claw"){
   // القضيب العلوي والمزلقان
   ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=4;
   ctx.beginPath();ctx.moveTo(0,22);ctx.lineTo(G.W,22);ctx.stroke();
   ctx.fillStyle="rgba(255,255,255,.13)";round(6,G.H-44,54,38,8);ctx.fill();
   ctx.strokeStyle=C.ok;ctx.lineWidth=3;ctx.stroke();
   ctx.fillStyle=C.ok;ctx.font="700 11px system-ui,Arial";ctx.textAlign="center";
   ctx.fillText("السلة",33,G.H-20);
   G.tg.forEach(t=>{if(t.dead)return;const c=centerOf(t);chip(c.x,c.y,t,C.acc);});
   const c=G.claw;
   if(c){
     ctx.save();ctx.translate(c.x,22);ctx.rotate(c.sw*.6);
     ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=2;
     ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,c.len);ctx.stroke();
     const open=(c.phase<2)?1:.25;
     ctx.lineWidth=4;ctx.strokeStyle=C.acc;
     ctx.beginPath();ctx.moveTo(0,c.len);ctx.lineTo(-12*open,c.len+14);ctx.stroke();
     ctx.beginPath();ctx.moveTo(0,c.len);ctx.lineTo(12*open,c.len+14);ctx.stroke();
     ctx.fillStyle=C.acc;ctx.beginPath();ctx.arc(0,c.len,5,0,6.3);ctx.fill();
     ctx.restore();
     ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillRect(c.x-9,14,18,12);
   }
 }
 else {
   G.tg.forEach(t=>{if(t.dead)return;const c=centerOf(t);chip(c.x,c.y,t,C.acc);});
   // الحيط
   ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=3;
   ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(2,G.H);ctx.moveTo(G.W-2,0);ctx.lineTo(G.W-2,G.H);ctx.stroke();
   const s=G.proj;
   if(s){s.trail.forEach((p,i)=>{ctx.fillStyle="rgba(255,255,255,"+(i/s.trail.length*.35)+")";
     ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill();});
     ctx.fillStyle="#FFF";ctx.beginPath();ctx.arc(s.x,s.y,8,0,6.3);ctx.fill();}
   else {ctx.fillStyle="#FFF";ctx.beginPath();ctx.arc(G.ball.x,G.ball.y,8,0,6.3);ctx.fill();}
 }
 G.parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)});
 ctx.globalAlpha=1;
 if(G.msg){ctx.fillStyle=C.acc;ctx.font="700 15px system-ui,Arial";ctx.textAlign="center";
  ctx.fillText(G.msg,G.W/2,20);}
}
function over(done){
 if(G.raf)cancelAnimationFrame(G.raf);G.raf=null;
 $("play").hidden=true;$("over").hidden=false;
 const st=G.right>=QS.length?3:G.right>=7?2:G.right>=4?1:0;
 $("ic").textContent=done?(st===3?"🏆":"🎱"):"💥";
 $("tt").textContent=done?"خلصت المرحلة!":"القلوب خلصت";
 $("tx").innerHTML=`إجابات صح: <b>${G.right}</b> من ${QS.length} — النقاط: <b>${G.score}</b><br>${"⭐".repeat(st)}${"☆".repeat(3-st)}`;
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G.raf){cancelAnimationFrame(G.raf);G.raf=null;}
 else if(!$("play").hidden&&!G.raf){G.last=performance.now();G.raf=requestAnimationFrame(loop);}});
</script>
