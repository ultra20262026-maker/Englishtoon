<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Citizens — Puzzle Adventure</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, var(--navy2), var(--navy) 65%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  #puzzle{ display:grid; grid-template-columns:repeat(3,90px); grid-template-rows:repeat(3,90px); gap:4px; margin-bottom:20px; }
  .piece{ background:var(--card); border:2px solid #1E4568; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:2.2rem; }
  .piece.filled{ border-color:var(--green); background:linear-gradient(135deg,#1e4a33,#153627); }
  .piece.locked{ background:#0e1f33; font-size:1.3rem; color:var(--muted); cursor:pointer; }
  #qbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:26px; max-width:600px; width:100%; }
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568;
    border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none;}
  button.next{ margin-top:16px; display:none; font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:10px;
    padding:12px 24px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:16px; }
  footer{ margin-top:20px; color:var(--muted); font-size:.75rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 6 · Global Citizens</div>
  <h1>🧩 Puzzle Adventure: Reveal the Earth</h1>
  <div class="hud">
    <div class="pill">Pieces: <b id="pieceCount">0</b> / 9</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>

  <div id="puzzle"></div>

  <div id="qbox">
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Reveal Next Piece →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original questions · Unit 6 grammar focus: Must/Mustn't + Connectors</footer>

<script>
const pieceEmoji = ["🌍","🌳","🐠","♻️","💧","🌱","🦋","☀️","🌏"];
const questions = [
  {q:"We ___________ (must) protect the environment.", opts:["must protect","must protects","musts protect","must to protect"], a:0, ex:"'Must' + base verb."},
  {q:"You ___________ (mustn't) waste water.", opts:["mustn't wastes","mustn't waste","don't must waste","mustn't to waste"], a:1, ex:"'Mustn't' + base verb."},
  {q:"They played well, ___________ they lost.", opts:["so","but","because","although"], a:1, ex:"'But' shows contrast."},
  {q:"She recycled ___________ she cares about the planet.", opts:["but","so","because","although"], a:2, ex:"'Because' gives a reason."},
  {q:"___________ it rained, we still cleaned the beach.", opts:["Because","So","But","Although"], a:3, ex:"'Although' starts a contrast clause."},
  {q:"We must keep our school ___________ (clean).", opts:["clean","cleaning","cleaned","cleans"], a:0, ex:"After 'must', use the base verb/adjective as needed."},
  {q:"He worked hard, ___________ he succeeded.", opts:["but","although","so","because"], a:2, ex:"'So' shows a result."},
  {q:"Global citizens ___________ (must) respect others.", opts:["must respect","must respects","musts respect","respecting must"], a:0, ex:"'Must' + base verb."},
  {q:"We mustn't ___________ (throw) rubbish into the sea.", opts:["throw","throws","throwing","threw"], a:0, ex:"After 'mustn't', use the base verb."},
];

let pieceIdx = 0;
let score = 0;

function renderPuzzle(){
  const puzzle = document.getElementById('puzzle');
  puzzle.innerHTML = '';
  for (let i=0;i<9;i++){
    const div = document.createElement('div');
    div.className = 'piece';
    if (i < pieceIdx) { div.classList.add('filled'); div.textContent = pieceEmoji[i]; }
    else { div.classList.add('locked'); div.textContent = '?'; }
    puzzle.appendChild(div);
  }
}
renderPuzzle();

function loadQuestion(){
  if (pieceIdx >= questions.length) { finishGame(); return; }
  document.getElementById('pieceCount').textContent = pieceIdx;
  const q = questions[pieceIdx];
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain');
  explainDiv.style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === q.a) {
        b.classList.add('correct');
        score += 12;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
      }
      document.getElementById('score').textContent = score;
      explainDiv.textContent = 'Why: ' + q.ex;
      explainDiv.style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').textContent = (pieceIdx === questions.length - 1) ? 'Complete the Puzzle →' : 'Reveal Next Piece →';
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => {
  pieceIdx++;
  renderPuzzle();
  loadQuestion();
});

function finishGame(){
  document.getElementById('qbox').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Puzzle Complete!';
  if (score >= 90) title = '🏆 Puzzle Master!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${questions.length} pieces.`;
}

loadQuestion();
</script>
</body>
</html>
