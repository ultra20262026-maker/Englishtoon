<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Citizens — Mission Impossible</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, #1a0f0f, var(--navy) 60%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  .pill.time b{ color:var(--red); font-family:monospace; font-size:1.1rem; }
  #countdown{ font-size:2.4rem; font-weight:800; color:var(--red); margin-bottom:14px; font-family:monospace; }
  #missionBox{ background:var(--card); border:2px solid var(--amber); border-radius:18px; padding:26px; max-width:600px; width:100%; }
  #missionLabel{ color:var(--amber); font-weight:800; font-size:.8rem; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; }
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568;
    border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  button.start{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:14px 30px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:10px; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  footer{ margin-top:20px; color:var(--muted); font-size:.75rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 6 · Global Citizens</div>
  <h1>💣 Mission Impossible: Save the Planet</h1>
  <div class="hud">
    <div class="pill">Mission: <b id="missionNum">0</b> / 6</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>
  <div id="countdown" style="display:none!important"></div>

  <div id="missionBox">
    <div id="missionLabel">Briefing</div>
    <div id="qtext">A countdown has started. Complete 6 grammar missions before time runs out to stop it!</div>
    <div id="options"></div>
  </div>
  <button class="start" id="startBtn">Begin Mission</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="start" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original missions · Unit 6 grammar focus: Must/Mustn't + Connectors</footer>

<script>
const missions = [
  {q:"Disarm code 1: 'We ___________ (must) protect endangered animals.'", opts:["must protect","must protects","musts protect"], a:0},
  {q:"Disarm code 2: 'You ___________ (mustn't) litter in public parks.'", opts:["mustn't litters","mustn't litter","don't must litter"], a:1},
  {q:"Disarm code 3: 'She recycled paper, ___________ she cares about trees.'", opts:["but","because","so"], a:1},
  {q:"Disarm code 4: 'He was tired, ___________ he kept cleaning the beach.'", opts:["but","so","because"], a:0},
  {q:"Disarm code 5: '___________ it was hard, the team finished the project.'", opts:["Because","Although","So"], a:1},
  {q:"Final code: 'Citizens ___________ (must) work together to save the planet.'", opts:["must work","must works","musts work"], a:0},
];

let missionIdx = 0;
let score = 0;
let timeLeft = 999999;
let timerInterval = null;
let running = false;

function loadMission(){
  if (missionIdx >= missions.length) { finishGame(true); return; }
  document.getElementById('missionNum').textContent = missionIdx + 1;
  document.getElementById('missionLabel').textContent = `Mission ${missionIdx + 1}`;
  const m = missions[missionIdx];
  document.getElementById('qtext').textContent = m.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  m.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      if (!running) return;
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === m.a) {
        b.classList.add('correct');
        score += 15;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[m.a].classList.add('correct');
        timeLeft = Math.max(0, timeLeft - 10); // penalty
      }
      document.getElementById('score').textContent = score;
      setTimeout(() => { missionIdx++; loadMission(); }, 700);
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').style.display = 'none';
  running = true;
  loadMission();
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
    const s = String(timeLeft%60).padStart(2,'0');
    document.getElementById('countdown').textContent = `${m}:${s}`;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      running = false;
      finishGame(false);
    }
  }, 1000);
});

function finishGame(defused){
  running = false;
  clearInterval(timerInterval);
  document.getElementById('missionBox').style.display = 'none';
  document.getElementById('countdown').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  if (defused) {
    document.getElementById('endTitle').textContent = '🎉 Mission Accomplished!';
    document.getElementById('endMsg').textContent = `You completed all missions and scored ${score} points.`;
  } else {
    document.getElementById('endTitle').textContent = '⏰ Time Ran Out!';
    document.getElementById('endMsg').textContent = `You completed ${missionIdx} of ${missions.length} missions and scored ${score} points. Try again!`;
  }
}
</script>
</body>
</html>
