<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Citizens — Pirate Island</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 100%, #0d3a4a, var(--navy) 65%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  #ocean{ position:relative; width:100%; max-width:640px; height:280px; background:linear-gradient(180deg,#0a2f42,#082230);
    border-radius:18px; border:1px solid #1E4568; overflow:hidden; margin-bottom:18px; }
  .island{ position:absolute; width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #c9a227, #8b6f1f);
    display:flex; align-items:center; justify-content:center; font-size:1.8rem; cursor:pointer; border:3px solid #6b5335; transform:translate(-50%,-50%); }
  .island.done{ background:radial-gradient(circle at 30% 30%, var(--green), #52a866); border-color:var(--green); }
  .island.locked{ opacity:.4; cursor:not-allowed; }
  #ship{ position:absolute; font-size:2rem; transition:all .8s ease; }
  #qmodal{ display:none; position:fixed; inset:0; background:rgba(4,10,18,.88); z-index:100; align-items:center; justify-content:center; padding:20px; }
  #qcardbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:28px; max-width:600px; width:100%; }
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568;
    border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none;}
  .btn-close{ margin-top:16px; display:none; font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:10px;
    padding:12px 24px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:16px; }
  footer{ margin-top:20px; color:var(--muted); font-size:.75rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 6 · Global Citizens</div>
  <h1>🏴‍☠️ Pirate Island: Collect the Golden Rules</h1>
  <div class="hud">
    <div class="pill">Islands: <b id="islandCount">0</b> / 6</div>
    <div class="pill">Gold: <b id="score">0</b> 🪙</div>
  </div>

  <div id="ocean"></div>

  <div id="qmodal">
    <div id="qcardbox">
      <div id="qtext"></div>
      <div id="options"></div>
      <div class="explain" id="explain"></div>
      <button class="btn-close" id="closeBtn">Sail On →</button>
    </div>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original questions · Unit 6 grammar focus: Must/Mustn't + Connectors</footer>

<script>
const islands = [
  {x:12, y:70, q:"Global citizens ___________ (must) respect other cultures.", opts:["must respect","must respects","musts respect"], a:0, ex:"'Must' + base verb."},
  {x:30, y:35, q:"We ___________ (mustn't) waste natural resources.", opts:["mustn't wastes","mustn't waste","don't must waste"], a:1, ex:"'Mustn't' + base verb."},
  {x:50, y:60, q:"They cleaned the beach, ___________ it was hot.", opts:["so","although","because"], a:1, ex:"'Although' shows contrast."},
  {x:68, y:30, q:"We must act now ___________ the ocean needs our help.", opts:["but","because","although"], a:1, ex:"'Because' gives a reason."},
  {x:85, y:65, q:"She worked all day, ___________ she felt proud.", opts:["so","because","although"], a:0, ex:"'So' shows result."},
  {x:95, y:25, q:"Citizens ___________ (must) protect endangered species.", opts:["must protect","must protects","musts protect"], a:0, ex:"'Must' + base verb."},
];

let idx = 0;
let score = 0;

function renderOcean(){
  const ocean = document.getElementById('ocean');
  ocean.innerHTML = '';
  islands.forEach((isl, i) => {
    const el = document.createElement('div');
    el.className = 'island';
    if (i < idx) el.classList.add('done');
    if (i > idx) el.classList.add('locked');
    el.textContent = i < idx ? '🏆' : '🏝️';
    el.style.left = isl.x + '%';
    el.style.top = isl.y + '%';
    el.addEventListener('click', () => { if (i === idx) openIsland(i); });
    ocean.appendChild(el);
  });
  const ship = document.createElement('div');
  ship.id = 'ship';
  ship.textContent = '⛵';
  const cur = islands[Math.min(idx, islands.length-1)];
  ship.style.left = (cur.x - 8) + '%';
  ship.style.top = (cur.y + 10) + '%';
  ocean.appendChild(ship);
}
renderOcean();

function openIsland(i){
  const isl = islands[i];
  document.getElementById('qtext').textContent = isl.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain');
  explainDiv.style.display = 'none';
  const closeBtn = document.getElementById('closeBtn');
  closeBtn.style.display = 'none';

  isl.opts.forEach((opt, oi) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (oi === isl.a) {
        b.classList.add('correct');
        score += 15;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[isl.a].classList.add('correct');
      }
      document.getElementById('score').textContent = score;
      explainDiv.textContent = 'Why: ' + isl.ex;
      explainDiv.style.display = 'block';
      closeBtn.style.display = 'inline-block';
    };
    optsDiv.appendChild(b);
  });

  document.getElementById('qmodal').style.display = 'flex';
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('qmodal').style.display = 'none';
  idx++;
  document.getElementById('islandCount').textContent = Math.min(idx, islands.length);
  renderOcean();
  if (idx >= islands.length) finishGame();
});

function finishGame(){
  document.getElementById('ocean').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Treasure Collected!';
  if (score >= 75) title = '🏆 Legendary Pirate!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final gold: ${score} across ${islands.length} islands.`;
}
</script>
</body>
</html>
