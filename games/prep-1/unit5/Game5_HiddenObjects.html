<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Dreams — Hidden Objects</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 30% 20%, var(--navy2), var(--navy) 60%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  #scene{ position:relative; width:100%; max-width:640px; height:380px; background:
      radial-gradient(circle at 20% 30%, #1a3a3a, transparent 40%),
      radial-gradient(circle at 80% 70%, #2a1a3a, transparent 40%), #142235;
    border-radius:18px; border:1px solid #1E4568; overflow:hidden; margin-bottom:16px;
  }
  .hidden-obj{ position:absolute; font-size:1.8rem; cursor:pointer; transition:transform .2s; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .hidden-obj:hover{ transform:scale(1.2); }
  .hidden-obj.found{ opacity:.25; pointer-events:none; }
  .wordlist{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:640px; margin-bottom:16px; }
  .wtag{ background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 16px; font-size:.85rem; }
  .wtag.found{ border-color:var(--green); color:var(--green); text-decoration:line-through; }
  #qmodal{ display:none; position:fixed; inset:0; background:rgba(4,10,18,.88); z-index:100; align-items:center; justify-content:center; padding:20px; }
  #qcardbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:28px; max-width:600px; width:100%; }
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568;
    border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none;}
  .btn-close{ margin-top:16px; display:none; font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:10px;
    padding:12px 24px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:16px; }
  footer{ margin-top:20px; color:var(--muted); font-size:.75rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 5 · Future Dreams</div>
  <h1>🔍 Hidden Objects: Careers of the Future</h1>
  <div class="hud">
    <div class="pill">Found: <b id="foundCount">0</b> / 6</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>

  <div class="wordlist" id="wordlist"></div>
  <div id="scene"></div>

  <div id="qmodal">
    <div id="qcardbox">
      <div id="qtext"></div>
      <div id="options"></div>
      <div class="explain" id="explain"></div>
      <button class="btn-close" id="closeBtn">Keep Searching →</button>
    </div>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original questions · Unit 5 grammar focus: Be Going To + Will</footer>

<script>
const objects = [
  {icon:"🔬", label:"Scientist", x:10, y:15, q:"She ___________ (become) a scientist. (plan)", opts:["is going to become","will becomes","become","becoming"], a:0, ex:"A decided plan uses 'be going to'."},
  {icon:"👨‍⚕️", label:"Doctor", x:70, y:20, q:"I ___________ (study) medicine. (plan)", opts:["study","am going to study","will studying","studies"], a:1, ex:"A decided plan uses 'be going to'."},
  {icon:"🎨", label:"Designer", x:30, y:60, q:"Maybe I ___________ (become) a designer. (guess)", opts:["am going to become","will become","becomes","becoming"], a:1, ex:"A guess/dream uses 'will'."},
  {icon:"👨‍🏫", label:"Teacher", x:85, y:65, q:"He ___________ (teach) at a new school next year. (announced plan)", opts:["is going to teach","will teaches","teach","teaching"], a:0, ex:"An announced plan uses 'be going to'."},
  {icon:"👨‍✈️", label:"Pilot", x:50, y:40, q:"I promise I ___________ (fly) safely. (promise)", opts:["am going to fly","will fly","flies","flying"], a:1, ex:"A promise uses 'will'."},
  {icon:"👩‍💻", label:"Engineer", x:18, y:82, q:"They ___________ (build) a new app. (decided plan)", opts:["are going to build","will builds","build","building"], a:0, ex:"A decided plan uses 'be going to'."},
];

let foundCount = 0;
let score = 0;

const scene = document.getElementById('scene');
const wordlist = document.getElementById('wordlist');
function render(){
  scene.innerHTML = '';
  wordlist.innerHTML = '';
  objects.forEach((o, i) => {
    const el = document.createElement('div');
    el.className = 'hidden-obj';
    el.textContent = o.icon;
    el.style.left = o.x + '%';
    el.style.top = o.y + '%';
    el.dataset.idx = i;
    el.addEventListener('click', () => openObject(i, el));
    scene.appendChild(el);

    const tag = document.createElement('div');
    tag.className = 'wtag';
    tag.id = 'tag-' + i;
    tag.textContent = o.label;
    wordlist.appendChild(tag);
  });
}
render();

function openObject(idx, el){
  if (el.classList.contains('found')) return;
  const o = objects[idx];
  document.getElementById('qtext').textContent = o.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain');
  explainDiv.style.display = 'none';
  const closeBtn = document.getElementById('closeBtn');
  closeBtn.style.display = 'none';

  o.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(x => x.onclick = null);
      el.classList.add('found');
      document.getElementById('tag-' + idx).classList.add('found');
      foundCount++;
      document.getElementById('foundCount').textContent = foundCount;
      if (i === o.a) {
        b.classList.add('correct');
        score += 15;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[o.a].classList.add('correct');
      }
      document.getElementById('score').textContent = score;
      explainDiv.textContent = 'Why: ' + o.ex;
      explainDiv.style.display = 'block';
      closeBtn.style.display = 'inline-block';
    };
    optsDiv.appendChild(b);
  });

  document.getElementById('qmodal').style.display = 'flex';
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('qmodal').style.display = 'none';
  if (foundCount === objects.length) finishGame();
});

function finishGame(){
  document.getElementById('scene').style.display = 'none';
  document.getElementById('wordlist').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 All Objects Found!';
  if (score >= 75) title = '🏆 Master Explorer!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${objects.length} hidden objects.`;
}
</script>
</body>
</html>
