<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Dreams — Space Adventure</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 20% 20%, #16203a, var(--navy) 60%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; overflow-x:hidden; }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  #path{ position:relative; width:100%; max-width:640px; height:340px; margin-bottom:16px; }
  .planet{ position:absolute; width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; border:2px solid #1E4568; background:var(--card); }
  .planet.done{ border-color:var(--green); background:linear-gradient(135deg,var(--green),#52a866); }
  .planet.current{ border-color:var(--amber); box-shadow:0 0 0 4px rgba(255,193,104,.3); }
  #rocket{ position:absolute; font-size:2rem; transition:all .8s ease; }
  #qbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:26px; max-width:600px; width:100%; }
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568;
    border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none;}
  button.next{ margin-top:16px; display:none; font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:10px;
    padding:12px 24px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:16px; }
  footer{ margin-top:20px; color:var(--muted); font-size:.75rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 5 · Future Dreams</div>
  <h1>🚀 Space Adventure: Journey to Your Future</h1>
  <div class="hud">
    <div class="pill">Planet: <b id="planetNum">1</b> / 6</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>

  <div id="path"></div>

  <div id="qbox">
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Launch to Next Planet →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original questions · Unit 5 grammar focus: Be Going To + Will</footer>

<script>
const planetIcons = ["🪐","🌍","🌕","🌑","🛰️","⭐"];
const questions = [
  {q:"I ___________ (study) medicine at university. (plan)", opts:["study","am going to study","will studying","studies"], a:1, ex:"A decided plan uses 'be going to'."},
  {q:"I think it ___________ (be) a great year for you. (prediction)", opts:["is going to be","will be","are being","be"], a:1, ex:"A prediction/guess uses 'will'."},
  {q:"___________ you ___________ (join) the science club? (plan)", opts:["Do...join","Are...going to join","Will...joining","Is...join"], a:1, ex:"Asking about a plan uses 'Are you going to'."},
  {q:"Don't worry, I ___________ (help) you practice. (promise)", opts:["am going to help","will help","helping","helps"], a:1, ex:"A promise uses 'will'."},
  {q:"She ___________ (become) an engineer. (decided plan)", opts:["is going to become","will becomes","become","becoming"], a:0, ex:"A decided plan uses 'be going to'."},
  {q:"Maybe I ___________ (travel) to space one day. (prediction/dream)", opts:["am going to travel","will travel","travels","travelling"], a:1, ex:"An unplanned dream/guess uses 'will'."},
];

let planetIdx = 0;
let score = 0;

function renderPath(){
  const path = document.getElementById('path');
  path.innerHTML = '';
  const n = planetIcons.length;
  for (let i=0;i<n;i++){
    const div = document.createElement('div');
    div.className = 'planet';
    if (i < planetIdx) div.classList.add('done');
    if (i === planetIdx) div.classList.add('current');
    div.textContent = planetIcons[i];
    const angle = (i / (n-1)) * Math.PI;
    const x = 20 + (i/(n-1)) * 540;
    const y = 140 - Math.sin(angle) * 100;
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    path.appendChild(div);
  }
  const rocket = document.createElement('div');
  rocket.id = 'rocket';
  rocket.textContent = '🚀';
  const idx = Math.min(planetIdx, n-1);
  const angle = (idx/(n-1)) * Math.PI;
  const x = 20 + (idx/(n-1)) * 540 + 10;
  const y = 140 - Math.sin(angle) * 100 - 30;
  rocket.style.left = x + 'px';
  rocket.style.top = y + 'px';
  path.appendChild(rocket);
}
renderPath();

function loadQuestion(){
  if (planetIdx >= questions.length) { finishGame(); return; }
  document.getElementById('planetNum').textContent = planetIdx + 1;
  const q = questions[planetIdx];
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain');
  explainDiv.style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === q.a) {
        b.classList.add('correct');
        score += 15;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
      }
      document.getElementById('score').textContent = score;
      explainDiv.textContent = 'Why: ' + q.ex;
      explainDiv.style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').textContent = (planetIdx === questions.length - 1) ? 'Complete the Journey →' : 'Launch to Next Planet →';
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => {
  planetIdx++;
  renderPath();
  loadQuestion();
});

function finishGame(){
  document.getElementById('path').style.display = 'none';
  document.getElementById('qbox').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Journey Complete!';
  if (score >= 75) title = '🏆 Space Explorer Champion!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You reached the final planet with a score of ${score}.`;
}

loadQuestion();
</script>
</body>
</html>
