<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Dreams — Platform Adventure</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:linear-gradient(180deg, #142840, var(--navy) 70%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px; text-align:center;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  #scene{ position:relative; width:100%; max-width:640px; height:220px; margin-bottom:18px; }
  .platform{ position:absolute; bottom:0; width:80px; height:26px; background:var(--card); border:2px solid #1E4568; border-radius:6px; }
  .platform.done{ border-color:var(--green); background:rgba(140,233,154,.2); }
  .platform.current{ border-color:var(--amber); }
  #hero{ position:absolute; bottom:26px; font-size:2rem; transition:left .6s ease; }
  #qbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:26px; max-width:600px; width:100%; }
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568;
    border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none;}
  button.next{ margin-top:16px; display:none; font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:10px;
    padding:12px 24px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:16px; }
  footer{ margin-top:20px; color:var(--muted); font-size:.75rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 5 · Future Dreams</div>
  <h1>🏃 Platform Adventure: Leap Toward Your Goal</h1>
  <div class="hud">
    <div class="pill">Platform: <b id="platNum">1</b> / 7</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>

  <div id="scene"></div>

  <div id="qbox">
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn">Jump to Next Platform →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original questions · Unit 5 grammar focus: Be Going To + Will</footer>

<script>
const questions = [
  {q:"I ___________ (become) a scientist. (decided plan)", opts:["become","am going to become","will becoming","becomes"], a:1, ex:"A decided plan uses 'be going to'."},
  {q:"I think technology ___________ (change) our lives. (prediction)", opts:["is going to changes","will change","changes","changing"], a:1, ex:"A prediction uses 'will'."},
  {q:"___________ you ___________ (study) abroad? (plan)", opts:["Do...study","Are...going to study","Will...studying","Is...study"], a:1, ex:"Asking about a plan uses 'Are...going to'."},
  {q:"I promise I ___________ (practice) every day. (promise)", opts:["am going to practice","will practice","practices","practicing"], a:1, ex:"A promise uses 'will'."},
  {q:"They ___________ (open) a new school next year. (announced plan)", opts:["are going to open","will opens","open","opening"], a:0, ex:"An announced plan uses 'be going to'."},
  {q:"Maybe she ___________ (win) the competition. (guess)", opts:["is going to win","will win","wins","winning"], a:1, ex:"A guess/prediction uses 'will'."},
  {q:"We ___________ (visit) the science fair this weekend. (plan)", opts:["are going to visit","will visits","visit","visiting"], a:0, ex:"A decided plan uses 'be going to'."},
];

let platIdx = 0;
let score = 0;

function renderScene(){
  const scene = document.getElementById('scene');
  scene.innerHTML = '';
  const n = questions.length + 1;
  const gap = 100 / (n - 1);
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'platform';
    if (i < platIdx) p.classList.add('done');
    if (i === platIdx) p.classList.add('current');
    p.style.left = `calc(${i * gap}% - ${i === n-1 ? 80 : 0}px)`;
    if (i === n - 1) { p.textContent = '🏆'; p.style.display='flex'; p.style.alignItems='center'; p.style.justifyContent='center'; }
    scene.appendChild(p);
  }
  const hero = document.createElement('div');
  hero.id = 'hero';
  hero.textContent = '🏃';
  hero.style.left = `calc(${platIdx * gap}% + 20px)`;
  scene.appendChild(hero);
}
renderScene();

function loadQuestion(){
  if (platIdx >= questions.length) { finishGame(); return; }
  document.getElementById('platNum').textContent = platIdx + 1;
  const q = questions[platIdx];
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain');
  explainDiv.style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === q.a) {
        b.classList.add('correct');
        score += 15;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
      }
      document.getElementById('score').textContent = score;
      explainDiv.textContent = 'Why: ' + q.ex;
      explainDiv.style.display = 'block';
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').textContent = (platIdx === questions.length - 1) ? 'Reach the Goal →' : 'Jump to Next Platform →';
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('nextBtn').addEventListener('click', () => {
  platIdx++;
  renderScene();
  loadQuestion();
});

function finishGame(){
  document.getElementById('scene').style.display = 'none';
  document.getElementById('qbox').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 You Reached the Goal!';
  if (score >= 85) title = '🏆 Platform Champion!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${questions.length} platforms.`;
}

loadQuestion();
</script>
</body>
</html>
