<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Choices — Spin and Solve</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 70% 10%, var(--navy2), var(--navy) 60%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.8rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px;}
  .hud{display:flex; gap:16px; margin-bottom:18px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.95rem;}
  .pill b{color:var(--green);}
  .arena{position:relative; width:300px; height:300px; margin:10px auto;}
  .wheel{ width:100%; height:100%; border-radius:50%; position:relative; overflow:hidden;
    transition: transform 3.6s cubic-bezier(.17,.67,.12,1); box-shadow:0 0 0 8px var(--navy2), 0 20px 40px rgba(0,0,0,.5); }
  .seg{ position:absolute; width:50%; height:50%; top:0; left:50%; transform-origin:0% 100%;
    display:flex; align-items:flex-start; justify-content:center; font-weight:800; font-size:.85rem; color:var(--navy); }
  .seg span{ transform: translateY(18px); }
  .pointer{ position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:0; height:0;
    border-left:16px solid transparent; border-right:16px solid transparent; border-top:28px solid var(--amber); z-index:5; }
  .hub{ position:absolute; top:50%; left:50%; width:60px; height:60px; margin:-30px 0 0 -30px;
    background:var(--navy2); border:3px solid var(--cyan); border-radius:50%; z-index:4; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
  button{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:14px 30px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:18px; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  #qpanel{ display:none; width:100%; max-width:560px; background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:26px; margin-top:22px; }
  #qcat{ color:var(--amber); font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px;}
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4;}
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568;
    border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:14px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.92rem; color:var(--muted); display:none;}
  .btn-next{ margin-top:16px; background:var(--amber); display:none; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  .progress{ width:100%; max-width:560px; height:10px; background:var(--card); border-radius:6px; overflow:hidden; margin-top:8px;}
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--cyan), var(--green)); width:0%; transition:width .4s; }
  footer{ margin-top:26px; color:var(--muted); font-size:.75rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 4 · Smart Choices</div>
  <h1>🌀 Spin and Solve</h1>
  <div class="hud">
    <div class="pill">Score: <b id="score">0</b></div>
    <div class="pill">Round: <b id="round">1</b> / 6</div>
  </div>
  <div class="progress"><div class="progress-fill" id="prog"></div></div>

  <div class="arena">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
    <div class="hub">🎯</div>
  </div>
  <button id="spinBtn">SPIN THE WHEEL</button>

  <div id="qpanel">
    <div id="qcat"></div>
    <div id="qtext"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="btn-next" id="nextBtn">Next Round →</button>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original practice content · Unit 4 grammar focus: Should/Shouldn't + First Conditional</footer>

<script>
const categories = [
  {name:"Should", color:"#8CE99A"},
  {name:"Shouldn't", color:"#FF8080"},
  {name:"If...will", color:"#35D0C9"},
  {name:"If...won't", color:"#FFC168"},
  {name:"Question", color:"#B79CFF"},
  {name:"Mixed", color:"#7FD8E8"},
];

const bank = [
  {cat:"Should", q:"You ___________ (should) ask for advice before deciding.", opts:["should asks","should ask","shoulds ask","asking should"], a:1, ex:"'Should' + base verb."},
  {cat:"Shouldn't", q:"He ___________ (shouldn't) take unnecessary risks.", opts:["shouldn't takes","shouldn't take","shouldn't to take","not should take"], a:1, ex:"'Shouldn't' + base verb."},
  {cat:"If...will", q:"If she studies hard, she ___________ (pass) the exam.", opts:["pass","will pass","passes","passing"], a:1, ex:"Result clause: will + base verb."},
  {cat:"If...won't", q:"If they don't plan ahead, they ___________ (not / succeed).", opts:["don't succeed","won't succeed","not succeed","doesn't succeed"], a:1, ex:"Negative result clause: won't + base verb."},
  {cat:"Question", q:"___________ I tell my teacher about the problem?", opts:["Should","Shoulds","Will","Do"], a:0, ex:"Advice questions use 'Should'."},
  {cat:"Mixed", q:"Choose the correctly formed sentence.", opts:["If I will rest, I feel better.","If I rest, I will feel better.","If I rest, I feel will better.","I will rest if I will feel better."], a:1, ex:"If + present, will + base verb: correct order."},
];

let deck = [...bank].sort(()=>Math.random()-0.5);
let round=0, score=0;
const TOTAL_ROUNDS=6;
const wheelEl=document.getElementById('wheel');
const spinBtn=document.getElementById('spinBtn');
const qpanel=document.getElementById('qpanel');

function buildWheel(){
  const n=categories.length;
  const step=360/n;
  const gradientParts=[];
  categories.forEach((c,i)=>gradientParts.push(`${c.color} ${i*step}deg ${(i+1)*step}deg`));
  wheelEl.style.background=`conic-gradient(${gradientParts.join(',')})`;
  categories.forEach((c,i)=>{
    const seg=document.createElement('div');
    seg.className='seg';
    seg.style.transform=`rotate(${i*step+step/2}deg)`;
    seg.innerHTML=`<span>${c.name}</span>`;
    wheelEl.appendChild(seg);
  });
}
buildWheel();

let currentRotation=0;
spinBtn.addEventListener('click', () => {
  if (round >= TOTAL_ROUNDS) return;
  spinBtn.disabled=true;
  qpanel.style.display='none';
  const n=categories.length, step=360/n;
  const targetIndex=Math.floor(Math.random()*n);
  const spins=4+Math.floor(Math.random()*2);
  const landingOffset=targetIndex*step+step/2;
  const finalRotation=currentRotation+spins*360+(360-landingOffset);
  currentRotation=finalRotation%360;
  wheelEl.style.transform=`rotate(${finalRotation}deg)`;
  setTimeout(() => { openQuestion(categories[targetIndex].name); spinBtn.disabled=false; }, 3700);
});

function openQuestion(catName){
  round++;
  document.getElementById('round').textContent=Math.min(round,TOTAL_ROUNDS);
  document.getElementById('prog').style.width=`${(round/TOTAL_ROUNDS)*100}%`;
  let pool=deck.filter(q=>q.cat===catName);
  if (pool.length===0) pool=deck;
  const q=pool[Math.floor(Math.random()*pool.length)];
  deck=deck.filter(item=>item!==q);
  if (deck.length===0) deck=[...bank].sort(()=>Math.random()-0.5);

  qpanel.style.display='block';
  document.getElementById('qcat').textContent='Category: '+catName;
  document.getElementById('qtext').textContent=q.q;
  const optsDiv=document.getElementById('options');
  optsDiv.innerHTML='';
  const explainDiv=document.getElementById('explain');
  explainDiv.style.display='none';
  const nextBtn=document.getElementById('nextBtn');
  nextBtn.style.display='none';

  q.opts.forEach((opt,idx)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=opt;
    b.onclick=()=>{
      document.querySelectorAll('.opt').forEach(o=>o.disabled=true);
      if (idx===q.a){ b.classList.add('correct'); score+=15; }
      else { b.classList.add('wrong'); document.querySelectorAll('.opt')[q.a].classList.add('correct'); }
      document.getElementById('score').textContent=score;
      explainDiv.textContent='Why: '+q.ex;
      explainDiv.style.display='block';
      nextBtn.textContent=(round>=TOTAL_ROUNDS)?'See Final Score →':'Next Round →';
      nextBtn.style.display='inline-block';
    };
    optsDiv.appendChild(b);
  });
  nextBtn.onclick=()=>{ if (round>=TOTAL_ROUNDS) finishGame(); else qpanel.style.display='none'; };
}

function finishGame(){
  qpanel.style.display='none';
  document.querySelector('.arena').style.display='none';
  spinBtn.style.display='none';
  const end=document.getElementById('endscreen');
  end.style.display='block';
  let title='🎉 Great Job!';
  if (score>=75) title='🏆 Smart Choice Champion!';
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endMsg').textContent=`You scored ${score} points across ${TOTAL_ROUNDS} rounds.`;
}
</script>
</body>
</html>
