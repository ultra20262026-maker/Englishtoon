.target-btn { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; border: none; font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: white; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; display: flex; justify-content: center; align-items: center; text-align: center; line-height: 1.2; padding: 10px; transition: filter 0.2s; }

.target-btn:disabled { cursor: not-allowed; }

/* Canvas */
canvas { display: block; position: fixed; top: 0; left: 0; z-index: 10; }

/* End Screen */
#end-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }

<body>

<div id="hud">
    <div>Frogger Crossing</div>
    <div id="q-num">Q 1/25</div>
    <div>Score: <span id="score-val">0</span></div>
</div>

<div id="q-panel"><div id="q-text"></div></div>

<div id="targets"></div>
<canvas id="cv"></canvas>

<div id="end-screen">
    <h1 id="end-title">Game Over!</h1>
    <p id="end-score">Score: 0</p>
    <button onclick="location.reload()">Play Again</button>
</div>

<script>
let autoAdvanceTimer = null;
const QS = [{"type": "mcq", "q": "Giving someone support to do something is to _____ them.", "choices": ["discourage", "encourage", "stop"], "answer": 1}, {"type": "mcq", "q": "Treating someone _____ means not to treat them in an equal way.", "choices": ["fairly", "kindly", "unfairly"], "answer": 2}, {"type": "mcq", "q": "We use the phrase 'All in all' in the _____ of our text.", "choices": ["introduction", "conclusion", "middle"], "answer": 1}, {"type": "mcq", "q": "You can collect clothes to _____ to people in need.", "choices": ["take", "leave", "give"], "answer": 2}, {"type": "mcq", "q": "Volunteering helps to _____ our local community.", "choices": ["spoil", "improve", "destroy"], "answer": 1}, {"type": "mcq", "q": "Young children _____ do sports in the club.", "choices": ["mustn't", "aren't", "must"], "answer": 2}, {"type": "mcq", "q": "Students _____ collect information before they start any project.", "choices": ["shouldn't", "mustn't", "must"], "answer": 2}, {"type": "mcq", "q": "We _____ respect people from other cultures.", "choices": ["must", "mustn't", "shouldn't"], "answer": 0}, {"type": "mcq", "q": "People aren't allowed to smoke in hospitals. They _____ smoke.", "choices": ["mustn't", "must", "should"], "answer": 0}, {"type": "mcq", "q": "It's a necessity to wear your school uniform. You _____ wear it.", "choices": ["can't", "must", "mustn't"], "answer": 1}, {"type": "mcq", "q": "Our responsibility is to plant trees. We _____ plant trees.", "choices": ["don't have to", "must", "mustn't"], "answer": 1}, {"type": "mcq", "q": "She stayed home _____ her temperature was very high.", "choices": ["because", "so", "although"], "answer": 0}, {"type": "mcq", "q": "They played well, _____ they won the championship.", "choices": ["because", "so", "but"], "answer": 1}, {"type": "mcq", "q": "Mariam ate a big amount of Koshari _____ she was very hungry.", "choices": ["because", "although", "so"], "answer": 0}, {"type": "mcq", "q": "_____ he reached the station late, he caught the train.", "choices": ["Although", "Because", "So"], "answer": 0}, {"type": "mcq", "q": "Visitors of hospitals _____ shout there.", "choices": ["must", "can", "mustn't"], "answer": 2}, {"type": "mcq", "q": "We _____ travel on holiday to London. It's our plan.", "choices": ["travel", "are going to travel", "traveled"], "answer": 1}, {"type": "mcq", "q": "My uncle is my role model. He _____ me to respect others.", "choices": ["discourages", "does", "inspires"], "answer": 2}, {"type": "mcq", "q": "My father _____ early for his work.", "choices": ["does always", "is always", "always is"], "answer": 1}, {"type": "mcq", "q": "You _____ listen to your teachers.", "choices": ["must", "can't", "mustn't"], "answer": 0}, {"type": "mcq", "q": "Drivers _____ follow traffic rules.", "choices": ["must", "shouldn't", "mustn't"], "answer": 0}, {"type": "mcq", "q": "It's against the law to park your car here. You _____ park here.", "choices": ["mustn't", "must", "will"], "answer": 0}, {"type": "mcq", "q": "You _____ be careless when you cross the street.", "choices": ["mustn't", "must", "should"], "answer": 0}, {"type": "mcq", "q": "You _____ drop litter in the park.", "choices": ["can", "mustn't", "must"], "answer": 1}, {"type": "mcq", "q": "I was sick, _____ I didn't go to school.", "choices": ["although", "so", "because"], "answer": 1}];
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = window.innerWidth; cv.height = window.innerHeight;
window.addEventListener('resize', () => { cv.width = window.innerWidth; cv.height = window.innerHeight; });

const AC = new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d,t='sine',v=0.4){
    if(window.ENG_TOON_AUDIO_MUTED) return;
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.start();o.stop(AC.currentTime+d);
}
function sndCorrect(){ tone(523,.1); setTimeout(()=>tone(784,.3),100); }
function sndWrong(){ tone(150,.6,'sawtooth'); setTimeout(()=>tone(100,.6,'sawtooth'),150); }
function sndShoot(){ tone(300,.1,'square',0.1); }

let qIdx = 0, score = 0, locked = false;
let particles = [];

function loadQ() {
    if(qIdx >= QS.length) { showEndScreen(); return; }
    const q = QS[qIdx];
    locked = false;
    document.getElementById('q-text').textContent = q.q;
    document.getElementById('q-num').textContent = `Q ${qIdx+1}/${QS.length}`;
    
    const container = document.getElementById('targets');
    container.innerHTML = '';
    
    let choices = [...q.choices];
    while(choices.length < 3) choices.push('...');
    choices = choices.slice(0, 3);
    const correctText = q.choices[q.answer] || q.choices[0];
    
    const labeled = choices.map(c => ({ text: c, isCorrect: c === correctText }));
    labeled.sort(() => Math.random() - 0.5); 
    
    labeled.forEach((item, i) => {
        if(!item.text) return;
        const btn = document.createElement('button');
        btn.className = 'target-btn';
        btn.textContent = item.text;
        btn.onclick = () => handleChoice(btn, item.isCorrect, i);
        container.appendChild(btn);
        gameInitTarget(btn, i, labeled.length);
    });
    
    if(typeof gameOnLoadQ === 'function') gameOnLoadQ();
}

function handleChoice(btn, isCorrect, index) {
    if(locked) return;
    btn.classList.add('selected');
    locked = true;
    document.querySelectorAll('.target-btn').forEach(b => b.disabled = true);
    
    const rect = btn.getBoundingClientRect();
    const tx = rect.left + rect.width / 2;
    const ty = rect.top + rect.height / 2;
    
    gameAnimateAction(tx, ty, isCorrect, btn, () => {
        if(isCorrect) {
            score += 100;
            document.getElementById('score-val').textContent = score;
            sndCorrect();
            createParticles(tx, ty, '#2ecc71', 30);
            if(typeof btnSuccessAnim === 'function') btnSuccessAnim(btn);
            else btn.style.transform += ' scale(0)';
        } else {
            sndWrong();
            createParticles(tx, ty, '#e74c3c', 30);
            if(typeof btnFailAnim === 'function') btnFailAnim(btn);
            else btn.style.transform += ' scale(0)';
            document.querySelectorAll('.target-btn').forEach(b => {
                if(b !== btn) b.style.opacity = '0.3';
            });
        }
        clearTimeout(autoAdvanceTimer); autoAdvanceTimer = setTimeout(() => { qIdx++; loadQ(); }, isCorrect ? 1000 : 1500);
    });
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1, color, size: Math.random() * 5 + 3
        });
    }
}

function updateAndDrawParticles() {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.2; 
        p.life -= 0.02;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    });
}

function showEndScreen() {
    document.getElementById('end-screen').classList.add('show');
    document.getElementById('end-title').textContent = score >= (QS.length*70) ? 'Awesome!' : 'Good Effort!';
    document.getElementById('end-score').textContent = `Final Score: ${score}`;
}

function mainLoop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    try { gameDrawBackground(); gameDrawForeground(); } catch (frameError) { console.warn('Gameplay frame recovered', frameError); }
    updateAndDrawParticles();
    requestAnimationFrame(mainLoop);
}


let car = null;
function gameInitTarget(btn, i, total) {
    const spacing = window.innerWidth / (total + 1);
    btn.style.left = (spacing * (i + 1)) + 'px';
    btn.style.top = (window.innerHeight * 0.3) + 'px';
}
function gameOnLoadQ() { car = null; return;}
function gameAnimateAction(tx, ty, isCorrect, btn, cb) {
    sndShoot();
    car = { x: -100, y: cv.height - 100, tx, ty, cb, btn, state: 'drive' };
}
function btnSuccessAnim(btn) {}
function btnFailAnim(btn) {}
function gameDrawBackground() {
    ctx.fillStyle = '#95a5a6'; ctx.fillRect(0, cv.height - 150, cv.width, 100); // road
    ctx.fillStyle = '#fff';
    for(let i=0; i<cv.width; i+=60) ctx.fillRect(i, cv.height - 105, 30, 10); // road lines
}
function gameDrawForeground() {
    if(car) {
        if(car.state === 'drive') {
            car.x += 25;
            if(car.x >= car.tx) car.state = 'turn';
        } else if(car.state === 'turn') {
            car.y -= 25;
            if(car.y <= car.ty + 70) {
                createParticles(car.x, car.y, '#e74c3c', 20);
                car.btn.style.transform += ' scale(0)';
                car.cb(); car = null; return;}
        }
        
        if(car) {
            ctx.save();
            ctx.translate(car.x, car.y);
            if(car.state === 'turn') ctx.rotate(-Math.PI/2);
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(-40, -15, 80, 30);
            ctx.fillStyle = '#000'; 
            ctx.fillRect(-25, -25, 15, 10); ctx.fillRect(15, -25, 15, 10);
            ctx.fillRect(-25, 15, 15, 10); ctx.fillRect(15, 15, 15, 10);
            ctx.fillStyle = '#f1c40f'; ctx.fillRect(35, -10, 5, 20); // headlights
            ctx.restore();
        }
    }
}

loadQ();
mainLoop();
</script>

      if (now - lastTouchEnd <= 300) { e.preventDefault(); }
      lastTouchEnd = now;
    }, {passive:false});
  } catch(err) {}
})();
</script>
