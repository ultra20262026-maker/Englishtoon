<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Styles — Memory Match</title>
<style>
  :root{
    --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9;
    --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:radial-gradient(circle at 20% 0%, var(--navy2), var(--navy) 65%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px;
  }
  h1{color:#fff; font-size:1.8rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  .board{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; max-width:620px; width:100%; }
  .card{ position:relative; aspect-ratio:3/4; cursor:pointer; perspective:800px; }
  .card-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .card.flip .card-inner{ transform:rotateY(180deg); }
  .card.matched .card-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; width:100%; height:100%; border-radius:12px; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:8px; backface-visibility:hidden; font-weight:700; font-size:.95rem; }
  .face-back{ background:linear-gradient(135deg, var(--navy2), var(--card)); border:2px solid #1E4568; color:var(--cyan); font-size:1.8rem; }
  .face-front{ background:linear-gradient(135deg, #1a3a5c, #12233a); border:2px solid var(--cyan); color:#fff; transform:rotateY(180deg);
    box-shadow:0 8px 18px rgba(0,0,0,.35); font-size:.85rem; line-height:1.25; }
  .card.matched .face-front{ border-color:var(--green); background:linear-gradient(135deg,#1e4a33,#153627); color:var(--green); }
  .card.wrongflash .face-front{ border-color:var(--red); }
  button{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:20px;
    box-shadow:0 8px 20px rgba(53,208,201,.3); transition:transform .15s; }
  button:hover{ transform:translateY(-2px); }
  .progress{ width:100%; max-width:620px; height:10px; background:var(--card); border-radius:6px; overflow:hidden; margin-top:6px;}
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--cyan), var(--green)); width:0%; transition:width .4s; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  .toast{ position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--green); color:var(--navy);
    padding:10px 22px; border-radius:999px; font-weight:800; opacity:0; transition:opacity .3s; z-index:50;}
  .toast.show{ opacity:1; }
  footer{ margin-top:26px; color:var(--muted); font-size:.75rem; text-align:center;}
  @media (max-width:520px){ .board{ grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
  <div class="sub">Unit 2 · Learning to Learn</div>
  <h1>🧠 Memory Match: Learning Styles &amp; Skills</h1>
  <div class="hud">
    <div class="pill">Moves: <b id="moves">0</b></div>
    <div class="pill">Matches: <b id="matches">0</b> / 8</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>
  <div class="progress"><div class="progress-fill" id="prog"></div></div>
  <div class="board" id="board"></div>
  <button id="restartBtn">Restart Game</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <div class="toast" id="toast"></div>
  <footer>Original vocabulary set · Unit 2 topic: learning styles &amp; study skills</footer>

<script>
const pairs = [
  {icon:"👀", word:"Visual learner", def:"Someone who learns best by seeing charts, maps, and pictures."},
  {icon:"👂", word:"Auditory learner", def:"Someone who learns best by listening and discussing."},
  {icon:"✋", word:"Kinesthetic learner", def:"Someone who learns best through hands-on activities and movement."},
  {icon:"🗺️", word:"Mind map", def:"A diagram used to organize ideas and information visually."},
  {icon:"🤝", word:"Cooperation", def:"Working well together with others toward a shared goal."},
  {icon:"💬", word:"Communicate", def:"To share ideas and information clearly with others."},
  {icon:"🎯", word:"Focus", def:"To give your full attention to one task without distraction."},
  {icon:"🔁", word:"Revise", def:"To go over your lessons again to remember them better."},
];

let cards = [];
pairs.forEach((p, i) => {
  cards.push({ id:i, type:'icon', display:p.icon+" "+p.word, label:p.word, key:i });
  cards.push({ id:i, type:'def', display:p.def, label:p.word, key:i });
});
cards = cards.sort(()=>Math.random()-0.5);

let flippedIndices = [];
let matchedCount = 0;
let moves = 0;
let score = 0;
let lock = false;

const board = document.getElementById('board');

function render(){
  board.innerHTML = '';
  cards.forEach((c, idx) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.dataset.idx = idx;
    cardEl.innerHTML = `
      <div class="card-inner">
        <div class="face face-back">?</div>
        <div class="face face-front">${c.display}</div>
      </div>
    `;
    cardEl.addEventListener('click', () => onCardClick(idx));
    board.appendChild(cardEl);
  });
}
render();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1200);
}

function onCardClick(idx){
  if (lock) return;
  const el = board.children[idx];
  if (el.classList.contains('flip') || el.classList.contains('matched')) return;
  if (flippedIndices.length >= 2) return;

  el.classList.add('flip');
  flippedIndices.push(idx);

  if (flippedIndices.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    lock = true;
    const [i1, i2] = flippedIndices;
    const c1 = cards[i1], c2 = cards[i2];
    const isMatch = c1.key === c2.key && c1.type !== c2.type;

    setTimeout(() => {
      const el1 = board.children[i1], el2 = board.children[i2];
      if (isMatch) {
        el1.classList.add('matched');
        el2.classList.add('matched');
        matchedCount++;
        score += 15;
        document.getElementById('score').textContent = score;
        document.getElementById('matches').textContent = matchedCount;
        document.getElementById('prog').style.width = `${(matchedCount/8)*100}%`;
        showToast(`Matched: ${c1.label}! ✅`);
        if (matchedCount === 8) {
          setTimeout(finishGame, 500);
        }
      } else {
        el1.classList.add('wrongflash');
        el2.classList.add('wrongflash');
        setTimeout(() => {
          el1.classList.remove('flip','wrongflash');
          el2.classList.remove('flip','wrongflash');
        }, 550);
      }
      flippedIndices = [];
      lock = false;
    }, 700);
  }
}

document.getElementById('restartBtn').addEventListener('click', () => location.reload());

function finishGame(){
  document.getElementById('board').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 All Matched!';
  if (moves <= 10) title = '🏆 Perfect Memory!';
  else if (moves <= 16) title = '👍 Great Job!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You finished in ${moves} moves with a score of ${score}.`;
}
</script>
</body>
</html>
