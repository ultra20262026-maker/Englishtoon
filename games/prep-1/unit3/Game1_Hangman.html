<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Role Models — Hangman</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 10% 90%, var(--navy2), var(--navy) 60%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  #clueBox{ max-width:600px; text-align:center; background:var(--card); border:1px solid #1E4568; border-radius:14px; padding:14px 22px; margin-bottom:18px; font-size:1.05rem; }
  #clueBox b{ color:var(--amber); }
  svg{ margin-bottom:10px; }
  #word{ font-size:2.2rem; font-weight:800; letter-spacing:8px; color:#fff; margin-bottom:20px; text-align:center; }
  #keyboard{ display:flex; flex-wrap:wrap; gap:8px; max-width:600px; justify-content:center; margin-bottom:16px; }
  .key{ width:42px; height:42px; border-radius:8px; background:var(--navy2); border:1px solid #1E4568; color:var(--light); font-weight:700; cursor:pointer; }
  .key:hover{ border-color:var(--cyan); }
  .key.correct{ background:rgba(140,233,154,.2); border-color:var(--green); color:var(--green); }
  .key.wrong{ background:rgba(255,128,128,.2); border-color:var(--red); color:var(--red); }
  .key:disabled{ cursor:default; opacity:.6; }
  button.action{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:10px; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  footer{ margin-top:24px; color:var(--muted); font-size:.75rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 3 · Role Models</div>
  <h1>🪢 Hangman: Past-Tense Verbs</h1>
  <div class="hud">
    <div class="pill">Word: <b id="wordNum">1</b> / 6</div>
    <div class="pill">Wrong Guesses: <b id="wrongCount">0</b> / 6</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>
  <div id="clueBox">Clue: <b id="clueText"></b></div>

  <svg id="gallows" width="180" height="180" viewBox="0 0 180 180">
    <line x1="20" y1="170" x2="140" y2="170" stroke="#8FA6BC" stroke-width="4"/>
    <line x1="50" y1="170" x2="50" y2="20" stroke="#8FA6BC" stroke-width="4"/>
    <line x1="50" y1="20" x2="120" y2="20" stroke="#8FA6BC" stroke-width="4"/>
    <line x1="120" y1="20" x2="120" y2="40" stroke="#8FA6BC" stroke-width="4"/>
    <circle id="p-head" cx="120" cy="55" r="14" stroke="#FFC168" stroke-width="3" fill="none" visibility="hidden"/>
    <line id="p-body" x1="120" y1="69" x2="120" y2="110" stroke="#FFC168" stroke-width="3" visibility="hidden"/>
    <line id="p-arm1" x1="120" y1="80" x2="100" y2="100" stroke="#FFC168" stroke-width="3" visibility="hidden"/>
    <line id="p-arm2" x1="120" y1="80" x2="140" y2="100" stroke="#FFC168" stroke-width="3" visibility="hidden"/>
    <line id="p-leg1" x1="120" y1="110" x2="100" y2="140" stroke="#FFC168" stroke-width="3" visibility="hidden"/>
    <line id="p-leg2" x1="120" y1="110" x2="140" y2="140" stroke="#FFC168" stroke-width="3" visibility="hidden"/>
  </svg>

  <div id="word"></div>
  <div id="keyboard"></div>
  <button class="action" id="nextBtn" style="display:none;">Next Word →</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="action" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original word list · Unit 3 grammar focus: Past Simple (irregular verbs)</footer>

<script>
const words = [
  { word:"WON", clue:"Past tense of 'win' — she ___ the competition." },
  { word:"WORKED", clue:"Past tense of 'work' — he ___ hard every day." },
  { word:"TAUGHT", clue:"Past tense of 'teach' — she ___ students at the university." },
  { word:"WENT", clue:"Past tense of 'go' — they ___ to the ceremony." },
  { word:"BOUGHT", clue:"Past tense of 'buy' — he ___ new equipment for the lab." },
  { word:"HELPED", clue:"Past tense of 'help' — she ___ her community." },
];
let order = [...words.keys()].sort(()=>Math.random()-0.5);
let wordIdx = 0;
let score = 0;
let wrongCount = 0;
let guessed = new Set();
const bodyParts = ['p-head','p-body','p-arm1','p-arm2','p-leg1','p-leg2'];

function loadWord(){
  if (wordIdx >= order.length) { finishGame(); return; }
  document.getElementById('wordNum').textContent = wordIdx + 1;
  const data = words[order[wordIdx]];
  document.getElementById('clueText').textContent = data.clue;
  guessed = new Set();
  wrongCount = 0;
  document.getElementById('wrongCount').textContent = wrongCount;
  bodyParts.forEach(id => document.getElementById(id).setAttribute('visibility','hidden'));
  document.getElementById('nextBtn').style.display = 'none';
  renderWord();
  renderKeyboard();
}

function renderWord(){
  const data = words[order[wordIdx]];
  document.getElementById('word').textContent = data.word.split('').map(l => guessed.has(l) ? l : '_').join(' ');
}

function renderKeyboard(){
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(letter => {
    const b = document.createElement('button');
    b.className = 'key';
    b.textContent = letter;
    b.onclick = () => guessLetter(letter, b);
    kb.appendChild(b);
  });
}

function guessLetter(letter, btnEl){
  const data = words[order[wordIdx]];
  btnEl.disabled = true;
  if (data.word.includes(letter)) {
    guessed.add(letter);
    btnEl.classList.add('correct');
    renderWord();
    if (data.word.split('').every(l => guessed.has(l))) {
      score += Math.max(5, 20 - wrongCount * 3);
      document.getElementById('score').textContent = score;
      document.querySelectorAll('.key').forEach(k => k.disabled = true);
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').textContent = (wordIdx === order.length - 1) ? 'See Final Score →' : 'Next Word →';
    }
  } else {
    btnEl.classList.add('wrong');
    document.getElementById(bodyParts[wrongCount]).setAttribute('visibility','visible');
    wrongCount++;
    document.getElementById('wrongCount').textContent = wrongCount;
    if (wrongCount >= 6) {
      document.getElementById('word').textContent = data.word.split('').join(' ');
      document.querySelectorAll('.key').forEach(k => k.disabled = true);
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').textContent = (wordIdx === order.length - 1) ? 'See Final Score →' : 'Next Word →';
    }
  }
}

document.getElementById('nextBtn').addEventListener('click', () => {
  wordIdx++;
  loadWord();
});

function finishGame(){
  document.getElementById('clueBox').style.display = 'none';
  document.getElementById('gallows').style.display = 'none';
  document.getElementById('word').style.display = 'none';
  document.getElementById('keyboard').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Great Job!';
  if (score >= 100) title = '🏆 Hangman Hero!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${order.length} words.`;
}

loadWord();
</script>
</body>
</html>
