<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Role Models — Card Flip</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 90% 10%, var(--navy2), var(--navy) 60%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  #grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:560px; width:100%; margin-bottom:20px; }
  .card{ aspect-ratio:1/1; perspective:800px; cursor:pointer; }
  .card-inner{ width:100%; height:100%; position:relative; transition:transform .5s; transform-style:preserve-3d; }
  .card.flip .card-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; width:100%; height:100%; border-radius:12px; display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; font-weight:800; }
  .face-back{ background:linear-gradient(135deg,var(--navy2),var(--card)); border:2px solid #1E4568; color:var(--cyan); font-size:1.8rem; }
  .face-front{ background:#12233a; border:2px solid var(--cyan); color:#fff; transform:rotateY(180deg); font-size:1.6rem; }
  .card.correct .face-front{ border-color:var(--green); background:rgba(140,233,154,.15); color:var(--green); }
  .card.wrong .face-front{ border-color:var(--red); background:rgba(255,128,128,.15); color:var(--red); }
  #qmodal{ display:none; position:fixed; inset:0; background:rgba(4,10,18,.88); z-index:100; align-items:center; justify-content:center; padding:20px; }
  #qcardbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:28px; max-width:600px; width:100%; }
  #qtext{ color:#fff; font-size:1.2rem; font-weight:700; margin-bottom:18px; line-height:1.4; }
  .opt{ display:block; width:100%; text-align:left; background:var(--navy2); color:var(--light); border:1px solid #1E4568;
    border-radius:10px; padding:13px 16px; margin-bottom:10px; font-size:1rem; cursor:pointer; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  .explain{ margin-top:12px; padding:12px 14px; background:var(--navy2); border-radius:10px; font-size:.9rem; color:var(--muted); display:none;}
  .btn-close{ margin-top:16px; display:none; font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:10px;
    padding:12px 24px; cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:16px; }
  footer{ margin-top:24px; color:var(--muted); font-size:.75rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 3 · Role Models</div>
  <h1>🃏 Card Flip: Past Simple Challenge</h1>
  <div class="hud">
    <div class="pill">Flipped: <b id="flippedCount">0</b> / 9</div>
    <div class="pill">Score: <b id="score">0</b></div>
  </div>

  <div id="grid"></div>

  <div id="qmodal">
    <div id="qcardbox">
      <div id="qtext"></div>
      <div id="options"></div>
      <div class="explain" id="explain"></div>
      <button class="btn-close" id="closeBtn">Continue →</button>
    </div>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original questions · Unit 3 grammar focus: Past Simple Tense</footer>

<script>
const questions = [
  {q:"She ___________ (study) science with her father.", opts:["study","studied","studies","studying"], a:1, ex:"Regular verb ending in consonant+y: study → studied."},
  {q:"He ___________ (not / visit) the exhibition.", opts:["didn't visit","doesn't visit","not visited","didn't visited"], a:0, ex:"'Didn't' + base verb."},
  {q:"___________ they win the championship?", opts:["Do","Does","Did","Was"], a:2, ex:"Past questions use 'Did'."},
  {q:"We ___________ (be) at the ceremony.", opts:["was","is","were","are"], a:2, ex:"'We' + were (past of 'to be')."},
  {q:"He ___________ (write) an inspiring book.", opts:["wrote","writed","writes","writing"], a:0, ex:"Irregular: write → wrote."},
  {q:"I ___________ (meet) a famous scientist last year.", opts:["meet","meeted","met","meets"], a:2, ex:"Irregular: meet → met."},
  {q:"She ___________ (not / give) up on her dream.", opts:["didn't gave","doesn't give","didn't give","not gave"], a:2, ex:"'Didn't' + base verb: 'didn't give'."},
  {q:"___________ he protect the border bravely?", opts:["Do","Does","Did","Is"], a:2, ex:"Past questions use 'Did'."},
  {q:"They ___________ (achieve) something amazing.", opts:["achieve","achieved","achieves","achieving"], a:1, ex:"Regular verb + -ed: achieved."},
];

let score = 0;
let flippedCount = 0;

const grid = document.getElementById('grid');
function render(){
  grid.innerHTML = '';
  questions.forEach((q, i) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.dataset.idx = i;
    cardEl.innerHTML = `
      <div class="card-inner">
        <div class="face face-back">?</div>
        <div class="face face-front">${i+1}</div>
      </div>
    `;
    cardEl.addEventListener('click', () => openCard(i, cardEl));
    grid.appendChild(cardEl);
  });
}
render();

function openCard(idx, cardEl){
  if (cardEl.classList.contains('flip')) return;
  const q = questions[idx];
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain');
  explainDiv.style.display = 'none';
  const closeBtn = document.getElementById('closeBtn');
  closeBtn.style.display = 'none';

  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      cardEl.classList.add('flip');
      flippedCount++;
      document.getElementById('flippedCount').textContent = flippedCount;
      if (i === q.a) {
        b.classList.add('correct');
        score += 10;
        cardEl.classList.add('correct');
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
        cardEl.classList.add('wrong');
      }
      document.getElementById('score').textContent = score;
      explainDiv.textContent = 'Why: ' + q.ex;
      explainDiv.style.display = 'block';
      closeBtn.style.display = 'inline-block';
    };
    optsDiv.appendChild(b);
  });

  document.getElementById('qmodal').style.display = 'flex';
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('qmodal').style.display = 'none';
  if (flippedCount === questions.length) finishGame();
});

function finishGame(){
  document.getElementById('grid').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 All Cards Flipped!';
  if (score >= 80) title = '🏆 Card Flip Master!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `Final score: ${score} points across ${questions.length} cards.`;
}
</script>
</body>
</html>
