<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Role Models — Time Challenge</title>
<style>
  :root{ --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9; --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:linear-gradient(180deg,#0d2438,var(--navy) 70%);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:14px;}
  .hud{display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  .pill{background:var(--card); border:1px solid #1E4568; border-radius:999px; padding:8px 18px; font-size:.9rem;}
  .pill b{color:var(--green);}
  .pill.time b{ color:var(--red); }
  #bigTimer{ font-size:3rem; font-weight:800; color:#fff; margin-bottom:6px; }
  #timerBarWrap{ width:100%; max-width:600px; height:14px; background:var(--card); border-radius:8px; overflow:hidden; margin-bottom:20px; }
  #timerBar{ height:100%; background:linear-gradient(90deg, var(--green), var(--amber), var(--red)); width:100%; transition:width 1s linear; }
  #qbox{ background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:26px; max-width:600px; width:100%; min-height:260px; display:flex; flex-direction:column; }
  #qtext{ color:#fff; font-size:1.25rem; font-weight:700; margin-bottom:20px; line-height:1.4; }
  .opt{ background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:14px 16px;
    margin-bottom:10px; font-size:1rem; cursor:pointer; text-align:left; }
  .opt:hover{ border-color:var(--cyan); background:#183a5c; }
  .opt.correct{ background:rgba(140,233,154,.18); border-color:var(--green); color:var(--green); font-weight:700; }
  .opt.wrong{ background:rgba(255,128,128,.18); border-color:var(--red); color:var(--red); font-weight:700; }
  button.start{ font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:14px 30px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:10px; }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  footer{ margin-top:24px; color:var(--muted); font-size:.75rem; text-align:center;}
</style>
</head>
<body>
  <div class="sub">Unit 3 · Role Models</div>
  <h1>⏱️ Time Challenge: Past Simple Sprint</h1>
  <div class="hud">
    <div class="pill">Score: <b id="score">0</b></div>
    <div class="pill">Question: <b id="qNum">0</b> / 10</div>
  </div>
  <div id="bigTimer">60</div>
  <div id="timerBarWrap"><div id="timerBar"></div></div>

  <div id="qbox">
    <div id="qtext">Answer as many questions as you can before time runs out!</div>
    <div id="options"></div>
  </div>
  <button class="start" id="startBtn">Start the 60-Second Sprint</button>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="start" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original questions · Unit 3 grammar focus: Past Simple Tense</footer>

<script>
const bank = [
  {q:"She ___________ (win) the award.", opts:["win","won","winned","wins"], a:1},
  {q:"They ___________ (not / visit) the museum.", opts:["didn't visit","doesn't visit","not visited","don't visited"], a:0},
  {q:"___________ he study medicine?", opts:["Do","Does","Did","Was"], a:2},
  {q:"We ___________ (be) proud of her.", opts:["was","is","were","be"], a:2},
  {q:"He ___________ (teach) at the university.", opts:["teached","taught","teach","teaches"], a:1},
  {q:"I ___________ (buy) a gift for the ceremony.", opts:["buy","buyed","bought","buys"], a:2},
  {q:"___________ they meet the scientist?", opts:["Do","Does","Did","Were"], a:2},
  {q:"She ___________ (go) to Cairo last year.", opts:["goes","go","went","gone"], a:2},
  {q:"He ___________ (not / know) about the award.", opts:["didn't know","doesn't know","not knew","didn't knew"], a:0},
  {q:"They ___________ (help) many people.", opts:["help","helps","helped","helping"], a:2},
];

let pool = [...bank].sort(()=>Math.random()-0.5);
let qIdx = 0;
let score = 0;
let timeLeft = 60;
let timerInterval = null;
let running = false;

function loadQuestion(){
  if (qIdx >= 10) { finishGame(); return; }
  document.getElementById('qNum').textContent = qIdx + 1;
  const q = pool[qIdx % pool.length];
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = () => {
      if (!running) return;
      document.querySelectorAll('.opt').forEach(o => o.onclick = null);
      if (i === q.a) {
        b.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt')[q.a].classList.add('correct');
      }
      setTimeout(() => { qIdx++; loadQuestion(); }, 500);
    };
    optsDiv.appendChild(b);
  });
}

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').style.display = 'none';
  running = true;
  loadQuestion();
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('bigTimer').textContent = timeLeft;
    document.getElementById('timerBar').style.width = (timeLeft/60*100) + '%';
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      running = false;
      finishGame();
    }
  }, 1000);
});

function finishGame(){
  clearInterval(timerInterval);
  running = false;
  document.getElementById('qbox').style.display = 'none';
  document.getElementById('bigTimer').style.display = 'none';
  document.getElementById('timerBarWrap').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  let title = '🎉 Sprint Complete!';
  if (score >= 80) title = '🏆 Lightning Fast!';
  else if (score >= 50) title = '👍 Great Speed!';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endMsg').textContent = `You scored ${score} points, answering ${Math.min(qIdx,10)} questions.`;
}
</script>
</body>
</html>
