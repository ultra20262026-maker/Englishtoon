/* Canvas */
canvas { display: block; position: fixed; top: 0; left: 0; z-index: 10; }

/* End Screen */
#end-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }

}

    <div>Car Racing</div>

</div>

<div id="targets"></div>
<canvas id="cv"></canvas>

<div id="end-screen">
    <h1 id="end-title">Game Over!</h1>
    <p id="end-score">Score: 0</p>
    <button onclick="location.reload()">Play Again</button>
</div>

<script>
let autoAdvanceTimer = null;
const QS = [{"type": "mcq", "q": "Even when their ideas failed at first, they kept _____.", "choices": ["giving up", "trying", "sleeping"], "answer": 1}, {"type": "mcq", "q": "They shared _____ along the way.", "choices": ["respect", "hate", "blame"], "answer": 0}, {"type": "mcq", "q": "Working in a team teaches students _____ and responsibility.", "choices": ["cooperation", "wasting time", "laziness"], "answer": 0}, {"type": "mcq", "q": "Farida Osman is a famous Egyptian _____.", "choices": ["swimmer", "footballer", "runner"], "answer": 0}, {"type": "mcq", "q": "Farida was born in 1995 in _____.", "choices": ["Luxor", "Cairo", "Alexandria"], "answer": 2}, {"type": "mcq", "q": "She started swimming when she was _____ years old.", "choices": ["five", "seven", "ten"], "answer": 1}, {"type": "mcq", "q": "She practices every day to become _____.", "choices": ["worse", "better", "slower"], "answer": 1}, {"type": "mcq", "q": "She won a bronze medal in _____.", "choices": ["2010", "2017", "2020"], "answer": 1}, {"type": "mcq", "q": "Farida is an example for many young _____ in Egypt.", "choices": ["doctors", "teachers", "athletes"], "answer": 2}, {"type": "mcq", "q": "She shows that with hard work, you can achieve great _____.", "choices": ["failure", "laziness", "success"], "answer": 2}, {"type": "mcq", "q": "She wants to make Egypt _____.", "choices": ["proud", "ashamed", "sad"], "answer": 0}, {"type": "mcq", "q": "The word 'tournaments' means _____.", "choices": ["friends", "competitions", "schools"], "answer": 1}, {"type": "mcq", "q": "Farida is very _____ in the water.", "choices": ["slow", "fast", "lazy"], "answer": 1}, {"type": "mcq", "q": "She dreams of winning more _____.", "choices": ["books", "medals", "bags"], "answer": 1}, {"type": "mcq", "q": "Saving electricity is important for both yourself and the _____.", "choices": ["sky", "street", "environment"], "answer": 2}, {"type": "mcq", "q": "A vet is a doctor who _____ animals.", "choices": ["raises", "treats", "eats"], "answer": 1}, {"type": "mcq", "q": "_____ for sick animals is a good side in working as a vet.", "choices": ["Cared", "Cares", "Caring"], "answer": 2}, {"type": "mcq", "q": "Helping animals makes a _____ to them and their owners.", "choices": ["differs", "difference", "different"], "answer": 1}, {"type": "mcq", "q": "You can make a _____ map to show your future dreams.", "choices": ["road", "mind", "traffic"], "answer": 1}, {"type": "mcq", "q": "You will succeed if you work hard and stay _____.", "choices": ["focused", "focuses", "focus"], "answer": 0}, {"type": "mcq", "q": "'the boys books are on the desk' - > the _____ books are on the desk.", "choices": ["boys'", "boys", "boy's"], "answer": 0}, {"type": "mcq", "q": "'I dont smoke at all' -> I _____ smoke at all.", "choices": ["don't", "doesn't", "didn't"], "answer": 0}, {"type": "mcq", "q": "'malik s mobile is expensive' -> _____ mobile is expensive.", "choices": ["Malik", "Maliks", "Malik's"], "answer": 2}, {"type": "mcq", "q": "A _____ treats sick animals.", "choices": ["vet", "surgeon", "dentist"], "answer": 0}, {"type": "mcq", "q": "I have a special _____ for drawing.", "choices": ["talent", "play", "dreams"], "answer": 0}];
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = window.innerWidth; cv.height = window.innerHeight;
window.addEventListener('resize', () => { cv.width = window.innerWidth; cv.height = window.innerHeight; });

const AC = new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d,t='sine',v=0.4){
    if(window.ENG_TOON_AUDIO_MUTED) return;
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.start();o.stop(AC.currentTime+d);
}
function sndCorrect(){ tone(523,.1); setTimeout(()=>tone(784,.3),100); }
function sndWrong(){ tone(150,.6,'sawtooth'); setTimeout(()=>tone(100,.6,'sawtooth'),150); }
function sndShoot(){ tone(300,.1,'square',0.1); }

let qIdx = 0, score = 0, locked = false;
let particles = [];

function loadQ() {
    if(qIdx >= QS.length) { showEndScreen(); return; }
    const q = QS[qIdx];
    locked = false;
    document.getElementById('q-text').textContent = q.q;
    document.getElementById('q-num').textContent = `Q ${qIdx+1}/${QS.length}`;
    
    const container = document.getElementById('targets');
    container.innerHTML = '';
    
    let choices = [...q.choices];
    while(choices.length < 3) choices.push('...');
    choices = choices.slice(0, 3);
    const correctText = q.choices[q.answer] || q.choices[0];
    
    const labeled = choices.map(c => ({ text: c, isCorrect: c === correctText }));
    labeled.sort(() => Math.random() - 0.5); 
    
    labeled.forEach((item, i) => {
        if(!item.text) return;
        const btn = document.createElement('button');
        btn.className = 'target-btn';
        btn.textContent = item.text;
        btn.onclick = () => handleChoice(btn, item.isCorrect, i);
        container.appendChild(btn);
        gameInitTarget(btn, i, labeled.length);
    });
    
    if(typeof gameOnLoadQ === 'function') gameOnLoadQ();
}

function handleChoice(btn, isCorrect, index) {
    if(locked) return;
    btn.classList.add('selected');
    locked = true;
    document.querySelectorAll('.target-btn').forEach(b => b.disabled = true);
    
    const rect = btn.getBoundingClientRect();
    const tx = rect.left + rect.width / 2;
    const ty = rect.top + rect.height / 2;
    
    gameAnimateAction(tx, ty, isCorrect, btn, () => {
        if(isCorrect) {
            score += 100;
            document.getElementById('score-val').textContent = score;
            sndCorrect();
            createParticles(tx, ty, '#2ecc71', 30);
            if(typeof btnSuccessAnim === 'function') btnSuccessAnim(btn);
            else btn.style.transform += ' scale(0)';
        } else {
            sndWrong();
            createParticles(tx, ty, '#e74c3c', 30);
            if(typeof btnFailAnim === 'function') btnFailAnim(btn);
            else btn.style.transform += ' scale(0)';
            document.querySelectorAll('.target-btn').forEach(b => {
                if(b !== btn) b.style.opacity = '0.3';
            });
        }
        clearTimeout(autoAdvanceTimer); autoAdvanceTimer = setTimeout(() => { qIdx++; loadQ(); }, isCorrect ? 1000 : 1500);
    });
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1, color, size: Math.random() * 5 + 3
        });
    }
}

function updateAndDrawParticles() {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.2; 
        p.life -= 0.02;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    });
}

function showEndScreen() {
    document.getElementById('end-screen').classList.add('show');
    document.getElementById('end-title').textContent = score >= (QS.length*70) ? 'Awesome!' : 'Good Effort!';
    document.getElementById('end-score').textContent = `Final Score: ${score}`;
}

function mainLoop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    try { gameDrawBackground(); gameDrawForeground(); } catch (frameError) { console.warn('Gameplay frame recovered', frameError); }
    updateAndDrawParticles();
    requestAnimationFrame(mainLoop);
}


let can = null;
function gameInitTarget(btn, i, total) {
    const spacing = window.innerWidth / (total + 1);
    btn.style.left = (spacing * (i + 1)) + 'px';
    btn.style.top = (window.innerHeight * 0.6) + 'px';
}
function gameOnLoadQ() { can = null; return;}
function gameAnimateAction(tx, ty, isCorrect, btn, cb) {
    sndShoot();
    can = { x: -100, y: ty - 150, tx: tx + 50, ty: ty - 100, cb, btn, state: 'fly', time: 0 };
}
function btnSuccessAnim(btn) { 
    btn.style.background = '#2ecc71';
    btn.style.transform = 'translate(-50%, -50%) scale(1.5)'; 
}
function btnFailAnim(btn) { 
    btn.style.background = '#333';
    btn.style.transform = 'translate(-50%, -50%) scale(0.5)'; 
}

function gameDrawBackground() {}
function gameDrawForeground() {
    if(can) {
        if(can.state === 'fly') {
            can.x += (can.tx - can.x) * 0.1;
            can.y += (can.ty - can.y) * 0.1;
            if(Math.hypot(can.tx - can.x, can.ty - can.y) < 5) can.state = 'pour';
        } else if(can.state === 'pour') {
            can.time++;
            // Water particles
            if(can.time % 2 === 0) createParticles(can.x - 40, can.y + 20, '#3498db', 2);
            if(can.time > 60) can.state = 'leave';
        } else if(can.state === 'leave') {
            can.x += 15;
            if(can.x > cv.width + 100) { can.cb(); can = null; return;}
        }
        
        if(can) {
            ctx.save();
            ctx.translate(can.x, can.y);
            if(can.state === 'pour') ctx.rotate(-Math.PI/6);
            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(-30, -30, 60, 60);
            ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(60, 0); ctx.lineTo(60, -30); ctx.stroke(); // Handle
            ctx.beginPath(); ctx.moveTo(-30, -10); ctx.lineTo(-60, -40); ctx.stroke(); // Spout
            ctx.restore();
        }
    }
}

loadQ();
mainLoop();
</script>

    document.addEventListener('touchend', function(e){
      var now = Date.now();
      if (now - lastTouchEnd <= 300) { e.preventDefault(); }
      lastTouchEnd = now;
    }, {passive:false});
  } catch(err) {}
})();
</script>
