<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Wants to Be a Grammar Millionaire?</title>
<style>
  :root{
    --navy:#0B1E33; --navy2:#112B47; --card:#16324F; --cyan:#35D0C9;
    --green:#8CE99A; --amber:#FFC168; --red:#FF8080; --light:#D7E3EC; --muted:#8FA6BC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:linear-gradient(160deg, #08131f, var(--navy) 55%, #08131f);
    font-family:'Segoe UI',Calibri,Arial,sans-serif; color:var(--light); display:flex; flex-direction:column; align-items:center; padding:24px;
  }
  h1{color:#fff; font-size:1.7rem; margin:6px 0 2px; text-align:center;}
  .sub{color:var(--cyan); font-weight:700; letter-spacing:2px; font-size:.8rem; text-transform:uppercase; margin-bottom:16px;}
  .layout{ display:flex; gap:24px; max-width:960px; width:100%; flex-wrap:wrap; justify-content:center;}
  .main{ flex:1 1 500px; max-width:560px;}
  .ladder{ width:220px; background:var(--card); border-radius:14px; padding:14px 10px; border:1px solid #1E4568;}
  .rung{
    display:flex; justify-content:space-between; padding:8px 12px; border-radius:8px; font-size:.85rem; margin-bottom:4px; color:var(--muted);
  }
  .rung.current{ background:var(--amber); color:var(--navy); font-weight:800; }
  .rung.done{ color:var(--green); font-weight:700; }
  #qbox{
    background:var(--card); border:1px solid #1E4568; border-radius:18px; padding:26px; min-height:340px;
    display:flex; flex-direction:column;
  }
  #qcount{ color:var(--amber); font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;}
  #qtext{ color:#fff; font-size:1.3rem; font-weight:700; margin-bottom:20px; line-height:1.4; min-height:70px;}
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt{
    background:var(--navy2); color:var(--light); border:1px solid #1E4568; border-radius:10px; padding:14px 14px;
    font-size:1rem; cursor:pointer; transition:.15s; text-align:left;
  }
  .opt:hover{ border-color:var(--cyan); background:#183a5c;}
  .opt.correct{ background:rgba(140,233,154,.2); border-color:var(--green); color:var(--green); font-weight:700;}
  .opt.wrong{ background:rgba(255,128,128,.2); border-color:var(--red); color:var(--red); font-weight:700;}
  .opt.locked{ opacity:.35; cursor:default; }
  .tools{ display:flex; gap:10px; margin:16px 0 4px; }
  .tool-btn{
    background:var(--navy2); color:var(--amber); border:1px solid var(--amber); border-radius:999px; padding:8px 16px;
    font-size:.8rem; font-weight:700; cursor:pointer;
  }
  .tool-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .explain{ margin-top:auto; padding-top:14px; font-size:.85rem; color:var(--muted); display:none; }
  button.next{
    font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:12px 26px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green)); margin-top:14px; display:none;
  }
  #endscreen{ display:none; text-align:center; margin-top:26px; }
  #endscreen h2{ font-size:2rem; color:#fff; }
  button.replay{
    font-family:inherit; font-weight:700; font-size:1rem; border:none; border-radius:12px; padding:13px 28px;
    cursor:pointer; color:var(--navy); background:linear-gradient(135deg, var(--cyan), var(--green));
  }
  footer{ margin-top:26px; color:var(--muted); font-size:.75rem; text-align:center;}

/* Timer elements hidden */
#timerBar, .timer-bar, .time-bar, .timer-container { display: none !important; }
#bigTimer, .big-timer { display: none !important; }
</style>
</head>
<body>
  <div class="sub">Unit 1 · Life in a Digital World</div>
  <h1>💰 Who Wants to Be a Grammar Millionaire?</h1>

  <div class="layout">
    <div class="main">
      <div id="qbox">
        <div id="qcount"></div>
        <div id="qtext"></div>
        <div class="opts" id="opts"></div>
        <div class="tools">
          <button class="tool-btn" id="fiftyBtn">50:50</button>
          <button class="tool-btn" id="skipBtn">Skip Question</button>
        </div>
        <div class="explain" id="explain"></div>
        <button class="next" id="nextBtn">Next Question →</button>
      </div>
    </div>
    <div class="ladder" id="ladder"></div>
  </div>

  <div id="endscreen">
    <h2 id="endTitle"></h2>
    <p id="endMsg" style="color:var(--muted); font-size:1.05rem;"></p>
    <button class="replay" onclick="location.reload()">Play Again</button>
  </div>

  <footer>Original questions · Unit 1 grammar focus: Present Simple + Adverbs of Frequency</footer>

<script>
const prizes = ["100","200","300","500","1,000","2,000","5,000","10,000","50,000","1 MILLION"];

const questions = [
  {q:"I _____ my phone every morning.", opts:["check","checks","checking","am check"], a:0, ex:"'I' takes the base verb: 'I check'."},
  {q:"My teacher _____ videos on the smartboard.", opts:["show","shows","showing","is show"], a:1, ex:"He/she/it + verb + -s: 'shows'."},
  {q:"We _____ our tablets during class.", opts:["doesn't use","don't use","not use","isn't use"], a:1, ex:"'We' + don't + base verb: 'don't use'."},
  {q:"_____ your sister play online games?", opts:["Do","Does","Is","Did"], a:1, ex:"'Your sister' = she, so use 'Does'."},
  {q:"Noha _____ for information online.", opts:["usually search","usually searches","is usually search","does usually search"], a:1, ex:"Third person + -es for verbs ending in -ch: 'searches'."},
  {q:"They _____ to charge their laptops.", opts:["never forgets","don't never forget","never forget","forget never"], a:2, ex:"'Never' already carries the negative meaning: 'they never forget'."},
  {q:"She _____ music from the internet every weekend.", opts:["sometimes download","sometimes downloads","download sometimes","is sometimes downloads"], a:1, ex:"'She' + downloads, with the adverb placed before the verb."},
  {q:"_____ he have a laptop for his lessons?", opts:["Do","Does","Have","Is"], a:1, ex:"He is third person singular, so we use 'Does'."},
  {q:"My friends rarely _____ their homework on paper now.", opts:["does","do","doing","done"], a:1, ex:"'My friends' = they, using the base form 'do'."},
  {q:"Choose the sentence with correct word order.", opts:["I check always my email.","I always check my email.","Always I check my email.","I check my email always only."], a:1, ex:"The adverb of frequency goes before the main verb: 'I always check'."},
];

const bonusPool = [
  {q:"My cousin _____ funny pictures to our family group every week.", opts:["send","sends","sending","is send"], a:1, ex:"He/she/it + verb + -s: 'sends'."},
  {q:"_____ your friends chat online after dinner?", opts:["Do","Does","Are","Is"], a:0, ex:"'Your friends' = they, so the question uses 'Do'."},
  {q:"I _____ my password with anyone online.", opts:["never shares","don't never share","never share","share never"], a:2, ex:"'Never' already makes the sentence negative: 'I never share'."},
  {q:"Nadia _____ her homework on paper anymore.", opts:["don't do","doesn't do","not does","isn't do"], a:1, ex:"'Nadia' = she, so 'doesn't do' is correct."},
  {q:"My classmates _____ videos to learn new vocabulary.", opts:["often watches","often watch","watch often only","is often watch"], a:1, ex:"'My classmates' = they, so 'often watch' is correct."},
  {q:"He _____ his tablet at the library on weekends.", opts:["sometimes uses","sometimes use","use sometimes","is sometimes uses"], a:0, ex:"'He' + verb + -s: 'sometimes uses'."},
];
// Shuffle in two bonus questions each playthrough for variety, replacing two mid-ladder questions
(function mixInBonus(){
  const shuffledBonus = [...bonusPool].sort(()=>Math.random()-0.5).slice(0,2);
  const replaceAt = [4, 7]; // mid and late ladder positions
  replaceAt.forEach((pos, i) => { if (shuffledBonus[i]) questions[pos] = shuffledBonus[i]; });
})();

let current = 0;
let score = 0;
let usedFifty = false, usedSkip = false;
let bankedPrize = "0";

function renderLadder(){
  const ladder = document.getElementById('ladder');
  ladder.innerHTML = '';
  for (let i = prizes.length - 1; i >= 0; i--) {
    const div = document.createElement('div');
    div.className = 'rung';
    if (i < current) div.classList.add('done');
    if (i === current) div.classList.add('current');
    div.innerHTML = `<span>${i+1}</span><span>${prizes[i]}</span>`;
    ladder.appendChild(div);
  }
}

function loadQuestion(){
  if (current >= questions.length) { finishGame(true); return; }
  const q = questions[current];
  document.getElementById('qcount').textContent = `Question ${current+1} of ${questions.length} — for ${prizes[current]} points`;
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('opts');
  optsDiv.innerHTML = '';
  const explainDiv = document.getElementById('explain');
  explainDiv.style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  q.opts.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = `${String.fromCharCode(65+idx)}. ${opt}`;
    b.dataset.idx = idx;
    b.onclick = () => selectAnswer(idx);
    optsDiv.appendChild(b);
  });
  renderLadder();
}

function selectAnswer(idx){
  const q = questions[current];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => { if(!b.classList.contains('locked')) b.onclick = null; });
  if (idx === q.a) {
    buttons[idx].classList.add('correct');
    score = current;
    bankedPrize = prizes[current];
  } else {
    buttons[idx].classList.add('wrong');
    buttons[q.a].classList.add('correct');
  }
  document.getElementById('explain').textContent = 'Why: ' + q.ex;
  document.getElementById('explain').style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = (idx === q.a) ?
    (current === questions.length - 1 ? 'Claim the Million! →' : 'Next Question →') :
    'See Final Result →';
  nextBtn.dataset.won = (idx === q.a) ? "1" : "0";
}

document.getElementById('nextBtn').addEventListener('click', () => {
  const won = document.getElementById('nextBtn').dataset.won === "1";
  if (!won) { finishGame(false); return; }
  current++;
  loadQuestion();
});

document.getElementById('fiftyBtn').addEventListener('click', () => {
  if (usedFifty) return;
  usedFifty = true;
  document.getElementById('fiftyBtn').disabled = true;
  const q = questions[current];
  const wrongIndices = q.opts.map((_,i)=>i).filter(i => i !== q.a);
  wrongIndices.sort(()=>Math.random()-0.5);
  const toHide = wrongIndices.slice(0, 2);
  const buttons = document.querySelectorAll('.opt');
  toHide.forEach(i => { buttons[i].classList.add('locked'); buttons[i].onclick = null; buttons[i].textContent = '—'; });
});

document.getElementById('skipBtn').addEventListener('click', () => {
  if (usedSkip) return;
  usedSkip = true;
  document.getElementById('skipBtn').disabled = true;
  current++;
  if (current >= questions.length) { finishGame(true); return; }
  loadQuestion();
});

function finishGame(wonAll){
  document.querySelector('.layout').style.display = 'none';
  const end = document.getElementById('endscreen');
  end.style.display = 'block';
  if (wonAll) {
    document.getElementById('endTitle').textContent = '🏆 You are a Grammar Millionaire!';
    document.getElementById('endMsg').textContent = `You answered every question correctly and won ${prizes[prizes.length-1]} points!`;
  } else {
    document.getElementById('endTitle').textContent = '💡 Game Over';
    document.getElementById('endMsg').textContent = `You banked ${bankedPrize} points before missing a question. Try again to reach the million!`;
  }
}

loadQuestion();
</script>
</body>
</html>
