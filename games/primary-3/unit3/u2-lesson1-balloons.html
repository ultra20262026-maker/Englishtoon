<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>الدرس الأول — Helping the Community — الوحدة الثانية (جيم ٤)</title>
<style>
:root{--ink:#FFF6EC;--deep:#12263F;--deep2:#1D3B5C;--sun:#FFC145;--leaf:#5BE39B;--berry:#FF5D6C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);
 background:var(--deep);min-height:100vh;padding:10px;overflow:hidden}
.wrap{max-width:620px;margin:0 auto}
.card{background:rgba(255,246,236,.06);border:1px solid rgba(255,246,236,.15);border-radius:16px;padding:16px}
h1{font-size:1.25rem;color:var(--sun);line-height:1.4}h2{font-size:1.1rem;color:var(--sun)}
p.lead{line-height:1.9;font-size:.95rem;margin-top:8px}
.btn{font-size:1.05rem;font-weight:700;font-family:inherit;background:var(--sun);color:#37280a;border:0;
 border-radius:12px;padding:13px 20px;cursor:pointer;box-shadow:0 4px 0 #c79400;width:100%;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c79400}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid rgba(255,246,236,.3);box-shadow:none}
.hud{display:flex;justify-content:space-between;align-items:center;background:var(--deep2);
 border:1px solid rgba(255,246,236,.18);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.88rem}
.qbox{background:var(--deep2);border:1px solid rgba(255,246,236,.18);border-radius:12px;padding:10px;
 text-align:center;margin-top:8px;min-height:60px;display:flex;flex-direction:column;justify-content:center}
.q{font-size:1.05rem;font-weight:700;direction:ltr;line-height:1.5}
.qsub{font-size:.78rem;opacity:.8;margin-top:3px}
#stage{width:100%;height:60vh;min-height:340px;margin-top:8px;border-radius:14px;display:block;touch-action:none;
 background:linear-gradient(180deg,#25507E,#3E7CB1 60%,#7FB2D9);border:1px solid rgba(255,246,236,.15)}
section{margin-top:12px}.trophy{font-size:4rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<section id="home"><div class="card">
  <h1>🎈 فرقع البالونة الصح</h1>
  <p class="lead">الوحدة التانية — مساعدة المجتمع.<br>البالونات بتطلع لفوق ببطء، دوس على البالونة اللي عليها الإجابة الصح قبل ما تهرب.</p>
  <button class="btn" onclick="start()">ابدأ</button>
</div></section>

<section id="play" hidden>
  <div class="hud"><span id="lives">❤❤❤</span>
    <span style="font-size:.72rem;opacity:.85">Unit 2 · Lesson 1 — Helping the Community</span>
    <span>⭐ <span id="score">0</span> <span id="combo" style="color:var(--sun)"></span></span></div>
  <div class="qbox"><div class="q" id="q"></div><div class="qsub" id="qsub"></div></div>
  <canvas id="stage"></canvas>
  <button class="btn ghost" onclick="location.reload()">من الأول</button>
</section>

<section id="over" hidden><div class="card" style="text-align:center">
  <div class="trophy" id="ic">🎈</div><h2 id="tt"></h2><p class="lead" id="tx"></p>
  <button class="btn" onclick="location.reload()">العب تاني</button>
</div></section>
</div>

<script>
const QS=[
 {q:"Adam ___ trash every Sunday.",opts:["cleans","plants","feeds","reads"],ans:0},
 {q:"Amira ___ the animals in the street.",opts:["collects","feeds","cleans","plants"],ans:1},
 {q:"She ___ at the community park.",opts:["volunteers","travels","sleeps","buys"],ans:0},
 {q:"I ___ clothes and give them to people who need them.",opts:["collect","clean","feed","plant"],ans:0},
 {q:"We ___ trees to make our city green.",opts:["plant","feed","collect","clean"],ans:0},
 {q:"Rubbish in the street is called ___ .",opts:["trash","traffic","bins","clothes"],ans:0},
 {q:"The people who live near us are our ___ .",opts:["neighbors","teachers","farmers","doctors"],ans:0},
 {q:"He works for free to help others. He is a ___ .",opts:["volunteer","driver","player","seller"],ans:0},
 {q:"All the people who live in one place make a ___ .",opts:["community","classroom","factory","garden"],ans:0},
 {q:"We should keep our ___ clean and safe.",opts:["streets","shoes","books","phones"],ans:0}
];
/* ===== أصوات اللعبة (WebAudio — من غير ملفات خارجية) ===== */
const SFX=(()=>{
 let ac=null,noise=null;
 const ctxA=()=>{ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
   if(ac.state==="suspended")ac.resume(); return ac; };
 function nbuf(a,dur){
  if(noise&&noise.duration>=dur)return noise;
  const len=Math.ceil(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  noise=b;return b;
 }
 function tone(f1,f2,dur,type,vol){
  const a=ctxA();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f1,a.currentTime);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);
  g.gain.setValueAtTime(vol||.12,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.02);
 }
 function noiseHit(dur,f,q,vol,sweepTo){
  const a=ctxA();if(!a)return;
  const s=a.createBufferSource();s.buffer=nbuf(a,1.4);
  const bp=a.createBiquadFilter();bp.type="bandpass";bp.frequency.setValueAtTime(f,a.currentTime);
  if(sweepTo)bp.frequency.exponentialRampToValueAtTime(sweepTo,a.currentTime+dur);
  bp.Q.value=q||1;
  const g=a.createGain();g.gain.setValueAtTime(vol||.25,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  s.connect(bp);bp.connect(g);g.connect(a.destination);s.start();s.stop(a.currentTime+dur+.02);
 }
 return {
  unlock(){ctxA();},
  whoosh(){noiseHit(.35,400,1.2,.18,2200);},
  splash(){noiseHit(.3,900,.8,.3,220);tone(320,120,.18,"sine",.1);},
  pop(){tone(900,180,.12,"triangle",.18);noiseHit(.08,1800,1,.16);},
  thunk(){tone(160,60,.18,"triangle",.22);noiseHit(.12,700,1.4,.18);},
  launch(){tone(180,760,.25,"sawtooth",.1);noiseHit(.3,600,1,.14,2400);},
  boom(){noiseHit(.45,300,.7,.32,90);tone(120,40,.35,"triangle",.18);},
  ding(){tone(880,1320,.16,"sine",.15);setTimeout(()=>tone(1320,1760,.2,"sine",.12),90);},
  wrong(){tone(240,90,.3,"square",.14);},
  /* تصفيق: نبضات ضوضاء عشوائية زي الأيادي */
  clap(){
   const a=ctxA();if(!a)return;
   const t0=a.currentTime;
   for(let i=0;i<26;i++){
    const t=t0+i*0.045+Math.random()*0.03;
    const s=a.createBufferSource();s.buffer=nbuf(a,1.4);
    const bp=a.createBiquadFilter();bp.type="bandpass";
    bp.frequency.value=1100+Math.random()*1800;bp.Q.value=.9;
    const g=a.createGain();
    const v=.10+Math.random()*.09;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);
    g.gain.exponentialRampToValueAtTime(.001,t+.09);
    s.connect(bp);bp.connect(g);g.connect(a.destination);
    s.start(t);s.stop(t+.12);
   }
   // هتاف خفيف
   const o=a.createOscillator(),g2=a.createGain(),f=a.createBiquadFilter();
   f.type="lowpass";f.frequency.value=900;o.type="sawtooth";o.frequency.setValueAtTime(300,t0);
   o.frequency.linearRampToValueAtTime(420,t0+.5);
   g2.gain.setValueAtTime(.0001,t0);g2.gain.linearRampToValueAtTime(.05,t0+.15);
   g2.gain.exponentialRampToValueAtTime(.0006,t0+1.1);
   o.connect(f);f.connect(g2);g2.connect(a.destination);o.start(t0);o.stop(t0+1.2);
  }
 };
})();

const $=i=>document.getElementById(i);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const cv=$("stage"),ctx=cv.getContext("2d");
const G={W:0,H:0,qi:0,lives:3,score:0,combo:0,right:0,bal:[],parts:[],busy:false,t:0,last:0,raf:null,
 msg:"",msgT:0,wind:0};
const COLORS=["#FF6B6B","#FFC145","#5BE39B","#41C9F5","#C084FC","#FB7185"];

function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
 cv.width=r.width*dpr;cv.height=r.height*dpr;G.W=r.width;G.H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener("resize",resize);
function beep(ok){ if(ok){SFX.ding();SFX.clap();} else SFX.wrong(); }
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;
 speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function msg(t){G.msg=t;G.msgT=1.6;}
function start(){SFX.unlock();$("home").hidden=true;$("play").hidden=false;
 requestAnimationFrame(()=>{resize();newQ();G.last=performance.now();G.raf=requestAnimationFrame(loop)});}
function hud(){$("lives").textContent="❤".repeat(Math.max(0,G.lives))+"🖤".repeat(3-Math.max(0,G.lives));
 $("score").textContent=G.score;$("combo").textContent=G.combo>1?"x"+Math.min(5,G.combo):"";}

function newQ(){
 if(G.qi>=QS.length)return over(true);
 const q=QS[G.qi];
 $("q").textContent=q.q;$("qsub").textContent="دوس على البالونة اللي فيها الإجابة الصح";
 ctx.font="700 14px system-ui,Arial";
 const opts=shuffle(q.opts.map((o,i)=>({t:o,ok:i===q.ans})));
 const slot=G.W/opts.length;
 G.wind=(Math.random()-.5)*14;
 G.bal=opts.map((o,i)=>{
  const rw=Math.max(34,ctx.measureText(o.t).width/2+16);
  return {text:o.t,ok:o.ok,rx:rw,ry:rw*1.16,
   x:slot*i+slot/2,y:G.H+40+Math.random()*120+i*30,
   vx:0,vy:-(16+Math.random()*6+G.qi*0.7), // طلوع بطيء
   ph:Math.random()*6.3,sw:.6+Math.random()*.5,color:COLORS[i%COLORS.length],dead:false};
 });
 G.busy=false;hud();
}
function tap(e){
 if(G.busy)return;e.preventDefault();
 const r=cv.getBoundingClientRect(),p=e.touches?e.changedTouches[0]:e;
 const x=p.clientX-r.left,y=p.clientY-r.top;
 for(const b of G.bal){
  if(b.dead)continue;
  const dx=(x-b.x)/b.rx,dy=(y-b.y)/b.ry;
  if(dx*dx+dy*dy<=1.15){pop(b);return;}
 }
}
cv.addEventListener("mousedown",tap);cv.addEventListener("touchstart",tap,{passive:false});

function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.3,s=60+Math.random()*260;
 G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.5,color:c})}}
function pop(b){
 const q=QS[G.qi];
 b.dead=true;
 if(b.ok){
  burst(b.x,b.y,b.color,26);SFX.pop();beep(true);say(b.text);
  G.combo++;const p=10*Math.min(5,G.combo);G.score+=p;G.right++;msg("صح! +"+p);hud();
  G.busy=true;G.qi++;setTimeout(newQ,850);
 }else{
  burst(b.x,b.y,"#FF5D6C",14);beep(false);G.combo=0;G.lives--;hud();
  msg("مش دي — الصح: "+q.opts[q.ans]);
  if(G.lives<=0){G.busy=true;setTimeout(()=>over(false),900);}
 }
}
function loop(t){const dt=Math.min(.033,(t-G.last)/1000);G.last=t;G.t+=dt;step(dt);draw();G.raf=requestAnimationFrame(loop);}
function step(dt){
 if(G.msgT>0)G.msgT-=dt;else G.msg="";
 G.bal.forEach(b=>{
  if(b.dead)return;
  // طفو + تمايل مع الهوا
  b.vy+=(-(18+G.qi*.8)-b.vy)*1.2*dt;
  const sway=Math.sin(G.t*b.sw+b.ph)*22+G.wind;
  b.vx+=(sway-b.vx)*1.6*dt;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<b.rx){b.x=b.rx;b.vx*=-.6}
  if(b.x>G.W-b.rx){b.x=G.W-b.rx;b.vx*=-.6}
  if(b.y+b.ry<-10){ // هربت
   b.dead=true;
   if(b.ok&&!G.busy){
    G.lives--;G.combo=0;hud();msg("البالونة الصح هربت! 😢");
    if(G.lives<=0){G.busy=true;setTimeout(()=>over(false),800);}
    else {G.busy=true;G.qi++;setTimeout(newQ,1200);}
   }
  }
 });
 G.parts.forEach(p=>{p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
 G.parts=G.parts.filter(p=>p.life>0);
}
function draw(){
 ctx.clearRect(0,0,G.W,G.H);
 // سحاب
 ctx.fillStyle="rgba(255,255,255,.12)";
 for(let i=0;i<4;i++){const cx=(i*137+G.t*8)%(G.W+160)-80,cy=40+i*62;
  ctx.beginPath();ctx.ellipse(cx,cy,52,18,0,0,6.3);ctx.fill();}
 ctx.textAlign="center";ctx.textBaseline="middle";
 G.bal.forEach(b=>{
  if(b.dead)return;
  const tilt=Math.max(-.25,Math.min(.25,b.vx/120));
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(tilt);
  // خيط
  ctx.strokeStyle="rgba(255,255,255,.6)";ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,b.ry);
  ctx.quadraticCurveTo(Math.sin(G.t*2+b.ph)*10,b.ry+18,Math.sin(G.t*2+b.ph)*4,b.ry+34);ctx.stroke();
  // جسم
  const g=ctx.createRadialGradient(-b.rx*.35,-b.ry*.4,3,0,0,b.rx*1.4);
  g.addColorStop(0,"rgba(255,255,255,.85)");g.addColorStop(.35,b.color);g.addColorStop(1,"rgba(0,0,0,.35)");
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,b.rx,b.ry,0,0,6.3);ctx.fill();
  // عقدة
  ctx.fillStyle=b.color;ctx.beginPath();ctx.moveTo(-5,b.ry);ctx.lineTo(5,b.ry);ctx.lineTo(0,b.ry+8);ctx.closePath();ctx.fill();
  ctx.fillStyle="#10202E";ctx.font="700 14px system-ui,Arial";ctx.fillText(b.text,0,0);
  ctx.restore();
 });
 G.parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)});
 ctx.globalAlpha=1;
 if(G.msg){ctx.fillStyle="#FFF";ctx.font="700 16px system-ui,Arial";ctx.fillText(G.msg,G.W/2,G.H-20);}
}
function over(done){
 if(G.raf)cancelAnimationFrame(G.raf);G.raf=null;
 $("play").hidden=true;$("over").hidden=false;
 const st=G.right>=QS.length?3:G.right>=7?2:G.right>=4?1:0;
 $("ic").textContent=done?(st===3?"🏆":"🎈"):"💥";
 $("tt").textContent=done?"خلصت المرحلة!":"القلوب خلصت";
 $("tx").innerHTML=`فرقعت صح: <b>${G.right}</b> من ${QS.length} — النقاط: <b>${G.score}</b><br>${"⭐".repeat(st)}${"☆".repeat(3-st)}`;
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G.raf){cancelAnimationFrame(G.raf);G.raf=null;}
 else if(!$("play").hidden&&!G.raf){G.last=performance.now();G.raf=requestAnimationFrame(loop);}});
</script>
</body>
</html>
