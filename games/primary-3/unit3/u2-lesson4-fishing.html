<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>الدرس الرابع — A Diary Entry — الوحدة الثانية (جيم ٤)</title>
<style>
:root{--ink:#EAF7FF;--deep:#04202E;--deep2:#0B3A50;--sun:#FFC145;--leaf:#5BE39B;--berry:#FF5D6C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);
 background:var(--deep);min-height:100vh;padding:10px;overflow:hidden}
.wrap{max-width:620px;margin:0 auto}
.card{background:rgba(234,247,255,.06);border:1px solid rgba(234,247,255,.15);border-radius:16px;padding:16px}
h1{font-size:1.25rem;color:var(--sun);line-height:1.4}h2{font-size:1.1rem;color:var(--sun)}
p.lead{line-height:1.9;font-size:.95rem;margin-top:8px}
.btn{font-size:1.05rem;font-weight:700;font-family:inherit;background:var(--sun);color:#37280a;border:0;
 border-radius:12px;padding:13px 20px;cursor:pointer;box-shadow:0 4px 0 #c79400;width:100%;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c79400}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid rgba(234,247,255,.3);box-shadow:none}
.hud{display:flex;justify-content:space-between;align-items:center;background:var(--deep2);
 border:1px solid rgba(234,247,255,.18);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.88rem}
.qbox{background:var(--deep2);border:1px solid rgba(234,247,255,.18);border-radius:12px;padding:10px;
 text-align:center;margin-top:8px;min-height:60px;display:flex;flex-direction:column;justify-content:center}
.q{font-size:1.05rem;font-weight:700;direction:ltr;line-height:1.5}
.qsub{font-size:.78rem;opacity:.8;margin-top:3px}
#stage{width:100%;height:60vh;min-height:340px;margin-top:8px;border-radius:14px;display:block;touch-action:none;
 background:linear-gradient(180deg,#7EC8E3 0 9%,#0E5C7F 9%,#04314A 70%,#021D2C);border:1px solid rgba(234,247,255,.15)}
section{margin-top:12px}
.trophy{font-size:4rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<section id="home"><div class="card">
  <h1>🎣 صياد السمك</h1>
  <p class="lead">الوحدة التانية — كتابة اليوميات + أصوات /f/ و /v/ + السوابق (dis- / il- / ir-).<br>دوس على السمكة اللي عليها الإجابة الصح والسنارة هتروح لها وتصطادها.</p>
  <button class="btn" onclick="start()">ابدأ الصيد</button>
</div></section>

<section id="play" hidden>
  <div class="hud"><span id="lives">❤❤❤</span>
    <span style="font-size:.72rem;opacity:.85">Unit 2 · Lessons 4-5 — A Diary Entry</span>
    <span>⭐ <span id="score">0</span> <span id="combo" style="color:var(--sun)"></span></span></div>
  <div class="qbox"><div class="q" id="q"></div><div class="qsub" id="qsub"></div></div>
  <canvas id="stage"></canvas>
  <button class="btn ghost" onclick="location.reload()">من الأول</button>
</section>

<section id="over" hidden><div class="card" style="text-align:center">
  <div class="trophy" id="ic">🐟</div><h2 id="tt"></h2><p class="lead" id="tx"></p>
  <button class="btn" onclick="location.reload()">العب تاني</button>
</div></section>
</div>

<script>
const QS=[
 {q:"A book where you write about your day is a ___ .",opts:["diary","dictionary","novel","poster"],ans:0},
 {q:"The area where you live with your neighbors is your ___ .",opts:["neighborhood","country","factory","museum"],ans:0},
 {q:"Trains stop at the ___ .",opts:["train station","bus","market","park"],ans:0},
 {q:"The story of the past is called ___ .",opts:["history","future","science","music"],ans:0},
 {q:"Which word has the /v/ sound?",opts:["van","fish","phone","four"],ans:0},
 {q:"Which word has the /f/ sound?",opts:["van","fish","very","seven"],ans:1},
 {q:"The opposite of 'like' is ___ .",opts:["dislike","unlike","illike","irlike"],ans:0},
 {q:"The opposite of 'legal' is ___ .",opts:["dislegal","unlegal","illegal","irlegal"],ans:2},
 {q:"The opposite of 'regular' is ___ .",opts:["disregular","irregular","illregular","unregular"],ans:1},
 {q:"In the old market there were ___ stalls selling fresh food.",opts:["wooden","plastic","glass","paper"],ans:0}
];
/* ===== أصوات اللعبة (WebAudio — من غير ملفات خارجية) ===== */
const SFX=(()=>{
 let ac=null,noise=null;
 const ctxA=()=>{ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
   if(ac.state==="suspended")ac.resume(); return ac; };
 function nbuf(a,dur){
  if(noise&&noise.duration>=dur)return noise;
  const len=Math.ceil(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  noise=b;return b;
 }
 function tone(f1,f2,dur,type,vol){
  const a=ctxA();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f1,a.currentTime);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);
  g.gain.setValueAtTime(vol||.12,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.02);
 }
 function noiseHit(dur,f,q,vol,sweepTo){
  const a=ctxA();if(!a)return;
  const s=a.createBufferSource();s.buffer=nbuf(a,1.4);
  const bp=a.createBiquadFilter();bp.type="bandpass";bp.frequency.setValueAtTime(f,a.currentTime);
  if(sweepTo)bp.frequency.exponentialRampToValueAtTime(sweepTo,a.currentTime+dur);
  bp.Q.value=q||1;
  const g=a.createGain();g.gain.setValueAtTime(vol||.25,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  s.connect(bp);bp.connect(g);g.connect(a.destination);s.start();s.stop(a.currentTime+dur+.02);
 }
 return {
  unlock(){ctxA();},
  whoosh(){noiseHit(.35,400,1.2,.18,2200);},
  splash(){noiseHit(.3,900,.8,.3,220);tone(320,120,.18,"sine",.1);},
  pop(){tone(900,180,.12,"triangle",.18);noiseHit(.08,1800,1,.16);},
  thunk(){tone(160,60,.18,"triangle",.22);noiseHit(.12,700,1.4,.18);},
  launch(){tone(180,760,.25,"sawtooth",.1);noiseHit(.3,600,1,.14,2400);},
  boom(){noiseHit(.45,300,.7,.32,90);tone(120,40,.35,"triangle",.18);},
  ding(){tone(880,1320,.16,"sine",.15);setTimeout(()=>tone(1320,1760,.2,"sine",.12),90);},
  wrong(){tone(240,90,.3,"square",.14);},
  /* تصفيق: نبضات ضوضاء عشوائية زي الأيادي */
  clap(){
   const a=ctxA();if(!a)return;
   const t0=a.currentTime;
   for(let i=0;i<26;i++){
    const t=t0+i*0.045+Math.random()*0.03;
    const s=a.createBufferSource();s.buffer=nbuf(a,1.4);
    const bp=a.createBiquadFilter();bp.type="bandpass";
    bp.frequency.value=1100+Math.random()*1800;bp.Q.value=.9;
    const g=a.createGain();
    const v=.10+Math.random()*.09;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);
    g.gain.exponentialRampToValueAtTime(.001,t+.09);
    s.connect(bp);bp.connect(g);g.connect(a.destination);
    s.start(t);s.stop(t+.12);
   }
   // هتاف خفيف
   const o=a.createOscillator(),g2=a.createGain(),f=a.createBiquadFilter();
   f.type="lowpass";f.frequency.value=900;o.type="sawtooth";o.frequency.setValueAtTime(300,t0);
   o.frequency.linearRampToValueAtTime(420,t0+.5);
   g2.gain.setValueAtTime(.0001,t0);g2.gain.linearRampToValueAtTime(.05,t0+.15);
   g2.gain.exponentialRampToValueAtTime(.0006,t0+1.1);
   o.connect(f);f.connect(g2);g2.connect(a.destination);o.start(t0);o.stop(t0+1.2);
  }
 };
})();

const $=i=>document.getElementById(i);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const cv=$("stage"),ctx=cv.getContext("2d");
const G={target:null,W:0,H:0,qi:0,lives:3,score:0,combo:0,right:0,fish:[],bub:[],parts:[],
  hook:null,boat:{x:0,y:26},state:"idle",px:null,busy:false,t:0,last:0,raf:null,msg:"",msgT:0};
const SEA=0.09; // نسبة سطح المية

function resize(){const r=cv.getBoundingClientRect();
  const dpr=Math.min(2,devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;
  G.W=r.width;G.H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);G.boat.x=G.W/2;G.boat.y=G.H*SEA-8;}
addEventListener("resize",resize);
function beep(ok){ if(ok){SFX.ding();SFX.clap();} else SFX.wrong(); }
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;
 speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function msg(t){G.msg=t;G.msgT=1.6;}

function start(){SFX.unlock();$("home").hidden=true;$("play").hidden=false;
  requestAnimationFrame(()=>{resize();newQ();G.last=performance.now();G.raf=requestAnimationFrame(loop);});}
function hud(){$("lives").textContent="❤".repeat(Math.max(0,G.lives))+"🖤".repeat(3-Math.max(0,G.lives));
 $("score").textContent=G.score;$("combo").textContent=G.combo>1?"x"+Math.min(5,G.combo):"";}
function newQ(){
  if(G.qi>=QS.length)return over(true);
  const q=QS[G.qi];
  $("q").textContent=q.q;$("qsub").textContent="دوس على السمكة اللي عليها الإجابة الصح والسنارة هتروح لها";
  ctx.font="700 14px system-ui,Arial";
  const opts=shuffle(q.opts.map((o,i)=>({t:o,ok:i===q.ans})));
  const top=G.H*SEA+50, gap=(G.H-top-40)/opts.length;
  G.fish=opts.map((o,i)=>{
    const w=ctx.measureText(o.t).width+34;
    const dir=Math.random()<.5?-1:1;
    return {text:o.t,ok:o.ok,w,h:26,dir,
      x:dir>0?-w-Math.random()*120:G.W+Math.random()*120,
      baseY:top+gap*i+gap*.4,y:0,sp:26+Math.random()*22+i*4,ph:Math.random()*6.3,hooked:false,gone:false};
  });
  G.fish.forEach(f=>f.y=f.baseY);
  G.hook=null;G.state="idle";G.busy=false;hud();
}

/* مسار مضمون: منحنى من نقطة الانطلاق للهدف اللي الطالب دوس عليه */
function bez(p0,p1,p2,t){const u=1-t;return u*u*p0+2*u*t*p1+t*t*p2;}
function nearest(list,p){
 let best=null,bd=1e9;
 for(const o of list){ if(o.dead||o.gone)continue;
  const cx=o.x+o.w/2, cy=o.y+(o.h||26)/2, d=Math.hypot(p.x-cx,p.y-cy);
  if(d<bd){bd=d;best=o;} }
 return bd<130?best:null;
}
/* التحكم: دوس على السمكة والسنارة تروح لوحدها */
function pt(e){const r=cv.getBoundingClientRect();const p=e.touches?e.changedTouches[0]:e;
  return {x:p.clientX-r.left,y:p.clientY-r.top};}
function down(e){
  e.preventDefault();
  if(G.busy||G.hook)return;
  const p=pt(e);
  const pick=nearest(G.fish,p);
  if(!pick){msg("دوس على السمكة اللي عليها الإجابة");return;}
  G.target=pick;
  G.hook={x:G.boat.x,y:G.boat.y+10,fx:G.boat.x,fy:G.boat.y+10,
    cx:(G.boat.x+pick.x+pick.w/2)/2, cy:(G.boat.y+pick.y)/2+40, t:0, dur:.95};
  G.state="down";
  SFX.whoosh();
}
cv.addEventListener("mousedown",down);
cv.addEventListener("touchstart",down,{passive:false});

function loop(t){const dt=Math.min(.033,(t-G.last)/1000);G.last=t;G.t+=dt;step(dt);draw();G.raf=requestAnimationFrame(loop);}
function step(dt){
  if(G.msgT>0)G.msgT-=dt; else G.msg="";
  // السمك بيعوم
  G.fish.forEach(f=>{
    if(f.hooked||f.gone)return;
    const chased=(f===G.target&&G.hook);
    f.x+=f.dir*f.sp*(chased?.35:1)*dt;
    f.y=f.baseY+Math.sin(G.t*1.8+f.ph)*7;
    if(chased){ // متهربش من الشاشة وهي مستهدفة
      if(f.x<6){f.x=6;f.dir=1;}
      if(f.x+f.w>G.W-6){f.x=G.W-6-f.w;f.dir=-1;}
      return;
    }
    if(f.dir>0&&f.x>G.W+40){f.x=-f.w-30;}
    if(f.dir<0&&f.x<-f.w-40){f.x=G.W+30;}
  });
  // فقاعات
  if(Math.random()<.06)G.bub.push({x:Math.random()*G.W,y:G.H,r:1+Math.random()*3,v:18+Math.random()*26});
  G.bub.forEach(b=>b.y-=b.v*dt);G.bub=G.bub.filter(b=>b.y>G.H*SEA);
  G.parts.forEach(p=>{p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
  G.parts=G.parts.filter(p=>p.life>0);

  const h=G.hook;if(!h)return;
  const tf=G.target;
  if(G.state==="down"&&tf){
    h.t+=dt/h.dur;
    const t=Math.min(1,h.t);
    const tx=tf.x+tf.w/2, ty=tf.y+tf.h/2;
    h.x=bez(h.fx,h.cx,tx,t);
    h.y=bez(h.fy,h.cy,ty,t);
    if(t>=1){
      tf.hooked=true;G.state="up";h.t=0;h.dur=.75;
      h.fx=h.x;h.fy=h.y;h.cx=(h.x+G.boat.x)/2;h.cy=(h.y+G.boat.y)/2;
      SFX.splash();
      for(let i=0;i<12;i++)G.bub.push({x:h.x,y:h.y,r:2,v:40+Math.random()*40});
    }
  } else if(G.state==="up"){
    h.t+=dt/h.dur;
    const t=Math.min(1,h.t);
    h.x=bez(h.fx,h.cx,G.boat.x,t);
    h.y=bez(h.fy,h.cy,G.boat.y+10,t);
  }
  // السمكة المصطادة تتبع السنارة
  const cf=G.fish.find(f=>f.hooked);
  if(cf){cf.x=h.x-cf.w/2;cf.y=h.y+6;}
  // وصلت للمركب
  if(G.state==="up"&&h.t>=1){
    G.hook=null;G.state="idle";
    if(cf)land(cf);
  }
}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.3,s=60+Math.random()*220;
  G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.6+Math.random()*.4,color:c})}}
function land(f){
  const q=QS[G.qi];
  if(f.ok){
    G.combo++;const p=10*Math.min(5,G.combo);G.score+=p;G.right++;
    burst(G.boat.x,G.boat.y,"#5BE39B",22);say(f.text);msg("صح! +"+p);hud();
    G.busy=true;G.qi++;setTimeout(newQ,900);
  }else{
    G.lives--;G.combo=0;beep(false);burst(G.boat.x,G.boat.y,"#FF5D6C",14);
    msg("مش دي — الصح: "+q.opts[q.ans]);hud();
    f.hooked=false;f.gone=true;
    if(G.lives<=0){G.busy=true;setTimeout(()=>over(false),900);}
  }
}
function draw(){
  ctx.clearRect(0,0,G.W,G.H);
  const sea=G.H*SEA;
  // موج
  ctx.fillStyle="rgba(255,255,255,.18)";
  ctx.beginPath();ctx.moveTo(0,sea);
  for(let x=0;x<=G.W;x+=8)ctx.lineTo(x,sea+Math.sin(x/28+G.t*2)*3);
  ctx.lineTo(G.W,sea+8);ctx.lineTo(0,sea+8);ctx.fill();
  // فقاعات
  ctx.strokeStyle="rgba(255,255,255,.25)";
  G.bub.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.3);ctx.stroke();});
  // مركب
  const b=G.boat;
  ctx.fillStyle="#8B5E34";ctx.beginPath();ctx.moveTo(b.x-32,b.y);ctx.lineTo(b.x+32,b.y);
  ctx.lineTo(b.x+22,b.y+14);ctx.lineTo(b.x-22,b.y+14);ctx.closePath();ctx.fill();
  ctx.fillStyle="#FFC145";ctx.beginPath();ctx.moveTo(b.x,b.y-30);ctx.lineTo(b.x+20,b.y-4);ctx.lineTo(b.x,b.y-4);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#EAF7FF";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y-32);ctx.lineTo(b.x,b.y);ctx.stroke();
  // سمك
  G.fish.forEach(f=>{
    if(f.gone&&!f.hooked)return;
    ctx.save();
    const cx=f.x+f.w/2,cy=f.y+f.h/2;
    ctx.translate(cx,cy);if(f.dir<0)ctx.scale(-1,1);
    ctx.fillStyle=f.hooked?"#FFD98A":"#41C9F5";
    ctx.beginPath();ctx.ellipse(0,0,f.w/2,f.h/2,0,0,6.3);ctx.fill();
    ctx.beginPath();ctx.moveTo(-f.w/2,0);ctx.lineTo(-f.w/2-12,-9);ctx.lineTo(-f.w/2-12,9);ctx.closePath();ctx.fill();
    ctx.fillStyle="#06222E";ctx.beginPath();ctx.arc(f.w/2-9,-4,2.6,0,6.3);ctx.fill();
    ctx.restore();
    ctx.fillStyle="#06222E";ctx.font="700 14px system-ui,Arial";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(f.text,cx,cy+1);
  });
  // خيط + سنارة
  const h=G.hook;
  if(h){
    ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(b.x,b.y);
    ctx.quadraticCurveTo((b.x+h.x)/2+ (h.x-b.x)*.15,(b.y+h.y)/2,h.x,h.y);ctx.stroke();
    ctx.strokeStyle="#EAF7FF";ctx.lineWidth=2.4;
    ctx.beginPath();ctx.arc(h.x,h.y+4,5,.6,4.4);ctx.stroke();
  }
  G.parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)});
  ctx.globalAlpha=1;
  if(G.msg){ctx.fillStyle="#FFC145";ctx.font="700 16px system-ui,Arial";ctx.textAlign="center";
    ctx.fillText(G.msg,G.W/2,sea+26);}
}
function over(done){
  if(G.raf)cancelAnimationFrame(G.raf);G.raf=null;
  $("play").hidden=true;$("over").hidden=false;
  const st=G.right>=QS.length?3:G.right>=7?2:G.right>=4?1:0;
  $("ic").textContent=done?(st===3?"🏆":"🎣"):"💥";
  $("tt").textContent=done?"خلصت الصيد!":"القلوب خلصت";
  $("tx").innerHTML=`صيد صح: <b>${G.right}</b> من ${QS.length} — النقاط: <b>${G.score}</b><br>${"⭐".repeat(st)}${"☆".repeat(3-st)}`;
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G.raf){cancelAnimationFrame(G.raf);G.raf=null;}
  else if(!$("play").hidden&&!G.raf){G.last=performance.now();G.raf=requestAnimationFrame(loop);}});
</script>
</body>
</html>
