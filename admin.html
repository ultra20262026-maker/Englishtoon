<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Toon - لوحة الإدارة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a',
                        secondary: '#1e293b',
                        accent: '#38bdf8',
                        gold: '#d4af37',
                    },
                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .nav-link.active {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(37, 99, 235, 0.2));
            border-right: 4px solid #38bdf8;
            color: #38bdf8;
        }

        .section {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- Sidebar / Bottom Bar -->

        <div class="p-6 hidden md:flex items-center gap-3 border-b border-white/10">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-shield-halved text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">الإدارة</h1>
        </div>
        
        <div class="flex md:flex-col overflow-x-auto md:overflow-visible w-full py-2 md:py-6 gap-1 md:gap-2 px-2 md:px-4">
            <button onclick="switchTab('single-add', this)" class="nav-link active flex-shrink-0 flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-all font-semibold text-sm md:text-base">
                <i class="fa-solid fa-user-plus w-5 text-center"></i> إضافة طالب
            </button>
            <button onclick="switchTab('bulk-add', this)" class="nav-link flex-shrink-0 flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-all font-semibold text-sm md:text-base">
                <i class="fa-solid fa-users-viewfinder w-5 text-center"></i> توليد مجمع
            </button>
            <button onclick="switchTab('manage-users', this)" class="nav-link flex-shrink-0 flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-all font-semibold text-sm md:text-base">

        <div class="mt-auto p-4 hidden md:block">

    <!-- Main Content -->

        <!-- SECTION 1: Single Add -->
        <div id="single-add" class="section active">

                                <option value="primary-6">الصف السادس الابتدائي</option>

                                <option value="prep-2">الصف الثاني الإعدادي</option>

                            <label class="text-sm font-bold text-slate-300">الحد الأقصى للأجهزة المسموح بها</label>

                            </div>

                    <button type="submit" class="w-full py-4 rounded-xl font-bold text-lg text-white bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 shadow-lg shadow-cyan-500/25 transition-all transform hover:-translate-y-1">

        <!-- SECTION 2: Bulk Add -->

                <h2 class="text-2xl font-black mb-2 text-white flex items-center gap-3">
                    <div class="bg-purple-500/20 p-2 rounded-lg text-purple-400"><i class="fa-solid fa-bolt"></i></div>

                            <input type="number" id="bulk-count" required min="1" max="500" placeholder="مثال: 50" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition-all">
                        </div>
                        <div class="space-y-2">

                            <input type="number" id="bulk-max-devices" min="1" max="30" value="1" required class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-bold text-slate-300">اختيار الصف للمجموعة</label>
                            <select id="bulk-grade-select" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition-all [&>option]:bg-slate-800">
                                <option value="all">كل الصفوف (صلاحية كاملة)</option>
                                <option value="primary-1">الصف الأول الابتدائي</option>
                                <option value="primary-2">الصف الثاني الابتدائي</option>
                                <option value="primary-3">الصف الثالث الابتدائي</option>
                                <option value="primary-4">الصف الرابع الابتدائي</option>
                                <option value="primary-5">الصف الخامس الابتدائي</option>
                                <option value="primary-6">الصف السادس الابتدائي</option>
                                <option value="prep-1">الصف الأول الإعدادي</option>
                                <option value="prep-2">الصف الثاني الإعدادي</option>
                                <option value="prep-3">الصف الثالث الإعدادي</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4 cursor-pointer hover:bg-amber-500/20 transition-all" onclick="document.getElementById('bulk-trial-checkbox').click()">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="bulk-trial-checkbox" class="w-5 h-5 rounded text-amber-500 focus:ring-amber-500 bg-slate-800 border-slate-600">
                            <div>
                                <span class="font-bold text-amber-400">توليد مجموعة حسابات تجريبية مؤقتة ⏱️</span>
                                <p class="text-xs text-amber-200/60 mt-1">صالحة لمدة 24 ساعة فقط لكل حساب بعد تسجيل الدخول الأول.</p>
                            </div>
                        </label>
                    </div>

                    <button type="submit" class="w-full py-4 rounded-xl font-bold text-lg text-white bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 shadow-lg shadow-purple-500/25 transition-all transform hover:-translate-y-1">
                        <i class="fa-solid fa-file-arrow-down mr-2"></i> توليد الحسابات وتنزيل الملف
                    </button>
                </form>
            </div>
        </div>

        <!-- SECTION 3: Manage Users -->
        <div id="manage-users" class="section">
            <div class="glass-card rounded-2xl p-6 md:p-8">
                
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-6 border-b border-white/10">
                    <h2 class="text-2xl font-black text-white flex items-center gap-3">
                        <div class="bg-emerald-500/20 p-2 rounded-lg text-emerald-400"><i class="fa-solid fa-address-book"></i></div>
                        سجل الطلاب
                    </h2>
                    
                    <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                        <div class="relative w-full md:w-64">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                                <i class="fa-solid fa-search"></i>
                            </div>
                            <input type="text" id="user-search" onkeyup="filterTable()" placeholder="ابحث عن اسم، باسوورد، صف..." class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-2 pr-10 pl-4 text-white text-sm focus:outline-none focus:border-emerald-500 transition-all">
                        </div>
                        <button onclick="resetAllUsersDevices()" class="flex-1 md:flex-none px-4 py-2 rounded-xl text-sm font-bold bg-amber-500/10 text-amber-500 border border-amber-500/20 hover:bg-amber-500 hover:text-white transition-all">
                            <i class="fa-solid fa-unlock-keyhole mr-1"></i> تصفير الكل
                        </button>
                        <button onclick="loadUsers()" class="flex-1 md:flex-none px-4 py-2 rounded-xl text-sm font-bold bg-slate-700 text-white hover:bg-slate-600 transition-all">
                            <i class="fa-solid fa-rotate-right mr-1"></i> تحديث
                        </button>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-slate-900/50 text-slate-300 text-sm border-b border-slate-700">
                                <th class="p-4 font-bold whitespace-nowrap rounded-tr-xl">اسم المستخدم</th>
                                <th class="p-4 font-bold whitespace-nowrap">كلمة المرور</th>
                                <th class="p-4 font-bold whitespace-nowrap">صلاحية الدخول</th>
                                <th class="p-4 font-bold whitespace-nowrap">الحد الأقصى</th>
                                <th class="p-4 font-bold whitespace-nowrap">حالة الاستخدام</th>
                                <th class="p-4 font-bold whitespace-nowrap">نوع الحساب</th>

                            </tr>
                        </thead>

    </main>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="js/data.js"></script>
    <script src="js/auth.js?v=20260815_V900"></script>
    <script>
        // Check Authentication - Strictly Admin Only
        checkAuth();
        const loggedUser = (localStorage.getItem('currentUser') || '').trim().toLowerCase();
        const isAdminUserPage = (loggedUser === 'admin' || loggedUser === '01208609509' || loggedUser === 'mm01208609509');
        if (!isAdminUserPage) {
            alert('عذراً، هذه الصفحة مخصصة للأدمن فقط. يرجى تسجيل الدخول بحساب الإدارة.');
            window.location.href = 'index.html';
        }

        // Tab Switching Logic
        function switchTab(tabId, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');

            if(tabId === 'manage-users') loadUsers();
        }

        // Display Alerts
        function showAlert(elementId, isSuccess, message) {
            const el = document.getElementById(elementId);
            el.innerHTML = message;
            el.className = `p-4 rounded-xl mb-6 font-bold text-center ${isSuccess ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        // --- SINGLE USER ADDITION ---
        document.getElementById('create-user-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const user = document.getElementById('new-username').value.trim();
            const pass = document.getElementById('new-password').value.trim();
            const maxDevices = parseInt(document.getElementById('max-devices').value, 10) || 1;
            const isTrial = document.getElementById('trial-user-checkbox').checked;
            const gradeSelect = document.getElementById('grade-select').value;
            
            const btn = document.querySelector('#create-user-form button');
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> جاري الإضافة...';
            btn.disabled = true;

            try {
                const userData = {
                    password: pass,
                    used: false,
                    maxDevices: maxDevices,
                    isMultiUser: maxDevices > 1, // Legacy fallback
                    isTrial: isTrial,
                    allowedGrade: gradeSelect,
                    allowedUnits: 'all',
                    deviceIds: []
                };

                await db.collection("codes").doc(user).set(userData);

                showAlert('single-alert', true, '<i class="fa-solid fa-circle-check ml-2"></i> تم حفظ بيانات الطالب بنجاح!');
                
                document.getElementById('new-username').value = '';
                document.getElementById('new-password').value = '';
                document.getElementById('max-devices').value = '1';
                document.getElementById('trial-user-checkbox').checked = false;
                
            } catch (error) {
                showAlert('single-alert', false, '<i class="fa-solid fa-circle-exclamation ml-2"></i> خطأ: تأكد من صلاحيات Firebase (Rules). Error: ' + error.message);
            }

            btn.innerHTML = originalBtnHtml;
            btn.disabled = false;
        });

        // --- BULK USER GENERATION ---
        document.getElementById('bulk-user-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const count = parseInt(document.getElementById('bulk-count').value, 10);
            const maxDevices = parseInt(document.getElementById('bulk-max-devices').value, 10) || 1;
            const gradeSelect = document.getElementById('bulk-grade-select').value;
            const isTrial = document.getElementById('bulk-trial-checkbox').checked;
            
            const btn = document.querySelector('#bulk-user-form button');
            const alertBox = document.getElementById('bulk-alert');
            
            if (!count || count < 1 || count > 500) {
                alert('يرجى إدخال عدد صحيح بين 1 و 500');
                return;
            }

            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> جاري التوليد...';
            btn.disabled = true;

            try {
                const batch = db.batch();
                
                let txtContent = "\uFEFFبسم الله الرحمن الرحيم\nقائمة الحسابات المجمعة لطلاب مدرسة إنجلش تون\n";
                if(isTrial) txtContent += "** ملاحظة: الحسابات تجريبية (24 ساعة من أول استخدام) **\n";
                txtContent += "=================================================\n\n";
                
                let prefix = isTrial ? 'trial_' : (gradeSelect === 'all' ? 'user_' : gradeSelect.substring(0,4) + '_');

                for (let i = 0; i < count; i++) {
                    const randomNum = Math.floor(1000 + Math.random() * 9000); 
                    const randomStr = Math.random().toString(36).substring(2, 4); 
                    const username = prefix + randomNum + randomStr; 
                    const password = Math.floor(1000 + Math.random() * 9000).toString(); 

                    const docRef = db.collection("codes").doc(username);
                    batch.set(docRef, {
                        password: password,
                        used: false,
                        maxDevices: maxDevices,
                        isMultiUser: maxDevices > 1,
                        isTrial: isTrial,
                        allowedGrade: gradeSelect,
                        allowedUnits: 'all',
                        deviceIds: []
                    });

                    txtContent += `اسم المستخدم: ${username}\n`;
                    txtContent += `الرقم السري:  ${password}\n`;
                    txtContent += `الأجهزة المسموحة: ${maxDevices}\n`;
                    if(isTrial) txtContent += `النوع: مؤقت تجريبي\n`;
                    txtContent += `------------------------\n`;
                }

                await batch.commit();

                showAlert('bulk-alert', true, `<i class="fa-solid fa-circle-check ml-2"></i> تم توليد وحفظ ${count} حساب بنجاح. جاري التنزيل!`);

                const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Students_${count}_${new Date().getTime()}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                document.getElementById('bulk-count').value = '';

            } catch (error) {
                showAlert('bulk-alert', false, '<i class="fa-solid fa-circle-exclamation ml-2"></i> فشل التوليد: ' + error.message);
            }

            btn.innerHTML = originalBtnHtml;
            btn.disabled = false;
        });

        // --- LOAD USERS TABLE ---
        window.allUsersRows = [];
        async function loadUsers() {
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>جاري جلب البيانات... تأكد من صلاحيات Firebase</td></tr>';
            
            try {
                const snapshot = await db.collection("codes").get();
                window.allUsersRows = [];
                
                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400">لا يوجد طلاب مسجلين بعد.</td></tr>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const username = doc.id;
                    
                    let devicesCount = (data.deviceIds && data.deviceIds.length) ? data.deviceIds.length : (data.deviceId ? 1 : 0);
                    let maxDev = data.maxDevices ? data.maxDevices : (data.isMultiUser ? 'غير محدود' : 1);
                    
                    const usedBadge = data.used 
                        ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded text-xs font-bold whitespace-nowrap"><i class="fa-solid fa-check mr-1"></i> مُفعل (${devicesCount})</span>` 
                        : `<span class="bg-slate-700 text-slate-300 px-2 py-1 rounded text-xs font-bold whitespace-nowrap">لم يُستخدم</span>`;
                    
                    let typeBadge = '';
                    if (data.isTrial || data.isTrial24h) {
                        typeBadge += '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-1 rounded text-xs font-bold whitespace-nowrap"><i class="fa-solid fa-clock mr-1"></i> تجريبي 24س</span>';
                    } else {
                        typeBadge += '<span class="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-1 rounded text-xs font-bold whitespace-nowrap">دائم</span>';
                    }

                    let gradeText = 'صلاحية كاملة';
                    if (data.allowedGrade && data.allowedGrade !== 'all') gradeText = data.allowedGrade;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-white/5 transition-colors group";
                    tr.innerHTML = `
                        <td class="p-4 font-bold text-white">${username}</td>
                        <td class="p-4 tracking-wider text-cyan-300 font-mono">${data.password}</td>
                        <td class="p-4 text-slate-400 text-xs">${gradeText}</td>
                        <td class="p-4 font-bold text-slate-300">${maxDev} جهاز</td>
                        <td class="p-4">${usedBadge}</td>
                        <td class="p-4">${typeBadge}</td>
                        <td class="p-4 text-center">
                            <div class="flex items-center justify-center gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="resetUser('${username}')" class="bg-amber-500/10 text-amber-500 hover:bg-amber-500 hover:text-white p-2 rounded-lg transition-colors" title="تصفير الأجهزة المربوطة لتسجيل دخول جديد">
                                    <i class="fa-solid fa-unlock-keyhole"></i>
                                </button>
                                <button onclick="deleteUser('${username}')" class="bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white p-2 rounded-lg transition-colors" title="حذف الطالب نهائياً">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    window.allUsersRows.push({ el: tr, searchStr: (username + " " + data.password + " " + gradeText).toLowerCase() });
                });

                renderUsers();

            } catch (error) {
                console.error("Error loading users:", error);
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-400">حدث خطأ في جلب البيانات من الخادم. تأكد من إعدادات الـ Rules في Firebase. (${error.message})</td></tr>`;
            }
        }

        function renderUsers() {
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = '';
            window.allUsersRows.forEach(row => tbody.appendChild(row.el));
            filterTable();
        }

        function filterTable() {
            const term = document.getElementById('user-search').value.toLowerCase();
            let visibleCount = 0;
            window.allUsersRows.forEach(row => {
                if (row.searchStr.includes(term)) {
                    row.el.style.display = '';
                    visibleCount++;
                } else {
                    row.el.style.display = 'none';
                }
            });
            
            const tbody = document.getElementById('users-tbody');
            if (visibleCount === 0 && window.allUsersRows.length > 0) {
                if (!document.getElementById('no-results-row')) {
                    const tr = document.createElement('tr');
                    tr.id = 'no-results-row';
                    tr.innerHTML = '<td colspan="7" class="p-8 text-center text-slate-500">لا يوجد نتائج تطابق بحثك.</td>';
                    tbody.appendChild(tr);
                }
            } else {
                const noRes = document.getElementById('no-results-row');
                if (noRes) noRes.remove();
            }
        }

        // Delete User
        window.deleteUser = async function(username) {
            if(confirm(`هل أنت متأكد أنك تريد حذف الطالب "${username}" بشكل نهائي؟ لا يمكن التراجع.`)) {
                try {
                    await db.collection("codes").doc(username).delete();
                    loadUsers();
                } catch (error) {
                    alert('حدث خطأ أثناء الحذف: ' + error.message);
                }
            }
        }

        // Reset Single User Device
        window.resetUser = async function(username) {
            if(confirm(`هل أنت متأكد أنك تريد تصفير الأجهزة للطالب "${username}"؟ سيتم مسح الأجهزة المربوطة حالياً وسيتمكن من الدخول بأجهزة جديدة.`)) {
                try {
                    await db.collection("codes").doc(username).update({
                        used: false,
                        deviceId: firebase.firestore.FieldValue.delete(),
                        deviceIds: []
                    });
                    loadUsers();
                } catch (error) {
                    alert('حدث خطأ: ' + error.message);
                }
            }
        }

        // Reset ALL Users Devices Global
        window.resetAllUsersDevices = async function() {
            if(confirm('تحذير! هل أنت متأكد من تصفير محاولات الأجهزة لجميع الطلاب المضافين؟ سيتمكن جميع الطلاب من الدخول مجدداً من أي أجهزة جديدة.')) {
                try {
                    const snapshot = await db.collection("codes").get();
                    const batch = db.batch();
                    snapshot.forEach(doc => {
                        batch.update(doc.ref, {
                            used: false,
                            deviceId: firebase.firestore.FieldValue.delete(),
                            deviceIds: []
                        });
                    });
                    await batch.commit();
                    alert('تم تصفير أجهزة جميع الطلاب بنجاح!');
                    loadUsers();
                } catch (error) {
                    alert('حدث خطأ أثناء تصفير الحسابات: ' + error.message);
                }
            }
        }

    </script>
</body>
</html>
