<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خريطة المراحل — EnglishToon</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #3b82f6;
      --accent: #f59e0b;
      --text: #f8fafc;
      --done: #22c55e;
      --locked: #64748b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
    }
    .hud {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .hud-stats { display: flex; gap: 15px; }
    .stat-item { display: flex; align-items: center; gap: 5px; font-weight: bold; font-size: 1.1rem; }
    .stat-item span { color: var(--accent); }
    
    .map-container {
      padding: 80px 20px 100px;
      max-width: 600px; margin: 0 auto;
      position: relative;
    }
    .map-header { text-align: center; margin-bottom: 40px; }
    .map-header h1 { margin: 0; font-size: 1.8rem; color: var(--accent); }
    .map-header p { margin: 5px 0 0; opacity: 0.7; }

    .unit-section { margin-bottom: 40px; position: relative; }
    .unit-title {
      background: var(--primary);
      color: white; padding: 8px 20px;
      border-radius: 20px; display: inline-block;
      margin-bottom: 20px; font-weight: bold;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .node-row {
      display: flex; align-items: center; gap: 20px;
      margin-bottom: 25px; position: relative;
    }
    .node-row::before {
      content: ''; position: absolute; left: 25px; top: 50px;
      width: 4px; height: 30px; background: rgba(255,255,255,0.1);
      z-index: -1;
    }
    .node-row:last-child::before { display: none; }

    .node {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--card-bg); border: 3px solid var(--locked);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer; transition: 0.3s;
      flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .node.done { border-color: var(--done); background: rgba(34, 197, 94, 0.2); }
    .node.next { border-color: var(--accent); background: rgba(245, 158, 11, 0.2); animation: pulse 2s infinite; }
    .node.locked { opacity: 0.6; cursor: not-allowed; }

    .info { flex-grow: 1; text-align: right; }
    .info .t { font-size: 0.9rem; opacity: 0.6; }
    .info .d { font-size: 1.1rem; font-weight: bold; margin-top: 2px; }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    .btn-back {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #5d3c00;
      padding: 12px 30px; border-radius: 25px;
      text-decoration: none; font-weight: bold;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      z-index: 100;
    }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 1000; visibility: hidden; opacity: 0;
      transition: 0.3s; backdrop-filter: blur(5px);
    }
    .modal.show { visibility: visible; opacity: 1; }
    .modal-content {
      background: #1e293b; padding: 30px; border-radius: 24px;
      max-width: 400px; width: 100%; text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-content h2 { margin-top: 0; color: var(--accent); }
    .modal-content button {
      background: var(--primary); color: white; border: none;
      padding: 10px 30px; border-radius: 12px; margin-top: 20px;
      font-size: 1.1rem; cursor: pointer;
    }

    .coming-soon-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 2000; display: none;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="hud-stats">
      <div class="stat-item">🔑 <span id="hud-keys">0</span></div>
      <div class="stat-item">⭐ <span id="hud-stars">0</span></div>
    </div>
    <div id="map-title" style="font-weight:bold; color:var(--accent)">تحميل...</div>
  </div>

  <div class="map-container" id="map-track">
    <div class="map-header">
      <h1 id="grade-name">خريطة التعلم</h1>
      <p>أكمل الدروس لفتح المغامرة!</p>
    </div>
  </div>

  <a href="games.html" class="btn-back">العودة للرئيسية</a>

  <div class="modal" id="intro-modal">
    <div class="modal-content">
      <h2>مرحباً بك يا بطل! 👋</h2>
      <p>ابدأ بالدرس الأول واجمع النجوم والمفاتيح لتفتح باقي الدروس وتصل للقمة!</p>
      <button id="intro-ok">يلا بينا! 🚀</button>
    </div>
  </div>

  <div class="coming-soon-overlay" id="coming-soon">
      <div style="font-size: 80px">🎮</div>
      <h1 style="color: var(--accent)">قريباً جداً</h1>
      <p>هذا الصف قيد التجهيز بألعاب مذهلة.</p>
      <a href="games.html" class="btn-back" style="position: static; margin-top: 20px">العودة</a>
  </div>

  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const GRADE = urlParams.get('id') || urlParams.get('grade') || 'primary-1';
      
      const GRADE_LABELS = {
        'primary-1': 'الصف الأول الابتدائي',
        'primary-2': 'الصف الثاني الابتدائي',
        'primary-3': 'الصف الثالث الابتدائي',
        'primary-4': 'الصف الرابع الابتدائي',
        'primary-5': 'الصف الخامس الابتدائي',
        'primary-6': 'الصف السادس الابتدائي',
        'prep-1': 'الصف الأول الإعدادي',
        'prep-2': 'الصف الثاني الإعدادي',
        'prep-3': 'الصف الثالث الإعدادي'
      };

      const SUPPORTED_GRADES = ['primary-1', 'primary-2', 'primary-3', 'primary-4', 'primary-5', 'primary-6', 'prep-1', 'prep-2', 'prep-3'];
      
      if (!SUPPORTED_GRADES.includes(GRADE)) {
        document.getElementById('coming-soon').style.display = 'flex';
        return;
      }

      document.getElementById('grade-name').textContent = GRADE_LABELS[GRADE];
      document.getElementById('map-title').textContent = GRADE_LABELS[GRADE];

      let progress = JSON.parse(localStorage.getItem('et_progress_' + GRADE) || '{}');
      let totalKeys = Object.values(progress).filter(v => v > 0).length;
      let totalStars = Object.values(progress).reduce((a, b) => a + b, 0);

      document.getElementById('hud-keys').textContent = totalKeys;
      document.getElementById('hud-stars').textContent = totalStars;

      const track = document.getElementById('map-track');
      const units = [1, 2, 3, 4, 5, 6];
      const lessonsPerUnit = 4;

      const getGameLink = (u, l) => {
        // نستخدم view-games.html كواجهة موحدة لكل الدروس حالياً لتجنب 404
        // حيث أن هذه الصفحة تقوم بتحميل اللعبتين (إملاء + أركيد) ديناميكياً
        return `view-games.html?id=${GRADE}&unit=${u}&lesson=${l}`;
      };

      let nextFound = false;
      units.forEach(u => {
        const unitDiv = document.createElement('div');
        unitDiv.className = 'unit-section';
        unitDiv.innerHTML = `<div class="unit-title">الوحدة ${u}</div>`;
        
        for (let l = 1; l <= lessonsPerUnit; l++) {
          const key = `${u}-${l}`;
          const stars = progress[key] || 0;
          const done = stars > 0;
          let state = 'locked';
          
          // جعل كل الدروس مفتوحة حالياً للتجربة بناءً على طلب المستخدم
          state = 'next'; 

          const row = document.createElement('div');
          row.className = 'node-row';
          const link = getGameLink(u, l);
          
          row.innerHTML = `
            <div class="node ${state}" onclick="playLesson('${key}', '${link}', '${state}')">
              ${done ? '⭐' : (state === 'next' ? '▶' : '🔒')}
            </div>
            <div class="info">
              <div class="t">الدرس ${l}</div>
              <div class="d">${done ? 'مكتمل!' : (state === 'next' ? 'العب الآن' : 'مغلق')}</div>
            </div>
          `;
          unitDiv.appendChild(row);
        }
        track.appendChild(unitDiv);
      });

      window.playLesson = (key, link, state) => {
        if (state === 'locked') {
          const modal = document.getElementById('intro-modal');
          modal.querySelector('h2').textContent = 'الدرس مغلق! 🔒';
          modal.querySelector('p').textContent = 'يجب عليك إنهاء الدروس السابقة أولاً لتتمكن من فتح هذا الدرس.';
          modal.classList.add('show');
          return;
        }
        window.location.href = link;
      };

      const intro = document.getElementById('intro-modal');
      if (!localStorage.getItem('et_intro_seen_' + GRADE)) {
        intro.classList.add('show');
        document.getElementById('intro-ok').onclick = () => {
          localStorage.setItem('et_intro_seen_' + GRADE, 'true');
          intro.classList.remove('show');
        };
      } else {
        document.getElementById('intro-ok').onclick = () => intro.classList.remove('show');
      }
    })();
  </script>
</body>
</html>
