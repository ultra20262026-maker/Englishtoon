<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EnglishToon | جاري التحميل</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI', Tahoma, sans-serif; background:#0d1b2a; color:#fff;
       display:flex; align-items:center; justify-content:center; min-height:100dvh;
       touch-action:manipulation; }
.center { text-align:center; }
.spinner {
  width:54px; height:54px; border:6px solid rgba(255,255,255,.2);
  border-top-color:#ffba08; border-radius:50%;
  animation:spin .8s linear infinite; margin:0 auto 14px;
}
@keyframes spin { to { transform:rotate(360deg); } }
p { font-size:16px; opacity:.9; }
a { color:#ffba08; font-weight:700; }
</style>
</head>
<body>
<div class="center">
  <div class="spinner"></div>
  <p>جارٍ فتح عالم الألعاب... 🎮</p>
  <p style="margin-top:10px; font-size:13px; opacity:.6"><a id="manual" href="#">اضغط هنا إذا لم يتم التحويل</a></p>
</div>
<script>
(() => {
  'use strict';
  if (localStorage.getItem('isLoggedIn') !== 'true') {
    location.href = 'index.html';
    return;
  }
  const p = new URLSearchParams(location.search);
  const grade = p.get('id') || p.get('grade');
  if (!grade) { location.href = 'dashboard.html'; return; }
  
  // نستخدم الخريطة map.html للصفوف التي تم بناء خرائط لها
  // وباقي الصفوف نستخدم unit.html التقليدية
  const mapSupported = ['primary-1', 'primary-2', 'primary-3', 'primary-4', 'primary-5', 'primary-6', 'prep-1', 'prep-2', 'prep-3'];
  let url = '';
  
  // التأكد من أن التوجيه يتم بشكل صحيح
  url = 'map.html?id=' + encodeURIComponent(grade);
  
  // في حال فشل تحميل الخريطة أو لم تكن موجودة، يمكن للمستخدم العودة لصفحة الوحدات
  // لكننا سنعتمد map.html كواجهة أساسية الآن
  
  document.getElementById('manual').href = url;
  location.href = url;
})();
</script>
</body>
</html>
