<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الأبطال — Primary 1 | English Toon</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        ar: ['Cairo', 'sans-serif'],
                        en: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        brand: '#3b82f6',
                        gold: '#f59e0b',
                        emerald: '#10b981',
                        rose: '#f43f5e'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at 10% 10%, #dbeafe 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, #fef3c7 0%, transparent 40%),
                        #f8fafc;
            min-height: 100vh;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-en { font-family: 'Outfit', sans-serif; }

        .glass-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px -15px rgba(30, 58, 138, 0.15);
        }

        .option-card {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .option-card:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .option-card:active {
            transform: scale(0.97);
        }

        .pulse-glow {
            animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.8)); }
        }

        .float-anim {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased overflow-x-hidden">

    <!-- Top Navigation Bar -->
    <header class="w-full max-w-5xl mx-auto px-4 pt-4 pb-2 flex items-center justify-between z-30">
        <a href="p1-adventure.html" id="backBtn" class="flex items-center gap-2 bg-white/90 hover:bg-white text-slate-700 px-4 py-2 rounded-2xl font-bold shadow-sm border border-slate-200 transition-all hover:-translate-x-1">
            <i class="fa-solid fa-arrow-right"></i>
            <span>خريطة المغامرة</span>
        </a>

        <!-- Lives / Hearts -->
        <div class="flex items-center gap-1.5 bg-white/90 px-4 py-2 rounded-2xl shadow-sm border border-slate-200">
            <span class="text-xs font-bold text-slate-400 ml-1">الفرص:</span>
            <div id="heartsContainer" class="flex gap-1 text-rose text-lg">
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>

        <!-- Score & Combo -->
        <div class="flex items-center gap-3">
            <div class="bg-amber-100/90 text-amber-700 font-en font-black px-4 py-2 rounded-2xl shadow-sm border border-amber-200 flex items-center gap-1.5 text-sm">
                <i class="fa-solid fa-coins text-amber-500"></i>
                <span id="scoreText">0</span>
            </div>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-4 flex flex-col justify-center">

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200/80 rounded-full h-3.5 mb-4 p-0.5 overflow-hidden shadow-inner">
            <div id="progressBar" class="bg-gradient-to-r from-blue-500 via-indigo-500 to-emerald-500 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%;"></div>
        </div>

        <!-- Question Counter & Game Badge -->
        <div class="flex items-center justify-between mb-3 px-1">
            <span id="gameTitleBadge" class="bg-blue-100 text-blue-700 font-bold px-3 py-1 rounded-xl text-xs font-ar flex items-center gap-1.5">
                <i class="fa-solid fa-gamepad"></i> جاري التحميل...
            </span>
            <span id="questionCounter" class="text-xs font-black text-slate-500 font-en">سؤال 1 من 15</span>
        </div>

        <!-- Question Card -->
        <div id="cardStage" class="glass-card rounded-[2.5rem] p-6 md:p-8 flex flex-col items-center text-center relative overflow-hidden transition-all duration-300">
            
            <!-- Combo Badge (Floating) -->
            <div id="comboBadge" class="hidden absolute top-4 left-4 bg-gradient-to-r from-rose to-amber-500 text-white font-en font-black text-xs px-3 py-1.5 rounded-full shadow-lg transform -rotate-12 animate-bounce">
                🔥 COMBO x<span id="comboCount">2</span>
            </div>

            <!-- 3D Pixar Image Spotlight -->
            <div class="relative w-44 h-44 md:w-52 md:h-52 mb-5 flex items-center justify-center">
                <div class="absolute inset-0 bg-gradient-to-tr from-blue-400/20 to-amber-300/20 rounded-full blur-2xl transform scale-90"></div>
                <img id="questionImage" src="images/games/p1/miss_mona.png" alt="Question Image" class="w-full h-full object-contain drop-shadow-2xl float-anim relative z-10 transition-transform duration-300">
            </div>

            <!-- Question Text -->
            <div class="flex items-center justify-center mb-6 max-w-xl">
                <h2 id="questionText" class="text-xl md:text-2xl font-black text-slate-800 font-en leading-relaxed">
                    Loading Question...
                </h2>
            </div>

            <!-- Options Grid -->
            <div id="optionsGrid" class="w-full grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4 mt-2">
                <!-- Options injected via JS -->
            </div>

        </div>

    </main>

    <!-- Victory / Finish Modal -->
    <div id="victoryModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] p-8 md:p-10 max-w-lg w-full text-center shadow-2xl border-4 border-amber-300 relative transform transition-all animate-fade-in-up">
            
            <div class="w-28 h-28 mx-auto -mt-20 mb-4 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-full p-2 shadow-xl flex items-center justify-center pulse-glow">
                <img id="modalTrophyImg" src="images/games/p1/trophy_cup.png" alt="Trophy" class="w-24 h-24 object-contain">
            </div>

            <h2 id="modalTitle" class="text-3xl font-black text-slate-800 mb-1 font-ar">أحسنت يا بطل! 🏆</h2>
            <p id="modalSub" class="text-slate-500 font-bold text-sm mb-6">لقد أنهيت التحدي بنجاح باهر!</p>

            <!-- Stars Rating -->
            <div id="starsGroup" class="flex justify-center gap-3 text-4xl text-amber-400 mb-6">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
            </div>

            <!-- Score Summary -->
            <div class="grid grid-cols-2 gap-3 bg-slate-50 rounded-2xl p-4 mb-6 border border-slate-100 font-en">
                <div class="text-center">
                    <span class="text-xs font-bold text-slate-400 block font-ar">النقاط المكتسبة</span>
                    <span id="finalScore" class="text-2xl font-black text-blue-600">+150 XP</span>
                </div>
                <div class="text-center">
                    <span class="text-xs font-bold text-slate-400 block font-ar">الإجابات الصحيحة</span>
                    <span id="finalAccuracy" class="text-2xl font-black text-emerald-600">15 / 15</span>
                </div>
            </div>

            <!-- Next Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <button onclick="retryGame()" class="px-6 py-3.5 rounded-2xl font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all">
                    <i class="fa-solid fa-rotate-left ml-1"></i> إعادة المحاولة
                </button>
                <button onclick="goToNextGame()" id="nextGameBtn" class="px-8 py-3.5 rounded-2xl font-black bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white shadow-lg shadow-blue-500/25 transition-all hover:scale-105">
                    <span>المرحلة التالية</span> <i class="fa-solid fa-arrow-left mr-1"></i>
                </button>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/p1_adventure_data.js"></script>
    <script>
        // Web Audio Synthesizer for instant rich sound effects without external audio files
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playTone(freq, type, duration, delay = 0) {
                this.init();
                setTimeout(() => {
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    } catch(e) {}
                }, delay * 1000);
            },
            correct() {
                this.playTone(523.25, 'sine', 0.15, 0);   // C5
                this.playTone(659.25, 'sine', 0.15, 0.08); // E5
                this.playTone(783.99, 'sine', 0.25, 0.16); // G5
                this.playTone(1046.50, 'sine', 0.35, 0.24); // C6
            },
            wrong() {
                this.playTone(220, 'triangle', 0.2, 0);
                this.playTone(180, 'triangle', 0.3, 0.15);
            },
            victory() {
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                notes.forEach((n, i) => this.playTone(n, 'triangle', 0.25, i * 0.12));
            }
        };

        // Game State
        let currentGame = null;
        let currentIndex = 0;
        let score = 0;
        let lives = 3;
        let combo = 0;
        let correctCount = 0;
        let worldId = 1;
        let lessonId = 1;
        let gameId = "u1_l1_g1";

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            gameId = params.get('game') || 'u1_l1_g1';

            // Find game in DB
            const DB = window.P1_ADVENTURE_DATABASE || { worlds: [] };
            for (const w of DB.worlds) {
                for (const l of w.lessons) {
                    for (const g of l.games) {
                        if (g.id === gameId) {
                            currentGame = g;
                            worldId = w.id;
                            lessonId = l.id;
                            break;
                        }
                    }
                }
            }

            if (!currentGame && DB.worlds[0] && DB.worlds[0].lessons[0]) {
                currentGame = DB.worlds[0].lessons[0].games[0];
            }

            if (currentGame) {
                document.getElementById('gameTitleBadge').innerHTML = `<i class="fa-solid fa-gamepad"></i> ${currentGame.name}`;
                loadQuestion(0);
            }
        });

        function loadQuestion(idx) {
            currentIndex = idx;
            const q = currentGame.questions[idx];
            const total = currentGame.questions.length;

            // Update Header & Progress
            document.getElementById('questionCounter').textContent = `سؤال ${idx + 1} من ${total}`;
            const pct = (idx / total) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;

            // Update Image & Text
            document.getElementById('questionImage').src = q.img || 'images/games/p1/trophy_cup.png';
            document.getElementById('questionText').textContent = q.q;

            // Render Options
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';

            const colors = [
                'from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700',
                'from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700',
                'from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700',
                'from-purple-500 to-fuchsia-600 hover:from-purple-600 hover:to-fuchsia-700'
            ];

            q.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `option-card w-full py-4 px-5 rounded-2xl font-black text-lg md:text-xl text-white bg-gradient-to-r ${colors[optIdx % colors.length]} shadow-md border border-white/20 font-en flex items-center justify-center`;
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected, btnEl) {
            const q = currentGame.questions[currentIndex];
            const isCorrect = (String(selected).trim().toLowerCase() === String(q.a).trim().toLowerCase());

            // Disable all option buttons
            const allBtns = document.querySelectorAll('.option-card');
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                AudioFX.correct();
                btnEl.classList.remove('from-blue-500', 'from-emerald-500', 'from-amber-500', 'from-purple-500');
                btnEl.classList.add('bg-emerald-500', 'ring-4', 'ring-emerald-300', 'scale-105');
                
                correctCount++;
                combo++;
                const comboBonus = combo > 1 ? combo * 5 : 0;
                score += (10 + comboBonus);
                document.getElementById('scoreText').textContent = score;

                // Trigger confetti burst
                confetti({
                    particleCount: 40,
                    spread: 60,
                    origin: { y: 0.7 }
                });

                if (combo > 1) {
                    const cb = document.getElementById('comboBadge');
                    cb.classList.remove('hidden');
                    document.getElementById('comboCount').textContent = combo;
                }
            } else {
                AudioFX.wrong();
                btnEl.classList.add('bg-rose-500', 'ring-4', 'ring-rose-300', 'animate-shake');
                combo = 0;
                document.getElementById('comboBadge').classList.add('hidden');

                // Highlight correct option
                allBtns.forEach(b => {
                    if (String(b.textContent).trim().toLowerCase() === String(q.a).trim().toLowerCase()) {
                        b.classList.add('bg-emerald-500', 'ring-4', 'ring-emerald-300');
                    }
                });

                lives--;
                updateHearts();
            }

            setTimeout(() => {
                if (lives <= 0) {
                    endGame(false);
                } else if (currentIndex + 1 < currentGame.questions.length) {
                    loadQuestion(currentIndex + 1);
                } else {
                    document.getElementById('progressBar').style.width = '100%';
                    endGame(true);
                }
            }, 1200);
        }

        function updateHearts() {
            const container = document.getElementById('heartsContainer');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < lives) {
                    container.innerHTML += '<i class="fa-solid fa-heart text-rose animate-pulse"></i>';
                } else {
                    container.innerHTML += '<i class="fa-regular fa-heart text-slate-300"></i>';
                }
            }
        }

        function endGame(won) {
            AudioFX.victory();
            const modal = document.getElementById('victoryModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            document.getElementById('finalScore').textContent = `+${score} XP`;
            document.getElementById('finalAccuracy').textContent = `${correctCount} / ${currentGame.questions.length}`;

            // Save progress to LocalStorage
            saveProgress(won);

            if (won) {
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
            }
        }

        function saveProgress(won) {
            try {
                const currentUser = localStorage.getItem('currentUser') || 'student';
                const key = `englishtoon_p1_progress_${currentUser}`;
                let progress = JSON.parse(localStorage.getItem(key)) || {
                    completedGames: [],
                    stars: 0,
                    xp: 0,
                    unlockedWorld: 1,
                    keys: []
                };

                if (won && !progress.completedGames.includes(currentGame.id)) {
                    progress.completedGames.push(currentGame.id);
                    progress.stars += 3;
                    progress.xp += score;

                    // Award key if finished world
                    if (!progress.keys.includes(worldId)) {
                        progress.keys.push(worldId);
                    }
                    progress.unlockedWorld = Math.max(progress.unlockedWorld, worldId + 1);

                    localStorage.setItem(key, JSON.stringify(progress));
                }
            } catch(e) { console.error(e); }
        }

        function retryGame() {
            window.location.reload();
        }

        function goToNextGame() {
            window.location.href = 'p1-adventure.html';
        }
    </script>
</body>
</html>
