<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | English Toon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        en: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6', // Bright Blue
                        secondary: '#ec4899', // Pink
                        accent: '#f59e0b', // Amber
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0fdf4;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1), 
                        inset 0 0 0 1px rgba(255,255,255,0.5);
        }

        .input-elegant {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        
        .input-elegant:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1), inset 0 2px 4px rgba(0,0,0,0.01);
            transform: translateY(-1px);
        }

        .btn-premium {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(37, 99, 235, 0.5), 0 4px 0 #1d4ed8;
        }
        
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(37, 99, 235, 0.6), 0 6px 0 #1d4ed8;
        }
        
        .btn-premium:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px rgba(37, 99, 235, 0.5), 0 0px 0 #1d4ed8;
        }

        .btn-premium::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg);
            transition: all 0.3s ease;
            opacity: 0;
        }

        .btn-premium:hover::after {
            animation: shine 1.5s infinite;
            opacity: 1;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .anim-delay-1 { animation-delay: 0.1s; }
        .anim-delay-2 { animation-delay: 0.2s; }
        .anim-delay-3 { animation-delay: 0.3s; }
    </style>
</head>
<body>

    <!-- Decorative Background Elements -->
    <div class="fixed w-full h-full pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary opacity-30 rounded-full mix-blend-multiply filter blur-3xl animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-secondary opacity-30 rounded-full mix-blend-multiply filter blur-3xl animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-accent opacity-30 rounded-full mix-blend-multiply filter blur-3xl animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <div class="w-full max-w-md px-6 z-10">
        
        <!-- Animated Login Card -->
        <div class="glass-panel rounded-[2.5rem] p-8 md:p-10 relative overflow-hidden">
            
            <!-- Glowing Accent Line -->
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary via-secondary to-accent"></div>

            <!-- Logo Section -->
            <div class="text-center mb-8 opacity-0 animate-fade-in-up">
                <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-white shadow-2xl border border-slate-100 mb-5 relative group">
                    <div class="absolute inset-0 bg-primary/10 rounded-3xl transform group-hover:rotate-6 transition-transform duration-300"></div>
                    <!-- Custom SVG Logo: Open Book with Star -->
                    <svg class="w-12 h-12 text-primary relative z-10 transform group-hover:scale-110 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" fill="#e0f2fe" stroke="#0ea5e9"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" fill="#fce7f3" stroke="#ec4899"/>
                        <circle cx="12" cy="7" r="2" fill="#f59e0b" stroke="#d97706"/>
                        <path d="M12 2v2M12 10v2M15 7h2M7 7h2" stroke="#f59e0b"/>
                    </svg>
                </div>
                <h1 class="text-4xl font-black text-slate-800 font-en tracking-tight">
                    English<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">Toon</span>
                </h1>
                <p class="text-slate-500 font-bold mt-2 text-sm">منصة التعليم التفاعلي الأذكى 🚀</p>
            </div>

            <!-- Login Form -->
            <div id="auth-container">
                <form id="loginForm" class="space-y-5">
                    <div class="opacity-0 animate-fade-in-up anim-delay-1">
                        <label class="block text-slate-700 text-sm font-bold mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-user-graduate text-primary"></i> كود الطالب
                        </label>
                        <input type="text" id="username" class="input-elegant w-full px-5 py-4 rounded-2xl text-slate-800 font-bold outline-none placeholder-slate-400" placeholder="أدخل كود المرور الخاص بك" required autocomplete="username">
                    </div>

                    <div class="opacity-0 animate-fade-in-up anim-delay-2">
                        <label class="block text-slate-700 text-sm font-bold mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-lock text-secondary"></i> كلمة المرور
                        </label>
                        <input type="password" id="password" class="input-elegant w-full px-5 py-4 rounded-2xl text-slate-800 font-bold outline-none placeholder-slate-400" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <div id="error-message" class="hidden opacity-0 animate-fade-in-up bg-red-50/80 border border-red-200 text-red-600 px-4 py-3 rounded-2xl text-sm font-bold flex items-center gap-3 backdrop-blur-md">
                        <i class="fa-solid fa-circle-exclamation text-lg"></i>
                        <span id="error-text"></span>
                    </div>

                    <div class="pt-2 opacity-0 animate-fade-in-up anim-delay-3">
                        <button type="submit" id="loginBtn" class="btn-premium w-full text-white font-black text-lg py-4 rounded-2xl flex items-center justify-center gap-3">
                            <span>ابدأ التعلم الآن</span>
                            <i class="fa-solid fa-arrow-right-to-bracket text-white/90 text-xl"></i>
                        </button>
                    </div>
                </form>
            </div>

        </div>

        <div class="text-center mt-6 text-slate-400/80 text-sm font-bold opacity-0 animate-fade-in-up anim-delay-3">
            <p>&copy; 2026 English Toon. جميع الحقوق محفوظة.</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authContainer = document.getElementById('auth-container');
            const loginForm = document.getElementById('loginForm');
            const errorMsg = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const loginBtn = document.getElementById('loginBtn');

            // Handle Already Logged In State gracefully
            if (localStorage.getItem('isLoggedIn') === 'true') {
                const currentUser = localStorage.getItem('currentUser') || 'طالبنا المتميز';
                const dest = currentUser === 'admin' ? 'admin.html' : 'dashboard.html';
                
                authContainer.innerHTML = 
                    <div class="text-center space-y-4 opacity-0 animate-fade-in-up anim-delay-1">
                        <div class="bg-emerald-50 text-emerald-600 rounded-2xl p-4 font-bold border border-emerald-100 flex items-center justify-center gap-3 mb-6">
                            <i class="fa-solid fa-face-smile text-2xl"></i>
                            أهلاً بعودتك يا 
                        </div>
                        <button onclick="window.location.replace('')" class="btn-premium w-full text-white font-black text-lg py-4 rounded-2xl flex items-center justify-center gap-3 bg-gradient-to-r from-emerald-500 to-teal-500 shadow-emerald-500/50" style="box-shadow: 0 10px 20px -10px rgba(16,185,129, 0.5), 0 4px 0 #047857;">
                            <span>متابعة التعلم</span>
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button onclick="logout()" class="w-full text-slate-500 font-bold text-sm py-3 mt-2 hover:text-red-500 transition-colors">
                            تسجيل الدخول بحساب آخر
                        </button>
                    </div>
                ;
                return;
            }

            // Normal Login Logic
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!username || !password) {
                    showError('يرجى إدخال كود الطالب وكلمة المرور.');
                    return;
                }

                loginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري الدخول...';
                loginBtn.classList.add('opacity-90', 'pointer-events-none');
                errorMsg.classList.add('hidden');
                errorMsg.classList.remove('opacity-100');

                try {
                    const result = await login(username, password);
                    
                    if (result.success) {
                        loginBtn.innerHTML = '<i class="fa-solid fa-check"></i> تم بنجاح!';
                        loginBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                        loginBtn.style.boxShadow = '0 10px 20px -10px rgba(16, 185, 129, 0.5), 0 4px 0 #047857';
                        
                        setTimeout(() => {
                            if (username.toLowerCase() === 'admin' || username === '01208609509' || username === 'mm01208609509') {
                                window.location.replace('admin.html');
                            } else {
                                window.location.replace('dashboard.html');
                            }
                        }, 800);
                    } else {
                        showError(result.message || 'بيانات الدخول غير صحيحة.');
                        resetBtn();
                    }
                } catch (error) {
                    console.error("Login Error:", error);
                    showError('حدث خطأ في الاتصال بالخادم. يرجى التأكد من اتصالك بالإنترنت.');
                    resetBtn();
                }
            });

            function showError(msg) {
                errorText.textContent = msg;
                errorMsg.classList.remove('hidden');
                // Force reflow to restart animation
                void errorMsg.offsetWidth;
                errorMsg.classList.add('opacity-100');
                
                // Shake effect
                authContainer.style.transform = 'translateX(-10px)';
                setTimeout(() => authContainer.style.transform = 'translateX(10px)', 100);
                setTimeout(() => authContainer.style.transform = 'translateX(-10px)', 200);
                setTimeout(() => authContainer.style.transform = 'translateX(10px)', 300);
                setTimeout(() => authContainer.style.transform = 'translateX(0)', 400);
            }

            function resetBtn() {
                loginBtn.innerHTML = '<span>ابدأ التعلم الآن</span> <i class="fa-solid fa-arrow-right-to-bracket text-white/90 text-xl"></i>';
                loginBtn.classList.remove('opacity-90', 'pointer-events-none');
            }
        });

        // Global logout for the welcome back screen
        window.logout = function() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('allowedGrade');
            localStorage.removeItem('allowedUnits');
            window.location.reload();
        }
    </script>
</body>
</html>
