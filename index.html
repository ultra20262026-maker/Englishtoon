<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | EnglishToon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: rgba(30, 41, 59, 0.7); backdrop-blur: 20px; border: 1px solid rgba(255,255,255,0.1); border-radius: 2.5rem; padding: 3rem; width: 100%; max-width: 450px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black mb-2">EnglishToon</h1>
            <p class="text-slate-400 font-bold">عالم الألعاب الممتع</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <input type="text" id="username" required class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl px-6 py-4 text-white font-bold text-lg" placeholder="اكتب اسمك هنا...">
            <button type="submit" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl text-xl">
                ابدأ المغامرة! 🎮
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            localStorage.setItem('currentUser', document.getElementById('username').value);
            localStorage.setItem('isLoggedIn', 'true');
            // REDIRECT TO NEW STABLE START PAGE
            window.location.href = 'start-now.html';
        });
        
        // Anti-Cache Reset
        if (window.location.search.includes('reset')) {
            localStorage.clear();
            sessionStorage.clear();
        }
    </script>
</body>
</html>
