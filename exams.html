<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الامتحانات الإلكترونية | English Toon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        en: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#ec4899',
                        accent: '#f59e0b',
                        success: '#10b981',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e0f2fe;
            background-image: 
                radial-gradient(circle at 85% 50%, rgba(255, 255, 255, 0.6) 0%, transparent 50%),
                linear-gradient(135deg, #e0f2fe 0%, #bae6fd 40%, #7dd3fc 100%);
            min-height: 100vh;
            background-attachment: fixed;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .exam-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05),
                        inset 0 0 0 1px rgba(255,255,255,0.8);
            overflow: hidden;
            position: relative;
            border-radius: 2rem;
        }

        .exam-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 30px -10px rgba(16, 185, 129, 0.2),
                        0 0 20px rgba(16, 185, 129, 0.1);
            border-color: #10b981;
        }

        .btn-exam {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px -5px rgba(16, 185, 129, 0.5), 0 4px 0 #047857;
        }
        
        .btn-exam:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(16, 185, 129, 0.6), 0 6px 0 #047857;
        }
        
        .btn-exam:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px rgba(16, 185, 129, 0.5), 0 0px 0 #047857;
        }

        .anim-delay-1 { animation-delay: 0.1s; }
        .anim-delay-2 { animation-delay: 0.2s; }
        .anim-delay-3 { animation-delay: 0.3s; }
    </style>
    <link rel="stylesheet" href="css/englishtoon-3d-backgrounds.css?v=1">
    <link rel="stylesheet" href="css/englishtoon-brand-theme.css?v=1">
</head>
<body class="text-slate-800 pb-20 toon-scene-exams">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-4">
                    <a href="dashboard.html" class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-200 text-slate-500 hover:text-success hover:border-success transition-all duration-300 transform hover:-translate-x-1">
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                    <div>
                        <h2 class="text-xl font-black text-slate-800">الامتحانات الإلكترونية</h2>
                        <p class="text-xs font-bold text-success">اختبر مستواك وتفوق!</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="hidden sm:block text-left mr-3">
                        <p class="text-xs font-bold text-slate-500">أهلاً بك</p>
                        <p id="userNameDisplay" class="text-sm font-black text-success">طالبنا المتميز</p>
                    </div>
                    <div class="w-12 h-12 rounded-[1rem] bg-gradient-to-tr from-success to-emerald-400 p-[2px] shadow-lg shadow-success/20">
                        <div class="w-full h-full bg-white rounded-[14px] overflow-hidden">
                            <img src="images/englishtoon_logo_new.jpg" alt="Profile" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        
        <!-- Welcome Banner -->
        <div class="bg-gradient-to-r from-success to-emerald-400 rounded-[2rem] p-8 md:p-10 text-white shadow-xl shadow-success/20 mb-12 relative overflow-hidden opacity-0 animate-fade-in-up">
            <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-10 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
            <div class="relative z-10 md:w-2/3">
                <span class="bg-white/20 text-white text-xs font-black px-3 py-1 rounded-full backdrop-blur-md mb-4 inline-block border border-white/30">
                    <i class="fa-solid fa-file-pen mr-1"></i> امتحن الآن
                </span>
                <h1 class="text-3xl md:text-5xl font-black mb-4 leading-tight">اختر صفك الدراسي <br><span class="text-yellow-300">لتبدأ الامتحانات!</span></h1>
                <p class="text-emerald-50 text-lg font-semibold mb-6 leading-relaxed">
                    تصفح الامتحانات التفاعلية لجميع الصفوف، واستعد لاختبار مستواك.
                </p>
            </div>
            
            <div class="hidden md:block absolute left-10 bottom-0 w-64 h-64">
                <!-- 3D Mascot or Icon placeholder -->
                <img src="images/icon_exams_3d.jpg" alt="Exams" class="w-full h-full object-contain filter drop-shadow-2xl animate-float opacity-90 rounded-full mix-blend-multiply">
            </div>
        </div>

        <!-- Grade Tabs -->
        <section class="et-primary-surface rounded-[2rem] p-4 sm:p-6 md:p-8 shadow-xl mb-12">
            <div class="flex items-center justify-between gap-3 mb-5">
                <div>
                    <p class="text-xs font-black text-success mb-1">اختر تبويب صفك</p>
                    <h2 class="text-2xl md:text-3xl font-black text-slate-800">امتحانات كل صف في مكانه</h2>
                </div>
                <div class="hidden sm:flex w-12 h-12 rounded-2xl bg-white/85 items-center justify-center text-success shadow-sm"><i class="fa-solid fa-layer-group text-xl"></i></div>
            </div>
            <div class="et-grade-tabs" id="gradeTabs" role="tablist" aria-label="صفوف الامتحانات"></div>
            <div id="gradePanels"></div>
        </section>
    </main>

    <script src="js/data.js?v=202701"></script>
    <script src="js/auth.js?v=202701"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check auth
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.replace('index.html');
                return;
            }

            // Set user name
            const currentUser = localStorage.getItem('currentUser') || 'طالبنا المتميز';
            document.getElementById('userNameDisplay').textContent = currentUser;

            const gradeTabs = document.getElementById('gradeTabs');
            const gradePanels = document.getElementById('gradePanels');

            GRADES_DATA.forEach((grade, index) => {
                const exams = (typeof EXAMS_MAP !== 'undefined' && EXAMS_MAP[grade.id]) ? EXAMS_MAP[grade.id] : {};
                const hasExams = Object.values(exams).some(unit => Array.isArray(unit) && unit.length > 0);
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'et-grade-tab' + (index === 0 ? ' active' : '');
                tab.setAttribute('role', 'tab');
                tab.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
                tab.dataset.grade = grade.id;
                tab.innerHTML = `<img class="et-tab-icon" src="${grade.image}" alt=""><span class="et-tab-label">${grade.name.replace('الصف ', '')}</span>`;
                tab.addEventListener('click', () => openGradeTab(grade.id));
                gradeTabs.appendChild(tab);

                const panel = document.createElement('div');
                panel.id = `panel-${grade.id}`;
                panel.className = 'et-grade-panel' + (index === 0 ? ' active' : '');
                panel.setAttribute('role', 'tabpanel');
                panel.innerHTML = `
                    <div class="et-panel-heading">
                        <img src="${grade.image}" alt="${grade.name}">
                        <div><h3>${grade.name}</h3><p>${hasExams ? 'اختبارات إلكترونية جاهزة للمراجعة' : 'الامتحانات قيد الإعداد'}</p></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="grid-${grade.id}"></div>`;
                gradePanels.appendChild(panel);

                const grid = panel.querySelector(`#grid-${grade.id}`);
                if (hasExams) {
                    grid.innerHTML = `<a href="exams-grades-view.html?id=${grade.id}" class="exam-card block p-0 group">
                        <img class="w-full h-44 object-cover border-b-2 border-white/50" src="${grade.image}" alt="${grade.name}">
                        <div class="p-5 flex items-center justify-between bg-white/85"><span class="text-lg font-black text-slate-800">فتح امتحانات ${grade.name.replace('الصف ', '')}</span><span class="bg-gradient-to-r from-success to-emerald-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow-sm">ابدأ <i class="fa-solid fa-arrow-left ml-1"></i></span></div>
                    </a>`;
                } else {
                    grid.innerHTML = `<div class="exam-card p-8 text-center bg-white/75"><i class="fa-solid fa-hourglass-half text-4xl text-accent mb-4"></i><p class="font-black text-slate-700">امتحانات هذا الصف قريبًا إن شاء الله</p></div>`;
                }
            });

            window.openGradeTab = function(gradeId) {
                document.querySelectorAll('.et-grade-tab').forEach(tab => {
                    const active = tab.dataset.grade === gradeId;
                    tab.classList.toggle('active', active);
                    tab.setAttribute('aria-selected', active ? 'true' : 'false');
                });
                document.querySelectorAll('.et-grade-panel').forEach(panel => panel.classList.toggle('active', panel.id === `panel-${gradeId}`));
            };
        });


    </script>
</body>
</html>
